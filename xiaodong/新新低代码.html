                  <th class="px-4 py-3 font-medium">引用数</th><th class="px-4 py-3 font-medium">状态</th>
                  <th class="px-4 py-3 font-medium">创建人</th><th class="px-4 py-3 font-medium">创建时间</th><th class="px-4 py-3 text-center font-medium">操作</th>
                </tr></thead>
                <tbody id="flowTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ===== 流程实例监控视图 ===== -->
        <section id="monitorView" class="flex-1 flex flex-col min-h-0" hidden>
          <div class="px-6 py-4 flex items-center justify-between border-b border-gray-200 bg-white">
            <div>
              <div class="flex items-center gap-2 mb-2">
                <div class="flex bg-gray-100 rounded-lg p-0.5 text-sm">
                  <button id="mtList" onclick="showView('list')" class="px-3 py-1.5 rounded-md font-medium seg text-gray-500 btn-click">流程列表</button>
                  <button id="mtMonitor" onclick="showView('monitor')" class="px-3 py-1.5 rounded-md font-medium seg bg-white text-[#165DFF] shadow-sm btn-click">实例监控</button>
                </div>
              </div>
              <h2 class="text-base font-semibold text-gray-800">流程实例监控</h2>
              <p class="text-xs text-gray-500 mt-0.5">跨应用查看所有流程实例，支持筛选与流转追踪（管理员视角）</p>
            </div>
            <div class="flex items-center gap-2">
              <select id="instApp" onchange="renderInstanceMonitor()" class="form-input border border-gray-300 rounded-lg px-3 py-1.5 text-sm"><option value="">全部应用</option><option>人事管理系统</option><option>财务费用系统</option></select>
              <select id="instStatus" onchange="renderInstanceMonitor()" class="form-input border border-gray-300 rounded-lg px-3 py-1.5 text-sm"><option value="">全部状态</option><option>审批中</option><option>已通过</option><option>已驳回</option><option>已拒绝</option><option>已撤回</option></select>
              <input id="instSearch" oninput="renderInstanceMonitor()" placeholder="搜索流程/发起人" class="form-input border border-gray-300 rounded-lg px-3 py-1.5 text-sm w-48">
            </div>
          </div>
          <div class="flex-1 overflow-y-auto p-6">
            <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
              <table class="w-full text-sm">
                <thead><tr class="bg-gray-50 text-left text-gray-500"><th class="px-4 py-3 font-medium">流程编号</th><th class="px-4 py-3 font-medium">流程</th><th class="px-4 py-3 font-medium">所属应用</th><th class="px-4 py-3 font-medium">发起人</th><th class="px-4 py-3 font-medium">发起时间</th><th class="px-4 py-3 font-medium">状态</th><th class="px-4 py-3 font-medium">当前节点</th><th class="px-4 py-3 text-center font-medium">操作</th></tr></thead>
                <tbody id="instBody"></tbody>
              </table>
              <div class="px-4 py-3 border-t border-gray-200"><span class="text-sm text-gray-500" id="instCount"></span></div>
            </div>
          </div>
        </section>

        <!-- ===== 流程设计器视图 ===== -->
        <section id="designerView" class="flex-1 flex flex-col min-h-0" hidden>
          <header class="bg-white border-b border-gray-200 px-5 py-2.5 flex items-center justify-between flex-shrink-0 gap-3">
            <div class="flex items-center gap-3 min-w-0 flex-1">
              <a onclick="showView('list')" class="text-gray-400 hover:text-[#165DFF] cursor-pointer btn-click" title="返回列表"><i class="fas fa-arrow-left"></i></a>
              <input id="flowNameInput" class="text-base font-bold text-gray-800 border-none focus:ring-0 bg-transparent" style="width:100%;max-width:240px" value="未命名流程" oninput="onFlowNameChange()">
              <span id="statusPill" class="status-pill px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700 whitespace-nowrap">草稿</span>
              <span id="versionPill" class="version-pill px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-500 whitespace-nowrap">v0</span>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs text-gray-400 hidden sm:inline">绑定表单：<b id="bindFormName" class="text-gray-600"></b></span>
              <div class="w-px h-5 bg-gray-200 mx-0.5"></div>
              <button onclick="saveFlow()" class="px-3 py-1.5 rounded-md text-xs font-medium btn-click border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 hover:text-[#165DFF]">保存</button>
              <button id="publishBtn" onclick="publishFlow()" data-proto-id="6" class="px-3 py-1.5 rounded-md text-xs font-medium btn-click bg-[#165DFF] hover:bg-blue-600 text-white shadow-sm">发布</button>
              <button id="unpublishBtn" onclick="unpublishFlow()" class="hidden px-3 py-1.5 rounded-md text-xs font-medium btn-click bg-white border border-red-200 text-red-600 hover:bg-red-50">下架</button>
              <button onclick="showVersions()" data-proto-id="7" class="px-3 py-1.5 rounded-md text-xs font-medium btn-click border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 hover:text-[#165DFF]">版本</button>
            </div>
          </header>
          <div id="stateBanner" class="px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200" style="display:none"></div>

          <!-- 画布（≈80%）+ 节点配置（≈20%） -->
          <div class="flex-1 flex min-h-0">
            <main id="flowScroll" class="flex-1 overflow-y-auto bg-[#F5F7FA] relative" onclick="onFlowCanvasClick(event)">
              <div class="sticky top-0 z-20 flex items-center gap-3 bg-white/95 backdrop-blur border-b border-gray-200 px-6 py-2.5 flex-wrap shadow-sm">
                <span class="text-xs font-medium text-gray-500">拖拽添加节点：</span>
                <div class="tool-pill approval" draggable="true" ondragstart="dragTool(event,'approval')" ondragend="dragToolEnd(event)"><i class="fas fa-check text-[#165DFF]"></i>审批节点</div>
                <div class="tool-pill cc" draggable="true" ondragstart="dragTool(event,'cc')" ondragend="dragToolEnd(event)"><i class="fas fa-paper-plane text-[#7c5cff]"></i>抄送节点</div>
                <span class="text-[11px] text-gray-400">拖到画布任意位置释放；从节点下方连接点拖拽到另一节点上方连接点即可连线；点击连线配置流转条件</span>
              </div>
              <div class="p-8">
                <div id="flowCanvas" class="proto-element mx-auto bg-white border border-dashed border-gray-300 rounded-lg relative" data-proto-id="2" style="width:100%; max-width:920px; min-height:640px; height:640px;" ondragover="allowDrop(event)" ondrop="dropTool(event)">
                  <div class="proto-element" data-proto-id="4" style="position:absolute; top:6px; right:8px; width:10px; height:10px; opacity:0; pointer-events:none; z-index:2"></div>
                  <svg id="edgesSvg"></svg>
                  <div id="nodeLayer"></div>
                  <div id="edgeLabelLayer"></div>
                </div>
                <div class="mt-4 text-center text-[11px] text-gray-400" data-proto-id="5"><i class="fas fa-hand-pointer mr-1"></i>点击空白配置整个流程；点击节点编辑节点；从节点<b>下方连接点</b>拖拽到另一节点<b>上方连接点</b>画线；点击连线设置流转条件或按 Delete 删除</div>
              </div>
            </main>

            <aside id="configPanel" data-proto-id="3" class="proto-element w-[300px] flex-shrink-0 bg-white border-l border-gray-200 overflow-y-auto">
              <div id="configBody" class="p-4"></div>

    <div id="divider" class="w-px bg-gray-300"></div>

    <!-- ============ 右 20%：逻辑说明 ============ -->
    <div id="right-panel" class="overflow-y-auto bg-amber-50 border-l-2 border-dashed border-amber-300" style="width:20%">
      <div class="p-4">
        <div class="mb-4 p-3 bg-amber-100 border border-amber-300 rounded-lg">
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2 py-0.5 bg-amber-500 text-white text-[10px] font-bold rounded uppercase tracking-wide">Prototype</span>
            <span class="text-xs font-semibold text-amber-800">逻辑说明</span>
          </div>
          <p class="text-[11px] text-amber-700 leading-relaxed">悬停左侧对应区域可高亮连线。流程中心与工作表单一对一绑定。</p>
        </div>
        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-amber-200">
          <i class="fas fa-map-signs text-amber-600"></i><h2 class="text-sm font-bold text-amber-900">功能说明</h2>
        </div>
        <div class="space-y-3">
          <div class="proto-desc p-3" data-proto-id="1">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">1</span>
              <div><h3 class="text-sm font-semibold text-gray-800">流程列表 → 新建 / 绑定表单</h3>
                <p class="text-xs text-gray-500 mt-1">流程资产列表：<b>新建</b>需先绑定<b>工作表单</b>（一对一、可搜索）；行内可<b>编辑/发布/复制</b>（一键克隆整套流程）。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="2">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">2</span>
              <div><h3 class="text-sm font-semibold text-gray-800">流程画布：自由绘制</h3>
                <p class="text-xs text-gray-500 mt-1"><b>自由绘制</b>画布：拖拽节点入库、拖动调位置，从下连接点拖到上连接点连线；点连线设条件、Delete 删除。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="3">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">3</span>
              <div><h3 class="text-sm font-semibold text-gray-800">节点配置面板（分 Tab）</h3>
                <p class="text-xs text-gray-500 mt-1">节点配置分 Tab：发起（范围/字段权限）、审批（审批人/字段权限/时限/操作设置）、抄送（抄送设置/字段权限）；发起/审批/抄送均支持<b>字段权限</b>控制；审批人/抄送人来源（角色/岗位/部门）均用<b>弹窗</b>选择，不逐一罗列；审批方式仅保留<b>会签</b>（所有人通过）与<b>或签</b>（一人通过）；<b>抄送为终止节点</b>，其后不能再连接任何节点（含流程结束 / 审批 / 抄送），试图拖线时弹出提示「抄送节点为流程终止节点，其后不允许再连接任何节点」；操作含<b>提交/驳回/拒绝/转办/加签</b>；节点可复制；<b>抄送节点的字段权限仅可设「只读 / 隐藏」</b>（抄送为知会性质，抄送人不可编辑表单字段，故不提供「可编辑」）。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="4">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">4</span>
              <div><h3 class="text-sm font-semibold text-gray-800">流转条件（点连线 → 右侧）</h3>
                <p class="text-xs text-gray-500 mt-1">点连线设<b>流转条件</b>：自定义「且/或」条件（满足才进该线）或 <b>else 兜底</b>；每条连接线均需配置流转条件或设为 else，不再提供「始终流转」简单选项。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="5">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">5</span>
              <div><h3 class="text-sm font-semibold text-gray-800">流程级配置（点空白）</h3>
                <p class="text-xs text-gray-500 mt-1">点空白配<b>流程属性</b>：名称/描述/<b>图标（弹窗图标库）</b>/允许撤回（时限可选手小时或天），与节点配置分层。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="6">

              <div><h3 class="text-sm font-semibold text-gray-800">状态机：草稿 ↔ 已发布</h3>

          </div>
          <div class="proto-desc p-3" data-proto-id="7">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">7</span>
              <div><h3 class="text-sm font-semibold text-gray-800">版本管理 + 流程锁定</h3>
                <p class="text-xs text-gray-500 mt-1">每次发布生成<b>不可变版本</b>（可点击<b>查看</b>在画布上展示历史版本节点结构）；<b>恢复并发布</b>以该版本内容重新上线、版本号不变；<b>流程锁定</b>按发起时版本渲染在途单据，改版不影响在途。</p></div></div>
          </div>
          <div class="proto-desc p-3 border border-amber-300 bg-amber-50" data-proto-id="8">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-600 text-white rounded-full text-xs font-bold flex items-center justify-center"><i class="fas fa-check"></i></span>
              <div><h3 class="text-sm font-semibold text-gray-800">最终结论 · 流程列表与实例监控开发逻辑</h3>
                <p class="text-xs text-gray-500 mt-1 leading-relaxed">以下为与产品确认后的<b>最终开发逻辑</b>（供开发直接参照）：</p>
                <div class="text-xs text-gray-600 mt-2 space-y-2">
                  <p><b>① 引用数：</b>流程被<b>应用菜单 / 流程任务</b>引用时，列表「引用数」= <code>refs.length</code>；点击可查看引用来源清单（与工作表单一致）。</p>
                  <p><b>② 状态与版本合并：</b>列表「状态」列将状态与版本合并为单标签，三态——<b>已发布 vN</b> / <b>草稿（已下架）</b>(version&gt;0) / <b>草稿（未发布）</b>。</p>
                  <p><b>③ 删除保护：</b>仅<b>「无引用」的草稿流程</b>可删除；被引用的流程删除时<b>拦截并提示"此流程已被引用，不可删除"</b>；已发布流程需先下架再删。</p>
                  <p><b>④ 流程名称唯一：</b>发布时校验重名，重复则提示"流程名称已存在，请修改名称后再发布"。</p>
                  <p><b>⑤ 实例监控 · 实例详情（点击实例行 或「查看」按钮）：</b>弹出<b>流程实例详情</b>，分左右两部分：<b>左侧</b>为绑定表单的<b>具体内容</b>，按「申请信息 / 详细信息」分卡片 section，字段以「标签 + 值」两列网格排版（优先用真实提交数据，缺失回退占位）；<b>右侧</b>为<b>流程流转日志</b>，按节点维度展示「状态徽章 + 当前审批人及各自审批状态（✓已审批 / ○待审批）+ 审批进度 + 操作按钮」。页面<b>下方</b>三个操作按钮：</p>
                  <p class="pl-3"><b>· 调整审批人：</b>仅展示<b>当前审批中节点「未审批」的人</b>（可移除标签）；<b>已完成审批的人以灰色只读标签展示、不可调整</b>；弹窗下方候选池点击可<b>增选 / 重新加回原审批人</b>（如把张三划掉、改加王武）。确定后该节点 <code>actor = 已完成人员 + 未审批人员</code>。</p>
                  <p class="pl-3"><b>· 催办：</b>弹窗列出<b>当前节点未审批人</b>（按 <code>、</code> 拆分），勾选后发送催办提醒；已审批人不出现在可催办列表。</p>
                  <p class="pl-3"><b>· 撤回流程：</b>填写撤回原因，确定后实例状态置「已撤回」并追加一条「撤回」步骤日志。</p>
                  <p class="pl-3"><b>· 前往处理：</b>流转日志中「前往处理」按钮打开<b>真实处理页面</b>——<b>上方为「单据详情」（即左侧表单内容，申请人填写内容）</b>，<b>下方为「当前审批人 + 审批意见」文本框 + 「通过 / 驳回」按钮</b>；点「通过」后把该节点所有审批人写入 <code>done</code> 并将节点置「通过」、流转至下一节点，点「驳回」则实例状态置「已驳回」并终止。</p>
                  <p class="pl-3"><b>· 流转图（右上角）：</b>BFS 分层 + 节点按状态着色 + SVG 连线 + 缩放 + 图例；<b>鼠标悬浮节点</b>显示「节点名称 + 状态 + 全部审批人（✓/○）+ 审批进度」；节点状态仅 3 种：<b>处理中=蓝 / 已流转=绿 / 未流转=灰</b>。开始节点一旦提交即视为「已流转」（绿）；<b>已完成类动作（通过/完成/提交/抄送）视为整节点通过，该节点全部审批人标记为已审批</b>；<b>多人审批节点：只要还有人未审批即显示蓝（处理中），全部通过才显示绿（已流转）——不单独区分"部分通过"状态</b>，悬浮卡仍展示全部审批人（✓已审批 / ○待审批）及进度 N/M。示例实例 I1 的「直属主管审批」李强已通过→整节点绿且李强显示<b>已审批</b>，「部门总监审批」为 张三✓/李四○ 的<b>处理中（蓝）</b>，I2（已通过）全绿；驳回节点（如 I4「部门总监审批」）归为<b>未流转（灰）</b>。</p>
                  <p><b>⑥ 实例入口统一：</b>点击实例行与「查看」按钮均打开上述<b>统一详情</b>（左表单 / 右日志 / 底三按钮 / 右上流转图）；<b>不再提供按人员维度的任务列表聚合</b>。</p>
                  <p><b>⑦ 流程版本号（与工作表单一致）：</b>首次发布生成 <b>v1</b>；后续发布时，将「本次内容与<b>上一个线上版本快照</b>」做全量比对——<b>内容有任意变化 → 版本号 +1</b>；<b>编辑后内容与原线上版本完全相同（无丝毫变化）→ 版本号保持不变</b>，仅刷新发布信息；历史版本「恢复并发布」以该版本内容重新上线，<b>版本号保持原值</b>；发布成功后，全员可发起。</p>
                  <p><b>⑧ 表锁定：</b>流程发起时锁定版本号，在途单据按当时 schema 渲染，改版不扰乱历史数据。</p>
                  <p><b>⑨ 找不到节点负责人时的兜底策略：</b>节点配置面板 → 审批人 Tab →「找不到节点负责人时」仅提供「转给指定成员 / 自动提交」两种兜底；选「转给指定成员」则自动指派到指定成员继续流转，选「自动提交」则跳过该节点并按流转条件进入下一节点。</p>
                  <p><b>⑩ 时限超时站内消息模板（节点 Tab · 时限超时 · 发送站内消息提醒）：</b>向该节点<b>全部未审批人</b>各发送一条站内消息，标题固定为「<b>【流程超时提醒】您的审批任务已超时</b>」，正文模板：<code>您有待审批单据《{流程名称}》（编号：{单据编号}，节点：{节点名称}）已超时 {N}{小时/天}，请尽快处理。点击查看详情 →</code>。变量名固定、不可编辑；若同时配置了邮件通道则同步发送邮件。</p>
                  <p><b>⑪ 流程结束动作「通知发起人」站内消息模板：</b>结束节点选择「通知发起人」时，实例进入「已结束」即向<b>发起人</b>发送站内消息，标题固定为「<b>【流程已结束】您发起的 {流程名称} 已处理完成</b>」，正文模板：<code>您于 {发起时间} 发起的《{流程名称}》（编号：{单据编号}）已于 {结束时间} 处理完成，最终结果：{全部通过 / 被驳回于{驳回节点} / 审批异常}。点击查看详情 →</code>。</p>
                  <p><b>⑫ 流程实例无暂存数据：</b>流程实例监控列表不展示「草稿 / 暂存」类单据；新建发起即进入「审批中」等正式状态，未正式提交的暂存草稿不进入实例监控。</p>
                  <p><b>⑬ 审批节点的「驳回」与「拒绝」为两种独立动作：</b>「驳回」（配置项「允许驳回」+「驳回至 发起人/上一节点」）将单据退回指定位置，实例进入「已驳回」状态，发起人修改后可重新提交流转；「拒绝」（配置项「允许拒绝」）视为流程终止，实例直接进入「已拒绝」状态，不可再流转。两者状态互不相同，运行态审批处理页按节点配置独立显示「驳回」「拒绝」两个按钮。</p>
                  <p><b>⑭ 流程下架语义（软下线 · 仅阻止新增引用）：</b>下架不改变"已建立关系"——已将该流程挂载为菜单素材的菜单项<b>仍可正常发起</b>，已发起的流程实例<b>不受影响、继续流转、保留可查</b>；下架仅阻止"新增引用"：下架后<b>不能再被新应用菜单挂载</b>（仅"已发布"素材可挂载）；流程自身状态回退"草稿（已下架）"保留历史版本快照可查，可重新「发布」上线；流程下架<b>不影响其绑定的表单</b>（表单是否下架为独立决策）。下架横幅文案：「流程『{名称}』已下架。已挂载该流程的菜单仍可正常发起；不再接受新的菜单挂载。历史版本保留可查，可重新发布上线。」</p>
                  <p><b>⑮ 字段字符长度限制（通用规则）：</b>所有「名称类」字段统一上限 <b>20 个字符</b>、「描述类」字段统一上限 <b>500 个字符</b>，超出即禁止继续输入（前端 maxlength 硬限制 + 后端校验，发布时若超限提示「{字段}不可超过 N 字」）。本模块适用：流程<b>名称 ≤ 20</b> 字、流程<b>描述 ≤ 500</b> 字。</p>
                </div>
              </div></div>
          </div>
        </div>
      </div>

  function fmtDateTime(s){ if(!s) return '—'; s=String(s); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s+' 00:00' : s; }
  /* 流程状态：状态与版本合并为单一状态标签（与工作表单一致） */
  function flowStatusInfo(f){
    if(f.status==='已发布') return { label:'已发布 v'+f.version, cls:'bg-green-100 text-green-600' };

  function deleteFlow(id){
    const idx=FLOWS.findIndex(x=>x.id===id); if(idx<0) return;

    if(f.refs && f.refs.length){ alert('此流程已被引用，不可删除。'); return; }
    if(!confirm('确定要删除草稿流程「'+f.name+'」吗？\n删除后该草稿流程将不可恢复。')) return;
    FLOWS.splice(idx,1); renderFlowTable();
  }

  function instStatusCls(s){return ({'审批中':'bg-blue-100 text-blue-600','已通过':'bg-green-100 text-green-600','已驳回':'bg-red-100 text-red-600','已拒绝':'bg-red-100 text-red-600','已撤回':'bg-amber-100 text-amber-600'})[s]||'bg-gray-100 text-gray-500';}
  /* ===================== 实例监控：实例详情(点击实例行) + 流转图 ===================== */
  /* openInstanceDetail：整个流程实例详情 — 左=表单内容(分section,2列) | 右=流转日志(节点+负责人+开始处理+处理耗时+操作) | 底部=调整审批人/催办/撤回流程 | 右上=流转图/显示内容切换 */
  function openInstanceDetail(id){

          <button onclick="openInstanceFlowChart('${s.id}')" class="px-3 py-1.5 text-sm rounded-md border border-gray-300 text-gray-600 hover:text-[#165DFF] hover:border-[#165DFF] btn-click"><i class="fas fa-project-diagram mr-1"></i>流转图</button>

      <div class="flex items-center justify-end gap-3 px-6 py-3 bg-white border-t border-gray-200 flex-shrink-0" onclick="event.stopPropagation()">
        <button onclick="openAdjustApprover('${s.id}')" class="px-4 py-2 text-sm rounded-md border border-[#165DFF] text-[#165DFF] hover:bg-blue-50 btn-click"><i class="fas fa-user-edit mr-1"></i>调整审批人</button>
        <button onclick="openUrge('${s.id}')" class="px-4 py-2 text-sm rounded-md border border-orange-400 text-orange-500 hover:bg-orange-50 btn-click"><i class="fas fa-bell mr-1"></i>催办</button>

    document.body.insertAdjacentHTML('beforeend', html);

  function toggleInstLog(){
    const p=document.getElementById('instLogPanel'); const b=document.getElementById('logToggleBtn');
    if(!p) return;
    const hidden=p.classList.toggle('hidden');
    if(b) b.innerHTML=hidden?'<i class="fas fa-eye-slash mr-1"></i>隐藏内容':'<i class="fas fa-eye mr-1"></i>显示内容';
  }
  /* 左：表单内容(卡片式分section排版) —— 优先展示该实例的真实提交数据 */
  const INSTANCE_FORM_DATA={
    I1:{ leaveType:'事假', days:'3', startDate:'2026-08-05', endDate:'2026-08-07', reason:'家中有事需处理，已安排同事代为跟进手头工作，请假期间手机保持畅通。' },
    I2:{ leaveType:'年假', days:'5', startDate:'2026-08-04', endDate:'2026-08-08', reason:'暑期家庭出游，提前安排好工作交接。' },
    I3:{ amount:'2,380.00', costType:'差旅', remark:'北京客户拜访差旅费用（高铁 + 住宿）。' },
    I4:{ leaveType:'病假', days:'2', startDate:'2026-08-06', endDate:'2026-08-07', reason:'感冒发烧，医嘱居家休息两天。' }
  };
  function buildFormSections(s){
    const flow=FLOWS.find(x=>x.id===s.flowId);
    const form=flow?FORM(flow.formId):null;
    if(!form||!form.fields||!form.fields.length) return '<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8 text-center text-sm text-gray-400">该流程未绑定表单或无字段。</div>';
    const f=form.fields;
    const data=INSTANCE_FORM_DATA[s.id]||{};
    const groups=[
      { title:'申请信息', icon:'fa-file-alt', fields:f.slice(0, Math.min(4, f.length)) },
      { title:'详细信息', icon:'fa-align-left', fields:f.slice(4) }
    ].filter(g=>g.fields.length);
    return `<div class="space-y-5">
      ${groups.map(g=>`
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
          <div class="flex items-center gap-2 px-5 py-3.5 border-b border-gray-100 bg-gray-50/70">
            <span class="w-7 h-7 rounded-lg bg-blue-50 text-[#165DFF] flex items-center justify-center"><i class="fas ${g.icon} text-xs"></i></span>
            <h3 class="text-sm font-semibold text-gray-800">${escapeHTML(g.title)}</h3>
          </div>
          <div class="px-5 py-2 grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-0">
            ${g.fields.map(fld=>fieldRow(fld, data)).join('')}
          </div>
        </div>`).join('')}
    </div>`;
  }
  function fieldRow(fld, data){
    const key=fld.fieldName||fld.name;
    const val=(data && (key in data) && data[key]!=='' && data[key]!==undefined) ? data[key] : mockFieldValue(fld);
    return `<div class="flex flex-col gap-1 py-3.5 border-b border-gray-50 sm:border-0">
      <span class="text-xs text-gray-400">${escapeHTML(fld.label||fld.name||'字段')}</span>
      <span class="text-sm text-gray-800 font-medium leading-5">${escapeHTML(val)}</span>
    </div>`;
  }
  function mockFieldValue(fld){
    const t=fld.type, lb=(fld.label||'');
    if(['member','dept','formref','feed'].indexOf(t)>=0) return '李四';
    if(t==='number'||lb.indexOf('天数')>=0) return '3 天';
    if(t==='date'||t==='datetime'||lb.indexOf('日期')>=0) return '2026-08-05';
    if(lb.indexOf('类型')>=0) return '事假';
    if(t==='select'||t==='radio'||t==='multiselect'||t==='checkbox') return (fld.options&&fld.options[0])?fld.options[0].label:'选项A';
    if(t==='textarea'||lb.indexOf('事由')>=0) return '家中事务处理，需请假三天，工作已交接。';
    return '—';
  }
  /* 右：流转日志(节点维度) */
  function buildRichLog(s){
    const flow=FLOWS.find(x=>x.id===s.flowId);
    const nodeObjs=flow?(flow.nodes||[]):[];
    const names=s.nodes||[];
    if(!names.length) return '<p class="text-sm text-gray-400">暂无流程节点。</p>';
    const rels=['40分钟前','1小时前','2小时前','3小时前','4小时前','5小时前'];
    const costs=['2小时','34秒','1秒','37秒','1秒','10秒'];
    return names.map((nm,i)=>{
      const n=nodeObjs.find(x=>x.name===nm)||{name:nm, type:'approval'};
      const stt=nodeApprovalState(s,n); const a=stt.key;
      const isP=(a==='审批中');
      const isD=a==='已流转';
      let badge;
      if(isP) badge='<span class="tag px-1.5 py-0.5 rounded text-[10px] bg-blue-100 text-blue-600">处理中</span>';
      else if(isD) badge='<span class="tag px-1.5 py-0.5 rounded text-[10px] bg-green-100 text-green-600">已完成</span>';
      else badge='<span class="tag px-1.5 py-0.5 rounded text-[10px] bg-gray-100 text-gray-400">未开始</span>';
      const rel=rels[i]||rels[rels.length-1];
      const cost=costs[i]||'—';
      const rawStep=(s.steps||[]).find(st=>st.node===n);
      let body='';
      if(isP){
        const approversHtml = stt.approvers.length ? '<div class="mt-2 space-y-1">'+stt.approvers.map(x=>`<div class="flex items-center gap-2 text-xs"><i class="fas ${x.done?'fa-check-circle text-green-500':'fa-clock text-orange-400'}"></i><span class="text-gray-700">${escapeHTML(x.name)}</span>${x.done?'<span class="text-green-500">已审批</span>':'<span class="text-orange-500">待审批</span>'}</div>`).join('')+'</div>' : '';
        body=`<div class="text-xs text-gray-500 mt-1.5">当前审批进度：<span class="text-gray-800 font-medium">${stt.doneCount}/${stt.total}</span></div>${approversHtml}
          <button class="mt-2 px-2.5 py-1 text-xs rounded-md border border-[#165DFF] text-[#165DFF] hover:bg-blue-50 btn-click" onclick="openHandleNode('${s.id}','${escapeHTML(nm)}')">前往处理</button>`;
      } else if(isD){
        const approversHtml = stt.approvers.length ? '<div class="mt-1.5 space-y-1">'+stt.approvers.map(x=>`<div class="flex items-center gap-2 text-xs"><i class="fas fa-check-circle text-green-500"></i><span class="text-gray-700">${escapeHTML(x.name)}</span><span class="text-green-500">已审批</span></div>`).join('')+'</div>' : `<div class="text-xs text-gray-500 mt-1.5">${escapeHTML(rawStep?rawStep.actor:'—')}</div>`;
        body=approversHtml+`<div class="text-xs text-gray-400 mt-0.5">开始处理：${rel}</div><div class="text-xs text-gray-400">处理耗时：${cost}</div>`;
      } else {
        // 未开始 / 已驳回等未通过流转的节点：统一归为“未开始”（仅保留3种状态，不再使用已驳回）
        if(rawStep && rawStep.action==='驳回'){
          body=`<div class="text-xs text-gray-500 mt-1.5">${escapeHTML(rawStep.actor||'—')}</div>`+(rawStep.comment?`<div class="text-xs text-gray-400 mt-0.5">驳回意见：${escapeHTML(rawStep.comment)}</div>`:'');
        } else {
          body='<div class="text-xs text-gray-300 mt-1.5">未开始</div>';
        }
      }
      return `<div class="border-b border-gray-100 pb-3 mb-3 last:border-0">
        <div class="flex items-center justify-between"><span class="text-sm font-semibold text-gray-800">${escapeHTML(n)}</span>${badge}</div>
        ${body}
      </div>`;
    }).join('');
  }
  /* 前往处理：真实处理页面(上=单据详情, 下=审批意见+通过/驳回) */
  function openHandleNode(id, nodeName){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const flow=FLOWS.find(x=>x.id===s.flowId);
    const nodeObj=(flow?(flow.nodes||[]):[]).find(n=>n.name===nodeName) || {name:nodeName, type:'approval'};
    const stt=nodeApprovalState(s, nodeObj);
    const formHtml=buildFormSections(s);
    const approversHtml = stt.approvers && stt.approvers.length ? stt.approvers.map(x=>`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full ${x.done?'bg-green-50 text-green-600':'bg-amber-50 text-amber-600'} text-xs"><i class="fas ${x.done?'fa-check-circle':'fa-clock'}"></i>${escapeHTML(x.name)}</span>`).join(' ') : '<span class="text-sm text-gray-500">—</span>';
    const html=`<div id="handleModal" class="fixed inset-0 z-[225] flex items-center justify-center bg-black/40" onclick="if(event.target===this)closeHandleModal()">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 max-h-[92vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 flex-shrink-0"><h3 class="text-lg font-semibold text-gray-800"><i class="fas fa-tasks mr-2 text-[#165DFF]"></i>审批处理 · ${escapeHTML(nodeName)}</h3><button onclick="closeHandleModal()" class="text-gray-400 hover:text-gray-600 btn-click"><i class="fas fa-times"></i></button></div>
        <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
          <div>
            <div class="text-xs text-gray-400 mb-2">单据详情（申请人填写内容）</div>
            ${formHtml}
          </div>
          <div class="bg-gray-50 rounded-xl border border-gray-200 p-4">
            <div class="flex items-center justify-between mb-3"><span class="text-sm font-medium text-gray-700">当前审批人</span><div class="flex flex-wrap gap-1.5">${approversHtml}</div></div>
            <label class="block text-xs text-gray-400 mb-1">审批意见</label>
            <textarea id="handleOpinion" rows="3" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-[#165DFF] focus:outline-none" placeholder="请输入审批意见（可选）..."></textarea>
          </div>
        </div>
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 flex-shrink-0">
          ${nodeObj.allowBounceBack?'<button onclick="confirmBounceBack(\''+s.id+'\',\''+escapeHTML(nodeName)+'\')" class="px-4 py-2 text-sm rounded-lg border border-red-400 text-red-500 hover:bg-red-50 btn-click"><i class="fas fa-undo mr-1"></i>驳回</button>':''}
          ${nodeObj.allowReject?'<button onclick="confirmReject(\''+s.id+'\',\''+escapeHTML(nodeName)+'\')" class="px-4 py-2 text-sm rounded-lg border border-red-500 text-red-500 hover:bg-red-50 btn-click"><i class="fas fa-ban mr-1"></i>拒绝</button>':''}
          <button onclick="confirmApprove('${s.id}','${escapeHTML(nodeName)}')" class="px-4 py-2 bg-[#165DFF] hover:bg-blue-600 text-white text-sm rounded-lg font-medium btn-click"><i class="fas fa-check mr-1"></i>通过</button>
        </div>
      </div></div>`;
    document.body.insertAdjacentHTML('beforeend', html);
  }
  function closeHandleModal(){ const e=document.getElementById('handleModal'); if(e) e.remove(); }
  function nextNodeName(s, nodeName){ const arr=s.nodes||[]; const i=arr.indexOf(nodeName); return (i>=0 && i<arr.length-1)?arr[i+1]:null; }
  function confirmApprove(id, nodeName){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const opinion=(document.getElementById('handleOpinion')||{}).value||'';
    const st=(s.steps||[]).find(x=>x.node===nodeName);
    if(st){ const approvers=(st.actor||'').split(/[、,， ]/).filter(Boolean); st.done=approvers.slice(); st.action='通过'; st.time=fmtDateTimeNow(); st.comment=opinion; }
    const nx=nextNodeName(s, nodeName);
    if(nx && nx!=='结束'){ s.currentNode=nx; (s.steps=s.steps||[]).push({ node:nx, actor:'—', action:'审批中', time:'—', comment:'' }); }
    else { s.currentNode='结束'; s.status='已通过'; (s.steps=s.steps||[]).push({ node:'结束', actor:'系统', action:'完成', time:fmtDateTimeNow(), comment:'' }); }
    closeHandleModal(); closeInstance(); openInstanceDetail(id); renderInstanceMonitor();
    alert('已通过，流程已流转至下一节点（原型演示）');
  }
  function confirmReject(id, nodeName){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const opinion=(document.getElementById('handleOpinion')||{}).value||'';
    const st=(s.steps||[]).find(x=>x.node===nodeName); if(st){ st.action='拒绝'; st.time=fmtDateTimeNow(); st.comment=opinion; }
    s.status='已拒绝'; s.currentNode=nodeName;
    closeHandleModal(); closeInstance(); openInstanceDetail(id); renderInstanceMonitor();
    alert('已拒绝，流程终止（原型演示）');
  }
  function confirmBounceBack(id, nodeName){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const opinion=(document.getElementById('handleOpinion')||{}).value||'';
    const st=(s.steps||[]).find(x=>x.node===nodeName); if(st){ st.action='驳回'; st.time=fmtDateTimeNow(); st.comment=opinion; }
    s.status='已驳回'; s.currentNode=nodeName;
    closeHandleModal(); closeInstance(); openInstanceDetail(id); renderInstanceMonitor();
    alert('已驳回，单据退回修改（原型演示）');
  }

  /* 调整审批人 */
  let _adjSel=[], _adjDone=[];
  const APPROVER_POOL=['张三','李四','王武','张伟','李强','王芳','赵敏','孙磊','周婷','吴昊'];
  function openAdjustApprover(id){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const curStep=(s.steps||[]).find(st=>st.action==='审批中');
    if(!curStep){ alert('当前流程没有处于审批中的节点，无法调整审批人。'); return; }
    const approvers=String(curStep.actor||'').split(/[、,， ]/).filter(Boolean);
    const done=(curStep.done||[]).filter(d=>approvers.indexOf(d)>=0);
    _adjDone=done.slice();
    _adjSel=approvers.filter(a=>done.indexOf(a)<0);
    const html=`<div id="adjModal" class="fixed inset-0 z-[220] flex items-center justify-center bg-black/40" onclick="if(event.target===this)closeAdjModal()">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200"><h3 class="text-lg font-semibold text-gray-800"><i class="fas fa-user-edit mr-2 text-[#165DFF]"></i>调整审批人</h3><button onclick="closeAdjModal()" class="text-gray-400 hover:text-gray-600 btn-click"><i class="fas fa-times"></i></button></div>
        <div class="px-6 py-5">
          <p class="text-sm text-gray-500 mb-2">当前节点：<b class="text-gray-800">${escapeHTML(s.currentNode||'')}</b></p>
          <p class="text-sm text-gray-500 mb-2">当前未审批的审批人（可删减 / 增选）：</p>
          <div id="adjSelBox" class="flex flex-wrap gap-2 mb-3 min-h-[40px] p-3 rounded-lg bg-blue-50/40 border border-blue-200"></div>
          ${_adjDone.length?`<p class="text-xs text-gray-400 mb-1">以下人员已完成审批（不可调整）：</p><div class="flex flex-wrap gap-2 mb-4">${_adjDone.map(n=>`<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-gray-100 text-gray-400 text-xs"><i class="fas fa-check-circle"></i>${escapeHTML(n)}</span>`).join('')}</div>`:''}
          <p class="text-xs text-gray-400 mb-2">点击下方姓名可添加 / 移除审批人：</p>
          <div id="adjPoolBox" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50">
          <button onclick="closeAdjModal()" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 btn-click">取消</button>
          <button onclick="confirmAdjustApprover('${s.id}')" class="px-4 py-2 bg-[#165DFF] hover:bg-blue-600 text-white text-sm rounded-lg font-medium btn-click">确定调整</button>
        </div>
      </div></div>`;
    document.body.insertAdjacentHTML('beforeend', html);
    renderAdjChips();
  }
  function renderAdjChips(){
    const selBox=document.getElementById('adjSelBox'); const poolBox=document.getElementById('adjPoolBox');
    if(!selBox||!poolBox) return;
    selBox.innerHTML = _adjSel.length ? _adjSel.map(n=>`<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-[#165DFF] text-white text-xs"><span>${escapeHTML(n)}</span><button type="button" onclick="toggleAdj('${escapeHTML(n)}')" class="hover:text-red-200 btn-click" title="移除"><i class="fas fa-times text-[10px]"></i></button></span>`).join('') : '<span class="text-xs text-gray-400">暂未选择未审批审批人</span>';
    poolBox.innerHTML = APPROVER_POOL.map(n=>{ const on=_adjSel.indexOf(n)>=0; return `<button type="button" onclick="toggleAdj('${escapeHTML(n)}')" class="px-3 py-1.5 rounded-full border text-xs btn-click ${on?'border-[#165DFF] bg-blue-50 text-[#165DFF]':'border-gray-300 text-gray-600 hover:border-[#165DFF] hover:text-[#165DFF]'}">${on?'<i class="fas fa-check mr-1"></i>':''}${escapeHTML(n)}</button>`; }).join('');
  }
  function toggleAdj(name){
    const i=_adjSel.indexOf(name);
    if(i>=0) _adjSel.splice(i,1); else _adjSel.push(name);
    renderAdjChips();
  }
  function closeAdjModal(){ const e=document.getElementById('adjModal'); if(e) e.remove(); }
  function confirmAdjustApprover(id){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    if(!_adjSel.length){ alert('请至少保留一名未审批的审批人'); return; }
    const st=(s.steps||[]).find(x=>x.action==='审批中');
    if(st){ st.actor=[..._adjDone, ..._adjSel].join('、'); st.done=_adjDone.slice(); }
    closeAdjModal();
    closeInstance(); openInstanceDetail(id); renderInstanceMonitor();
  }
  /* 催办 */
  function openUrge(id){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const curStep=(s.steps||[]).find(st=>st.action==='审批中');
    if(!curStep){ alert('当前流程没有处于审批中的节点，无法催办。'); return; }
    const str=curStep.actor||'当前审批人';
    let people=str.split(/[、,， ]/).filter(Boolean);
    if(!people.length) people=[str];
    const list=people.map((n,i)=>`
      <label class="flex items-center gap-3 p-2.5 border border-gray-200 rounded-lg cursor-pointer hover:border-orange-400">
        <input type="checkbox" name="urgePick" value="${escapeHTML(n)}" ${i===0?'checked':''} class="text-orange-500">
        <span class="text-sm text-gray-700">${escapeHTML(n)}</span>

  /* 流转图页面 */
  let _chartZoom=1;
  function openInstanceFlowChart(id){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const flow=FLOWS.find(x=>x.id===s.flowId); if(!flow) return;
    const nodes=flow.nodes||[]; const edges=flow.edges||[];
    const steps=s.steps||[];
    // 开始/结束节点在流程定义中的默认名是「发起人/流程结束」，而实例步骤里写的是「开始/结束」，
    // 这里按类型兜底匹配，保证状态判定正确。
    const dispName=nObj=>(nObj.type==='start'?'开始':(nObj.type==='end'?'结束':nObj.name));
    const statusOf=nObj=>nodeApprovalState(s, nObj).key;
    const adj={}; nodes.forEach(n=>{adj[n.id]=[];});
    edges.forEach(e=>{ if(adj[e.from]) adj[e.from].push(e.to); });
    const startNode=nodes.find(n=>n.type==='start')||nodes[0];
    const layer={}; const visited=new Set();
    if(startNode){ visited.add(startNode.id); layer[startNode.id]=0; const q=[startNode.id];
      while(q.length){ const id=q.shift(); (adj[id]||[]).forEach(to=>{ if(!visited.has(to)){ visited.add(to); layer[to]=(layer[id]||0)+1; q.push(to); } }); }
    }
    let ml=Math.max(0,...Object.values(layer));
    nodes.forEach(n=>{ if(!(n.id in layer)){ ml++; layer[n.id]=ml; } });
    const groups={}; nodes.forEach(n=>{ const l=layer[n.id]; (groups[l]=groups[l]||[]).push(n); });
    const layerKeys=Object.keys(groups).map(Number).sort((a,b)=>a-b);
    const NW=180,NH=52,GAP_Y=90,GAP_X=40;
    const positions={};
    layerKeys.forEach(l=>{
      const row=groups[l];
      const totalW=row.length*NW+(row.length-1)*GAP_X;
      const rowStartX=-(totalW/2);
      row.forEach((n,j)=>{ positions[n.id]={x:rowStartX+j*(NW+GAP_X), y:l*(NH+GAP_Y)}; });
    });
    let minX=Infinity,maxX=-Infinity,maxY=0;
    Object.keys(positions).forEach(id=>{ const p=positions[id]; if(p.x<minX) minX=p.x; if(p.x+NW>maxX) maxX=p.x+NW; if(p.y+NH>maxY) maxY=p.y+NH; });
    const pad=60;
    const offX=-minX+pad, offY=pad;
    const CW=maxX-minX+pad*2, CH=maxY+pad*2;
    const statusCls={'审批中':'border-blue-500 bg-blue-50 text-blue-700','已流转':'border-green-500 bg-green-50 text-green-700','未流转':'border-gray-300 bg-gray-50 text-gray-500'};
    const nodeHTML=nodes.map(n=>{
      const stt=nodeApprovalState(s,n); const p=positions[n.id];
      return `<div class="absolute flex items-center justify-center gap-2 rounded-full border-2 ${statusCls[stt.key]} px-5 py-2.5 cursor-pointer hover:shadow-md bg-white" style="left:${p.x+offX}px;top:${p.y+offY}px;width:${NW}px;height:${NH}px;" onmouseenter="showNodeChartHover('${s.id}','${n.id}')" onmouseleave="hideNodeChartHover()">
        <i class="fas ${FLOW_NODE_ICON[n.type]||'fa-circle'}"></i>
        <span class="text-sm font-medium">${escapeHTML(dispName(n))}</span>
      </div>`;
    }).join('');
    let edgePaths='<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker></defs>';
    edges.forEach(e=>{
      const a=positions[e.from], b=positions[e.to]; if(!a||!b) return;
      const ax=a.x+offX+NW/2, ay=a.y+offY+NH;
      const bx=b.x+offX+NW/2, by=b.y+offY;
      const my=(ay+by)/2;
      edgePaths+=`<path d="M${ax},${ay} C${ax},${my} ${bx},${my} ${bx},${by}" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>`;
    });
    window._chartPositions=positions; window._chartOffX=offX; window._chartOffY=offY;
    const ver='V'+(s.currentIdx||1);
    const html=`<div id="flowChartPage" class="fixed inset-0 z-[230] flex flex-col bg-white" onclick="if(event.target===this)closeFlowChart()">
      <div class="flex items-center justify-between px-6 py-3 border-b border-gray-200 flex-shrink-0" onclick="event.stopPropagation()">
        <div class="flex items-center gap-3"><span class="px-2.5 py-1 rounded-full border border-[#165DFF] text-[#165DFF] text-xs font-medium">流程版本 ${ver}</span></div>
        <div class="flex items-center gap-4 text-xs text-gray-600">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded border-2 border-blue-500 bg-blue-50 inline-block"></span>处理中</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded border-2 border-green-500 bg-green-50 inline-block"></span>已流转</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded border-2 border-gray-300 bg-gray-50 inline-block"></span>未流转</span>
        </div>
        <button onclick="closeFlowChart()" class="w-8 h-8 rounded-md text-gray-400 hover:bg-gray-100 btn-click"><i class="fas fa-times"></i></button>
      </div>
      <div class="flex items-center gap-2 px-6 py-2 border-b border-gray-100 text-sm text-gray-600 flex-shrink-0" onclick="event.stopPropagation()">
        <button onclick="zoomChart(-0.1)" class="w-7 h-7 rounded border border-gray-300 hover:border-[#165DFF] btn-click">−</button>
        <span id="chartZoomLabel" class="w-12 text-center">100%</span>

          <svg class="absolute inset-0 w-full h-full pointer-events-none">${edgePaths}</svg>
          ${nodeHTML}

    document.body.insertAdjacentHTML('beforeend', html);

  function zoomChart(delta){
    _chartZoom=Math.max(0.5,Math.min(2,_chartZoom+delta));
    const c=document.getElementById('chartContainer'); if(c) c.style.transform='scale('+_chartZoom+')';

  function closeFlowChart(){ const e=document.getElementById('flowChartPage'); if(e) e.remove(); }
  /* 节点图标（供流转图与悬浮提示共用） */
  const FLOW_NODE_ICON={'start':'fa-play-circle','approval':'fa-user','cc':'fa-flag','end':'fa-flag-checkered'};
  /* 计算节点审批状态：未流转 / 处理中 / 已流转（仅3种，已驳回不再作为节点状态，驳回节点归为未流转）；支持多人会签/或签的 done 进度（部分通过仍归为"处理中"） */
  function nodeApprovalState(s, n){
    const steps=s.steps||[];
    let st=steps.find(x=>x.node===n.name);
    if(!st){
      if(n.type==='start'){ const t=steps.find(x=>x.action==='提交'); st=t?{action:'提交',actor:t.actor||''}:null; }
      else if(n.type==='end'){ st=(steps.some(x=>x.action==='完成')||s.status==='已通过')?{action:'完成',actor:'系统'}:null; }
    }
    if(!st) return {key:'未流转',label:'未流转',cls:'border-gray-300 bg-gray-50 text-gray-500',approvers:[],doneCount:0,total:0};
    const a=st.action;
    // 已完成类动作（通过/完成/提交/抄送）视为整节点通过，所有处理人标记为已审批，
    // 避免“节点已流转(绿)却仍显示某人待审批”的矛盾；仅“审批中”按 done 数组逐个判定。
    const completed=['通过','完成','提交','抄送'].indexOf(a)>=0;
    const approvers=(st.actor||'').split(/[、,， ]/).filter(Boolean).map(x=>({name:x, done: completed || (st.done||[]).indexOf(x)>=0}));
    const total=approvers.length, doneCount=approvers.filter(x=>x.done).length;
    if(a==='审批中'){
      if(doneCount<total) return {key:'审批中',label:'处理中',cls:'border-blue-500 bg-blue-50 text-blue-700',approvers,doneCount,total};
      return {key:'已流转',label:'已流转',cls:'border-green-500 bg-green-50 text-green-700',approvers,doneCount,total};
    }
    if(completed) return {key:'已流转',label:'已流转',cls:'border-green-500 bg-green-50 text-green-700',approvers,doneCount,total};
    // 驳回：流程未通过该节点，归为“未流转”（流转图仅保留 处理中/已流转/未流转 三种状态，不再使用已驳回）
    return {key:'未流转',label:'未流转',cls:'border-gray-300 bg-gray-50 text-gray-500',approvers,doneCount,total};
  }
  function statusLabelByKey(k){return ({'未流转':'bg-gray-100 text-gray-400','审批中':'bg-blue-100 text-blue-600','已流转':'bg-green-100 text-green-600'})[k]||'bg-gray-100 text-gray-400';}
  function hideNodeChartHover(){ const e=document.getElementById('nodeChartHover'); if(e) e.remove(); }

    hideNodeChartHover();
    const s=FLOW_INSTANCES.find(x=>x.id===sid); if(!s) return;

    const n=(flow.nodes||[]).find(x=>x.id===nodeId); if(!n) return;

    } else {
      approverRows='<div class="text-gray-400 mt-0.5">处理人：<b class="text-[#165DFF]">—</b></div>';
    }
    const progress = stt.total>1 ? `<div class="text-gray-400 mt-0.5">审批进度：${stt.doneCount}/${stt.total}</div>` : '';
    const card=`<div id="nodeChartHover" class="absolute bg-white border border-gray-200 rounded-lg shadow-lg px-3 py-2 text-xs z-20 pointer-events-none" style="left:${pos.x+offX}px;top:${pos.y+offY+NH+14}px;width:${NW}px;">
      <div class="font-semibold text-gray-800 mb-1 flex items-center gap-1.5"><i class="fas ${FLOW_NODE_ICON[n.type]||'fa-circle'} text-[#165DFF] text-[10px]"></i>${escapeHTML(disp)}</div>

  function statusLabelOf(nodeObj,st){

    if(a==='通过'||a==='完成') return {label:'已流转', cls:'bg-green-100 text-green-600'};
    if(a==='抄送') return {label:'已抄送', cls:'bg-gray-100 text-gray-500'};
    return {label:'未流转', cls:'bg-gray-100 text-gray-400'};
  }

  function nodeHTML(n, i){
    const sel = n.id===selectedNodeId ? 'sel':'';
    const x = n.x||0, y = n.y||0;
    const style = `position:absolute; left:${x}px; top:${y}px;`;
    const viewOnly = !!viewingVersion;
    const evAttrs = viewOnly ? '' : `onmousedown="startNodeDrag(event,'${n.id}')" onclick="selectNode('${n.id}');event.stopPropagation()"`;
    const portIn = (!viewOnly && n.type!=='start') ? `<div class="port in" data-nid="${n.id}" onmousedown="startConnect(event,'${n.id}','in')"></div>` : '';
    const portOut = (!viewOnly && n.type!=='end' && n.type!=='cc') ? `<div class="port out" data-nid="${n.id}" onmousedown="startConnect(event,'${n.id}','out')"></div>` : '';
    const copyBtn = viewOnly ? '' : `<button class="node-copy" onmousedown="event.stopPropagation();event.preventDefault();" onclick="copyNode('${n.id}');event.stopPropagation()" title="复制节点"><i class="fas fa-copy"></i></button>`;
    const delBtn = viewOnly ? '' : `<button class="node-del" onmousedown="event.stopPropagation();event.preventDefault();" onclick="delNode('${n.id}');event.stopPropagation()"><i class="fas fa-times"></i></button>`;

    if(n.type==='end'){

  function approverText(n){
    switch(n.approverType){
      case 'initiator': return '发起人本人';
      case 'initiator_manager': return '发起人直属主管';
      case 'manager_level': return '第 '+n.level+' 级主管';
      case 'member': return n.members.length? (n.members.length>3? '已选 '+n.members.length+' 人' : n.members.join('、')) : '未指定成员';
      case 'role': return (n.roles.join('、')||'未指定角色')+'（角色）';
      case 'dept_head': return (n.depts.join('、')||'未指定部门')+' 主管';
      case 'field': return '表单字段：'+(n.fieldRef||'未选择');
      case 'post': return '指定岗位：'+(n.posts.join('、')||'未选择岗位');
    }

  }
  function modeText(m){ return m==='and'?'会签（全部通过）':m==='seq'?'依次审批':'或签（一人通过）'; }
  function ccText(n){
    if(n.ccType==='member') return n.members.length? (n.members.length>3? '已选 '+n.members.length+' 人' : n.members.join('、')) : '未指定成员';
    if(n.ccType==='role') return (n.roles.join('、')||'未指定角色')+'（角色）';
    if(n.ccType==='dept') return (n.depts.join('、')||'未指定部门')+'（部门）';
    if(n.ccType==='post') return (n.posts.join('、')||'未指定岗位')+'（岗位）';

  function selectNode(id){ selectedNodeId=id; selectedEdgeId=null; cfgTab='base'; renderCanvas(); renderConfig(); }
  function selectEdge(eid){ selectedEdgeId=eid; selectedNodeId=null; cfgTab='base'; renderCanvas(); renderConfig(); }
  function onFlowCanvasClick(e){
    const t=e.target;
    if(t.id==='nodeLayer'||t.id==='flowCanvas'||t.id==='edgeLabelLayer'||t.id==='edgesSvg'||t.id==='flowScroll'){
      selectedNodeId=null; selectedEdgeId=null; renderCanvas(); renderConfig();
    }
  }
  function delNode(id){
    const f=currentFlow(); const i=f.nodes.findIndex(n=>n.id===id); if(i<0) return;
    f.nodes.splice(i,1);
    f.edges = f.edges.filter(e=>e.from!==id && e.to!==id);
    if(selectedNodeId===id) selectedNodeId=null;
    if(selectedEdgeId && !getEdge(selectedEdgeId)) selectedEdgeId=null;
    renderCanvas(); renderConfig();
  }
  function copyNode(id){
    const f=currentFlow(); const n=f.nodes.find(x=>x.id===id); if(!n) return;
    const c=JSON.parse(JSON.stringify(n));
    c.id='n_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);

  /* ===================== 手动连线：从 out 端口拖到 in 端口 ===================== */
  function startConnect(e,nid,kind){
    if(kind==='in') return; // 只能从下连到上
    e.preventDefault(); e.stopPropagation();
    const f=currentFlow();
    drawingEdge={ from:nid, startX:e.clientX, startY:e.clientY };
    document.addEventListener('mousemove', drawTempEdge);
    document.addEventListener('mouseup', endConnect);
  }
  function drawTempEdge(ev){
    if(!drawingEdge) return;
    const svg=g('edgesSvg');
    // 清掉旧的临时线
    let tmp=svg.querySelector('#tempEdge'); if(tmp) tmp.remove();
    const canvas=g('flowCanvas'); const cr=canvas.getBoundingClientRect();
    const fromEl=g('node-'+drawingEdge.from); if(!fromEl) return;
    const ar=fromEl.getBoundingClientRect();
    const sx=ar.left+ar.width/2-cr.left, sy=ar.bottom-cr.top;
    const tx=ev.clientX-cr.left, ty=ev.clientY-cr.top;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    const d=`M ${sx} ${sy} C ${sx} ${sy+60}, ${tx} ${ty-60}, ${tx} ${ty}`;
    path.setAttribute('d',d); path.setAttribute('id','tempEdge'); path.setAttribute('stroke','#165DFF'); path.setAttribute('stroke-width','2'); path.setAttribute('stroke-dasharray','5,3'); path.setAttribute('fill','none'); svg.appendChild(path);
  }
  function endConnect(ev){
    document.removeEventListener('mousemove', drawTempEdge);
    document.removeEventListener('mouseup', endConnect);
    const tmp=g('edgesSvg').querySelector('#tempEdge'); if(tmp) tmp.remove();
    if(!drawingEdge) return;
    // 查找落点是否在 in 端口上
    const t=ev.target;
    if(t.classList && t.classList.contains('port') && t.classList.contains('in')){
      const toId=t.getAttribute('data-nid');
      if(toId && toId!==drawingEdge.from){
        const f=currentFlow();
        // 避免重复连接或自连
        const exists=f.edges.some(e=>e.from===drawingEdge.from && e.to===toId);
        const fromNode=f.nodes.find(x=>x.id===drawingEdge.from);
        const toNode=f.nodes.find(x=>x.id===toId);
        if(fromNode && fromNode.type==='cc'){
          alert('抄送节点为流程终止节点，其后不允许再连接任何节点。');
        } else if(!exists){
          f.edges.push({ id:'e_'+Date.now(), from:drawingEdge.from, to:toId, mode:'always', logic:'and', conditions:[] });
          selectedEdgeId=f.edges[f.edges.length-1].id; selectedNodeId=null;
          renderCanvas(); renderConfig();
        }
      }
    }
    drawingEdge=null;
  }

  /* ===================== 节点拖动 ===================== */
  function startNodeDrag(e, id){
    if(e.button!==0) return;
    if(e.target.closest('.node-del') || e.target.closest('.port')) return;
    e.preventDefault();
    const f=currentFlow(); const n=f.nodes.find(x=>x.id===id); if(!n) return;
    const canvas=g('flowCanvas');
    const startX=e.clientX, startY=e.clientY, ox=n.x||0, oy=n.y||0;
    const el=g('node-'+id); if(el) el.classList.add('node-dragging');
    selectNode(id);
    function mv(ev){
      let nx = ox + (ev.clientX-startX);
      let ny = oy + (ev.clientY-startY);
      nx=Math.max(0,Math.min(nx, canvas.clientWidth-210));
      ny=Math.max(0,Math.min(ny, canvas.clientHeight-90));
      n.x=nx; n.y=ny;
      const el=g('node-'+id); if(el){ el.style.left=nx+'px'; el.style.top=ny+'px'; }
      drawNodeEdges();
    }
    function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); const el=g('node-'+id); if(el) el.classList.remove('node-dragging'); }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  }
  function startBendDrag(e, eid){
    e.preventDefault(); e.stopPropagation();
    const f=currentFlow(); const ed=f.edges.find(x=>x.id===eid); if(!ed) return;
    const canvas=g('flowCanvas');
    function mv(ev){ const cr=canvas.getBoundingClientRect(); ed.bend={x:ev.clientX-cr.left, y:ev.clientY-cr.top}; drawNodeEdges(); }
    function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  }

  /* ===================== SVG 连线绘制 ===================== */
  const SVGNS='http://www.w3.org/2000/svg';
  function cubicPoint(x0,y0,x1,y1,x2,y2,x3,y3,t){
    const mt=1-t;
    const a=mt*mt*mt, b=3*mt*mt*t, c=3*mt*t*t, d=t*t*t;
    return { x:a*x0+b*x1+c*x2+d*x3, y:a*y0+b*y1+c*y2+d*y3 };
  }
  function drawNodeEdges(){
    const svg=g('edgesSvg'); if(!svg) return;
    const f=snapshotOfView() || currentFlow(); if(!f) return;
    // 保留临时线
    const tmp=svg.querySelector('#tempEdge');
    svg.innerHTML='';
    if(tmp) svg.appendChild(tmp);
    const canvas=g('flowCanvas'); const cr=canvas.getBoundingClientRect();
    f.edges.forEach(e=>{
      const a=g('node-'+e.from), b=g('node-'+e.to); if(!a||!b) return;
      const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
      const sx=ar.left+ar.width/2-cr.left, sy=ar.bottom-cr.top;
      const tx=br.left+br.width/2-cr.left, ty=br.top-cr.top;
      let c1x=sx, c1y=sy+70, c2x=tx, c2y=ty-70;
      if(e.bend){ c1x=e.bend.x;c1y=e.bend.y;c2x=e.bend.x;c2y=e.bend.y; }
      const d=`M ${sx} ${sy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tx} ${ty}`;
      const hit=document.createElementNS(SVGNS,'path'); hit.setAttribute('d',d); hit.setAttribute('class','edge-hit'); hit.setAttribute('data-eid',e.id); hit.onclick=(ev)=>{ev.stopPropagation(); selectEdge(e.id);}; svg.appendChild(hit);
      const p=document.createElementNS(SVGNS,'path'); p.setAttribute('d',d); p.setAttribute('class','edge-path'+(e.id===selectedEdgeId?' sel':'')+(e.mode==='else'?' else':'')); svg.appendChild(p);
      // 箭头
      const arrow=document.createElementNS(SVGNS,'polygon');
      const ang=Math.atan2(ty-c2y, tx-c2x);
      const arrLen=8;
      const ax1=tx-arrLen*Math.cos(ang-Math.PI/6), ay1=ty-arrLen*Math.sin(ang-Math.PI/6);
      const ax2=tx-arrLen*Math.cos(ang+Math.PI/6), ay2=ty-arrLen*Math.sin(ang+Math.PI/6);
      arrow.setAttribute('points',`${tx},${ty} ${ax1},${ay1} ${ax2},${ay2}`);
      arrow.setAttribute('fill', e.mode==='else'?'#7c5cff':'#165DFF');
      arrow.setAttribute('opacity', e.id===selectedEdgeId?'1':'.6');
      svg.appendChild(arrow);
      // 中点控制点
      if(e.id===selectedEdgeId || e.mode==='else' || e.mode==='condition'){
        const mid=cubicPoint(sx,sy,c1x,c1y,c2x,c2y,tx,ty,0.5);
        const h=document.createElementNS(SVGNS,'circle'); h.setAttribute('cx',mid.x);h.setAttribute('cy',mid.y);h.setAttribute('r',5);h.setAttribute('class','edge-bend');h.setAttribute('data-eid',e.id);h.onmousedown=(ev)=>{ev.stopPropagation();startBendDrag(ev,e.id);}; svg.appendChild(h);
      }
      const mid=cubicPoint(sx,sy,c1x,c1y,c2x,c2y,tx,ty,0.5); e._mx=mid.x; e._my=mid.y;
    });
    f.edges.forEach(e=>{
      const lb=g('elabel-'+e.id); if(lb && e._mx!=null){ lb.style.left=e._mx+'px'; lb.style.top=e._my+'px'; }
    });
  }
  function edgeLabelHTML(e){
    const sel = e.id===selectedEdgeId ? 'sel':'';
    const viewOnly = !!viewingVersion;
    const clickAttr = viewOnly ? '' : `onclick="selectEdge('${e.id}');event.stopPropagation()"`;
    if(e.mode==='else'){
      return `<button id="elabel-${e.id}" class="edge-lbl else ${sel}" ${clickAttr} title="else：其他分支条件都不满足时走此线"><i class="fas fa-code-branch mr-1"></i>else 条件</button>`;

    }
    if(e.mode==='condition'){
      return `<button id="elabel-${e.id}" class="edge-lbl warn ${sel}" ${clickAttr} title="该分支尚未配置条件"><i class="fas fa-exclamation-circle mr-1"></i>条件待配置</button>`;

  /* ===================== 配置面板 ===================== */
  const inp=(v)=>`value="${v===undefined||v===null?'':v}"`;
  const row=(label, ctrl, logic)=>`<div class="mb-3.5"><label class="block text-xs font-medium text-gray-600 mb-1">${label}</label>${ctrl}${logic?`<div class="cfg-logic"><i class="fas fa-info-circle mr-1"></i>${logic}</div>`:''}</div>`;

  function orgAllMembers(dept){ let r=[...(dept.members||[])]; (dept.children||[]).forEach(c=>r=r.concat(orgAllMembers(c))); return r; }
  function findDept(path){ const parts=path.split('/'); let list=ORG, cur=null; for(const p of parts){ cur=list.find(d=>d.name===p); if(!cur) return null; list=cur.children||[]; } return cur; }
  function toggleOrg(path){ orgExpand[path]=!orgExpand[path]; renderMemberPicker(); }

  function deptBlock(dept, path, all, depth, inner, expanded){

      </div>`;

  function deptTreeNode(dept, path, depth){
    const allSub = deptAllSubNames(dept);
    const selAll = allSub.length && allSub.every(d=>pickerDeptSel.has(d));
    const someSel = allSub.some(d=>pickerDeptSel.has(d)) && !selAll;
    const expanded = deptExpand[path]!==false;
    const caret = (dept.children&&dept.children.length) ? `<i class="fas ${expanded?'fa-chevron-down':'fa-chevron-right'} text-gray-400 text-[10px] w-3 cursor-pointer" onclick="toggleDeptExpand('${path}')"></i>` : `<span class="w-3 inline-block"></span>`;
    let h = `<div class="org-dept">
      <div class="org-dept-head flex items-center gap-2 py-1.5 px-2 rounded hover:bg-gray-50">
        ${caret}
        <input type="checkbox" class="org-cb" ${selAll?'checked':''} ${someSel?'data-indet="1"':''} onchange="toggleDeptSel('${path}',this.checked)">
        <span class="text-sm font-medium text-gray-700 flex-1 cursor-pointer" onclick="toggleDeptExpand('${path}')">${dept.name} <span class="text-[11px] text-gray-400">(${allSub.length})</span></span>
      </div>`;
    if(expanded && dept.children && dept.children.length){
      let inner='';
      dept.children.forEach(c=> inner+=deptTreeNode(c, path+'/'+c.name, depth+1));
      h += `<div class="org-dept-children">${inner}</div>`;
    }
    h += `</div>`;
    return h;
  }

  function renderConfig(){

      g('configBody').innerHTML = `
