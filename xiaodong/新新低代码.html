  function renderVisible(v){
    v = v||{mode:'always',logic:'and',conditions:[{field:'',op:'eq',value:''}]};
    const fieldOpts = fields.filter(f=>f.id!==selectedId).map(f=>`<option value="${f.fieldName}" ${v.conditions[0]&&v.conditions[0].field===f.fieldName?'selected':''}>${f.label}</option>`).join('') || '<option value="">（暂无其他字段）</option>';
    const modeSel = `<select id="cfg_vmode" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm mb-2"><option value="always" ${v.mode==='always'?'selected':''}>始终显示</option><option value="when" ${v.mode==='when'?'selected':''}>满足条件时显示</option></select>`;
    if(v.mode!=='when') return modeSel;
    const logicSel = `<select id="cfg_vlogic" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm mb-2"><option value="and" ${v.logic==='and'?'selected':''}>且（全部满足）</option><option value="or" ${v.logic==='or'?'selected':''}>或（满足其一）</option></select>`;
    const conds = (v.conditions||[]).map((c,i)=>{
      const fsel = fields.filter(f=>f.id!==selectedId).map(f=>`<option value="${f.fieldName}" ${c.field===f.fieldName?'selected':''}>${f.label}</option>`).join('') || '<option value="">（无）</option>';
      return `<div class="flex items-center gap-1.5 mb-1.5">
        <select id="cfg_vfield_${i}" class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm">${fsel}</select>
        <select id="cfg_vop_${i}" class="form-input border border-gray-300 rounded-md px-2 py-1 text-sm"><option value="eq" ${c.op==='eq'?'selected':''}>等于</option><option value="ne" ${c.op==='ne'?'selected':''}>不等于</option><option value="contains" ${c.op==='contains'?'selected':''}>包含</option></select>
        <input id="cfg_vval_${i}" class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm" value="${c.value||''}" placeholder="值">
        ${v.conditions.length>1?`<button class="text-gray-400 hover:text-red-500 btn-click" onclick="removeVisibleCond(${i})"><i class="fas fa-times"></i></button>`:''}
      </div>`;
    }).join('');
    return modeSel + logicSel + conds + `<button onclick="addVisibleCond()" class="text-[#165DFF] text-xs btn-click mt-1"><i class="fas fa-plus mr-1"></i>添加条件</button>`;
  }
  function addVisibleCond(){ const f=fields.find(x=>x.id===selectedId); f.visible.conditions.push({field:'',op:'eq',value:''}); renderConfig(); }
  function removeVisibleCond(i){ const f=fields.find(x=>x.id===selectedId); f.visible.conditions.splice(i,1); renderConfig(); }

  /* 选项来源 + 选项列表：单选/多选/下拉多选/下拉单选 共用 */
  function sourceHTML(f){
    const s = `<select id="cfg_src" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="static" ${f.source==='static'?'selected':''}>静态录入</option><option value="dict" ${f.source==='dict'?'selected':''}>数据字典</option><option value="api" ${f.source==='api'?'selected':''}>远程 API</option></select>`;
    let extra='';
    if(f.source==='dict'){
      extra = row('数据字典', `<select id="cfg_dict" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="region" ${f.dictKey==='region'?'selected':''}>行政区划</option><option value="industry" ${f.dictKey==='industry'?'selected':''}>行业分类</option><option value="bank" ${f.dictKey==='bank'?'selected':''}>银行列表</option></select>`, '选择平台内置或企业自定义的数据字典，运行态选项从该字典动态加载，保证全平台口径一致。');
    } else if(f.source==='api'){
      extra = row('接口地址', `<input id="cfg_api" ${inp(f.apiUrl)} class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" placeholder="https://api.example.com/options">`, '运行态从此接口拉取选项，需返回 {label,value} 数组；常用于对接第三方系统枚举。') + `<div class="mb-3.5"><button onclick="alert('测试连接（演示）')" class="text-xs text-[#165DFF] btn-click"><i class="fas fa-plug mr-1"></i>测试连接</button><div class="cfg-logic">配置后将展示返回字段映射，确保接口字段与 label/value 对应。</div></div>`;
    }
    return row('选项来源', s, '选项数据来源：静态为设计态固定；数据字典/API 为运行态动态拉取（对接集成能力）。') + extra;
  }
  function optionListHTML(f){
    const optRows=(f.options||[]).map((o,i)=>`<div class="flex items-center gap-1.5 mb-1.5"><input class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm" value="${o.label}" oninput="updateOption(${i},this.value)"><button class="text-gray-400 hover:text-red-500 btn-click" onclick="removeOption(${i})"><i class="fas fa-times"></i></button></div>`).join('');
    return `<div class="mb-3.5"><label class="block text-xs font-medium text-gray-600 mb-1">选项列表</label>${optRows}<button onclick="addOption()" class="text-[#165DFF] text-xs btn-click"><i class="fas fa-plus mr-1"></i>添加选项</button><div class="cfg-logic">每个选项含「显示名(label)」与「存储值(value)」，value 参与数据提交与流程条件判断。</div></div>`;
  }

  /* 专属配置（按类型） */
  function renderSpecific(f){
    let h = sec('专属配置（'+CONTROL_DEFS[f.type].label+'）','specific');
    if(f.type==='text'){
      const fmts=Object.entries(FORMATS).map(([k,v])=>`<option value="${k}" ${f.format===k?'selected':''}>${v}</option>`).join('');
      h += row('输入格式（校验）', `<select id="cfg_fmt" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${fmts}</select>`, '限制输入内容类型；提交时按规则校验，不通过则拦截并提示（如手机号必须 11 位数字）。');
      h += row('最大长度', `<input id="cfg_max" type="number" ${inp(f.maxLength)}>`, '允许输入的最大字符数，超出无法继续输入，防止超长脏数据。');
      h += row('最小长度', `<input id="cfg_min" type="number" ${inp(f.minLength)}>`, '低于该长度则校验不通过（如身份证必须 18 位）。');
      h += row('密码模式', sw('cfg_pwd', f.password, '输入内容以圆点掩码显示。'), '适用于敏感文本输入（如密钥、密码）。');
      h += row('自动去除首尾空格', sw('cfg_trim', f.trim, '提交前自动清理用户输入的首尾空格。'), '默认开启，避免「 张三 」这类脏数据。');
      h += row('校验失败提示', `<input id="cfg_err" ${inp(f.errMsg)}>`, '校验不通过时展示的自定义文案，留空则用默认提示，提升友好度。');
    } else if(f.type==='textarea'){
      h += row('最大长度', `<input id="cfg_max" type="number" ${inp(f.maxLength)}>`, '允许输入的最大字符数，超出无法继续输入，防止超长脏数据。');
      h += row('最小长度', `<input id="cfg_min" type="number" ${inp(f.minLength)}>`, '低于该长度则校验不通过（如备注至少 10 字）。');
      h += row('可见行数', `<input id="cfg_rows" type="number" ${inp(f.rows)}>`, '文本域默认展示的行高，决定运行态输入区高度（如 4 行 ≈ 100px），长文本建议设 6–10 行。');
      h += row('自动去除首尾空格', sw('cfg_trim', f.trim, '提交前自动清理用户输入的首尾空格。'), '默认开启，避免「 张三 」这类脏数据。');
      h += row('显示字数统计', sw('cfg_count', f.showCount, '在输入区下方实时显示「已输入 / 上限」字数。'), '便于用户掌握剩余可输入长度，常用于说明、备注类长文本。');
      h += row('校验失败提示', `<input id="cfg_err" ${inp(f.errMsg)}>`, '校验不通过时展示的自定义文案，留空则用默认提示，提升友好度。');
    } else if(f.type==='number'){
      h += row('最小值', `<input id="cfg_min" type="number" ${inp(f.min)}>`, '允许输入的数值下限，低于则校验不通过。');
      h += row('最大值', `<input id="cfg_max" type="number" ${inp(f.max)}>`, '允许输入的数值上限，超出则校验不通过。');
      h += row('小数位数', `<input id="cfg_prec" type="number" min="0" ${inp(f.precision)}>`, '保留的小数位数；0 表示只允许整数。提交时按此精度校验 / 格式化。');
      h += row('单位后缀', `<input id="cfg_unit" ${inp(f.unit)}>`, '在输入框右侧展示的单位文字（如 元 / kg / %），仅展示不参与存储。');
      h += row('显示步进器', sw('cfg_step', f.showStepper, '运行态提供上 / 下箭头按步长增减数值。'), '适合数量、次数等可微调场景。');
      h += row('千分位分隔显示', sw('cfg_thousand', f.thousand, '运行态按千位加逗号展示（如 1,000）。'), '大数值更易读，仅影响展示不影响存储。');
      h += row('校验失败提示', `<input id="cfg_err" ${inp(f.errMsg)}>`, '校验不通过时展示的自定义文案。');
    } else if(f.type==='radio'){
      h += sourceHTML(f);
      h += optionListHTML(f);
      h += row('校验失败提示', `<input id="cfg_err" ${inp(f.errMsg)}>`, '未按要求选择时展示的提示文案。');
    } else if(f.type==='checkbox'){
      h += sourceHTML(f);
      h += optionListHTML(f);
      h += row('限制可选数', sw('cfg_limit', f.limitChoose, '开启后需填写可选范围；关闭则不限制数量。'), '关闭：可任意勾选；开启：填写最少 / 最多可选数量，运行态按范围校验（低于最少或超出最多均拦截提交）。');
      if(f.limitChoose){
        h += row('最少可选', `<input id="cfg_minchoose" type="number" min="1" ${inp(f.minChoose)}>`, '至少需勾选的数量，低于则拦截提交。');
        h += row('最多可选', `<input id="cfg_maxchoose" type="number" min="1" ${inp(f.maxChoose)}>`, '最多可勾选的数量，超出则拦截提交。');
      }
    } else if(f.type==='multiselect'){
      h += sourceHTML(f);
      h += optionListHTML(f);
      h += row('可搜索', sw('cfg_search', f.searchable, '选项较多时可输入关键字过滤。'), '预览 / 运行态渲染为可输入过滤的下拉多选框。');
      h += row('限制可选数', sw('cfg_limit', f.limitChoose, '开启后需填写可选范围；关闭则不限制数量。'), '关闭：可任意选；开启：填写最少 / 最多可选数量，运行态按范围校验。');
      if(f.limitChoose){
        h += row('最少可选', `<input id="cfg_minchoose" type="number" min="1" ${inp(f.minChoose)}>`, '至少需选中的数量，低于则拦截提交。');
        h += row('最多可选', `<input id="cfg_maxchoose" type="number" min="1" ${inp(f.maxChoose)}>`, '最多可选中的数量，超出则拦截提交。');
      }
    } else if(f.type==='datetime'){
      const types=[['date','日期'],['datetime','日期时间'],['time','时间']];
      const te=`<select id="cfg_datetype" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${types.map(([v,l])=>`<option value="${v}" ${f.dateType===v?'selected':''}>${l}</option>`).join('')}</select>`;
      h += row('日期类型', te, '选择控件承载「日期 / 日期时间 / 时间」，决定运行态唤起的选择器与存储粒度。');
      const fmts={ date:['YYYY-MM-DD','YYYY/MM/DD','MM-DD'], datetime:['YYYY-MM-DD HH:mm','YYYY-MM-DD HH:mm:ss'], time:['HH:mm','HH:mm:ss'] };
      const cur=fmts[f.dateType]||fmts.datetime;
      const fe=`<select id="cfg_format" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${cur.map(v=>`<option ${f.format===v?'selected':''}>${v}</option>`).join('')}</select>`;
      h += row('显示格式', fe, '运行态展示与存储的字符串格式；切换日期类型后可选格式随之变化。');
      h += row('最早可选日期', `<input id="cfg_mindate" type="date" value="${f.minDate||''}" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">`, '早于该日期的选项置灰不可选。');
      h += row('最晚可选日期', `<input id="cfg_maxdate" type="date" value="${f.maxDate||''}" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">`, '晚于该日期的选项置灰不可选。');
    } else if(f.type==='divider'){
      h += row('显示文字', sw('cfg_showtext', f.showText, '在分隔线中央叠加一段说明文字。'), '开启后可在分隔线上展示文字，常用于分组标题（如「基本信息」）。');
      if(f.showText) h += row('文字内容', `<input id="cfg_divtext" ${inp(f.text)}>`, '分隔线上展示的文字，一般用于区块分组说明。');
      h += row('文字位置', `<select id="cfg_divpos" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="left" ${f.divPos==='left'?'selected':''}>居左</option><option value="center" ${f.divPos==='center'?'selected':''}>居中</option><option value="right" ${f.divPos==='right'?'selected':''}>居右</option></select>`, '文字在分隔线上的对齐位置。');
      h += row('线条样式', `<select id="cfg_divstyle" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="solid" ${f.divStyle==='solid'?'selected':''}>实线</option><option value="dashed" ${f.divStyle==='dashed'?'selected':''}>虚线</option><option value="dotted" ${f.divStyle==='dotted'?'selected':''}>点线</option></select>`, '分隔线的线型样式。');
    } else if(f.type==='select'){
      const optRows=(f.options||[]).map((o,i)=>`<div class="flex items-center gap-1.5 mb-1.5"><input class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm" value="${o.label}" oninput="updateOption(${i},this.value)"><button class="text-gray-400 hover:text-red-500 btn-click" onclick="removeOption(${i})"><i class="fas fa-times"></i></button></div>`).join('');
      h += row('选项来源', `<select id="cfg_src" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="static" ${f.source==='static'?'selected':''}>静态录入</option><option value="dict" ${f.source==='dict'?'selected':''}>数据字典</option><option value="api" ${f.source==='api'?'selected':''}>远程 API</option></select>`, '选项数据来源：静态为设计态固定；数据字典/API 为运行态动态拉取（对接集成能力）。');
      if(f.source==='dict'){
        h += row('数据字典', `<select id="cfg_dict" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="region" ${f.dictKey==='region'?'selected':''}>行政区划</option><option value="industry" ${f.dictKey==='industry'?'selected':''}>行业分类</option><option value="bank" ${f.dictKey==='bank'?'selected':''}>银行列表</option></select>`, '选择平台内置或企业自定义的数据字典，运行态选项从该字典动态加载，保证全平台口径一致。');
      } else if(f.source==='api'){
        h += row('接口地址', `<input id="cfg_api" ${inp(f.apiUrl)} class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" placeholder="https://api.example.com/options">`, '运行态从此接口拉取选项，需返回 {label,value} 数组；常用于对接第三方系统枚举。');
        h += `<div class="mb-3.5"><button onclick="alert('测试连接（演示）')" class="text-xs text-[#165DFF] btn-click"><i class="fas fa-plug mr-1"></i>测试连接</button><div class="cfg-logic">配置后将展示返回字段映射，确保接口字段与 label/value 对应。</div></div>`;
      }
      if(f.source==='static'){
        h += `<div class="mb-3.5"><label class="block text-xs font-medium text-gray-600 mb-1">选项列表</label>${optRows}<button onclick="addOption()" class="text-[#165DFF] text-xs btn-click"><i class="fas fa-plus mr-1"></i>添加选项</button><div class="cfg-logic">每个选项含「显示名(label)」与「存储值(value)」，value 参与数据提交与流程条件判断。</div></div>`;
      } else {
        // 选项来源为数据字典/远程 API 时，运行态选项动态加载，此处不维护静态选项列表
        h += info('选项来源为「'+(f.source==='dict'?'数据字典':'远程 API')+'」时，运行态选项<b>动态加载</b>，此处<b>不维护静态选项列表</b>；请在上方配置对应的字典或接口地址。');
      }
      h += row('可搜索', sw('cfg_search', f.searchable, '选项超过一定数量时可输入关键字过滤。'), '选项较多时开启，预览/运行态将渲染为「可输入过滤的下拉选择框」，输入关键字即时筛选项；关闭则为普通下拉。');
    } else if(f.type==='subform'){
      h += `<div class="cfg-logic-block" style="margin-top:0"><div class="cfg-logic-title"><i class="fas fa-table"></i>子表单的作用与场景</div><div class="cfg-logic-body">子表单用于承载<b>「一对多」明细</b>：一笔主数据下挂多条结构相同的子记录（如一张报销单下的多条费用明细、一个订单下的多个商品）。每个<b>子字段</b>相当于一条独立字段，整体以<b>二维数组</b>存储，便于后续按行统计、汇总及在流程节点中做条件判断。<br>典型场景：① 费用报销 / 采购申请的明细清单 ② 订单中的商品行 ③ 家庭成员 / 紧急联系人 ④ 考勤 / 课时记录。当某条主信息需要重复结构的数据时，就用子表单，而不是在主表单堆 N 个相同字段。</div></div>`;
      const subs=(f.subFields||[]).map((s,i)=>`<div class="subform-col-row flex items-center gap-1.5 mb-1.5 p-1 rounded border border-gray-200 bg-white" draggable="true" data-col="${i}" ondragstart="onSubColDragStart(event,'${f.id}',${i})" ondragover="onSubColDragOver(event)" ondrop="onSubColDrop(event,'${f.id}',${i})" ondragend="this.classList.remove('dragging');document.querySelectorAll('.subform-col-row').forEach(r=>r.classList.remove('drop-target'))"><i class="fas fa-grip-vertical text-gray-300 cursor-grab"></i><span class="text-[10px] text-gray-400 w-8 flex-none text-center">${SUB_TYPE_LABEL[s.type]||s.type}</span><input class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm" value="${s.label}" oninput="updateSub(${i},this.value)"><button class="text-gray-400 hover:text-red-500 btn-click" onclick="removeSub(${i})" title="删除该列"><i class="fas fa-times"></i></button></div>`).join('');
      h += `<div class="mb-3.5"><label class="block text-xs font-medium text-gray-600 mb-1">子表单列（类型由拖入控件决定，不可改）</label>${subs}<div class="cfg-logic"><i class="fas fa-info-circle"></i><span><b>新增列</b>：从左侧控件库拖控件到画布中的子表单区域，松手即成一列（列类型＝拖入控件类型，表头标「文本/数字/日期/下拉/成员」）。<b>排序</b>：在本列表中拖动每行（⠿ 手柄）调整列顺序；<b>删除</b>：点 ✕。列类型不可在此修改，需换类型时删除后重新拖入对应控件。</span></div></div>`;
      h += row('显示汇总行', sw('cfg_sum', f.showSummary, '在子表单底部增加「合计」行，对所有「数字」类型子字段自动求和。'), '开启后，画布表格底部立即出现蓝色合计行（标「Σ 自动求和」），运行态随用户录入实时累加。文本 / 日期列不参与汇总。');
    } else if(['member','dept','formref','feed'].includes(f.type)){
      const m = PICKER_META[f.type];
      h += row('选择范围', `<select id="cfg_range" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="all" ${f.range==='all'?'selected':''}>${m.scopeAll}</option><option value="dept" ${f.range==='dept'?'selected':''}>指定部门</option><option value="role" ${f.range==='role'?'selected':''}>指定角色</option></select>`, `限定可选${m.noun}的范围；选部门/角色时需勾选具体对象（对接组织架构集成）。切换后画布即时显示范围摘要。`);
      if(f.range==='dept'){

      h += row('日期格式', `<select id="cfg_andate" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${dfmts.map(([v,l])=>`<option value="${v}" ${f.dateFmt===v?'selected':''}>${l}</option>`).join('')}</select>`, '在编号中插入生成日期，便于按时间归档检索。');

      h += row('步长', `<input id="cfg_anstep" type="number" min="1" ${inp(f.step)}>`, '每次新增记录序号递增的量。');
      const resets=[['none','不重置'],['daily','每日重置'],['monthly','每月重置'],['yearly','每年重置']];
      h += row('重置周期', `<select id="cfg_anreset" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${resets.map(([v,l])=>`<option value="${v}" ${f.reset===v?'selected':''}>${l}</option>`).join('')}</select>`, '按周期归零流水号（如每日单号从 0001 重排），避免无限增长。');
      h += info(`预览示例：<b>${genAutoNumber(f)}</b>（运行态按规则自动生成，不可手改）。`);
    }
    h += secEnd();
    return h;
  }
  /* 地址显示字段开关 / 图片附件格式勾选 / 级联级别 */
  function toggleAddrField(id,k,on){ const f=getField(id); if(!f.addrShow)f.addrShow={}; f.addrShow[k]=on; renderConfig(); }
  function toggleFmt(id,fmt,on){ const f=getField(id); if(on){ if(!f.formats.includes(fmt))f.formats.push(fmt); } else { f.formats=f.formats.filter(x=>x!==fmt); } renderConfig(); }
  function casName(id,i,v){ const f=getField(id); if(f.cascadeLevels[i]) f.cascadeLevels[i].name=v; renderConfig(); }
  function casAddLevel(id){ const f=getField(id); f.cascadeLevels.push({name:'级别'+(f.cascadeLevels.length+1)}); f.levels=f.cascadeLevels.length; renderConfig(); }
  function casDelLevel(id,i){ const f=getField(id); f.cascadeLevels.splice(i,1); f.levels=f.cascadeLevels.length; renderConfig(); }
  function setCasLevels(id){ const f=getField(id); const n=Math.max(1,Math.min(5, +document.getElementById('cfg_caslevels').value||1)); const cur=f.cascadeLevels||[]; const next=[]; for(let i=0;i<n;i++){ next.push(cur[i]||{name:(['国家','省','市','区','街道'][i]||('级别'+(i+1)))}); } f.cascadeLevels=next; f.levels=n; renderConfig(); }
  function genAutoNumber(f){
    const d=new Date(); const p=n=>String(n).padStart(2,'0');
    let datePart=''; if(f.dateFmt==='YYYYMMDD')datePart=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
    else if(f.dateFmt==='YYYYMM')datePart=`${d.getFullYear()}${p(d.getMonth()+1)}`;
    else if(f.dateFmt==='YYYY')datePart=`${d.getFullYear()}`;
    const seq=String((f.start||1)).padStart(f.seqLen||4,'0');
    return (f.prefix||'')+datePart+seq+(f.suffix||'');
  }

    if(g('cfg_anreset')) g('cfg_anreset').onchange=e=>{f.reset=e.target.value;renderConfig();};
  }
  function addOption(){ const f=fields.find(x=>x.id===selectedId); f.options.push({label:'新选项',value:'opt'+(f.options.length+1)}); renderConfig(); renderCanvas(); }
  function removeOption(i){ const f=fields.find(x=>x.id===selectedId); f.options.splice(i,1); renderConfig(); renderCanvas(); }
  function updateOption(i,v){ const f=fields.find(x=>x.id===selectedId); f.options[i].label=v; renderCanvas(); }
  function toggleDefaultMulti(value, checked){
    const f=fields.find(x=>x.id===selectedId); if(!f) return;
    f.defaultValue = Array.isArray(f.defaultValue) ? f.defaultValue : [];
    if(checked){ if(!f.defaultValue.includes(value)) f.defaultValue.push(value); }
    else { f.defaultValue = f.defaultValue.filter(v=>v!==value); }
    renderCanvas();
  }
  function removeSub(i){ const f=fields.find(x=>x.id===selectedId); f.subFields.splice(i,1); renderConfig(); renderCanvas(); }
  function updateSub(i,v){ const f=fields.find(x=>x.id===selectedId); f.subFields[i].label=v; renderCanvas(); }
  /* 右侧面板子表单列：整行拖动调整顺序（类型不可改，由拖入控件决定） */
  let subColDrag=null;
  function onSubColDragStart(e, fid, i){ subColDrag={fid, i}; e.currentTarget.classList.add('dragging'); }
  function onSubColDragOver(e){ const row=e.currentTarget; if(!subColDrag) return; e.preventDefault(); row.classList.add('drop-target'); }
  function onSubColDrop(e, fid, i){
    e.preventDefault();
    document.querySelectorAll('.subform-col-row').forEach(r=>r.classList.remove('drop-target','dragging'));
    if(!subColDrag || subColDrag.fid!==fid){ subColDrag=null; return; }
    const f=fields.find(x=>x.id===fid); if(!f) { subColDrag=null; return; }
    const from=subColDrag.i, to=i;
    if(from===to){ subColDrag=null; return; }
    const [item]=f.subFields.splice(from,1);
    f.subFields.splice(to,0,item);
    subColDrag=null; renderConfig(); renderCanvas();
  }

  /* ===================== 表单级配置（完整，无关联流程） ===================== */
  /* ---- 列数据权限（字段级）---- 角色视角：全局默认 + 角色差异覆盖 + 批量 ---- */
  var fpCurrentRole='global';   // 当前编辑的角色视图：'global' | 角色名
  var fpCollapsed={};           // 角色组展开/折叠状态（key=组名）
  const FP_MODES=[['edit','可编辑'],['readonly','只读'],['hidden','隐藏']];
  function fpEffMode(c, fn, view){
    if(view==='global') return (c.colGlobal&&c.colGlobal[fn])||'edit';
    if(c.colRoles && c.colRoles[view] && c.colRoles[view][fn]) return c.colRoles[view][fn];
    return (c.colGlobal&&c.colGlobal[fn])||'edit';
  }
  function fpIsOverridden(c, fn, view){
    return view!=='global' && !!(c.colRoles && c.colRoles[view] && c.colRoles[view][fn]);
  }
  function fpIsConf(c,r){ return r==='global' ? !!(c.colGlobal&&Object.keys(c.colGlobal).length) : !!(c.colRoles&&c.colRoles[r]&&Object.keys(c.colRoles[r]||{}).length); }
  function fpNode(key,label,active,isGlobal,conf){
    let dot = isGlobal ? '<span class="w-2 h-2 rounded-full bg-[#EF9F27] inline-block mr-1"></span>'
             : conf ? '<span class="w-2 h-2 rounded-full bg-[#165DFF] inline-block mr-1"></span>'
             : '<span class="w-2 h-2 rounded-full border border-gray-300 inline-block mr-1"></span>';
    return `<div class="flex items-center ${active?'bg-[#E8F3FF]':'hover:bg-gray-50'} rounded px-1 py-1 cursor-pointer text-sm ${active?'text-[#165DFF] font-medium':'text-gray-700'}" onclick="fpSelectRole('${key}')"><span class="pl-3"></span>${dot}${label}</div>`;
  }
  function fpTree(c){
    let t='';
    t += fpNode('global','全局默认（所有角色）', fpCurrentRole==='global', true, fpIsConf(c,'global'));
    ROLE_GROUPS.forEach(function(g){
      const open = !fpCollapsed[g.name];
      t += `<div class="flex items-center gap-1 px-1 py-1 cursor-pointer select-none" onclick="fpToggleGroup('${g.name}')"><span class="text-gray-400 text-xs w-3">${open?'\u25BE':'\u25B8'}</span><span class="text-xs font-medium text-gray-600">${g.name}</span></div>`;
      if(open){ g.roles.forEach(function(r){ t += fpNode(r, r, fpCurrentRole===r, false, fpIsConf(c,r)); }); }
    });
    return t;
  }
  function fpPanel(c){
    if(!fields || !fields.length) return info('当前表单还没有字段，请先在画布添加字段，再回来配置列数据权限。');
    const allFields = fields.filter(function(f){ return f.fieldName||f.name; });
    if(!c.colGlobal) c.colGlobal={};
    if(!c.colRoles) c.colRoles={};
    const view = fpCurrentRole;
    const roles = (typeof ROLES!=='undefined'?ROLES:[]);
    const batch = '<div class="flex items-center gap-2 my-2 text-xs flex-wrap">'
      +'<span class="text-gray-500">批量设置：</span>'
      +'<select onchange="if(this.value){ fpAll(this.value); }" class="form-input border border-gray-300 rounded-md px-2 py-1 text-xs">'
      +'<option value="">请选择…</option>'
      +'<option value="edit">全部可编辑</option>'
      +'<option value="readonly">全部只读</option>'
      +'<option value="hidden">全部隐藏</option>'
      +'</select>'
      +'<span class="text-gray-400">（作用于当前视图：全局默认=全员基准，具体角色=该角色覆盖）</span>'
      +'</div>';
    const header = '<th class="text-left font-medium text-gray-500 text-xs py-1 pr-3 border-b border-gray-200">字段</th>'
      +FP_MODES.map(function(m){return '<th class="text-center font-medium text-gray-500 text-xs py-1 px-3 border-b border-gray-200">'+m[1]+'</th>';}).join('');
    const rows = allFields.map(function(f){
      const fn=f.fieldName||f.name; const label=f.label||fn;
      const cells = FP_MODES.map(function(m){
        const mode=fpEffMode(c, fn, view);
        const inherited = view!=='global' && !fpIsOverridden(c, fn, view);
        const on = mode===m[0];
        return '<td class="text-center '+(on?'bg-[#E8F3FF]':'')+' '+(inherited?'opacity-50':'')+'"><span class="cursor-pointer select-none text-base '+(on?'text-[#165DFF]':'text-gray-400')+'" onclick="fpSetMode(\'+fn+\',\'+m[0]+\')">'+(on?'\u2611':'\u2610')+'</span></td>';
      }).join('');
      let tag='';
      if(view!=='global'){ tag = fpIsOverridden(c, fn, view) ? '<span class="text-[11px] text-[#165DFF] ml-1">覆盖</span>' : '<span class="text-[11px] text-gray-400 ml-1">继承</span>'; }
      return '<tr><td class="py-1 pr-3 text-sm text-gray-700">'+label+tag+'</td>'+cells+'</tr>';
    }).join('');
    const grid='<table class="w-full"><thead><tr>'+header+'</tr></thead><tbody>'+rows+'</tbody></table>';
    const note = info('列数据权限与「三、数据可见范围」（行级）互补：行级决定能否看到这一<b>行</b>，列级决定能否看清这一<b>列</b>。先配「全局默认」（全员基准），切到具体角色只改差异字段（其余继承）。顶部下拉可对本视图全部字段一次性套用模式。左侧角色树中，蓝点=已自定义配置，橙点=全局默认基准，空心=继承默认。');
    const tree = fpTree(c);
    return `<div class="flex gap-3 items-start">`
      + `<div class="w-44 shrink-0 border rounded-md p-2 bg-gray-50 max-h-80 overflow-auto">${tree}</div>`
      + `<div class="flex-1 min-w-0">${batch+grid+note}</div>`
      + `</div>`;
  }
  function fpSelectRole(r){ fpCurrentRole=r; renderConfig(); }
  function fpToggleGroup(name){ if(fpCollapsed[name]) delete fpCollapsed[name]; else fpCollapsed[name]=true; renderConfig(); }
  function fpSetMode(fn, mode){
    const c=formConfig; const view=fpCurrentRole||'global';
    if(view==='global'){ if(!c.colGlobal) c.colGlobal={}; c.colGlobal[fn]=mode; }
    else { if(!c.colRoles) c.colRoles={}; if(!c.colRoles[view]) c.colRoles[view]={}; c.colRoles[view][fn]=mode; }
    renderConfig();
  }
  function fpAll(mode){
    const c=formConfig; const view=fpCurrentRole||'global';
    const allFields=(fields||[]).filter(function(f){return f.fieldName||f.name;}).map(function(f){return f.fieldName||f.name;});
    if(view==='global'){ if(!c.colGlobal) c.colGlobal={}; allFields.forEach(function(fn){ c.colGlobal[fn]=mode; }); }
    else { if(!c.colRoles) c.colRoles={}; if(!c.colRoles[view]) c.colRoles[view]={}; allFields.forEach(function(fn){ c.colRoles[view][fn]=mode; }); }
    renderConfig();
  }

  function renderFormConfig(body){
    const c=formConfig;
    const cv=currentView();
    let h = `<div class="mb-3 pb-3 border-b border-gray-100 flex items-center gap-2 text-sm font-semibold text-gray-700"><i class="fas fa-cog text-[#165DFF]"></i>表单配置</div>`;
    h += sec('一、基础信息','form_basic');
    h += row('表单名称', `<input id="fc_name" ${inp(c.name)}>`, '该表单的显示名称，出现在列表与运行态顶部。');
    h += row('表单描述', `<textarea id="fc_desc" rows="2" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm resize-none">${c.desc||''}</textarea>`, '运行态表单顶部展示的说明文字，帮助用户理解用途。');
    h += row('表单图标', `<select id="fc_icon" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="fa-file-alt" ${c.icon==='fa-file-alt'?'selected':''}>📄 通用文件</option><option value="fa-umbrella-beach" ${c.icon==='fa-umbrella-beach'?'selected':''}>🌴 请假</option><option value="fa-receipt" ${c.icon==='fa-receipt'?'selected':''}>🧾 报销</option><option value="fa-id-card" ${c.icon==='fa-id-card'?'selected':''}>🪪 登记</option></select>`, '列表与入口处展示的图标，便于区分业务。');
    h += row('表单分类', `<select id="fc_cat" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option>未分类</option><option>人事</option><option>财务</option><option>行政</option></select>`, '用于列表分组与权限批量管理。');
    h += secEnd();

    // 表单设置仅保留「一、基本信息」与「二、列表与交互」两块；二（提交设置）/三（数据可见范围）/四（字段权限）/五（展示设置）已移除

    // 第二大项：列表与交互（列表配置 / 查询配置 / 按钮配置）；不再有独立「视图管理」入口，也不再支持新建视图与数据可见范围
    h += `<div class="mt-5 pt-4 border-t border-gray-100 mb-3 pb-3 flex items-center gap-2 text-sm font-semibold text-gray-700"><i class="fas fa-table text-[#165DFF]"></i>二、列表与交互</div>`;
    h += sec('列表配置','form_list'); h += listConfigHTML(currentView()); h += secEnd();
    h += sec('查询配置','form_query'); h += queryConfigHTML(currentView()); h += secEnd();
    h += sec('按钮配置','form_buttons'); h += buttonConfigHTML(currentView()); h += secEnd();

    body.innerHTML = h;
    bindFormEvents();
  }
  /* ===================== 列表 / 查询 / 按钮 配置 ===================== */
  const QUERY_MODES=[['like','包含'],['eq','精确'],['range','区间'],['date','日期']];
  const LIST_BTN_DEFS=[['add','新增'],['import','导入'],['export','导出']];
  const ROW_BTN_DEFS=[];
  function listFieldDefs(c){
    if(!c.listFields || !c.listFields.length) c.listFields = (fields||[]).map(f=>({field:f.fieldName,label:f.label,sortable:false}));
    return c.listFields;
  }
  function listConfigHTML(c){
    const defs=listFieldDefs(c);
    if(!fields.length) return info('当前表单还没有字段，请先在画布添加字段，再回来配置列表展示。');
    const rows = fields.map(f=>{
      const idx=defs.findIndex(d=>d.field===f.fieldName);
      const shown=idx>=0; const sortable=shown?defs[idx].sortable:false;
      const up=shown?`<button class="text-gray-400 hover:text-[#165DFF] btn-click text-xs px-1" ${idx===0?'disabled style="opacity:.3"':''} onclick="moveListField('${f.fieldName}',-1)"><i class="fas fa-arrow-up"></i></button>`:'';
      const down=shown?`<button class="text-gray-400 hover:text-[#165DFF] btn-click text-xs px-1" ${idx===defs.length-1?'disabled style="opacity:.3"':''} onclick="moveListField('${f.fieldName}',1)"><i class="fas fa-arrow-down"></i></button>`:'';
      const sortChk=shown?`<label class="flex items-center gap-1 text-xs text-gray-400 ml-1"><input type="checkbox" ${sortable?'checked':''} onchange="setListSortable('${f.fieldName}',this.checked)" class="rounded text-[#165DFF]">可排序</label>`:'';
      return `<div class="flex items-center gap-2 mb-1.5 text-sm"><input type="checkbox" ${shown?'checked':''} onchange="toggleListField('${f.fieldName}','${f.label}',this.checked)" class="rounded text-[#165DFF]"><span class="flex-1 text-gray-700">${f.label}</span>${up}${down}${sortChk}</div>`;
    }).join('');
    return `<div class="mb-2">${rows}</div><div class="cfg-logic"><i class="fas fa-info-circle"></i><span>勾选字段即出现在运行态数据列表；用 ▲▼ 调整列左右顺序；「可排序」开启后该列支持点击排序。未勾选字段仅在提交详情中可见。</span></div>`;
  }
  function toggleListField(field,label,checked){
    const c=currentView(); if(!c.listFields) c.listFields=[];
    const i=c.listFields.findIndex(d=>d.field===field);
    if(checked && i<0) c.listFields.push({field,label,sortable:false});
    else if(!checked && i>=0) c.listFields.splice(i,1);
    renderConfig();
  }
  function moveListField(field,dir){
    const c=currentView(); const a=c.listFields; if(!a) return; const i=a.findIndex(d=>d.field===field); const j=i+dir;
    if(i<0||j<0||j>=a.length) return; const t=a[i];a[i]=a[j];a[j]=t; renderConfig();
  }
  function setListSortable(field,checked){ const c=currentView(); const d=c.listFields&&c.listFields.find(x=>x.field===field); if(d) d.sortable=checked; }
  function queryConfigHTML(c){
    if(!fields.length) return info('当前表单还没有字段，请先在画布添加字段，再回来配置查询条件。');
    const qfs=c.queryFields||[];
    const rows=fields.map(f=>{
      const qf=qfs.find(x=>x.field===f.fieldName); const on=!!qf; const mode=qf?qf.mode:'like';
      const modeSel=on?`<select onchange="setQueryMode('${f.fieldName}',this.value)" class="form-input border border-gray-300 rounded-md px-2 py-1 text-xs">${QUERY_MODES.map(m=>`<option value="${m[0]}" ${mode===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select>`:'';
      return `<div class="flex items-center gap-2 mb-1.5 text-sm"><input type="checkbox" ${on?'checked':''} onchange="toggleQueryField('${f.fieldName}','${f.label}',this.checked)" class="rounded text-[#165DFF]"><span class="flex-1 text-gray-700">${f.label}</span>${modeSel}</div>`;
    }).join('');
    return `<div class="mb-2">${rows}</div><div class="cfg-logic"><i class="fas fa-info-circle"></i><span>勾选字段即作为运行态数据列表的查询条件；「查询方式」决定匹配规则（包含/精确/区间/日期）。</span></div>`;
  }
  function toggleQueryField(field,label,checked){
    const c=currentView(); if(!c.queryFields) c.queryFields=[];
    const i=c.queryFields.findIndex(x=>x.field===field);
    if(checked && i<0) c.queryFields.push({field,label,mode:'like'});
    else if(!checked && i>=0) c.queryFields.splice(i,1);
    renderConfig();
  }
  function setQueryMode(field,mode){ const c=currentView(); const q=c.queryFields&&c.queryFields.find(x=>x.field===field); if(q) q.mode=mode; }
  function buttonConfigHTML(c){
    const lb=c.listButtons||['add','export'];
    const rb=c.rowButtons||[];
    const fb=c.formButtons||{submit:true,draft:true,reset:true};
    const listBtns=LIST_BTN_DEFS.map(b=>`<label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${(lb.includes(b[0]))?'checked':''} onchange="toggleListBtn('${b[0]}',this.checked)" class="rounded text-[#165DFF]"> ${b[1]}</label>`).join('');
    const rowBtns=ROW_BTN_DEFS.length?ROW_BTN_DEFS.map(b=>`<label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${(rb.includes(b[0]))?'checked':''} onchange="toggleRowBtn('${b[0]}',this.checked)" class="rounded text-[#165DFF]"> ${b[1]}</label>`).join(''):'';
    const formBtns=`
      <label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${fb.submit?'checked':''} onchange="currentView().formButtons.submit=this.checked" class="rounded text-[#165DFF]"> 提交</label>
      <label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${fb.draft?'checked':''} onchange="currentView().formButtons.draft=this.checked" class="rounded text-[#165DFF]"> 保存草稿</label>
      <label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${fb.reset?'checked':''} onchange="currentView().formButtons.reset=this.checked" class="rounded text-[#165DFF]"> 取消</label>`;
    return `<div class="mb-2"><div class="text-xs font-semibold text-gray-500 mb-1">列表按钮（数据列表上方工具栏）</div>${listBtns}</div>`+
      (rowBtns?`<div class="mb-2"><div class="text-xs font-semibold text-gray-500 mb-1">行操作按钮（每条数据的操作）</div>${rowBtns}</div>`:'')+
      `<div class="mb-2"><div class="text-xs font-semibold text-gray-500 mb-1">表单按钮（填写页底部）</div>${formBtns}</div>`+
      `<div class="cfg-logic"><i class="fas fa-info-circle"></i><span>「提交 / 保存草稿 / 取消」均为<b>可选项</b>，按业务勾选是否出现在填写页底部（取消用于关闭当前填写页、不保存）。列表按钮由数据列表上方工具栏提供，行操作按钮已无配置项。</span></div>`;
  }
  function toggleListBtn(key,checked){ const c=currentView(); if(!c.listButtons) c.listButtons=['add','export']; if(checked&&!c.listButtons.includes(key)) c.listButtons.push(key); else if(!checked) c.listButtons=c.listButtons.filter(x=>x!==key); }
  function toggleRowBtn(key,checked){ const c=currentView(); if(!c.rowButtons) c.rowButtons=[]; if(checked&&!c.rowButtons.includes(key)) c.rowButtons.push(key); else if(!checked) c.rowButtons=c.rowButtons.filter(x=>x!==key); }

  function bindFormEvents(){
    const g=id=>document.getElementById(id); const c=formConfig;
    if(g('fc_name')) g('fc_name').oninput=e=>{c.name=e.target.value; formName=c.name; document.getElementById('formNameInput').value=c.name;};

    if(g('fc_after')) g('fc_after').onchange=e=>{c.afterSubmit=e.target.value; renderConfig();};
    if(g('fc_afterurl')) g('fc_afterurl').oninput=e=>{c.afterUrl=e.target.value;};

    if(g('fv_dvis')) g('fv_dvis').onchange=e=>{ currentView().dataVisible=e.target.value; renderConfig(); };

  function applyFormWidth(){

  /* ===================== 顶部 & 保存 / 发布 / 下架 ===================== */
  function onFormNameChange(){ formName=document.getElementById('formNameInput').value; formConfig.name=formName; }
  /* 保存：持久化当前设计。
     草稿 → 仍保持草稿；已发布 → 标记为「待发布修改」（线上版本不变，黄条提示）。
     新表单（未入列表）→ 首次保存即写入列表，状态为草稿 v0。 */
  function saveForm(){
    let f=currentForm();
    if(!f){
      const id='form'+Date.now();
      f={ id, name:formName||'未命名表单', status:'草稿', version:0, publishedAt:'', publishedBy:'', hasUnpublished:false,
          updatedAt:todayStr(), cat:formConfig.category||'未分类',
          creator:'产品同学', createdAt:todayStr(), refs:[],
          fc:JSON.parse(JSON.stringify(formConfig)), fields:JSON.parse(JSON.stringify(fields)), versions:[] };
      SAMPLE_FORMS.unshift(f); currentFormId=id;
    } else {
      f.name=formName; f.fc=JSON.parse(JSON.stringify(formConfig)); f.fields=JSON.parse(JSON.stringify(fields));
      f.updatedAt=todayStr(); f.cat=formConfig.category||'未分类';
      if(f.status==='已发布') f.hasUnpublished=true;   // 线上版本保持不变，仅标记有未发布修改
    }
    isCreating=false;
    renderFormTable(); refreshDesignerChrome();
    const isPublished = f.status==='已发布';
    alert('已保存「'+(formName||'未命名表单')+'」\n'+(isPublished?'（已发布表单：修改已存为待发布草稿，发布后生效）':'（状态：草稿，未被他人提交）'));
  }
  /* 发布：版本 +1，快照当前设计为线上锁定版本，状态变「已发布」 */
  function publishForm(){
    const name=(formName||'').trim();
    if(!name){ alert('请先填写表单名称，再发布。'); return; }
    const dup=SAMPLE_FORMS.find(x=>x.name.trim()===name && x.id!==currentFormId);
    if(dup){ alert('已存在同名表单「'+name+'」（'+(dup.status||'')+'），表单名称需唯一，请修改名称后再发布。'); return; }
    let f=currentForm();
    if(!f){ saveForm(); f=currentForm(); }              // 未保存过则先落库再发布
    if(!f) return;
    // 版本号规则（最终结论）：
    // ① 首次发布（此前从未发布过，version=0）→ 生成 v1；
    // ② 已发布/已下架后再次发布时，将「本次发布内容与上一个线上版本快照」做全量比对；
    //    内容有任何变化 → 版本号 +1；编辑后内容与原线上版本完全相同（无丝毫变化）→ 版本号保持不变，仅刷新发布信息；
    // ③ 历史版本「恢复并发布」由 restoreFormVersion 处理，版本号保持原值。
    const prevSnap = (f.version>0) ? (f.versions||[]).find(v=>v.version===f.version) : null;
    const curContent  = JSON.stringify({ fields, fc:formConfig });
    const prevContent = prevSnap ? JSON.stringify({ fields:prevSnap.fields, fc:prevSnap.fc }) : null;
    const contentChanged = !prevContent || (curContent !== prevContent);
    if(contentChanged){ f.version = (f.version||0)+1; }
    f.status='已发布'; f.publishedAt=todayStr(); f.publishedBy='产品同学'; f.hasUnpublished=false;
    f.fc=JSON.parse(JSON.stringify(formConfig)); f.fields=JSON.parse(JSON.stringify(fields)); f.updatedAt=todayStr();
    if(!f.versions) f.versions=[];
    if(contentChanged){
      f.versions.push({ version:f.version, time:f.publishedAt, publisher:f.publishedBy,
                        note: f.version===1?'首次发布，锁定该版本 schema':'基于 v'+(f.version-1)+' 的修改发布',
                        name:f.name, cat:f.cat, icon:f.fc.icon,
                        fields:JSON.parse(JSON.stringify(f.fields)), fc:JSON.parse(JSON.stringify(f.fc)) });
    } else {
      // 内容无变化：版本号不变，仅刷新该线上版本的发布时间/发布人
      const ex=(f.versions||[]).find(v=>v.version===f.version);
      if(ex){ ex.time=f.publishedAt; ex.publisher=f.publishedBy; ex.note='内容无变化，重新发布（版本号保持 v'+f.version+'）'; }
    }
    renderFormTable(); refreshDesignerChrome();
    alert('发布成功！当前线上版本 v'+f.version+'，表单已可被全员提交。\n（该版本 schema 已锁定，历史数据按版本渲染）');
  }
  /* 下架：状态回退草稿（已下架），停止接收提交，保留历史数据 */
  function unpublishForm(){
    const f=currentForm(); if(!f) return;
    f.status='草稿'; f.hasUnpublished=false;
    renderFormTable(); refreshDesignerChrome();
    alert('已下架。表单停止接收提交；历史数据（至 v'+f.version+'）保留可查。\n如需重新上线，点击「发布」生成新版本。');
  }
  /* 版本历史弹窗 */
  function showVersions(){
    const f=currentForm();
    const wrap=document.getElementById('versionList');
    const vers = f ? (f.versions||[]).slice().sort((a,b)=>b.version-a.version) : [];
    if(vers.length===0){
      wrap.innerHTML='<div class="text-sm text-gray-400 text-center py-6">暂无发布版本。点击「发布」后会生成 v1 并锁定该版本结构。</div>';
    } else {
      wrap.innerHTML = vers.map(v=>{
        const cur = v.version===f.version && f.status==='已发布';
        const hasSnap = !!(v.fields && v.fc);
        return `<div class="border border-gray-200 rounded-lg p-3 ${cur?'ring-2 ring-[#165DFF] border-[#165DFF]':''}">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-gray-800">v${v.version} ${cur?'<span class="ml-1 px-1.5 py-0.5 rounded text-[10px] bg-green-100 text-green-600">当前线上</span>':''}</span>
            <span class="text-xs text-gray-400">${v.time} · ${v.publisher}</span>
          </div>
          <div class="text-xs text-gray-500 mt-1">${v.note||''}${hasSnap?` · ${v.fields.length} 个字段`:''}</div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-[11px] text-gray-400"><i class="fas fa-lock mr-1"></i>该版本 schema 已锁定，提交数据按此版本渲染</span>
            ${cur?'':`<span class="flex gap-2">
              <button onclick="viewFormVersion(${v.version})" class="px-2.5 py-1 rounded-md text-xs btn-click border border-gray-300 text-gray-600 hover:border-[#165DFF] hover:text-[#165DFF]"><i class="fas fa-eye mr-1"></i>查看</button>
              <button onclick="restoreFormVersion(${v.version})" class="px-2.5 py-1 rounded-md text-xs btn-click border border-[#165DFF] text-[#165DFF] hover:bg-blue-50"><i class="fas fa-rotate-left mr-1"></i>恢复并发布</button>
            </span>`}
          </div>
        </div>`;
      }).join('');
    }
    openModal('versionsModal');
  }
  /* 查看历史版本：在设计器画布上直接展示该版本的字段结构（只读） */
  function viewFormVersion(v){
    const f=currentForm(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.version===v); if(!s) return;
    if(!s.fields || !s.fc){ alert('该历史版本未保存结构快照，无法预览。'); return; }
    formViewingVersion=v; selectedId=null;
    closeModal('versionsModal');
    const banner=document.getElementById('stateBanner');
    banner.style.display='flex';
    banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-blue-50 text-blue-700';
    banner.innerHTML='<i class="fas fa-eye"></i> 正在查看历史版本 <b>v'+v+'</b>（只读 · '+(s.publisher||'系统')+' · '+(s.time||'—')+'）<button onclick="exitFormVersionView()" class="ml-auto px-2.5 py-1 rounded-md text-[11px] font-medium bg-[#165DFF] text-white hover:bg-blue-600 btn-click">返回编辑</button>';
    renderCanvas(); renderConfig();
  }
  function exitFormVersionView(){
    formViewingVersion=null; selectedId=null;
    renderCanvas(); renderConfig(); refreshDesignerChrome();
  }
  /* 恢复历史版本：以该版本内容覆盖当前表单并重新发布，版本号不变 */
  function restoreFormVersion(v){
    const f=currentForm(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.version===v); if(!s) return;
    if(!s.fields || !s.fc){ alert('该历史版本未保存结构快照，无法恢复。'); return; }
    if(!confirm('确认恢复历史版本 v'+v+'？\n将把当前表单内容替换为该版本内容并重新发布，版本号保持 v'+v+'，不生成新版本。')) return;
    f.name=s.name||f.name; f.cat=s.cat||f.cat; f.icon=s.icon||f.icon;
    f.fc=JSON.parse(JSON.stringify(s.fc)); f.fields=JSON.parse(JSON.stringify(s.fields));
    f.version=v; f.status='已发布'; f.hasUnpublished=false;
    f.publishedAt=s.time||f.publishedAt; f.publishedBy=s.publisher||f.publishedBy; f.updatedAt=todayStr();
    formName=f.name; formConfig=JSON.parse(JSON.stringify(f.fc)); ensureViews({fc:formConfig});
    fields=JSON.parse(JSON.stringify(f.fields)); selectedId=null; formViewingVersion=null;
    currentViewId=(formConfig.views.find(x=>x.isDefault)||formConfig.views[0]).id;
    document.getElementById('formNameInput').value=formName;
    applyFormWidth();
    closeModal('versionsModal');
    renderFormTable(); renderCanvas(); renderConfig(); refreshDesignerChrome();
    alert('已恢复历史版本 v'+v+' 并重新发布（版本号保持 v'+v+'，不新增版本号）');
  }

  /* ===================== 预览态子表单（可增删行 + 实时汇总） ===================== */
  const previewSubRows = {};
  function previewSubform(f){
    const fid=f.id;
    if(!previewSubRows[fid]){
      const n=(f.minRows&&f.minRows>0)?f.minRows:1;
      previewSubRows[fid]=Array.from({length:n},()=>(f.subFields||[]).map(()=>''));
    }
    const sf=f.subFields||[];
    const head=sf.map(s=>`<th class="px-3 py-2 text-left text-xs font-medium text-gray-600">${s.label}${s.type==='number'?' <span class="font-normal text-gray-400">数字</span>':''}</th>`).join('')+'<th class="w-8"></th>';
    return `<div class="subprev border border-gray-200 rounded-md overflow-hidden" id="subprev_${fid}">
      <table class="w-full text-sm"><thead class="bg-gray-50">${head}</thead>
      <tbody id="subbody_${fid}">${subRowsHTML(f)}</tbody>
      ${f.showSummary?`<tfoot id="subfoot_${fid}">${subFootHTML(f)}</tfoot>`:''}
      </table>
      <div class="px-3 py-2 text-xs flex items-center gap-3 bg-gray-50 border-t">
        <button class="text-[#165DFF] btn-click" onclick="subAddRow('${fid}')"><i class="fas fa-plus mr-1"></i>添加一行</button>
        ${f.allowAdd?'':`<span class="text-gray-400">（已锁定增删，固定 ${previewSubRows[fid].length} 行）</span>`}
        ${f.maxRows?`<span class="text-gray-400 ml-auto">最多 ${f.maxRows} 行</span>`:''}
      </div>
    </div>`;
  }
  function subRowsHTML(f){
    const rows=previewSubRows[f.id]||[];
    const sf=f.subFields||[];
    return rows.map((row,ri)=>`<tr>${sf.map((s,ci)=>{
      const ph=s.type==='number'?'0.00':(s.type==='date'?'年/月/日':'请输入');
      const t=s.type==='date'?'date':(s.type==='number'?'number':'text');
      return `<td class="px-3 py-2 border-t"><input type="${t}" value="${row[ci]||''}" placeholder="${ph}" data-r="${ri}" data-c="${ci}" oninput="subOnInput('${f.id}',this)" class="w-full border border-gray-200 rounded px-2 py-1 text-sm"></td>`;
    }).join('')}<td class="px-3 py-2 border-t text-center"><button class="text-gray-400 hover:text-red-500 btn-click" onclick="subDelRow('${f.id}',${ri})"><i class="fas fa-trash-alt"></i></button></td></tr>`).join('');
  }
  function subFootHTML(f){
    const sf=f.subFields||[];
    const lead=sf.findIndex(s=>s.type!=='number'); const li=lead<0?0:lead;
    const cells=sf.map((s,ci)=>{
      if(s.type!=='number') return ci===li?`<td class="px-3 py-2 text-xs font-semibold text-[#165DFF] border-t border-gray-200 bg-[#F0F5FF]">合计</td>`:`<td class="border-t border-gray-200 bg-[#F0F5FF]"></td>`;
      return `<td class="px-3 py-2 text-xs font-semibold text-[#165DFF] border-t border-gray-200 bg-[#F0F5FF]" id="subsum_${f.id}_${ci}">0</td>`;
    }).join('')+'<td class="border-t border-gray-200 bg-[#F0F5FF]"></td>';
    return `<tr>${cells}</tr>`;
  }
  function subAddRow(fid){ const f=fields.find(x=>x.id===fid); if(!f) return; const rows=previewSubRows[fid]||(previewSubRows[fid]=[]); if(f.maxRows&&rows.length>=f.maxRows) return; rows.push((f.subFields||[]).map(()=>'')); subRebuild(fid); }
  function subDelRow(fid,ri){ const f=fields.find(x=>x.id===fid); if(!f) return; const rows=previewSubRows[fid]||[]; if(f.minRows&&rows.length<=f.minRows) return; rows.splice(ri,1); subRebuild(fid); }
  function subOnInput(fid,el){ const f=fields.find(x=>x.id===fid); if(!f) return; const r=+el.dataset.r,c=+el.dataset.c; previewSubRows[fid][r][c]=el.value; subRecalc(fid); }
  function subRecalc(fid){ const f=fields.find(x=>x.id===fid); if(!f||!f.showSummary) return; (f.subFields||[]).forEach((s,ci)=>{ if(s.type!=='number') return; const sum=previewSubRows[fid].reduce((a,row)=>a+(parseFloat(row[ci])||0),0); const cell=document.getElementById('subsum_'+fid+'_'+ci); if(cell) cell.textContent=sum.toFixed(2).replace(/\.00$/,''); }); }
  function subRebuild(fid){ const f=fields.find(x=>x.id===fid); if(!f) return; const body=document.getElementById('subbody_'+fid); if(body) body.innerHTML=subRowsHTML(f); subRecalc(fid); }

  /* ===================== 预览 / Schema ===================== */
  function previewForm(){
    document.getElementById('previewTitle').textContent = formName + ' · 预览';
    for(const k in previewSubRows) delete previewSubRows[k];
    const body=document.getElementById('previewBody');
    if(fields.length===0){ body.innerHTML='<p class="text-sm text-gray-400">画布暂无字段，请先添加控件。</p>'; }
    else {
      let html = formConfig.desc?`<p class="text-sm text-gray-500 mb-4">${formConfig.desc}</p>`:'';
      fields.forEach(f=>{
        if(f.type==='divider'){ html += `<div class="my-4">${dividerPreviewHTML(f)}</div>`; return; }
        const lp = f.labelPos || formConfig.labelPos;
        const la = f.labelAlign || formConfig.labelAlign;
        const lwKey = f.labelWidth==='inherit'||!f.labelWidth ? formConfig.labelWidth : f.labelWidth;
        let c = previewControlHTML(f);
        let label;
        if(lp==='left'){
          const lwStyle = lwKey==='auto' ? 'width:auto;flex:none;' : `width:${LABEL_W[lwKey]};flex:none;`;
          label = `<label class="label-cell text-sm font-medium text-gray-700 ${lwKey==='auto'?'auto':''}" style="${lwStyle}text-align:${la};padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.label}${(f.required?'<span class="text-red-500 ml-0.5">*</span>':'')}</label>`;
        } else {
          label = `<label class="block text-sm font-medium text-gray-700 mb-1" style="text-align:${la}">${f.label}${(f.required?'<span class="text-red-500 ml-0.5">*</span>':'')}</label>`;
        }
        const wrap = lp==='left' ? `<div class="flex items-start gap-3">${label}<div class="flex-1 min-w-0">${c}${f.helpText?`<div class="text-[11px] text-gray-400 mt-1">${f.helpText}</div>`:''}</div></div>` : `<div>${label}<div>${c}${f.helpText?`<div class="text-[11px] text-gray-400 mt-1">${f.helpText}</div>`:''}</div></div>`;
        html += `<div class="mb-4">${wrap}</div>`;
      });
      body.innerHTML = html;
      bindPreviewInteractions();
    }
    const fb=currentView().formButtons||{submit:true,draft:true,reset:true};
    let btns='';
    if(fb.draft) btns+='<button class="px-4 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg btn-click" onclick="closeModal(\'previewModal\')">保存草稿</button>';
    if(fb.reset) btns+='<button class="px-4 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg btn-click" onclick="closeModal(\'previewModal\')">取消</button>';
    if(fb.submit) btns+='<button class="px-4 py-2 bg-[#165DFF] hover:bg-blue-600 text-white text-sm rounded-lg font-medium btn-click" onclick="alert(\'提交成功（演示）\')">提交</button>';
    document.getElementById('previewBtns').innerHTML = btns || '<span class="text-xs text-gray-400">未配置任何表单按钮</span>';
    openModal('previewModal');
  }
  /* 预览态：单个控件的真实交互渲染（可输入/可点选，便于看效果） */
  function previewControlHTML(f){
    const fn=f.fieldName;
    if(f.type==='text'){
      const fmt = f.format&&f.format!=='none' ? f.format : '';
      const fmtLabel = fmt ? `<div class="text-[11px] text-gray-400 mt-1">（${FORMATS[f.format]}）</div>` : '';
      const max = f.maxLength?`maxlength="${f.maxLength}"`:'';
      const da=`data-fmt="${fmt}" data-min="${f.minLength||''}" data-err="${esc(f.errMsg||'')}"`;
      const err=`<div id="pverr_${fn}" class="text-[11px] text-red-500 mt-1" style="display:none"></div>`;
      return `<input id="pv_${fn}" ${max} ${da} class="pv-validate w-full border border-gray-300 rounded-md px-3 py-2 text-sm" placeholder="${f.placeholder||''}" value="${defaultDisplay(f)}">`+fmtLabel+err;
    }
    if(f.type==='textarea'){
      const rows=f.rows||4; const max=f.maxLength||0;
      const da=`data-min="${f.minLength||''}" data-err="${esc(f.errMsg||'')}"`;
      const ta=`<textarea id="pv_${fn}" rows="${rows}" ${da} class="pv-textarea pv-validate w-full border border-gray-300 rounded-md px-3 py-2 text-sm" placeholder="${f.placeholder||''}" ${max?`maxlength="${max}"`:''}>${defaultDisplay(f)}</textarea>`;
      const cnt=f.showCount?`<div class="text-[11px] text-gray-400 mt-1 text-right" id="pvcount_${fn}"></div>`:'';
      const err=`<div id="pverr_${fn}" class="text-[11px] text-red-500 mt-1" style="display:none"></div>`;
      return ta+cnt+err;
    }
    if(f.type==='number'){
      const unit=f.unit?`<span class="text-sm text-gray-400 ml-1 whitespace-nowrap">${f.unit}</span>`:'';
      const step=f.showStepper?`step="${Math.pow(10,-(f.precision||0))}"`:'step="any"';
      const min=f.min!=null?`min="${f.min}"`:''; const max=f.max!=null?`max="${f.max}"`:'';
      const da=`data-min="${f.min!=null?f.min:''}" data-max="${f.max!=null?f.max:''}" data-prec="${f.precision||''}" data-err="${esc(f.errMsg||'')}"`;
      const err=`<div id="pverr_${fn}" class="text-[11px] text-red-500 mt-1" style="display:none"></div>`;
      return `<div class="flex items-center gap-1"><input id="pv_${fn}" type="number" ${step} ${min} ${max} ${da} class="pv-validate flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm" placeholder="${f.placeholder||'请输入数字'}">${unit}</div>`+err;
    }
    if(f.type==='radio'){
      const def=f.defaultValue||'';
      const opts=(f.options||[]).map(o=>`<label class="flex items-center gap-1.5 px-3 py-1.5 border border-gray-200 rounded-md text-sm cursor-pointer hover:border-[#165DFF]"><input type="radio" name="pv_${fn}" value="${o.value}" ${o.value===def?'checked':''}> ${o.label}</label>`).join('');
      return `<div class="flex flex-wrap gap-2">${opts||'<span class="text-xs text-gray-300">（暂无选项）</span>'}</div>`;
    }
    if(f.type==='checkbox'){
      const lim=f.limitChoose?`data-lim="${f.maxChoose}"`:'';
      const opts=(f.options||[]).map(o=>`<label class="flex items-center gap-1.5 px-3 py-1.5 border border-gray-200 rounded-md text-sm cursor-pointer hover:border-[#165DFF]"><input type="checkbox" class="pv-cb" data-grp="${fn}" ${lim} value="${o.value}"> ${o.label}</label>`).join('');
      const tip=f.limitChoose?`<div class="text-[11px] text-gray-400 mt-1">可选范围：最少 ${f.minChoose} 项，最多 ${f.maxChoose} 项</div>`:'';
      return `<div class="flex flex-wrap gap-2">${opts||'<span class="text-xs text-gray-300">（暂无选项）</span>'}</div>`+tip;
    }
    if(f.type==='multiselect'){
      const lim=f.limitChoose?f.maxChoose:0;
      const opts=(f.options||[]).map(o=>`<label class="flex items-center gap-2 px-3 py-1.5 text-sm hover:bg-blue-50 cursor-pointer"><input type="checkbox" class="pv-ms" data-grp="${fn}" data-lim="${lim}" value="${o.value}"> ${o.label}</label>`).join('');
      const search=f.searchable?`<input id="pvms_${fn}" class="w-full border border-gray-200 rounded-md px-2 py-1 text-xs mb-1" placeholder="搜索选项">`:'';
      return `<div class="border border-gray-300 rounded-md overflow-hidden"><div class="px-3 py-2 text-sm text-gray-500 cursor-pointer bg-gray-50" onclick="const p=this.nextElementSibling;p.style.display=p.style.display==='none'?'block':'none'">${f.searchable?'点击展开多选（可搜索）':'点击展开多选'}</div><div style="display:none" class="border-t border-gray-100 p-2 max-h-48 overflow-auto">${search}${opts}</div></div>`;
    }
    if(f.type==='datetime'){
      const it=f.dateType==='time'?'time':(f.dateType==='date'?'date':'datetime-local');
      let def=f.defaultValue||'';
      if(f.defaultType==='today') def=new Date().toISOString().slice(0, f.dateType==='date'?10:19);
      const min=f.minDate?`min="${f.minDate}"`:''; const max=f.maxDate?`max="${f.maxDate}"`:'';
      return `<input id="pv_${fn}" type="${it}" ${min} ${max} value="${def}" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">`;
    }
    if(['member','dept','formref','feed'].includes(f.type)){
      const m=PICKER_META[f.type];
      let ph=m.ph; const dt=f.defaultType||'manual';
      if(dt==='manual' && f.defaultValue){ ph = Array.isArray(f.defaultValue)?f.defaultValue.join('、'):f.defaultValue; }
      else if(dt==='currentUser')ph='当前登录人'; else if(dt==='linkage')ph=defaultDisplay(f);
      const scope=pickerScope(f);
      const icon=f.type==='dept'?'fa-sitemap':f.type==='formref'?'fa-file-alt':f.type==='feed'?'fa-comments':'fa-user-plus';
      return `<div class="border border-gray-300 rounded-md px-3 py-2 text-sm flex items-center gap-2 cursor-pointer hover:border-[#165DFF]" onclick="alert('${(m.noun+'选择器 · 范围：'+scope).replace(/'/g,'')}')"><i class="fas ${icon} text-[#165DFF]"></i> ${ph}${f.multi?'（可多选）':''}<span class="ml-auto text-xs text-gray-400">${scope}</span></div>`;
    }
    if(f.type==='signature'){
      const hgh=f.signHeight||120; const col=f.penColor||'#165DFF';
      const modeTxt={hand:'手写签名（请用鼠标在框内书写）',type:'打字签名',image:'点击上传签名图片'}[f.signMode]||'手写签名';
      const wm=f.showWatermark?`<div class="absolute top-1 right-2 text-[10px] text-gray-300">${formConfig.owner||'用户'} · ${todayStr()}</div>`:'';
      return `<div class="relative rounded-md border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400 text-sm" style="height:${hgh}px;color:${col}"><i class="fas fa-signature mr-2"></i>${modeTxt}${wm}</div>`;
    }
    if(f.type==='address'){
      const af=f.addrShow||{}; const ph=f.placeholder||'请选择/输入地址';
      const parts=[];
      if(af.province) parts.push(`<select class="flex-1 min-w-0 border border-gray-300 rounded px-2 py-2 text-sm"><option>省/直辖市</option><option>北京</option><option>上海</option><option>广东</option></select>`);
      if(af.city) parts.push(`<select class="flex-1 min-w-0 border border-gray-300 rounded px-2 py-2 text-sm"><option>城市</option><option>广州</option><option>深圳</option></select>`);
      if(af.district) parts.push(`<select class="flex-1 min-w-0 border border-gray-300 rounded px-2 py-2 text-sm"><option>区/县</option><option>天河区</option><option>南山区</option></select>`);
      if(af.detail) parts.push(`<input id="pv_${fn}" class="flex-1 min-w-0 border border-gray-300 rounded px-2 py-2 text-sm" placeholder="详细地址${f.requireDetail?'（必填）':''}" ${f.requireDetail?'data-req="1"':''}>`);
      return `<div class="space-y-1.5"><div class="flex gap-1.5">${parts.join('')}</div><div class="text-[11px] text-gray-400">${ph}</div></div>`;
    }
    if(f.type==='image'){
      const modeTxt={local:'点击上传图片',camera:'拍照上传',both:'点击或拍照上传'}[f.uploadMode]||'点击上传图片';
      return `<div class="flex items-center gap-2 border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-500 cursor-pointer hover:border-[#165DFF]"><i class="fas fa-image text-[#165DFF]"></i> ${modeTxt} · 最多 ${f.maxCount} 张 · ≤ ${f.maxSize}MB${f.compress?' · 压缩':''}</div>`;
    }
    if(f.type==='attachment'){
      return `<div class="flex items-center gap-2 border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-500 cursor-pointer hover:border-[#165DFF]"><i class="fas fa-paperclip text-[#165DFF]"></i> 点击上传附件 · 最多 ${f.maxCount} 个 · ≤ ${f.maxSize}MB${f.required?' · <span class="text-red-500">必传</span>':''}</div>`;
    }
    if(f.type==='location'){
      const modeTxt={auto:'自动获取定位',manual:'在地图选择',both:'自动或手动选择'}[f.locateMode]||'自动获取定位';
      const map=f.showMap?`<div class="mt-1 h-24 rounded-md border border-gray-200 bg-gradient-to-br from-blue-50 to-gray-100 flex items-center justify-center text-gray-300 text-xs"><i class="fas fa-map mr-1"></i>地图缩略图</div>`:'';
      return `<div><div class="flex items-center gap-2 border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-500 cursor-pointer hover:border-[#165DFF]"><i class="fas fa-map-pin text-[#165DFF]"></i> ${f.placeholder||'点击获取定位'}（${modeTxt}）</div>${map}</div>`;
    }
    if(f.type==='cascader'){
      const lvs=(f.cascadeLevels||[]).map((lv,i)=>`<select id="pv_${fn}_lv${i}" class="flex-1 min-w-0 border border-gray-300 rounded px-2 py-2 text-sm" onchange="previewCascade('${f.fieldName}',${i})"><option>请选择${lv.name}</option></select>`).join(`<i class="fas fa-angle-right text-gray-400 mx-0.5"></i>`);
      return `<div class="flex flex-wrap items-center gap-1.5">${lvs||'<span class="text-xs text-gray-300">未配置级别</span>'}</div>`;
    }
    if(f.type==='autonumber'){
      return `<div class="flex items-center gap-2 border border-gray-300 rounded-md px-3 py-2 text-sm bg-gray-50 text-gray-500"><i class="fas fa-barcode text-[#165DFF]"></i> <span class="font-mono">${genAutoNumber(f)}</span><span class="ml-auto text-[11px] text-gray-400">系统自动生成 · 不可改</span></div>`;
    }
    if(f.type==='select'){
      let ph=f.placeholder||'请选择'; const dt=f.defaultType||'manual';
      let defLabel='';
      if(dt==='manual'&&f.defaultValue){const o=(f.options||[]).find(o=>o.value===f.defaultValue);defLabel=o?o.label:f.defaultValue;}
      else if(dt==='currentUser')defLabel='当前登录人'; else if(dt==='today')defLabel=new Date().toISOString().slice(0,10); else if(dt==='linkage')defLabel=defaultDisplay(f);
      if(f.searchable){
        return `<div class="relative" onfocusin="previewShowSelect('${fn}')" onfocusout="setTimeout(()=>previewHideSelect('${fn}'),150)">
          <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 text-sm bg-white">
            <i class="fas fa-search text-gray-400 mr-2"></i>
            <input id="ps_${fn}" class="flex-1 outline-none text-sm" placeholder="${ph}" value="${defLabel}" oninput="previewFilterSelect(this,'${fn}')">
          </div>
          <div id="pslist_${fn}" class="absolute z-10 mt-1 w-full bg-white border border-gray-200 rounded-md shadow-lg max-h-40 overflow-auto" style="display:none">
            ${(f.options||[]).map(o=>`<div class="px-3 py-1.5 text-sm hover:bg-blue-50 cursor-pointer" data-val="${o.label}" onclick="previewPickSelect('${fn}','${(o.label||'').replace(/'/g,'')}')">${o.label}</div>`).join('')}
          </div>
        </div>`;
      }
      return `<select class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm"><option>请选择</option>${(f.options||[]).map(o=>`<option ${o.value===f.defaultValue?'selected':''}>${o.label}</option>`).join('')}</select>`;
    }
    if(f.type==='subform') return previewSubform(f);
    return '';
  }
  function dividerPreviewHTML(f){
    const borderStyle = (f.divStyle||'solid')==='dashed'?'dashed':(f.divStyle||'solid')==='dotted'?'dotted':'solid';
    if(f.showText && f.text){
      const just = f.divPos==='left'?'justify-start':(f.divPos==='right'?'justify-end':'justify-center');
      return `<div class="flex items-center ${just} gap-3"><div class="flex-1 border-t" style="border-style:${borderStyle}"></div><span class="text-xs text-gray-500 whitespace-nowrap font-medium">${f.text}</span><div class="flex-1 border-t" style="border-style:${borderStyle}"></div></div>`;
    }
    return `<div class="border-t" style="border-style:${borderStyle}"></div>`;
  }
  function bindPreviewInteractions(){
    document.querySelectorAll('.pv-textarea').forEach(ta=>{
      const fn=ta.id.replace('pv_',''); const cnt=document.getElementById('pvcount_'+fn);
      if(!cnt) return; const max=+ta.getAttribute('maxlength')||0;
      const upd=()=>{ const len=ta.value.length; cnt.textContent=max?`${len} / ${max}`:`${len}`; };
      ta.addEventListener('input',upd); upd();
    });
    document.querySelectorAll('.pv-cb').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const lim=+cb.dataset.lim||0; if(lim && cb.checked){
          const checked=document.querySelectorAll(`.pv-cb[data-grp="${cb.dataset.grp}"]:checked`);
          if(checked.length>lim){ cb.checked=false; alert('最多可选 '+lim+' 项'); }
        }
      });
    });
    document.querySelectorAll('.pv-ms').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const lim=+cb.dataset.lim||0; if(lim && cb.checked){
          const checked=document.querySelectorAll(`.pv-ms[data-grp="${cb.dataset.grp}"]:checked`);
          if(checked.length>lim){ cb.checked=false; alert('最多可选 '+lim+' 项'); }
        }
      });
    });
    document.querySelectorAll('[id^="pvms_"]').forEach(inp=>{
      inp.addEventListener('input',()=>{
        const q=inp.value.trim().toLowerCase();
        const box=inp.parentElement;
        box.querySelectorAll('label').forEach(l=>{ l.style.display=l.textContent.toLowerCase().includes(q)?'':'none'; });
      });
    });
    /* 实时格式 / 范围校验（与「校验失败提示」配置联动，输入即校验，不通过显示红框 + 提示） */
    document.querySelectorAll('.pv-validate').forEach(input=>{
      const handler=()=>previewValidate(input);
      input.addEventListener('input',handler);
      input.addEventListener('blur',handler);
      handler();
    });
    /* 多级查询：初始化级联联动（下级选项随上级变化） */
    document.querySelectorAll('[id^="pv_"][id$="_lv0"]').forEach(sel=>{
      const fn=sel.id.replace(/_lv0$/,''); previewCascadeInit(fn);
    });
  }
  function previewCascadeInit(fn){
    // 重置并渲染第一级可选
    const f=getFieldByFn(fn); if(!f) return;
    f._casSel=[];
  }
  function previewCascade(fn,i){
    const f=getFieldByFn(fn); if(!f) return;
    if(!f._casSel) f._casSel=[];
    const sel=document.getElementById('pv_'+fn+'_lv'+i);
    f._casSel[i]= sel ? sel.value : '';
    f._casSel=f._casSel.slice(0,i+1);
    if(i < (f.cascadeLevels||[]).length-1){
      const nodes=cascadeOptionsAt(f,i+1);
      const next=document.getElementById('pv_'+fn+'_lv'+(i+1));
      if(next) next.innerHTML='<option>请选择'+(f.cascadeLevels[i+1].name)+'</option>'+(nodes.map(n=>`<option>${n.label}</option>`).join(''));
    }
  }
  function getFieldByFn(fn){ return (typeof fields!=='undefined'&&fields)?fields.find(x=>x.fieldName===fn):null; }
  function previewValidate(input){
    const fn=input.id.replace('pv_','');
    const errEl=document.getElementById('pverr_'+fn);
    const v=input.value;
    let msg='';
    const fmt=input.dataset.fmt;
    if(fmt && fmt!=='none' && v){
      const re=FORMAT_REGEX[fmt];
      if(re && !re.test(v)) msg = input.dataset.err || DEFAULT_FMT_MSG[fmt] || '格式不正确';
    }
    if(!msg && input.dataset.min){
      const mn=+input.dataset.min;
      if(input.type==='number'){ if(v==='' || isNaN(+v) || +v<mn) msg = input.dataset.err || ('不能小于 '+mn); }
      else { if(v.length<mn) msg = input.dataset.err || ('至少输入 '+mn+' 个字符'); }
    }
    if(!msg && input.dataset.max){
      const mx=+input.dataset.max;
      if(input.type==='number' && v!=='' && !isNaN(+v) && +v>mx) msg = input.dataset.err || ('不能大于 '+mx);
    }
    if(!msg && input.dataset.prec){
      const p=+input.dataset.prec;
      if(input.type==='number' && v!=='' && !isNaN(+v)){
        const dec=(String(v).split('.')[1]||'').length;
        if(dec>p) msg = input.dataset.err || ('最多保留 '+p+' 位小数');
      }
    }
    if(msg){
      input.classList.add('border-red-500'); input.classList.remove('border-gray-300');
      if(errEl){ errEl.textContent=msg; errEl.style.display=''; }
    } else {
      input.classList.remove('border-red-500'); input.classList.add('border-gray-300');
      if(errEl) errEl.style.display='none';
    }
  }
  // 预览态：下拉单选「可搜索」效果（可输入关键字即时过滤 + 点选回填）
  function previewShowSelect(fn){ const l=document.getElementById('pslist_'+fn); if(l) l.style.display=''; }
  function previewHideSelect(fn){ const l=document.getElementById('pslist_'+fn); if(l) l.style.display='none'; }
  function previewFilterSelect(input, fn){
    const l=document.getElementById('pslist_'+fn); if(!l) return;
    const q=input.value.trim().toLowerCase();
    l.querySelectorAll('div[data-val]').forEach(d=>{ d.style.display = d.getAttribute('data-val').toLowerCase().includes(q) ? '' : 'none'; });
  }
  function previewPickSelect(fn, label){
    const i=document.getElementById('ps_'+fn); if(i) i.value=label;
    previewHideSelect(fn);
  }
  function showSchema(){
    const schema = {
      formName, version:1, config: formConfig,
      fields: fields.map(f=>{
        const base={ field:f.fieldName, label:f.label, type:f.type, span:f.span||12, required:!!f.required, helpText:f.helpText||'',
          visible:f.visible||{mode:'always',logic:'and',conditions:[]}, readonly:!!f.readonly, printShow:f.printShow!==false,
          defaultType:f.defaultType||'manual', defaultValue:f.defaultValue||'', linkage:f.linkage||{formId:'',formName:'',conditions:[],returnField:''} };
        if(f.type==='text') Object.assign(base,{placeholder:f.placeholder,maxLength:f.maxLength,minLength:f.minLength,format:f.format,password:!!f.password,trim:!!f.trim});
        if(f.type==='select') Object.assign(base,{source:f.source,apiUrl:f.apiUrl||'',dictKey:f.dictKey||'',options:f.options,searchable:!!f.searchable,allowCustom:!!f.allowCustom});
        if(f.type==='subform') Object.assign(base,{minRows:f.minRows,maxRows:f.maxRows,allowAdd:!!f.allowAdd,showSummary:!!f.showSummary,subFields:f.subFields});
        if(['member','dept','formref','feed'].includes(f.type)) Object.assign(base,{range:f.range,depts:f.depts||[],roles:f.roles||[],multi:!!f.multi,includeDept:!!f.includeDept});
        if(f.type==='cascader') Object.assign(base,{levels:f.levels,cascadeLevels:f.cascadeLevels,searchable:!!f.searchable});
        if(f.type==='autonumber') Object.assign(base,{prefix:f.prefix,dateFmt:f.dateFmt,seqLen:f.seqLen,suffix:f.suffix,start:f.start,step:f.step,reset:f.reset});
        if(['signature','address','image','attachment','location'].includes(f.type)) Object.assign(base,{...f});
        return base;
      })
    };
    document.getElementById('schemaBody').textContent = JSON.stringify(schema,null,2);
    openModal('schemaModal');
  }

  /* ===================== 模态 ===================== */
  function openModal(id){ document.getElementById(id).classList.remove('modal-hidden'); }
  function closeModal(id){ document.getElementById(id).classList.add('modal-hidden'); }
  document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.add('modal-hidden'); }));

  /* ===================== 连线 ===================== */
  const svg=document.getElementById('connections'); const connections=[];
  function drawConnections(){
    svg.innerHTML=''; connections.length=0;
    document.querySelectorAll('.proto-element[data-proto-id]').forEach(leftEl=>{
      const pid=leftEl.getAttribute('data-proto-id');
      const rightEl=document.querySelector(`.proto-desc[data-proto-id="${pid}"]`); if(!rightEl) return;
      const lr=leftEl.getBoundingClientRect(), rr=rightEl.getBoundingClientRect(), sr=svg.getBoundingClientRect();
      if(!lr.width||!lr.height||!rr.width) return;
      const x1=lr.right-sr.left, y1=lr.top+lr.height/2-sr.top, x2=rr.left-sr.left, y2=rr.top+rr.height/2-sr.top, cx=x1+(x2-x1)*0.5;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`);
      path.setAttribute('class','connection-line'); path.setAttribute('data-proto-id',pid); svg.appendChild(path);
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const bg=document.createElementNS('http://www.w3.org/2000/svg','circle'); bg.setAttribute('cx',mx); bg.setAttribute('cy',my); bg.setAttribute('r',11); bg.setAttribute('class','connection-label-bg'); svg.appendChild(bg);
      const tx=document.createElementNS('http://www.w3.org/2000/svg','text'); tx.setAttribute('x',mx); tx.setAttribute('y',my); tx.setAttribute('dy','0.05em'); tx.setAttribute('class','connection-label'); tx.textContent=pid; svg.appendChild(tx);
      connections.push({pid,path,leftEl,rightEl});
    });
  }
  function highlight(pid,on){ const c=connections.find(x=>x.pid===pid); if(!c) return; c.path.classList.toggle('active',on); c.leftEl.classList.toggle('active-highlight',on); c.rightEl.classList.toggle('active-highlight',on); }
  function bindHover(){
    document.querySelectorAll('.proto-element[data-proto-id]').forEach(el=>{ el.addEventListener('mouseenter',()=>highlight(el.getAttribute('data-proto-id'),true)); el.addEventListener('mouseleave',()=>highlight(el.getAttribute('data-proto-id'),false)); });
    document.querySelectorAll('.proto-desc[data-proto-id]').forEach(el=>{ el.addEventListener('mouseenter',()=>highlight(el.getAttribute('data-proto-id'),true)); el.addEventListener('mouseleave',()=>highlight(el.getAttribute('data-proto-id'),false)); });
  }
  let mobileDesc=false;
  function toggleMobileView(){ mobileDesc=!mobileDesc; const lp=document.getElementById('left-panel'), rp=document.getElementById('right-panel'), b=document.getElementById('mobileToggle'); if(mobileDesc){ lp.style.display='none'; rp.style.height='100vh'; b.innerHTML='<i class="fas fa-desktop"></i>'; } else { lp.style.display=''; rp.style.height=''; b.innerHTML='<i class="fas fa-info"></i>'; } }

  /* ===================== 初始化 ===================== */
  function init(){
    // 规范化：为示例表单补齐 版本 / 发布信息 / 版本历史
    SAMPLE_FORMS.forEach(f=>{
      if(f.version==null) f.version = (f.status==='已发布')?1:0;
      if(f.publishedAt==null) f.publishedAt = (f.status==='已发布')?f.updatedAt:'';
      if(f.publishedBy==null) f.publishedBy = (f.status==='已发布')?'系统':'';
      if(f.hasUnpublished==null) f.hasUnpublished=false;
      if(!f.versions) f.versions = (f.status==='已发布')
        ? [{version:1, time:f.publishedAt||f.updatedAt, publisher:f.publishedBy||'系统', note:'首次发布，锁定该版本 schema',
            name:f.name, cat:f.cat, icon:(f.fc&&f.fc.icon)||'fa-file-alt',
            fields:JSON.parse(JSON.stringify(f.fields||[])), fc:JSON.parse(JSON.stringify(f.fc))}]
        : [];
    });
    renderFormTable(); renderPalette(); applyFormWidth(); renderCanvas(); renderConfig(); drawConnections(); bindHover();
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(init,120));
  let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(init,150); });
  document.getElementById('left-panel').addEventListener('scroll',()=>requestAnimationFrame(drawConnections));
  document.getElementById('right-panel').addEventListener('scroll',()=>requestAnimationFrame(drawConnections));
  ___SCEND___
</body>
</html>
</script>

    /* ===== 流程节点卡片（绝对定位，可拖动） ===== */
    .node-card { position:absolute; width:210px; border:2px solid #e5e7eb; background:#fff; border-radius:12px; padding:12px 14px; cursor:grab; transition:border-color .15s, box-shadow .15s; pointer-events:auto; user-select:none; }
    .node-card:hover { border-color:#9db8ff; }
    .node-card.sel { border-color:#165DFF; box-shadow:0 0 0 3px rgba(22,93,255,0.15); }
    .node-start, .node-end { width:180px; margin:0; text-align:center; border-radius:999px; }
    .node-start { background:#165DFF; color:#fff; border-color:#165DFF; }
    .node-end { background:#00B42A; color:#fff; border-color:#00B42A; }
    .node-approval { border-left:4px solid #165DFF; }
    .node-cc { border-left:4px solid #7c5cff; }
    .node-del { position:absolute; top:-9px; right:-9px; width:20px; height:20px; border-radius:50%; background:#fff; border:1px solid #fca5a5; color:#ef4444; font-size:11px; display:none; align-items:center; justify-content:center; }
    .node-card:hover .node-del { display:flex; }

    /* 连接点 */
    .port { position:absolute; width:12px; height:12px; border-radius:50%; background:#fff; border:2px solid #165DFF; left:50%; transform:translateX(-50%); z-index:15; cursor:crosshair; transition:all .15s; }
    .port:hover { background:#165DFF; transform:translateX(-50%) scale(1.2); }
    .port.in { top:-7px; }
    .port.out { bottom:-7px; }
    .node-end .port.in { border-color:#00B42A; }
    .node-start .port.out { border-color:#fff; background:#165DFF; }
    .node-start .port.out:hover { background:#fff; }
    .node-dragging { cursor:grabbing; opacity:.9; }

    /* ===== 画布与连线（SVG） ===== */
    #flowCanvas { position:relative; overflow:hidden; min-width:640px; }
    #edgesSvg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
    #nodeLayer { position:absolute; inset:0; z-index:10; pointer-events:none; }
    #edgeLabelLayer { position:absolute; inset:0; pointer-events:none; z-index:12; }
    .edge-hit { fill:none; stroke:transparent; stroke-width:14; pointer-events:stroke; cursor:pointer; }
    .edge-path { fill:none; stroke:#165DFF; stroke-width:2; opacity:.6; transition:stroke .15s; }
    .edge-path.sel { stroke-width:3; opacity:1; }
    .edge-path.else { stroke:#7c5cff; }
    .edge-bend { fill:#fff; stroke:#165DFF; stroke-width:2; cursor:move; pointer-events:all; }
    .edge-lbl { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-size:11px; padding:3px 10px; border-radius:999px; border:1px dashed #cbd5e1; background:#fff; color:#64748b; cursor:pointer; transition:all .15s; box-shadow:0 1px 3px rgba(0,0,0,.06); pointer-events:auto; }
    .edge-lbl:hover { border-color:#165DFF; color:#165DFF; }
    .edge-lbl.has { border-style:solid; border-color:#f59e0b; color:#d97706; background:#fffbeb; }
    .edge-lbl.else { border-style:solid; border-color:#7c5cff; color:#7c5cff; background:#f5f3ff; }
    .edge-lbl.warn { border-style:solid; border-color:#ef4444; color:#ef4444; background:#fef2f2; }
    .edge-lbl.sel { background:#165DFF; color:#fff; border-color:#165DFF; }

    /* ===== 配置面板 ===== */
    .cfg-logic { font-size:11px; color:#6b7280; margin-top:4px; line-height:1.5; background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; padding:6px 8px; }
    .cfg-info { font-size:11px; color:#6b7280; background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; padding:8px 10px; line-height:1.5; margin-top:6px; }
    .cfg-sec { margin-top:14px; border-top:1px dashed #e5e7eb; padding-top:12px; }
    .cfg-sec-h { font-size:12px; font-weight:700; color:#334155; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .cfg-sec-h::before { content:""; width:3px; height:13px; background:#165DFF; border-radius:2px; display:inline-block; }
    .cfg-tabs { gap:2px; }
    .cfg-tab { flex:1; padding:8px 6px; font-size:12px; font-weight:600; color:#64748b; border-bottom:2px solid transparent; transition:all .15s; white-space:nowrap; }
    .cfg-tab:hover { color:#165DFF; }
    .cfg-tab.on { color:#165DFF; border-bottom-color:#165DFF; background:rgba(22,93,255,0.04); }
    .cfg-warn { font-size:11px; color:#b45309; background:#fffbeb; border:1px solid #fcd34d; border-radius:6px; padding:6px 8px; line-height:1.5; margin-top:8px; }

    .status-pill { font-weight:600; }
    .version-pill { font-weight:600; }

    .tool-pill { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; border:1px solid #e5e7eb; background:#fff; color:#374151; font-size:12px; font-weight:500; cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:all .15s; }
    .tool-pill:hover { border-color:#165DFF; color:#165DFF; box-shadow:0 2px 6px rgba(22,93,255,.1); }
    .tool-pill.approval { border-left:3px solid #165DFF; }
    .tool-pill.cc { border-left:3px solid #7c5cff; }
    .tool-pill.dragging { opacity:.7; }

    /* 节点复制按钮 */
    .node-copy { position:absolute; top:-9px; left:-9px; width:20px; height:20px; border-radius:50%; background:#fff; border:1px solid #9db8ff; color:#165DFF; font-size:10px; display:none; align-items:center; justify-content:center; z-index:3; }
    .node-card:hover .node-copy { display:flex; }
    .node-copy:hover { background:#165DFF; color:#fff; }

    /* 组织架构选人面板 */
    .org-dept-head { user-select:none; }
    .org-cb, .org-mb { width:14px; height:14px; accent-color:#165DFF; cursor:pointer; flex-shrink:0; }
    .org-dept, .org-dept-children { margin-top:1px; }

    [hidden] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50">

  <div id="app" class="flex h-screen relative">

      <!-- 主内容 -->
      <div class="flex-1 flex flex-col min-w-0 bg-gray-50">

        <!-- ===== 流程列表视图 ===== -->
        <section id="listView" class="flex-1 flex flex-col min-h-0">
          <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between flex-shrink-0">

                <button id="ftMonitor" onclick="showView('monitor')" class="px-3 py-1.5 rounded-md font-medium seg text-gray-500 btn-click">实例监控</button>
              </div>
            </div>
            <div class="proto-element" data-proto-id="1">
              <button onclick="openNewFlow()" class="bg-[#165DFF] hover:bg-blue-600 text-white px-3.5 py-1.5 rounded-md text-sm font-medium btn-click"><i class="fas fa-plus mr-1"></i>新建流程</button>
            </div>
          </header>
          <div class="flex-1 overflow-y-auto p-6">
            <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
