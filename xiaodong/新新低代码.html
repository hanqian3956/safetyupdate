        ${row('找不到节点负责人时', select('n_noapprover',[['transfer','转给指定成员'],['auto','自动提交']], n.noApprover||'auto'), '当本节点的审批人解析不到具体成员（如主管离职、角色无人、表单字段为空）时的兜底策略：选「转给指定成员」则自动指派到指定成员继续流转；选「自动提交」则跳过该节点并按流转条件进入下一节点。')}
        ${n.noApprover==='transfer'?memberPickerBlock(n, '兜底转给', 'noApproverMember'):''}
        ${info('审批人 + 审批方式共同决定「谁审、怎么过」。方式仅在多人/多级时生效。')}`;
    }
    g('configBody').innerHTML = head + tabs + body;
    bindCommon(n); bindApproval(n);
  }
  function fieldPermMatrix(f,n){
    const fields=FORM_FIELDS(f.formId);
    if(!fields.length) return '<div class="cfg-logic">（当前表单无字段）</div>';
    const isCC = n.type==='cc';
    const MODES = isCC ? [['read','只读'],['hide','隐藏']] : [['edit','可编辑'],['read','只读'],['hide','隐藏']];
    const def = isCC ? 'read' : 'edit';
    const seg=(name,val)=>`<div class="inline-flex rounded-md overflow-hidden border border-gray-200 text-[11px]">`+MODES.map(o=>`<button onclick="setFieldPerm('${name}','${o[0]}')" class="px-2 py-1 ${val===o[0]?'bg-[#165DFF] text-white':'bg-white text-gray-500 hover:bg-gray-50'} btn-click">${o[1]}</button>`).join('')+`</div>`;
    const rows=fields.map(fl=>{
      let v=n.fieldPerm[fl.fieldName]||def;
      if(isCC && v==='edit') v='read';
      return `<tr class="border-b border-gray-100"><td class="py-1.5 pr-2 text-xs text-gray-700">${fl.label}</td><td class="py-1.5 text-right">${seg(fl.fieldName, v)}</td></tr>`;
    }).join('');
    const subTitle = isCC ? '字段权限（抄送人本节点可见范围）' : '字段权限（审批人本节点可见/可改范围）';
    const bulkOpts = isCC
      ? '<option value="">批量设置…</option><option value="read">全部只读</option><option value="hide">全部隐藏</option>'
      : '<option value="">批量设置…</option><option value="edit">全部可编辑</option><option value="read">全部只读</option><option value="hide">全部隐藏</option>';
    const tip = isCC
      ? '<b>只读</b>抄送人可见内容、<b>隐藏</b>不可见；抄送节点为知会性质，抄送人不可编辑表单字段，故不提供「可编辑」。'
      : '<b>可编辑</b>可改、<b>只读</b>仅看、<b>隐藏</b>不可见。常用于让主管看全部但只能改特定字段；批量设置可快速统一，再个别调整。';
    return `
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] text-gray-500">${subTitle}</span>
        <select onchange="bulkFieldPerm(this.value)" class="text-[11px] border border-gray-300 rounded px-1.5 py-1 text-gray-600">
          ${bulkOpts}
        </select>
      </div>
      <div class="border border-gray-100 rounded-lg overflow-hidden">
        <table class="w-full"><tbody>${rows}</tbody></table>
      </div>
      <div class="cfg-logic mt-2"><i class="fas fa-info-circle mr-1"></i>${tip}</div>`;
  }
  function setFieldPerm(name, val){
    const f=currentFlow(); if(!f) return; const n=f.nodes.find(x=>x.id===selectedNodeId);
    if(n){ n.fieldPerm[name]=val; renderConfig(); }
  }
  function bulkFieldPerm(v){
    const f=currentFlow(); if(!f||!v) return; const n=f.nodes.find(x=>x.id===selectedNodeId);
    if(n){ FORM_FIELDS(f.formId).forEach(fl=>n.fieldPerm[fl.fieldName]=v); renderConfig(); }
  }

  /* ---- 抄送节点（分 tab 页） ---- */
  function renderCC(f,n){
    const head = `<div class="flex items-center gap-2 mb-3"><span class="w-6 h-6 rounded bg-[#7c5cff]/10 text-[#7c5cff] flex items-center justify-center text-xs"><i class="fas fa-paper-plane"></i></span><h3 class="text-sm font-bold text-gray-800">抄送节点</h3></div>
      ${row('节点名称', `<input id="n_name" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" ${inp(n.name)}>`, '抄送节点名称，如「通知HR」。')}`;
    const tabs = tabsHTML(cfgTab, [['base','抄送设置'],['perm','字段权限']]);
    let body='';
    if(cfgTab==='perm'){
      body = fieldPermMatrix(f,n);
    } else {
      body = `
        ${row('抄送人类型', select('n_ctype',[['member','指定成员'],['role','指定角色'],['dept','指定部门'],['post','指定岗位']], n.ccType), '被抄送人仅接收知会，不参与审批、不影响流转。')}
        ${n.ccType==='member'?memberPickerBlock(n, '指定成员', 'members'):''}
        ${n.ccType==='role'?rolePickerBlock(n, '指定角色', 'roles'):''}
        ${n.ccType==='dept'?deptPickerBlock(n, '指定部门', 'depts'):''}
        ${n.ccType==='post'?postPickerBlock(n, '指定岗位', 'posts'):''}
        ${info('抄送人类型决定「抄送给谁」；在「字段权限」中配置抄送人可见的字段范围（仅只读 / 隐藏，抄送人不可编辑）。')}`;
    }
    g('configBody').innerHTML = head + tabs + body;
    bindCommon(n); bindCC(n);
  }

  /* ---- 结束节点 ---- */
  function renderEnd(f,n){
    g('configBody').innerHTML = `
      <div class="flex items-center gap-2 mb-3"><span class="w-6 h-6 rounded bg-[#00B42A] text-white flex items-center justify-center text-xs"><i class="fas fa-flag-checkered"></i></span><h3 class="text-sm font-bold text-gray-800">结束节点</h3></div>
      ${row('节点名称', `<input id="n_name" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" ${inp(n.name)}>`, '流程终点名称。')}
      ${row('结束动作', select('n_end',[['archive','归档'],['notify','通知发起人'],['webhook','触发Webhook']], n.endAction), '流程正常结束后的系统动作：归档留痕、或通知发起人、或回调外部系统。')}
      ${n.endAction==='webhook'?`
        ${row('回调地址', `<input id="n_webhook" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" placeholder="https://" ${inp(n.webhook)}>`, '流程结束时系统向该地址发送单据数据（回调目标）。')}
        ${row('请求方式', select('n_wmethod',[['POST','POST'],['GET','GET']], n.webhookMethod), '调用回调地址使用的 HTTP 方法，默认 POST 携带 JSON 数据。')}
        ${row('请求头（JSON）', `<textarea id="n_wheaders" rows="2" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm resize-none font-mono" placeholder='如 {"Authorization":"Bearer xxx"}'>${n.webhookHeaders||''}</textarea>`, '可选：自定义请求头，用于鉴权或指定 Content-Type。')}
        ${info('流程结束归档时触发回调，发送单据数据至上述地址；失败自动重试 3 次。')}
      `:''}
      ${info('结束节点表示审批链路完成，实例进入「已结束」终态，不再流转。')}`;
    bindCommon(n); bindEnd(n);
  }
  function bindEnd(n){
    const ed=g('n_end'); if(ed) ed.onchange=e=>{ n.endAction=e.target.value; renderConfig(); };
    const wh=g('n_webhook'); if(wh) wh.oninput=e=>{ n.webhook=e.target.value; };
    const wm=g('n_wmethod'); if(wm) wm.onchange=e=>{ n.webhookMethod=e.target.value; };
    const whd=g('n_wheaders'); if(whd) whd.oninput=e=>{ n.webhookHeaders=e.target.value; };
  }

  /* ===================== 配置事件绑定 ===================== */
  function bindCommon(n){
    const nameEl=g('n_name'); if(nameEl) nameEl.oninput=e=>{ n.name=e.target.value; renderCanvas(); };
    const sc=g('n_scope'); if(sc) sc.onchange=e=>{ n.initiatorScope=e.target.value; cfgTab='base'; renderStart(currentFlow(), n); };
  }
  function bindFlowConfig(){
    const f=currentFlow();
    const set=(id,key,parse)=>{ const el=g(id); if(el) el.onchange=e=>{ f[key]=parse?parse(e.target.value):e.target.value; renderConfig(); }; };
    const setNum=(id,key)=>{ const el=g(id); if(el) el.oninput=e=>{ f[key]=Number(e.target.value); }; };
    set('fc_name','name');
    const d=g('fc_desc'); if(d) d.oninput=e=>f.desc=e.target.value;
    set('fc_category','category');
    const fc=g('fc_recall'); if(fc) fc.onchange=e=>{ f.allowRecall=e.target.checked; renderConfig(); };
    setNum('fc_recallh','recallHours');
    const fru=g('fc_recallu'); if(fru) fru.onchange=e=>{ f.recallUnit=e.target.value; };
  }
  function bindApproval(n){
    const f=currentFlow();
    const at=g('n_atype'); if(at) at.onchange=e=>{ n.approverType=e.target.value; renderConfig(); };
    const fl=g('n_field'); if(fl) fl.onchange=e=>{ n.fieldRef=e.target.value; };
    const lv=g('n_level'); if(lv) lv.oninput=e=>{ n.level=Number(e.target.value)||1; };
    const mo=g('n_mode'); if(mo) mo.onchange=e=>{ n.mode=e.target.value; renderCanvas(); };
    const nap=g('n_noapprover'); if(nap) nap.onchange=e=>{ n.noApprover=e.target.value; renderConfig(); };
    const to=g('n_timeout'); if(to) to.onchange=e=>{ n.timeoutEnabled=e.target.checked; renderConfig(); };
    const th=g('n_th'); if(th) th.oninput=e=>{ n.timeoutHours=Number(e.target.value)||24; };
    const tu=g('n_tunit'); if(tu) tu.onchange=e=>{ n.timeoutUnit=e.target.value; };
    const ta=g('n_tact'); if(ta) ta.onchange=e=>{ n.timeoutAction=e.target.value; };
    const op=g('n_opinion'); if(op) op.onchange=e=>{ n.opinion=e.target.value; };
    const sb=g('n_submit'); if(sb) sb.onchange=e=>{ n.allowSubmit=e.target.checked; };
    const bb=g('n_bounceback'); if(bb) bb.onchange=e=>{ n.allowBounceBack=e.target.checked; renderConfig(); };
    const rj=g('n_reject'); if(rj) rj.onchange=e=>{ n.allowReject=e.target.checked; renderConfig(); };
    const rjt=g('n_rejectto'); if(rjt) rjt.onchange=e=>{ n.rejectTo=e.target.value; };
    const tr=g('n_transfer'); if(tr) tr.onchange=e=>{ n.allowTransfer=e.target.checked; };
    const as=g('n_addsign'); if(as) as.onchange=e=>{ n.allowAddSign=e.target.checked; };
  }

  /* 审批方式仅保留 会签 / 或签（依次审批已移除） */

  function bindCC(n){
    const ct=g('n_ctype'); if(ct) ct.onchange=e=>{ n.ccType=e.target.value; renderConfig(); };
  }
  function bindConfig(){ /* 分派由各 render 调用具体 bind */ }

  /* ===================== 流转条件（参考图：自定义条件 / else） ===================== */
  const OPS=[['eq','等于'],['ne','不等于'],['gt','大于'],['lt','小于'],['gte','大于等于'],['lte','小于等于'],['contains','包含'],['empty','为空'],['notempty','不为空']];
  function condSummaryOf(c){
    const fs=FORM_FIELDS(currentFlow().formId);
    const label=x=>{ const f=fs.find(y=>y.fieldName===x); return f?f.label:x; };
    const opT=o=>{ const m=OPS.find(y=>y[0]===o); return m?m[1]:o; };
    return c.conditions.map(cd=>`${label(cd.field)}${opT(cd.op)}${cd.val||''}`).join(c.logic==='and'?'且':'或');
  }

  function renderEdgeConfig(f){
    const eid=selectedEdgeId; const e=getEdge(eid); if(!e) return;
    const src=f.nodes.find(x=>x.id===e.from), tgt=f.nodes.find(x=>x.id===e.to);
    const outs=getOutgoing(e.from);
    const hasElseElsewhere = outs.some(o=>o.id!==e.id && o.mode==='else');
    const h = `
      <div class="flex items-center gap-2 mb-3"><i class="fas fa-share text-[#165DFF]"></i><h3 class="text-sm font-bold text-gray-800">节点连接线</h3></div>
      <div class="mb-3 text-[11px] text-gray-500"><b>${src?src.name:'?'}</b> → <b>${tgt?tgt.name:'?'}</b></div>
      <div class="cfg-sec" style="margin-top:0;border-top:none;padding-top:0">
        <div class="cfg-sec-h">数据流转条件</div>
        ${row('条件模式', select('edge_mode',[
          ['condition','使用自定义流转条件'],
          ['else','使用 else 条件']
        ], e.mode), '自定义流转条件：满足下方条件的数据才进入这条连接线下的节点；else 条件：当同源其他线的条件都不满足时走此线（兜底）。每一条连接线均需配置流转条件或设为 else。')}
        <div class="cfg-logic mb-3"><i class="fas fa-info-circle mr-1"></i>${e.mode==='else'?'当其他分支条件都不满足时，数据会走这一条 else 连线。':'添加后，满足流转条件的数据，才会进入这条连接线下的节点。'}</div>
        ${e.mode==='condition'?`
          <div class="mb-2 text-xs text-gray-600">符合以下 ${select('edge_logic',[['and','所有'],['or','任一']], e.logic)} 流转条件的数据</div>
          ${e.conditions.length?e.conditions.map((cd,i)=>edgeRowHTML(cd,i)).join(''):'<div class="cfg-logic">尚未添加条件，可点击下方按钮新增。</div>'}
          <button onclick="edgeAddRow()" class="mt-2 text-[#165DFF] text-xs btn-click"><i class="fas fa-plus mr-1"></i>添加流转条件</button>
          <div class="cfg-info mt-2">${edgePreview()}</div>
        `:''}
        ${e.mode==='else'?`<div class="cfg-info"><i class="fas fa-code-branch mr-1"></i>本分支为 <b>else 默认分支</b>：当「${src?src.name:''}」的其他流出分支条件都不满足时自动走此线，无需配置条件。</div>`:''}
      </div>`;
    g('configBody').innerHTML=h;
    bindEdgeConfig(e);
  }
  function edgeRowHTML(cd,i){
    const fields=FORM_FIELDS(currentFlow().formId);
    const fopts = fields.length? fields.map(fl=>`<option value="${fl.fieldName}" ${cd.field===fl.fieldName?'selected':''}>${fl.label}</option>`).join('') : '<option value="">（无字段）</option>';
    const oopts = OPS.map(o=>`<option value="${o[0]}" ${cd.op===o[0]?'selected':''}>${o[1]}</option>`).join('');
    const hide = (cd.op==='empty'||cd.op==='notempty');
    return `<div class="flex items-center gap-1.5 mb-2">
      <select onchange="updEdgeCond(${i},'field',this.value)" class="form-input border border-gray-300 rounded px-2 py-1 text-xs flex-1">${fopts}</select>
      <select onchange="updEdgeCond(${i},'op',this.value)" class="form-input border border-gray-300 rounded px-2 py-1 text-xs w-24">${oopts}</select>
      <input oninput="updEdgeCond(${i},'val',this.value)" value="${cd.val||''}" ${hide?'disabled':''} class="form-input border border-gray-300 rounded px-2 py-1 text-xs w-20" placeholder="值">
      <button onclick="edgeDelRow(${i})" class="text-gray-400 hover:text-red-500 btn-click"><i class="fas fa-times"></i></button>
    </div>`;
  }
  function edgeAddRow(){ const e=getEdge(selectedEdgeId); e.conditions.push({field:'',op:'eq',val:''}); renderEdgeConfig(currentFlow()); }
  function edgeDelRow(i){ const e=getEdge(selectedEdgeId); e.conditions.splice(i,1); renderEdgeConfig(currentFlow()); }
  function updEdgeCond(i,key,val){ const e=getEdge(selectedEdgeId); e.conditions[i][key]=val; if(key==='op'){ renderEdgeConfig(currentFlow()); } else { const p=g('configBody').querySelector('.cfg-info'); if(p) p.innerHTML=edgePreview(); } }
  function edgePreview(){
    const e=getEdge(selectedEdgeId); if(!e||!e.conditions.length) return '（未配置条件，默认直接流转）';
    const fs=FORM_FIELDS(currentFlow().formId);
    const label=x=>{ const f=fs.find(y=>y.fieldName===x); return f?f.label:x; };
    const opT=o=>{ const m=OPS.find(y=>y[0]===o); return m?m[1]:o; };
    const parts=e.conditions.map(cd=>`${label(cd.field)} ${opT(cd.op)} ${cd.val||'?'}`);
    return (e.logic==='and'?'且：':'或：') + parts.join(e.logic==='and'?' ， ':' 或 ');
  }
  function edgeApply(){ renderCanvas(); }
  function edgeClear(){ const e=getEdge(selectedEdgeId); if(e){ e.mode='always'; e.logic='and'; e.conditions=[]; renderEdgeConfig(currentFlow()); renderCanvas(); } }
  function delEdge(eid){
    const f=currentFlow(); const e=getEdge(eid); if(!e) return;
    f.edges=f.edges.filter(x=>x.id!==eid);
    selectedEdgeId=null; renderCanvas(); renderConfig();
  }
  function bindEdgeConfig(e){
    const el=getEdge(selectedEdgeId);
    const m=g('edge_mode'); if(m) m.onchange=()=>{
      const val=g('edge_mode').value;
      if(val==='else'){
        // 取消其他同源线的 else
        getOutgoing(el.from).forEach(o=>{ if(o.id!==el.id && o.mode==='else') o.mode='always'; });
      }
      el.mode=val;
      renderEdgeConfig(currentFlow()); renderCanvas();
    };
    const l=g('edge_logic'); if(l) l.onchange=()=>{ el.logic=g('edge_logic').value; renderEdgeConfig(currentFlow()); };
  }

  /* 键盘 Delete 删除选中的连线 */
  document.addEventListener('keydown', e=>{
    if((e.key==='Delete' || e.key==='Backspace') && selectedEdgeId){ delEdge(selectedEdgeId); }
  });

  /* ===================== 顶部 & 保存/发布 ===================== */
  function statusInfo(f){
    if(f.status==='已发布') return f.hasUnpublished
      ? { label:'待发布', cls:'px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700' }
      : { label:'已发布', cls:'px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-600' };
    return { label:(f.version>0?'草稿（已下架）':'草稿'), cls:'px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700' };
  }
  function updateHeader(){
    const f=currentFlow(); if(!f) return;
    const pill=g('statusPill'), vp=g('versionPill'), pub=g('publishBtn'), unp=g('unpublishBtn'), banner=g('stateBanner');
    const si=statusInfo(f);
    pill.textContent=si.label; pill.className='status-pill '+si.cls;
    vp.textContent='v'+f.version;
    const published=f.status==='已发布';
    pub.classList.toggle('hidden', published && !f.hasUnpublished);
    unp.classList.toggle('hidden', !published);
    pub.innerHTML = (published && f.hasUnpublished) ? '<i class="fas fa-rocket mr-1"></i>发布新版本' : '<i class="fas fa-rocket mr-1"></i>发布';
    if(published && f.hasUnpublished){
      banner.style.display='flex'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-amber-50 text-amber-700';
      banner.innerHTML='<i class="fas fa-exclamation-triangle"></i> 本流程已发布（线上 <b>v'+f.version+'</b>），当前为<b>待发布修改</b>。点击「发布」生成 <b>v'+(f.version+1)+'</b> 并生效，在途单据不受影响。';
    } else if(!published && f.version>0){
      banner.style.display='flex'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-gray-50 text-gray-600';
      banner.innerHTML='<i class="fas fa-eye-slash"></i> 流程已下架，当前为<b>草稿</b>，不再接收发起；历史数据（v1…v'+f.version+'）保留可查。点击「发布」可重新上线为新版本。';
    } else { banner.style.display='none'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200'; banner.innerHTML=''; }
  }
  function saveFlow(){
    const f=currentFlow(); if(!f) return;
    if(f.status!=='已发布'){ f.status='草稿'; if(f.version===0) f.version=0; }
    else { f.hasUnpublished=true; }
    f.publishedAt=f.publishedAt||'—';
    updateHeader(); renderFlowTable();
    alert('已保存流程「'+f.name+'」\n共 '+f.nodes.length+' 个节点（演示）');
  }
  function snapshotOf(f){
    return { v:f.version, publishedAt:f.publishedAt, publishedBy:f.publishedBy, name:f.name, desc:f.desc, icon:f.icon, formId:f.formId,
      allowRecall:f.allowRecall, recallHours:f.recallHours, recallUnit:f.recallUnit,
      nodes:JSON.parse(JSON.stringify(f.nodes)), edges:JSON.parse(JSON.stringify(f.edges)) };
  }
  function publishFlow(){
    const f=currentFlow(); if(!f) return;
    // 逻辑：流程名称全局唯一，重复则拦截（与工作表单一致）
    if(FLOWS.some(function(x){return x.id!==f.id && x.name===f.name;})){ alert('流程名称「'+f.name+'」已存在，请修改名称后再发布。'); return; }
    const maxV=(f.versions&&f.versions.length)?Math.max.apply(null, f.versions.map(s=>s.v)):(f.version||0);
    if(!confirm('确认发布流程「'+f.name+'」？\n将生成 v'+(maxV+1)+' 并作为线上锁定版本。')) return;
    f.version=maxV+1; f.status='已发布'; f.hasUnpublished=false; f.publishedAt=new Date().toISOString().slice(0,10); f.publishedBy='产品同学';
    if(!f.versions) f.versions=[];
    f.versions.push(snapshotOf(f));
    updateHeader(); renderFlowTable(); renderCanvas();
    alert('已发布：'+f.name+' v'+f.version+'（线上锁定版本生效）');
  }
  function unpublishFlow(id){
    const f = id?FLOWS.find(x=>x.id===id):currentFlow(); if(!f) return;
    if(!confirm('确认下架流程「'+f.name+'」？\n下架后停止接收发起，历史数据保留。')) return;
    f.status='草稿'; f.hasUnpublished=false;
    if(currentFlowId===f.id) updateHeader();
    renderFlowTable();
  }
  function quickPublish(id){ const f=FLOWS.find(x=>x.id===id); if(!f) return; currentFlowId=id; publishFlow(); }
  function copyFlow(id){
    const f=FLOWS.find(x=>x.id===id); if(!f) return;
    const idMap={};
    const newNodes=f.nodes.map(n=>{ const c=JSON.parse(JSON.stringify(n)); const nid='n_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); idMap[n.id]=nid; c.id=nid; return c; });
    const newEdges=f.edges.map(e=>{ const c=JSON.parse(JSON.stringify(e)); c.id='e_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); c.from=idMap[e.from]; c.to=idMap[e.to]; c.bend=undefined; return c; });
    const nf=JSON.parse(JSON.stringify(f));
    nf.id='p_'+Date.now(); nf.name=f.name+' 副本'; nf.status='草稿'; nf.version=0; nf.hasUnpublished=false; nf.publishedAt='—'; nf.versions=[]; nf.nodes=newNodes; nf.edges=newEdges;
    FLOWS.push(nf); renderFlowTable();
  }

  /* ===================== 版本历史 ===================== */
  function showVersions(){
    const f=currentFlow(); if(!f) return;
    const vers=(f.versions&&f.versions.length)?f.versions.slice().sort((a,b)=>b.v-a.v):[];
    let list=vers.map(s=>{
      const cur = s.v===f.version && f.status==='已发布';
      return `<div class="flex items-center gap-3 p-3 border rounded-lg ${cur?'border-[#165DFF] bg-blue-50':'border-gray-200'}">
        <span class="px-2 py-0.5 rounded-full text-xs font-medium ${cur?'bg-[#165DFF] text-white':'bg-gray-100 text-gray-500'}">v${s.v}</span>
        <div class="flex-1 min-w-0"><div class="text-sm text-gray-800">${cur?'线上版本（当前生效）':'历史版本'}</div><div class="text-xs text-gray-400">${s.publishedBy||'系统'} · ${s.publishedAt||'—'} · ${s.nodes?s.nodes.length:0} 个节点</div></div>
        ${cur?'<span class="text-xs text-[#165DFF]"><i class="fas fa-lock mr-1"></i>已锁定</span>':
          `<button onclick="viewVersion(${s.v})" class="px-3 py-1 rounded-md text-xs btn-click border border-gray-300 text-gray-600 hover:border-[#165DFF] hover:text-[#165DFF]"><i class="fas fa-eye mr-1"></i>查看</button>
           <button onclick="restoreVersion(${s.v})" class="px-3 py-1 rounded-md text-xs btn-click border border-[#165DFF] text-[#165DFF] hover:bg-blue-50"><i class="fas fa-rotate-left mr-1"></i>恢复并发布</button>`}
      </div>`;
    }).join('');
    if(!vers.length) list='<div class="text-xs text-gray-400 p-2">尚未发布，暂无版本记录。</div>';
    g('versionList').innerHTML=list;
    openModal('versionsModal');
  }
  function viewVersion(v){
    const f=currentFlow(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.v===v); if(!s) return;
    // 直接把画布切换为该历史版本的节点结构（只读）
    viewingVersion=v; selectedNodeId=null; selectedEdgeId=null;
    closeModal('versionsModal');
    const banner=g('stateBanner');
    banner.style.display='flex'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-blue-50 text-blue-700';
    banner.innerHTML='<i class="fas fa-eye"></i> 正在查看历史版本 <b>v'+v+'</b>（只读 · '+(s.publishedBy||'系统')+' · '+(s.publishedAt||'—')+'）<button onclick="exitVersionView()" class="ml-auto px-2.5 py-1 rounded-md text-[11px] font-medium bg-[#165DFF] text-white hover:bg-blue-600 btn-click">返回编辑</button>';
    renderCanvas(); renderConfig();
  }
  function exitVersionView(){
    viewingVersion=null; selectedNodeId=null; selectedEdgeId=null;
    renderCanvas(); renderConfig(); updateHeader();
  }
  function restoreVersion(v){
    const f=currentFlow(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.v===v); if(!s) return;
    if(!confirm('确认恢复历史版本 v'+v+'？\n将把当前流程内容替换为该版本内容并重新发布，版本号保持 v'+v+'，不生成新版本。')) return;
    f.name=s.name; f.desc=s.desc; f.icon=s.icon; f.formId=s.formId;
    f.allowRecall=s.allowRecall; f.recallHours=s.recallHours; f.recallUnit=s.recallUnit;
    f.nodes=JSON.parse(JSON.stringify(s.nodes)); f.edges=JSON.parse(JSON.stringify(s.edges));
    f.version=v; f.status='已发布'; f.hasUnpublished=false;
    f.publishedAt=s.publishedAt; f.publishedBy=s.publishedBy;
    selectedNodeId=null; selectedEdgeId=null;
    closeModal('versionsModal');
    updateHeader(); renderFlowTable(); renderCanvas(); renderConfig();
    alert('已恢复历史版本 v'+v+' 并重新发布（版本号保持 v'+v+'，不新增版本号）');
  }

  /* ===================== 模态框 ===================== */
  function openModal(id){ g(id).classList.remove('modal-hidden'); }
  function closeModal(id){ g(id).classList.add('modal-hidden'); }
  document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.add('modal-hidden'); }));

  /* ===================== 逻辑说明高亮连线 ===================== */
  const svg0=document.getElementById('connections');
  function drawConnections(){
    svg0.innerHTML='';
    document.querySelectorAll('.proto-element[data-proto-id]').forEach(leftEl=>{
      const pid=leftEl.getAttribute('data-proto-id');
      const rightEl=document.querySelector('.proto-desc[data-proto-id="'+pid+'"]'); if(!rightEl) return;
      const lr=leftEl.getBoundingClientRect(), rr=rightEl.getBoundingClientRect(), sr=svg0.getBoundingClientRect();
      if(lr.width===0||rr.width===0) return;
      const x1=lr.right-sr.left, y1=lr.top+lr.height/2-sr.top;
      const x2=rr.left-sr.left, y2=rr.top+rr.height/2-sr.top;
      const cx=x1+(x2-x1)*0.5;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`);
      p.setAttribute('class','connection-line'); p.setAttribute('data-proto-id',pid); svg0.appendChild(p);
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
      bg.setAttribute('cx',mx); bg.setAttribute('cy',my); bg.setAttribute('r',11); bg.setAttribute('class','connection-label-bg'); svg0.appendChild(bg);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',mx); t.setAttribute('y',my); t.setAttribute('dy','0.05em'); t.setAttribute('class','connection-label'); t.textContent=pid; svg0.appendChild(t);
    });
  }
  function highlight(pid,active){
    document.querySelectorAll('.connection-line[data-proto-id="'+pid+'"]').forEach(p=>p.classList.toggle('active',active));
    const l=document.querySelector('.proto-element[data-proto-id="'+pid+'"]'); if(l) l.classList.toggle('active-highlight',active);
    const r=document.querySelector('.proto-desc[data-proto-id="'+pid+'"]'); if(r) r.classList.toggle('active-highlight',active);
  }
  function bindHover(){
    document.querySelectorAll('.proto-element[data-proto-id]').forEach(el=>{ const p=el.getAttribute('data-proto-id'); el.addEventListener('mouseenter',()=>highlight(p,true)); el.addEventListener('mouseleave',()=>highlight(p,false)); });
    document.querySelectorAll('.proto-desc[data-proto-id]').forEach(el=>{ const p=el.getAttribute('data-proto-id'); el.addEventListener('mouseenter',()=>highlight(p,true)); el.addEventListener('mouseleave',()=>highlight(p,false)); });
  }

  /* ===================== 移动端 ===================== */
  let mobileShowDesc=false;
  function toggleMobileView(){ mobileShowDesc=!mobileShowDesc; const lp=g('left-panel'),rp=g('right-panel'),b=g('mobileToggle'); if(mobileShowDesc){ lp.style.display='none'; rp.style.height='100vh'; b.innerHTML='<i class="fas fa-desktop"></i>'; } else { lp.style.display=''; rp.style.height=''; b.innerHTML='<i class="fas fa-info"></i>'; } }

  /* ===================== 初始化 ===================== */
  function init(){
    orgInitExpand();
    renderFlowTable(); renderCanvas();
    drawConnections(); bindHover();
    document.getElementById('left-panel').addEventListener('scroll',()=>requestAnimationFrame(drawConnections));
    document.getElementById('right-panel').addEventListener('scroll',()=>requestAnimationFrame(drawConnections));
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(init,100));
  let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ drawConnections(); drawNodeEdges(); },150); });
  ___SCEND___
</body>
</html>

</script>

<script>
/* ===================== 数据模型 ===================== */
const TENANT={id:'t1',name:'星辰科技'};
const tenantName=id=>id===TENANT.id?TENANT.name:id;

// 组织架构（部门 → 小组 → 成员）
let DEPTS=[
  {id:'d1',name:'研发中心',type:'dept',parentId:null},

let MEMBERS=[

// 表单设计器 / 流程中心 / 任务中心 产物（挂载素材；status=published 为已发布可选）
let FORMS=[
  {id:'f1',name:'请假申请单',cat:'审批',status:'published',views:[{id:'v_f1_d',name:'默认视图',isDefault:true}]},
  {id:'f2',name:'报销单',cat:'审批',status:'published',views:[

  ]},
  {id:'f3',name:'入职登记表',cat:'登记',status:'published',views:[{id:'v_f3_d',name:'默认视图',isDefault:true}]},
  {id:'f4',name:'员工通讯录查询',cat:'查询',status:'published',views:[{id:'v_f4_d',name:'默认视图',isDefault:true}]},
  {id:'f5',name:'绩效评估表',cat:'审批',status:'draft',views:[{id:'v_f5_d',name:'默认视图',isDefault:true}]}
];
let FLOWS=[

];
let TASKS=[

  {id:'t2',name:'我发起的',cat:'发起',desc:'我发起的流程与单据'},

];

// 应用（自动归属当前租户；图标来自图标库，仅存图标名）
let APPS=[
  {id:'a1',name:'企业OA系统',icon:{name:'fa-building'},tenantId:'t1',desc:'办公自动化门户',status:'published',menus:[
    {id:'am1',name:'人事',type:'folder',children:[
      {id:'am1a',name:'请假申请单',type:'form',refId:'f1',roleIds:null},
      {id:'am1b',name:'请假审批',type:'flow',refId:'p1',roleIds:['r2']},
    ]},
    {id:'am2',name:'财务',type:'folder',children:[
      {id:'am2a',name:'报销单',type:'form',refId:'f2',roleIds:null},
      {id:'am2b',name:'报销审批',type:'flow',refId:'p2',roleIds:['r3']},
    ]},
  ]},
  {id:'a2',name:'项目管理系统',icon:{name:'fa-tasks'},tenantId:'t1',desc:'研发项目协作',status:'draft',menus:[
    {id:'bm1',name:'项目看板',type:'folder',children:[
      {id:'bm1a',name:'研发任务',type:'form',refId:'f3',roleIds:null},
      {id:'bm1b',name:'我的待办',type:'task',refId:'t1',roleIds:null},
    ]},
  ]},
];

// 角色体系：角色组 → 角色（含用户、可分配应用）
let ROLE_GROUPS=[
  {id:'g1',name:'职能角色',roles:[
    {id:'r1',name:'普通员工',memberIds:['m1','m2','m6','m4'],appIds:['a1']},
    {id:'r2',name:'部门主管',memberIds:['m3','m5'],appIds:['a1']},
  ]},
  {id:'g2',name:'财务角色',roles:[
    {id:'r3',name:'财务专员',memberIds:['m3','m4'],appIds:['a1']},
  ]},
];

/* ===================== 工具函数 ===================== */
const uid=p=>(p||'id')+Math.random().toString(36).slice(2,8);
const memberName=id=>{const m=MEMBERS.find(x=>x.id===id);return m?m.name:id;};
const deptName=id=>{const d=DEPTS.find(x=>x.id===id);return d?d.name:id;};
const appName=id=>{const a=APPS.find(x=>x.id===id);return a?a.name:id;};
const groupName=id=>{const g=ROLE_GROUPS.find(x=>x.id===id);return g?g.name:id;};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function menuItems(m){
  if(!m) return [];
  if(Array.isArray(m.items)&&m.items.length) return m.items;
  if(m.refId) return [{refId:m.refId, viewId:m.viewId, viewName:m.viewName}];
  return [];
}
function refName(type,id){
  const list=type==='form'?FORMS:type==='flow'?FLOWS:TASKS;
  const r=list.find(x=>x.id===id); return r?r.name:'(已删除素材)';
}
function roleById(id){for(const g of ROLE_GROUPS){const r=g.roles.find(x=>x.id===id);if(r)return r;}return null;}
function findGroupOf(roleId){const g=ROLE_GROUPS.find(g=>g.roles.some(r=>r.id===roleId));return g?g.id:null;}
function allRoles(){let r=[];ROLE_GROUPS.forEach(g=>r.push(...g.roles));return r;}
function countMenus(menus){let n=0;menus.forEach(m=>{if(m.type==='folder')n+=countMenus(m.children);else n++;});return n;}
function findMenu(a,id,list){list=list||a.menus;for(const m of list){if(m.id===id)return m;if(m.children){const f=findMenu(a,id,m.children);if(f)return f;}}return null;}
function findParent(a,id,list){list=list||a.menus;for(const m of list){if(m.children){if(m.children.some(c=>c.id===id))return m;const f=findParent(a,id,m.children);if(f)return f;}}return null;}

/* ===================== 全局状态 ===================== */
let state={module:'app',appId:null,appTab:'menu',deptId:null,roleId:null,rpTab:'roles',roleAppRoleId:null,menuAppId:'a1',roleShowPerm:false,previewMenuId:null};

/* ===================== 渲染入口 ===================== */
function switchModule(m){state.module=m;if(m!=='app')state.appId=null;render();}
function render(){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.m===state.module));
  const main=document.getElementById('main');
  if(state.module==='app') main.innerHTML=state.appId?renderAppEditor():renderAppList();
  else if(state.module==='user') main.innerHTML=renderUsers();
  else if(state.module==='role') main.innerHTML=renderRolePerm();
  renderNotes();
}

function addMenuGroup(parentId){

function menuTree(a,menus){
  if(!menus.length) return '<div class="text-[12px] text-gray-400 py-2">暂无菜单，点击「添加菜单」挂载。</div>';

    }).join(''):'<span class="text-[11px] text-gray-400">暂无素材</span>';
    return `<div class="tree-node" draggable="true" ondragstart="dragMenu('${a.id}','${m.id}')" ondragover="event.preventDefault()" ondrop="dropMenu('${a.id}','${m.id}')">

        <i class="fas fa-${icon} text-[#165DFF]"></i>
        <span class="font-medium">${esc(m.name)}</span>
        <span class="text-[11px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">${tag} · ${items.length} 项</span>
        <span class="text-[11px] text-[#165DFF] cursor-pointer ml-2" onclick="openAppendMenuItem('${a.id}','${m.id}')" title="向该菜单追加素材">+素材</span>
        <span class="text-[11px] text-red-400 cursor-pointer ml-1" onclick="delMenu('${a.id}','${m.id}')">删除</span>
      </div>
      <div class="pl-6 flex flex-wrap gap-1.5 pb-2">${chips}</div>
    </div>`;
  }).join('');
}
/* 添加菜单向导：先填名称 → 选类型（表单/流程/任务） → 从已发布素材中多选；一次生成一个菜单，下面挂多个素材。menuId 不为空时为「向已有菜单追加素材」。 */
const ADD_MENU_TYPES={form:{label:'表单',list:()=>FORMS},flow:{label:'流程',list:()=>FLOWS},task:{label:'任务',list:()=>TASKS}};
let _addm={appId:null,parentId:null,menuId:null,name:'',type:'form',query:'',cat:'',sel:[]};
/* 同应用级去重辅助：汇总某应用所有菜单节点已挂载的素材 refId（跨菜单） */
function allAppRefs(a){
  const set=new Set();
  (function walk(list){ for(const n of (list||[])){ if(n.type!=='folder'){ menuItems(n).forEach(it=>{ if(it&&it.refId) set.add(it.refId); }); } if(n.children) walk(n.children); } })(a.menus);
  return set;
}
/* 同应用级去重辅助：菜单名称是否已在应用内重复（整树，trim + 不区分大小写） */
function appMenuNameDup(a,name){
  const t=(name||'').trim().toLowerCase();
  let dup=false;
  (function walk(list){ for(const n of (list||[])){ if((n.name||'').trim().toLowerCase()===t) dup=true; if(n.children) walk(n.children); } })(a.menus);
  return dup;
}
function openAddMenu(appId,parentId,menuId){ _addm={appId,parentId,menuId:menuId||null,name:'',type:'form',query:'',cat:'',sel:[]}; renderAddMenu(); }
function openAppendMenuItem(appId,menuId){
  const a=APPS.find(x=>x.id===appId); if(!a)return;
  const m=findMenu(a,menuId); if(!m||m.type==='folder')return;
  _addm={appId,parentId:null,menuId,name:m.name,type:m.type,query:'',cat:'',sel:[]};
  renderAddMenu();
}
function addMenuAssets(type){ return ADD_MENU_TYPES[type].list().filter(x=>!x.status||x.status==='published'); }
function renderAddMenu(){
  const meta=ADD_MENU_TYPES[_addm.type];
  const locked=_addm.menuId!=null;
  const a=APPS.find(x=>x.id===_addm.appId);
  const existMenu=locked?findMenu(a,_addm.menuId):null;
  const title=locked?`向「${existMenu?existMenu.name:'该菜单'}」追加素材`:(`添加菜单${_addm.parentId?'（到分组）':''}`);
  let items=addMenuAssets(_addm.type);
  const taken=allAppRefs(a); // 同应用内已挂素材（跨菜单）
  items=items.filter(x=>!taken.has(x.id)); // 同应用素材不可重复挂载：清单过滤已挂
  const q=_addm.query.trim().toLowerCase();
  if(q) items=items.filter(x=>x.name.toLowerCase().includes(q));
  if(_addm.cat) items=items.filter(x=>x.cat===_addm.cat);
  const cats=[...new Set(addMenuAssets(_addm.type).map(x=>x.cat).filter(Boolean))];
  const rows=items.map(x=>{
    const on=_addm.sel.includes(x.id);
    return `<div class="picker-row ${on?'am-sel':''}" onclick="pickAddMenu('${x.id}')">
    <div class="flex items-center gap-2">
      <input type="checkbox" class="am-cb" ${on?'checked':''} onclick="event.stopPropagation()" onchange="pickAddMenu('${x.id}')">
      <span class="flex-1">${esc(x.name)}</span>
      ${x.cat?`<span class="text-[11px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">${esc(x.cat)}</span>`:''}
      ${on?'<i class="fas fa-check text-[#165DFF]"></i>':''}
    </div>
    ${x.desc?`<div class="text-[11px] text-gray-400 mt-0.5 pl-6">${esc(x.desc)}</div>`:''}
  </div>`;
  }).join('') || '<div class="text-[12px] text-gray-400 py-2">没有匹配的已发布素材</div>';
  openModal(`<div class="font-bold mb-3">${esc(title)}</div>
    <div class="field"><label>菜单名称</label><input id="am_name" value="${esc(_addm.name)}" ${locked?'disabled style="background:#f7f8fa;color:#86909c;cursor:not-allowed;"':'oninput="amName(this.value)"'}${locked?'':'placeholder="如：岗位职责排查集"'}>
      ${locked?'<div class="text-[11px] text-gray-400 mt-1">追加模式下不可修改菜单名称。</div>':''}
    </div>
    <div class="field"><label>菜单类型</label><select id="am_type" ${locked?'disabled style="background:#f7f8fa;color:#86909c;cursor:not-allowed;"':'onchange="amType(this.value)"'}>
      <option value="form" ${_addm.type==='form'?'selected':''}>表单</option>
      <option value="flow" ${_addm.type==='flow'?'selected':''}>流程</option>
      <option value="task" ${_addm.type==='task'?'selected':''}>任务</option>
    </select></div>
    <div class="field"><label>选择${esc(meta.label)}（已发布，可多选）</label>
      <div class="flex gap-2 mb-2">
        <input placeholder="搜索名称…" value="${esc(_addm.query)}" oninput="amQuery(this.value)" style="flex:1;min-width:0">
        ${cats.length?`<select onchange="amCat(this.value)" style="width:auto"><option value="">全部类型</option>${cats.map(c=>`<option value="${esc(c)}" ${_addm.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`:''}
      </div>
      <div class="max-h-56 overflow-auto space-y-1 border rounded p-1">${rows}</div>
      <div class="text-[11px] text-gray-400 mt-1.5">${locked?`已选 <b class="text-[#165DFF]">${_addm.sel.length}</b> 项：将追加到现有菜单下`: `已选 <b class="text-[#165DFF]">${_addm.sel.length}</b> 项：每个素材将归入新菜单；点击行或勾选复选框均可选中/取消。`}</div>
    </div>
    <div class="flex justify-end gap-2 mt-3"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doAddMenu()">${locked?'追加':'添加'}（${_addm.sel.length}）</button></div>`);
}
function amName(v){_addm.name=v;}
function amType(v){_addm.type=v;_addm.query='';_addm.cat='';_addm.sel=[];renderAddMenu();}
function amQuery(v){_addm.query=v;renderAddMenu();}
function amCat(v){_addm.cat=v;renderAddMenu();}
function pickAddMenu(id){const i=_addm.sel.indexOf(id);if(i>=0)_addm.sel.splice(i,1);else _addm.sel.push(id);renderAddMenu();}
function doAddMenu(){
  const a=APPS.find(x=>x.id===_addm.appId); if(!a)return;
  if(!_addm.sel.length){alert('请至少选择一个'+(ADD_MENU_TYPES[_addm.type].label));return;}
  const newItems=_addm.sel.map(refId=>{
    const ref=ADD_MENU_TYPES[_addm.type].list().find(x=>x.id===refId); if(!ref)return null;
    const it={refId:ref.id};
    if(_addm.type==='form'&&ref.views&&ref.views.length){ it.viewId=ref.views[0].id; it.viewName=ref.views[0].name; }
    return it;
  }).filter(Boolean);
  if(_addm.menuId){
    // 追加到已有菜单
    const m=findMenu(a,_addm.menuId); if(!m){closeModal();return;}
    const exist=menuItems(m);
    const all=exist.concat(newItems);
    // 去重（按 refId）
    const seen=new Set(); const merged=[];
    for(const it of all){ if(seen.has(it.refId)) continue; seen.add(it.refId); merged.push(it); }
    m.items=merged;
  } else {
    const custom=(_addm.name||'').trim();
    if(!custom){alert('请填写菜单名称');return;}
    if(appMenuNameDup(a,custom)){ alert('同一应用下菜单名称「'+custom+'」已存在，请更换名称。'); return; }
    const taken=allAppRefs(a);
    const dupRef=_addm.sel.find(id=>taken.has(id));
    if(dupRef){ const ref=ADD_MENU_TYPES[_addm.type].list().find(x=>x.id===dupRef); alert('素材「'+(ref?ref.name:'')+'」已在当前应用的其他菜单挂载，不能重复挂载。'); return; }
    const node={id:uid('am'),name:custom,type:_addm.type,items:newItems,roleIds:null};
    if(_addm.parentId){ const p=findMenu(a,_addm.parentId); if(!p){closeModal();return;} p.children=p.children||[]; p.children.push(node); }
    else a.menus.push(node);
  }
  closeModal(); render();
}
function delMenuItem(appId,menuId,idx){
  const a=APPS.find(x=>x.id===appId); if(!a)return;
  const m=findMenu(a,menuId); if(!m||m.type==='folder')return;
  const its=menuItems(m);
  if(idx<0||idx>=its.length) return;
  if(!confirm('确认从该菜单移除该素材？')) return;
  if(!Array.isArray(m.items)){ m.items=its; }
  m.items.splice(idx,1);
  render();
}

/* 拖拽排序：菜单可在树内调整顺序/层级 */
let _drag=null;
function dragMenu(appId,id){_drag={appId,id};}
function dropMenu(appId,targetId){
  if(!_drag||_drag.id===targetId)return;
  const a=APPS.find(x=>x.id===appId);
  const dragged=findMenu(a,_drag.id);if(!dragged)return;
  if(dragged.type==='folder'&&isDescendant(dragged,targetId))return;
  detachMenu(a,_drag.id);
  const tgt=findMenu(a,targetId);
  if(tgt.type==='folder'){tgt.children=tgt.children||[];tgt.children.push(dragged);}
  else{const p=findParent(a,targetId);const arr=p?p.children:a.menus;const idx=arr.findIndex(x=>x.id===targetId);arr.splice(idx+1,0,dragged);}
  _drag=null;render();
}
function detachMenu(a,id,list){list=list||a.menus;for(let i=0;i<list.length;i++){if(list[i].id===id){list.splice(i,1);return;}if(list[i].children)detachMenu(a,id,list[i].children);}}
function isDescendant(folder,id,list){list=list||folder.children;if(!list)return false;for(const c of list){if(c.id===id)return true;if(c.children&&isDescendant(c,id,c.children))return true;}return false;}

/* 预览应用 */
function previewApp(appId){
  const a=APPS.find(x=>x.id===appId);
  if(!state.previewMenuId){const lf=firstLeaf(a.menus);state.previewMenuId=lf?lf.id:null;}
  const leaf=state.previewMenuId?findMenu(a,state.previewMenuId):null;
  const typeTag={
    form:'<span class="text-[11px] px-1.5 py-0.5 rounded bg-blue-100 text-blue-600">表单</span>',
    flow:'<span class="text-[11px] px-1.5 py-0.5 rounded bg-[#7c5cff]/10 text-[#7c5cff]">流程</span>',
    task:'<span class="text-[11px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-600">任务</span>'
  };
  const content=leaf?(function(){
    const items=menuItems(leaf);
    const tag=typeTag[leaf.type]||'';
    const cardColor={form:'#165DFF',flow:'#7c5cff',task:'#faad14'};
    const iconFor=t=>t==='form'?'file-alt':(t==='flow'?'project-diagram':'clipboard-list');
    if(!items.length){
      return `<div class="p-1">
        <div class="flex items-center gap-2 mb-2">${tag}<span class="text-[11px] text-gray-400">暂无挂载素材</span></div>
        <div class="text-xl font-bold mb-3">${esc(leaf.name)}</div>
        <div class="border rounded-lg p-6 bg-gray-50 text-center text-gray-400 text-[13px]">该菜单暂无挂载素材，请在应用菜单中编辑添加。</div>
      </div>`;
    }
    const grid=items.map(it=>{
      const rn=refName(leaf.type,it.refId);
      const desc=leaf.type==='task'?'任务中心入口':(leaf.type==='flow'?'流程发起 / 待办入口':'表单数据 / 提单入口');
      const ic=iconFor(leaf.type);
      return `<div class="flex items-center gap-3 px-3 py-3 border rounded-lg bg-white hover:shadow-sm cursor-pointer">
        <span class="icon-box flex-shrink-0" style="background:${cardColor[leaf.type]}22;color:${cardColor[leaf.type]}"><i class="fas ${ic}"></i></span>
        <div class="min-w-0">
          <div class="font-medium text-[14px] truncate">${esc(rn)}</div>
          <div class="text-[11px] text-gray-400 truncate">${esc(leaf.name)}${it.viewName&&it.viewName!=='默认视图'?' · '+esc(it.viewName):''}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="p-1">
      <nav class="text-[12px] text-gray-400 mb-2"><i class="fas fa-layer-group mr-1"></i>当前位置：<span class="text-gray-600">${esc(a.name)}</span> / <span class="text-[#165DFF]">${esc(leaf.name)}</span></nav>
      <div class="flex items-center gap-2 mb-2">${tag}<span class="text-[12px] text-gray-500">共 ${items.length} 项素材</span></div>
      <div class="grid grid-cols-3 gap-3 mt-3">${grid}</div>
      <p class="text-[11px] text-gray-400 mt-3">预览态展示该菜单下挂载的所有素材。运行态由平台按素材自动生成对应入口（如表单数据列表、流程发起/待办、任务中心）。</p>
    </div>`;
  })():'<div class="text-gray-400 text-center py-10">该应用暂无菜单</div>';
  const body=`<div class="flex" style="height:66vh">
    <div class="w-56 border-r p-3 overflow-auto bg-gray-50">
      <div class="text-[12px] font-semibold text-gray-500 mb-2">${esc(a.name)} · 菜单</div>
      ${previewMenuList(a,a.menus)}
    </div>
    <div class="flex-1 p-5 overflow-auto">${content}</div>
  </div>`;
  openPreviewModal(`<div class="flex items-center justify-between mb-2"><h3 class="text-base font-semibold">应用预览 · ${esc(a.name)}</h3><button class="text-gray-400 hover:text-gray-600" onclick="closeModal();state.previewMenuId=null"><i class="fas fa-times"></i></button></div>${body}`);
}
function firstLeaf(menus){for(const m of menus){if(m.type!=='folder')return m;if(m.children){const f=firstLeaf(m.children);if(f)return f;}}return null;}
function previewMenuList(a,menus){
  return menus.map(m=>{
    if(m.type==='folder')return `<div class="mb-1"><div class="text-[12px] font-medium text-gray-500 py-0.5"><i class="fas fa-folder text-amber-500 mr-1"></i>${esc(m.name)}</div><div class="pl-3">${previewMenuList(a,m.children)}</div></div>`;
    const on=state.previewMenuId===m.id;

function openPreviewModal(html){

function delMenu(appId,id){

        <div class="flex items-center justify-between mb-2"><span class="font-semibold text-[13px]">组织架构</span><button class="text-[11px] text-[#165DFF]" onclick="addDept(null)">+ 部门</button></div>

          ${members.map(m=>`<tr class="border-t border-gray-100"><td class="py-1.5 font-medium">${m.name}</td><td class="text-gray-500">${deptName(m.deptId)}</td><td class="text-gray-500">${m.title}</td></tr>`).join('')}

function deptTree(){
  const depts=DEPTS.filter(d=>d.parentId===null);
  return depts.map(d=>{
    const groups=DEPTS.filter(g=>g.parentId===d.id);
    const cnt=MEMBERS.filter(m=>m.deptId===d.id||groups.some(g=>g.id===m.deptId)).length;
    return `<div class="mb-1">
      <div class="flex items-center gap-1 py-1 cursor-pointer ${state.deptId===d.id?'bg-[#eff4ff] rounded px-1':''}" onclick="state.deptId='${d.id}';render()">
        <i class="fas fa-sitemap text-gray-400"></i><span class="font-medium">${d.name}</span><span class="text-[11px] text-gray-400">(${cnt})</span>
        <span class="ml-auto text-[11px] text-[#165DFF]" onclick="event.stopPropagation();addDept('${d.id}')">+小组</span>
      </div>
      <div class="pl-4">${groups.map(g=>{
        const c=MEMBERS.filter(m=>m.deptId===g.id).length;
        return `<div class="flex items-center gap-1 py-0.5 cursor-pointer ${state.deptId===g.id?'bg-[#eff4ff] rounded px-1':''}" onclick="state.deptId='${g.id}';render()"><i class="fas fa-users text-gray-300"></i><span>${g.name}</span><span class="text-[11px] text-gray-400">(${c})</span></div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
}
function addDept(parentId){

  DEPTS.push({id:uid('d'),name,type:parentId?'group':'dept',parentId:parentId||null});
  render();
}

/* renderRolesTab 已并入 renderRolePerm（左侧角色组/角色列表内联），保留空位以免遗漏引用 */
function renderRoleDetail(){
  const r=roleById(state.roleId);

      <div class="flex items-center gap-2 mb-3"><span class="icon-box" style="background:#165DFF22;color:#165DFF">👥</span><div><div class="font-bold">${r.name}</div><div class="text-[11px] text-gray-400">${groupName(findGroupOf(r.id))}</div></div></div>

function addGroup(){const name=prompt('角色组名称');if(!name)return;ROLE_GROUPS.push({id:uid('g'),name,roles:[]});render();}
function addRole(groupId){const name=prompt('角色名称');if(!name)return;ROLE_GROUPS.find(g=>g.id===groupId).roles.push({id:uid('r'),name,memberIds:[],appIds:[]});render();}
function toggleRoleApp(roleId,appId){const r=roleById(roleId);if(r.appIds.includes(appId))r.appIds=r.appIds.filter(x=>x!==appId);else r.appIds.push(appId);render();}
function assignUsers(roleId){
  openModal(`<div class="font-bold mb-3">为「${roleById(roleId).name}」挂用户</div>
   <div class="text-[12px] text-gray-500 mb-2">从组织架构选择用户（可多选）：</div>
   <div class="max-h-64 overflow-auto space-y-1">${DEPTS.map(d=>`<div class="text-[12px] font-semibold text-gray-600 mt-1">${d.name}</div>${MEMBERS.filter(m=>m.deptId===d.id).map(m=>`<label class="flex items-center gap-2 text-[12px] py-0.5"><input type="checkbox" ${roleById(roleId).memberIds.includes(m.id)?'checked':''} value="${m.id}" class="uu"> ${m.name} <span class="text-gray-400">${m.title}</span></label>`).join('')}`).join('')}</div>

function doAssignUsers(roleId){const r=roleById(roleId);r.memberIds=[...document.querySelectorAll('.uu:checked')].map(c=>c.value);closeModal();render();}
function removeUserFromRole(roleId,mid){const r=roleById(roleId);r.memberIds=r.memberIds.filter(x=>x!==mid);render();}

function renderRolePermConfig(r){
  return `<div class="card p-4">
    <div class="font-semibold text-[13px] mb-2">应用与菜单权限（在一处配置）</div>
    <div class="text-[12px] text-gray-500 mb-3">勾选应用 = 第一道门（角色成员可进入）；展开后逐菜单勾选 = 第二道门（该角色可见哪些菜单）。应用与菜单合并配置。</div>
    <div class="space-y-3">
      ${APPS.map(a=>{
        const on=r.appIds.includes(a.id);
        return `<div class="border rounded p-3 ${on?'border-[#165DFF] bg-[#f7faff]':'border-gray-200'}">
          <div class="flex items-center gap-2">
            <input type="checkbox" ${on?'checked':''} onchange="toggleRoleApp('${r.id}','${a.id}')">
            <span class="icon-box" style="background:#165DFF22;color:#165DFF"><i class="fas ${a.icon.name||'fa-th-large'}"></i></span>
            <span class="font-medium">${a.name}</span>
            <span class="text-[11px] text-gray-400">${a.menus.length} 菜单</span>
          </div>
          ${on?`<div class="pl-6 mt-2 space-y-1">${menuPermInline(a,a.menus,r)}</div>`:`<div class="pl-6 mt-2 text-[11px] text-gray-400">未进入该应用，菜单权限暂不生效。</div>`}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function menuVisibleByRole(m,r){
  if(m.roleIds===null) return true;
  return m.roleIds.includes(r.id);
}
function menuPermInline(a,menus,r){
  if(!menus.length) return '<div class="text-[11px] text-gray-400">该应用暂无菜单。</div>';
  return menus.map(m=>{
    if(m.type==='folder') return `<div class="pl-3"><div class="text-[12px] font-medium text-gray-500 py-0.5"><i class="fas fa-folder text-amber-500 mr-1"></i>${esc(m.name)}</div>${menuPermInline(a,m.children,r)}</div>`;
    const vis=menuVisibleByRole(m,r);
    const items=menuItems(m);
    const icon=m.type==='form'?'file-alt':(m.type==='flow'?'project-diagram':'clipboard-list');
    const tag=m.type==='form'?'表单':(m.type==='flow'?'流程':'任务');
    return `<label class="flex items-center gap-2 text-[12px] py-0.5 cursor-pointer ${vis?'text-[#165DFF] font-medium':''}">
      <input type="checkbox" ${vis?'checked':''} onchange="toggleMenuRole('${a.id}','${m.id}','${r.id}')">
      <i class="fas fa-${icon} text-[#165DFF]"></i>${esc(m.name)}
      <span class="text-[11px] text-gray-400">${tag} · ${items.length} 项</span>
    </label>`;
  }).join('');
}
function toggleMenuRole(appId,menuId,roleId){
  const a=APPS.find(x=>x.id===appId);const m=findMenu(a,menuId);
  if(m.roleIds===null)m.roleIds=allRoles().filter(r=>r.appIds.includes(appId)).map(r=>r.id);
  if(m.roleIds.includes(roleId))m.roleIds=m.roleIds.filter(x=>x!==roleId);else m.roleIds.push(roleId);
  render();
}

      <div class="note-card"><span class="note-num">6</span><b>素材来源：</b>表单来自「表单设计器」、流程来自「流程中心」、任务指向「任务中心」，此处仅引用与编排。</div>
      <div class="note-card"><span class="note-num">7</span><b>素材下架与菜单可用性（软下线）：</b>素材（表单/流程/任务）下架后，菜单<b>已挂载该素材的菜单项不受影响、仍可正常进入使用</b>；仅"新增挂载"被阻止（挂载向导只列"已发布"素材，下架素材不可选）。即：<b>下架 = "停止被新引用"，不等于"下线已挂载入口"</b>；已建立的菜单入口继续对终端用户可用。应用本身下架（应用级）则整应用菜单对终端用户隐藏。</div>
      <div class="note-card"><span class="note-num">8</span><b>同应用内去重（限制仅在同一应用内生效）：</b>① 同一应用下<b>菜单名称不可重复</b>（含分组 / 子菜单，整树唯一；<b>不同应用之间菜单名可重复</b>）；② 同一应用下<b>素材不可重复挂载</b>——一个素材（refId）一旦挂到该应用的任一菜单，<b>不能再挂到该应用的其他菜单</b>（同菜单二次追加亦不可）；但<b>同一素材可挂载到不同应用的菜单下</b>。挂载向导的素材清单按"当前应用已挂素材"自动过滤，保存时遇同名菜单 / 重复素材拦截并提示。</div>
      <div class="note-card"><span class="note-num">9</span><b>字段字符长度限制（通用规则）：</b>所有「名称类」字段统一上限 <b>20 个字符</b>、「描述类」字段统一上限 <b>500 个字符</b>，超出即禁止继续输入（前端 maxlength 硬限制 + 后端校验，保存时若超限提示「{字段}不可超过 N 字」）。本模块适用：应用<b>名称 ≤ 20</b> 字 / 应用<b>描述 ≤ 500</b> 字 / 新建<b>分组（含子分组）名称 ≤ 20</b> 字 / 挂载<b>菜单名称 ≤ 20</b> 字。</div>`;
  }else if(state.module==='user'){
    n.innerHTML=`<div class="font-bold text-[13px] text-gray-700 mb-2">逻辑备注 · 用户管理</div>
      <div class="note-card"><span class="note-num">1</span><b>唯一用户源：</b>用户由租户管理员在此导入/创建，<b>全租户所有应用共用，只建一次</b>。</div>
      <div class="note-card"><span class="note-num">2</span><b>组织架构：</b>部门 → 小组 → 成员，是授权的组织维度，可在授权时按部门选择。</div>
      <div class="note-card"><span class="note-num">3</span><b>与角色解耦：</b>此处只管"有哪些人、在什么组织"，不在此分配权限；权限在「角色权限管理」通过角色关联。</div>`;
  }else{
    n.innerHTML=`<div class="font-bold text-[13px] text-gray-700 mb-2">逻辑备注 · 角色权限管理</div>
      <div class="note-card"><span class="note-num">1</span><b>角色组→角色→用户：</b>先建角色组（分类），组内建角色，角色下挂用户（从组织架构选）。</div>
      <div class="note-card"><span class="note-num">2</span><b>单页配置：</b>选中角色后，同页内点「挂用户」与「配置应用与菜单权限」两个按钮，无需切换页签。</div>
      <div class="note-card"><span class="note-num">3</span><b>应用与菜单合并：</b>同一角色下，勾选应用即第一道门（可进入），展开后逐菜单勾选即第二道门（可见菜单），两道门在一处完成。</div>
      <div class="note-card"><span class="note-num">4</span><b>权限唯一入口：</b>所有访问控制集中在此模块，应用中心/用户管理均不触碰权限。</div>`;
  }
}

<script>
(function(){
  var MODULES={
    form:{iframe:document.getElementById('iframe-form'),tpl:'mod-form-full',loaded:false},
    flow:{iframe:document.getElementById('iframe-flow'),tpl:'mod-flow-full',loaded:false},
    app:{iframe:document.getElementById('iframe-app'),tpl:'mod-gov-full',loaded:false,hash:'app'},
    user:{iframe:document.getElementById('iframe-user'),tpl:'mod-gov-full',loaded:false,hash:'user'},
    tenant:{iframe:document.getElementById('iframe-tenant'),tpl:'mod-gov-full',loaded:false,hash:'role'}
  };
  window.switchModule=function(key){
    for(var k in MODULES){ MODULES[k].iframe.style.display='none'; }
    var m=MODULES[key];
    m.iframe.style.display='block';
    if(!m.loaded){
      var raw=document.getElementById(m.tpl).textContent;
      var html=raw.replace(/___SCEND___/g,'<\/script>');
      m.url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
      m.loaded=true;
    }
    var target=m.url+(m.hash?('#'+m.hash):'');
    if(m.iframe.getAttribute('src')!==target) m.iframe.src=target;
    var items=document.querySelectorAll('.topnav-item');
    for(var i=0;i<items.length;i++){
      items[i].classList.toggle('active', items[i].dataset.mod===key);
    }
  };
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='switch' && MODULES[e.data.mod]){
      switchModule(e.data.mod);
    }
  });
  setTimeout(function(){ switchModule('form'); }, 30);
})();
</script>
