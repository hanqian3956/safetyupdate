              <div><h3 class="text-sm font-semibold text-gray-800">控件库分类</h3>

              <div><h3 class="text-sm font-semibold text-gray-800">画布：排序 & 宽度占位</h3>
                <p class="text-xs text-gray-500 mt-1">12 栅格布局，<b>拖动卡片改顺序</b>、宽度定占位；<b>切换画布宽度即时可视</b>。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="4">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">4</span>
              <div><h3 class="text-sm font-semibold text-gray-800">配置面板：仅「基础信息」+「列表与交互」</h3>
                <p class="text-xs text-gray-500 mt-1">单一<b>表单配置</b>面板仅保留<b>一·基础信息</b>与<b>二·列表与交互</b>两项；选中字段下钻<b>控件配置</b>：一行一项、说明收进 ⓘ 悬停，<b>字段名自动生成、不可手改</b>。</p></div></div>
          </div>
          <div class="proto-desc p-3">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-400 text-white rounded-full text-xs font-bold flex items-center justify-center">5</span>
              <div><h3 class="text-sm font-semibold text-gray-800">控件配置面板结构 + 默认值后置</h3>
                <p class="text-xs text-gray-500 mt-1 leading-relaxed">字段配置固定五段：<b>基础</b>（标题 / 字段名 / 帮助说明）→ <b>布局</b>（宽度 / 标签位置与对齐）→ <b>字段属性</b>（必填 / 字段权限 / 显示条件）→ <b>组件专属</b> → <b>默认值</b>。<b>必填</b>为单个复选框，<b>字段权限</b>为「只读 / 可编辑」二选一。<b>默认值排在决定其候选或格式的配置项之后</b>（单行文本：输入格式与长度之后；成员 / 部门：选择范围之后），依赖项未选时默认值置灰。默认值方式支持手动、公式、当前用户、当前日期、数据联动。</p></div></div>
          </div>
          <div class="proto-desc p-3">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-400 text-white rounded-full text-xs font-bold flex items-center justify-center">6</span>
              <div><h3 class="text-sm font-semibold text-gray-800">显示条件 = 条件构造器</h3>
                <p class="text-xs text-gray-500 mt-1">选「满足条件时显示」展开<b>条件构造器</b>（多条件 + 且/或）；隐藏时字段不参与必填与格式校验，提交值为空。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="7">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">7</span>
              <div><h3 class="text-sm font-semibold text-gray-800">表单状态机：草稿 ↔ 已发布</h3>
                <p class="text-xs text-gray-500 mt-1"><b>草稿↔已发布</b>状态机：发布快照锁定版本全员可提交，下架保留历史数据，改后需再发布生效。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="8">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">8</span>
              <div><h3 class="text-sm font-semibold text-gray-800">版本管理 + 表锁定</h3>
                <p class="text-xs text-gray-500 mt-1">每次发布生成<b>不可变版本</b>（可点击<b>查看</b>在画布上展示该版本字段结构）；<b>恢复并发布</b>以该版本内容重新上线、版本号不变；<b>表锁定</b>按提交时 schema 渲染历史数据，改版不扰乱在途流程。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="9">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">9</span>
              <div><h3 class="text-sm font-semibold text-gray-800">最终结论 · 工作表单与组件开发逻辑</h3>
                <p class="text-xs text-gray-500 mt-1 leading-relaxed">以下为与产品确认后的<b>最终开发逻辑</b>（供开发直接参照）：</p>
                <div class="text-xs text-gray-600 mt-2 space-y-2">
                  <p><b>① 工作表单删除保护：</b>被任一「应用菜单 / 流程任务」引用的表单，删除时<b>拦截并提示"此表单已被引用，不可删除"</b>；仅「无引用」的草稿表单允许删除。解除引用须在对应菜单/流程配置处操作。</p>
                  <p><b>② 工作表单状态与版本号（核心规则）：</b></p>
                  <p class="pl-3">· 三种状态：<b>草稿（未发布）</b> / <b>草稿（已下架）</b>（曾发布后下架）/ <b>已发布（vN）</b>。</p>
                  <p class="pl-3">· <b>版本号变化规则</b>：首次发布生成 <b>v1</b>；后续发布时，将「本次内容与<b>上一个线上版本快照</b>」做全量比对——<b>内容有任意变化 → 版本号 +1</b>；<b>编辑后内容与原线上版本完全相同（无丝毫变化）→ 版本号保持不变</b>，仅刷新发布信息；历史版本可「恢复并发布」以该版本内容重新上线，<b>版本号保持原值</b>。</p>
                  <p class="pl-3">· <b>表单名称全局唯一</b>：发布时校验重名，重复则提示"表单名称需唯一"。</p>
                  <p class="pl-3">· <b>表锁定</b>：每条提交数据记录提交时刻的版本号，历史数据按当时 schema 渲染，改版不扰乱在途流程。</p>
                  <p><b>③ 控件默认值位置（部分控件移至专属配置）：</b>以下控件默认值<b>不放在通用配置</b>，改在<b>专属配置</b>维护——<b>成员 / @部门 / @工作表单 / @动态号</b>：放在「选择范围」下方（默认候选受范围约束）；<b>地址</b>：放在「类型」下方（按所选类型做省/市/区/详细级联）；<b>单选按钮组 / 多选按钮组 / 下拉多选</b>：放在「校验失败提示」上方（候选取决于「选项来源」，见 ⑥）。其余控件默认值仍在<b>通用配置</b>。</p>
                  <p><b>④ 工作表单数据列表（设计者自查）：</b>通过「工作表单 · 数据」进入的数据列表为只读自查，<b>不展示新增 / 导入按钮</b>，且<b>不展示预览视图选择器</b>。</p>
                  <p><b>⑤ 列表创建时间：</b>统一格式为 <b>YYYY-MM-DD HH:mm</b>（如 2025-10-16 11:18）。</p>
                  <p><b>⑥ 选项类控件「选项来源」：</b>适用<b>下拉单选 / 单选按钮组 / 多选按钮组 / 下拉多选</b>。选项来源为<b>数据字典 / 远程 API</b> 时，<b>隐藏静态「选项列表」</b>——运行态动态加载，<b>取到什么就是什么，设计态不可再编辑</b>；仅"静态录入"时维护选项列表。<b>默认值候选同步随来源变化</b>：静态录入 → 从选项列表点选；数据字典 → 从所选字典的字典项点选；远程 API → 运行态动态加载、设计态无法枚举，需手写接口返回的 value。<b>切换「选项来源」或「数据字典」会清空已设默认值</b>（候选已变，旧值失效）。</p>
                  <p><b>⑦ 表单画布：</b>设计器工具组去掉 <b>Schema</b> 按钮（Schema 仍可在版本/导出等渠道查看）。</p>
                  <p><b>⑧ 工作表单数据无状态 / 无暂存：</b>工作表单提交后<b>不进入审批流程</b>，故数据列表<b>无审批状态（无审批中 / 已通过 / 已驳回 等）</b>，列表仅展示「表单字段 + 提交人 + 提交时间」；同时<b>不展示「草稿 / 暂存」类记录</b>，未正式提交的暂存草稿不进入数据列表。</p>
                  <p><b>⑨ 表单下架语义（软下线 · 仅阻止新增引用）：</b>下架不改变任何"已建立关系"——已 1:1 绑定该表单的流程<b>仍可正常发起并填表</b>，已将该表单挂载为菜单素材的菜单项<b>仍可正常进入并提交</b>，已发起实例与已提交数据<b>不受影响、保留可查</b>；下架仅阻止"新增引用"：下架后<b>不能再被新流程绑定、不能再被新应用菜单挂载</b>（挂载向导只列"已发布"素材，下架素材天然不可选）；表单自身状态回退"草稿（已下架）"但仍保留历史版本快照可查，可重新「发布」上线。下架横幅文案：「表单『{名称}』已下架。已绑定该表单的流程、已挂载的菜单仍可正常使用；不再接受新的流程绑定与菜单挂载。历史版本（v1…vN）保留可查，可重新发布上线。」</p>
                  <p><b>⑩ 字段字符长度限制（通用规则）：</b>所有「名称类」字段统一上限 <b>20 个字符</b>、「描述类」字段统一上限 <b>500 个字符</b>，超出即禁止继续输入（前端 maxlength 硬限制 + 后端校验，保存 / 发布时若超限提示「{字段}不可超过 N 字」）。本模块适用：表单<b>名称 ≤ 20</b> 字、表单<b>描述 ≤ 500</b> 字。</p>
                  <p><b>⑪ 多级查询「选项来源」：</b>多级查询的选项是<b>一棵树</b>（第 N 级候选取决于第 N-1 级选了什么），故单独配置。选项来源同样三选一：<b>静态录入</b>——设计态用树形编辑器维护一棵树（缩进表示层级，可增删父子级）；<b>数据字典</b>——选<b>树形字典</b>（行政区划 / 组织架构 / 商品分类），与单选、多选用的<b>扁平字典区分</b>，选定后只读展示该树并自动带出各级名称；<b>远程 API</b>——「一次性返回整树」或「按上级 value 逐级查询」（后者覆盖末级是业务数据的场景，如 大区 → 门店），设计态不维护静态选项。<b>「显示级数」= 从这棵树里截取前 N 级</b>；「各级名称」只是显示名 / 占位文字。<b>默认值是一条路径</b>（如 广东省 / 深圳市 / 南山区），候选随来源变化，远程 API 需手写路径。切换「选项来源 / 树形字典 / 显示级数」会清空已设默认值。</p>
                </div>
              </div>
            </div>
          </div>

     详细地址单独作为一个输入框。设计态配置(scope='cfg')与运行态预览(scope='pv')复用同一套渲染。
     「显示层级」由 addrType 决定（省 / 省-市 / 省-市-区 / 省-市-区-详细地址），向下兼容旧的 addrShow 字段。 */
  const ADDR_TYPES = [['province','省'],['province_city','省-市'],['province_city_district','省-市-区'],['full','省-市-区-详细地址']];
  function addrShowFor(type){
    return {
      province: type==='province'||type==='province_city'||type==='province_city_district'||type==='full',
      city:     type==='province_city'||type==='province_city_district'||type==='full',
      district: type==='province_city_district'||type==='full',
      detail:   type==='full'
    };
  }
  function getAddrShow(f){
    if(f.addrType) return addrShowFor(f.addrType);
    const af=f.addrShow||{};
    return {province:!!af.province, city:!!af.city, district:!!af.district, detail:!!af.detail};
  }
  const _addrCasOpen = {};            // open 状态：key = scope+'_'+fieldId
  let _addrCasDocInit = false;
  function addrDefaultObj(f){
    const dv=(f.defaultType==='manual' && f.defaultValue && typeof f.defaultValue==='object' && !Array.isArray(f.defaultValue)) ? f.defaultValue : {};
    return {province:dv.province||'', city:dv.city||'', district:dv.district||'', detail:dv.detail||''};
  }
  function setAddrDefault(f,key,val){
    if(!f) return;
    const dv=addrDefaultObj(f);
    dv[key]=val;
    if(key==='province'){ dv.city=''; dv.district=''; }
    if(key==='city'){ dv.district=''; }
    f.defaultValue=dv;
  }

  /* ===================== 状态 / 版本 辅助 ===================== */
  function currentForm(){ return currentFormId ? SAMPLE_FORMS.find(x=>x.id===currentFormId) : null; }
  function todayStr(){ const d=new Date(); const p=n=>(''+n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  /* 列表「创建时间」统一格式为 YYYY-MM-DD HH:mm；纯日期自动补 00:00，已含时分则保持 */
  function fmtDateTime(s){ if(!s) return '—'; s=String(s); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s+' 00:00' : s; }
  function statusInfo(f){
    if(f.status==='已发布') return { label:'已发布 v'+f.version, cls:'bg-green-100 text-green-600' };
    if(f.version>0) return { label:'草稿（已下架）', cls:'bg-gray-200 text-gray-600' };
    return { label:'草稿（未发布）', cls:'bg-amber-100 text-amber-600' };
  }
  /* 根据当前表单状态刷新设计器顶部状态药丸 / 版本 / 发布·下架按钮 / 横幅 */
  function refreshDesignerChrome(){
    const pill=document.getElementById('statusPill'), vp=document.getElementById('versionPill');
    const pub=document.getElementById('publishBtn'), unp=document.getElementById('unpublishBtn'), banner=document.getElementById('stateBanner');
    if(!pill) return;
    if(formViewingVersion) return; /* 历史版本查看态：保持只读横幅，不覆盖 */
    const f=currentForm();
    if(!f){
      pill.textContent='草稿（未保存）'; pill.className='status-pill px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700 whitespace-nowrap';
      vp.textContent='v0'; vp.className='version-pill px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-500 whitespace-nowrap';
      pub.classList.remove('hidden'); unp.classList.add('hidden'); banner.style.display='none';
      pub.innerHTML='<i class="fas fa-rocket mr-1"></i>发布'; return;
    }
    const si=statusInfo(f);
    pill.textContent=si.label; pill.className='status-pill px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap '+si.cls;
    vp.textContent='v'+f.version;
    const published = f.status==='已发布';
    pub.classList.toggle('hidden', published && !f.hasUnpublished);
    unp.classList.toggle('hidden', !published);
    pub.innerHTML = (published && f.hasUnpublished) ? '<i class="fas fa-rocket mr-1"></i>发布新版本' : '<i class="fas fa-rocket mr-1"></i>发布';
    if(published && f.hasUnpublished){
      banner.style.display='flex';
      banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-amber-50 text-amber-700';
      banner.innerHTML='<i class="fas fa-exclamation-triangle"></i> 本表单已发布（线上 <b>v'+f.version+'</b>），当前为<b>待发布修改</b>。点击「发布」生成 <b>v'+(f.version+1)+'</b> 并生效，已提交数据不受影响。';
    } else if(!published && f.version>0){
      banner.style.display='flex';
      banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-gray-50 text-gray-600';
      banner.innerHTML='<i class="fas fa-eye-slash"></i> 表单已下架，当前为<b>草稿</b>，不再接收提交；历史数据（v1…v'+f.version+'）保留可查。点击「发布」可重新上线为新版本。';
    } else { banner.style.display='none'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200'; banner.innerHTML=''; }
  }

        ${f.status==='已发布'

  /* ===================== 控件面板 ===================== */
  function renderPalette(){

  /* ===================== 字段增删 / 排序 ===================== */
  function addFieldAt(type, index){
    const d=CONTROL_DEFS[type];
    const f=Object.assign({ id:nid(), type, label:d.label, fieldName:genFieldName(type), span:12, required:false, helpText:'', visible:{mode:'always',logic:'and',conditions:[{field:'',op:'eq',value:''}]} }, d.defaults());
    let idx = (index==null)?fields.length:index;
    if(idx<0) idx=0; if(idx>fields.length) idx=fields.length;
    fields.splice(idx,0,f); selectedId=f.id;
    renderCanvas(); renderConfig();
  }
  function moveField(id, toIndex){
    const from = fields.findIndex(f=>f.id===id); if(from<0) return;
    const [item]=fields.splice(from,1);
    let idx=toIndex; if(idx>from) idx--;
    if(idx<0) idx=0; if(idx>fields.length) idx=fields.length;
    fields.splice(idx,0,item); selectedId=id; selectedSub=null;
    renderCanvas(); renderConfig();
  }
  function deleteField(id){
    fields=fields.filter(f=>f.id!==id);
    if(selectedId===id) selectedId=null;
    if(selectedSub && selectedSub.fid===id) selectedSub=null;
    renderCanvas(); renderConfig();
  }
  function selectField(id){ selectedId=id; selectedSub=null; renderCanvas(); renderConfig(); }
  function deselectField(){ selectedId=null; selectedSub=null; renderCanvas(); renderConfig(); }

  /* ===================== 子表单列（子组件）辅助 ===================== */
  function subFieldId(){ return 'sf' + (Date.now().toString(36)) + '_' + (_subSeq++); }
  function findSubField(sel){
    if(!sel) return null;
    const p=fields.find(x=>x.id===sel.fid); if(!p) return null;
    return (p.subFields||[]).find(s=>s.id===sel.subId)||null;
  }
  /* 当前正在配置的对象：优先子表单列（子组件），否则为选中的顶层字段 */
  function activeField(){
    return findSubField(selectedSub) || fields.find(x=>x.id===selectedId) || null;
  }
  /* 子表单列沿用统一字段名规则，与普通组件保持一致。 */
  function genSubFieldName(pf, label, type){
    return genFieldName(type);
  }
  /* 兼容旧数据：补齐列的 id / 字段名 / 类型默认属性（幂等） */
  function ensureSubCols(pf){
    if(!pf || pf.type!=='subform') return;
    pf.subFields = pf.subFields||[];
    pf.subFields.forEach(s=>{
      if(!s.id) s.id=subFieldId();
      if(!s.type) s.type='text';
      /* 旧「日期」列统一走日期时间组件（默认只到天），配置项才完整 */
      if(s.type==='date'){ s.type='datetime'; if(!s.dateType) s.dateType='date'; }
      if(!s.fieldName) s.fieldName=genSubFieldName(pf, s.label, s.type);
      if(['select','multiselect','radio','checkbox'].indexOf(s.type)>=0 && !(s.options&&s.options.length)){
        s.options=[{value:'opt1',label:'选项1'},{value:'opt2',label:'选项2'}];
      }
      if(s.type==='multiselect' && !Array.isArray(s.defaultValue)) s.defaultValue=[];
      if(s.type==='datetime' && !s.dateType) s.dateType='datetime';
      if(s.type==='datetime' && !s.format){
        s.format = s.dateType==='date' ? 'YYYY-MM-DD' : (s.dateType==='time' ? 'HH:mm' : 'YYYY-MM-DD HH:mm');
      }
    });
  }
  function selectSubCol(fid, subId){
    const pf=fields.find(x=>x.id===fid); if(!pf) return;
    ensureSubCols(pf);
    if(!(pf.subFields||[]).some(s=>s.id===subId)) return;
    selectedId=fid; selectedSub={fid:fid, subId:subId};
    renderCanvas(); renderConfig();
  }
  function backToSubform(fid){
    selectedSub=null;
    selectedId=fid||selectedId;
    renderCanvas(); renderConfig();
  }

  /* ===================== 拖拽（新增 + 排序） ===================== */
  let dragPayload=null, dropIndex=null;
  function onCtrlDragStart(e,type){ dragPayload={kind:'new',type}; e.dataTransfer.effectAllowed='copy'; e.dataTransfer.setData('text/plain',type); }
  function onFieldDragStart(e,id){ dragPayload={kind:'move',id}; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id); }
  function onCanvasDragOver(e){
    if(formViewingVersion) return;
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
    document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
    // 子表单内部不再接受拖放（新增列请用「添加列」）
    if(e.target.closest('[data-subform]')){ dropIndex=null; return; }
    const card=e.target.closest('.field-card');
    if(card){
      const r=card.getBoundingClientRect();
      const after = e.clientY > r.top + r.height/2;
      card.classList.add(after?'drop-after':'drop-before');
      const idx=fields.findIndex(f=>f.id===card.dataset.id);
      dropIndex = after ? idx+1 : idx;
    } else { dropIndex = fields.length; }
    document.getElementById('canvas').classList.add('canvas-dragover');
  }
  function onCanvasDragLeave(e){ document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('drop-before','drop-after')); document.querySelectorAll('.subform-dragover').forEach(s=>s.classList.remove('subform-dragover')); document.getElementById('canvas').classList.remove('canvas-dragover'); }
  function onCanvasDrop(e){
    if(formViewingVersion) return;
    e.preventDefault();
    document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
    document.querySelectorAll('.subform-dragover').forEach(s=>s.classList.remove('subform-dragover'));
    document.getElementById('canvas').classList.remove('canvas-dragover');
    if(e.target.closest('[data-subform]')){ dragPayload=null; dropIndex=null; return; }
    const p=dragPayload; dragPayload=null;
    if(!p) return;
    if(p.kind==='new') addFieldAt(p.type, dropIndex==null?fields.length:dropIndex);
    else if(p.kind==='move') moveField(p.id, dropIndex==null?fields.length:dropIndex);
    dropIndex=null;
  }
  /* 子表单：通过「添加列」选择列类型，不再支持把控件拖入子表单 */
  /* 可作为子表单列的组件（分隔线、子表单本身不适合作为列，未列入） */
  const SUB_COL_GROUPS = [
    { name:'基础', items:[
      ['text','单行文本'], ['textarea','多行文本'], ['number','数字'], ['datetime','日期时间']
    ]},
    { name:'选择', items:[

  /* 「添加列」下拉菜单：按钮下方弹出竖向类型列表（超出高度可滚动），点击即添加 */

  function addSubCol(fid, type){
    const f=fields.find(x=>x.id===fid); if(!f) return;
    if(type==='date') type='datetime';   /* 旧别名 → 日期时间 */
    const labelMap={ text:'文本列', textarea:'多行列', number:'数字列', datetime:'日期列',
      radio:'单选列', checkbox:'多选列', select:'下拉列', multiselect:'多选下拉列',
      cascader:'级联列', address:'地址列', signature:'签名列', image:'图片列', attachment:'附件列',
      location:'定位列', autonumber:'编号列', member:'成员列', dept:'部门列', formref:'表单列', feed:'动态列' };
    const base=labelMap[type]||'新列';
    f.subFields=f.subFields||[];
    let label=base, n=2;
    while(f.subFields.some(s=>s.label===label)){ label=base+n; n++; }
    /* 用该类型组件的默认属性初始化，保证子列一上来就有完整默认配置 */
    const d=(CONTROL_DEFS[type] && CONTROL_DEFS[type].defaults) ? CONTROL_DEFS[type].defaults() : {};
    const col=Object.assign({}, d, { id:subFieldId(), label:label, type:type });
    /* 子列由子表单统一排版，不保留布局类属性 */
    delete col.span; delete col.labelPos; delete col.labelAlign; delete col.labelWidth;
    col.fieldName=genSubFieldName(f, label, type);
    if(['select','multiselect','radio','checkbox'].indexOf(type)>=0 && !(col.options&&col.options.length)){
      col.options=[{value:'opt1',label:'选项1'},{value:'opt2',label:'选项2'}];
    }
    f.subFields.push(col);

  /* ===================== 数据联动 ===================== */
  const LK_OPS=[['eq','等于'],['ne','不等于'],['contains','包含'],['ncontains','不包含'],['empty','为空'],['notempty','不为空']];
  function lkNoValue(op){ return op==='empty'||op==='notempty'; }
  /* 字段类型简写标记（模仿参考稿：方框内一个字母） */
  function lkFieldChar(type){
    const m={text:'T',textarea:'¶',number:'#',select:'▾',radio:'◉',checkbox:'☑',multiselect:'▤',datetime:'日',member:'人',dept:'部',formref:'表',feed:'圈',address:'址',cascader:'级',subform:'副',divider:'—',signature:'签',image:'图',attachment:'附',location:'位',autonumber:'编'};
    return m[type]||'A';
  }
  function lkBlankCond(){ return {refField:'',op:'eq',valType:'field',localField:'',value:''}; }
  /* 联动配置有两处：默认值来源（f.linkage）与选项来源（f.sourceLinkage），共用同一个弹窗 */
  let lkTarget='default';
  function lkSlot(f){
    if(lkTarget==='source'){
      if(!f.sourceLinkage) f.sourceLinkage={formId:'',formName:'',logic:'all',conditions:[],returnField:''};
      return f.sourceLinkage;
    }
    if(!f.linkage) f.linkage={formId:'',formName:'',logic:'all',conditions:[lkBlankCond()],returnField:''};
    return f.linkage;
  }
  function lkEnsure(f){
    const lk=lkSlot(f);
    if(!lk.logic) lk.logic='all';
    if(!lk.conditions) lk.conditions=[];
    // 默认值联动：必须有条件（要定位到具体一条记录）；选项来源：条件可选，允许 0 条
    if(!lk.conditions.length && lkTarget!=='source') lk.conditions=[lkBlankCond()];
    lk.conditions.forEach(c=>{
      if(!c.op)c.op='eq';
      // 选项来源联动仅支持字段与字段比对，不提供固定值条件。
      if(lkTarget==='source'){ c.valType='field'; c.value=''; }
      else if(!c.valType)c.valType='field';
    });
    return lk;
  }
  function lkLayout(){
    const formBlk=document.getElementById('lkFormBlock'),
          condBlk=document.getElementById('lkCondBlock'),
          fieldBlk=document.getElementById('lkFieldBlock');
    if(!formBlk||!condBlk||!fieldBlk) return;
    if(lkTarget==='source'){          // 选项来源：表单 → 字段 → （可选）过滤条件
      formBlk.after(fieldBlk);
      fieldBlk.after(condBlk);
    } else {                          // 默认值：表单 → 条件 → 触发联动
      formBlk.after(condBlk);
      condBlk.after(fieldBlk);
    }
  }
  function openLinkage(target){

  function renderLinkageConditions(lk){
    const wrap=document.getElementById('lkConditions');

      const tail = noval
        ? `<div class="lk-inputwrap"><span class="lk-icon">T</span><input class="lk-input hasicon" placeholder="无需填写" disabled></div>`
        : vt==='value'
        ? `<div class="lk-inputwrap"><span class="lk-icon">T</span><input id="lk_val_${i}" class="lk-input hasicon" value="${cfg2Esc(c.value||'')}" placeholder="请输入值"></div>`

        <div class="lk-inputwrap"><span class="lk-icon">A</span><select id="lk_local_${i}" class="lk-input hasicon" onchange="onLinkageChange()">${myOpts}</select></div>
        <select id="lk_op_${i}" class="lk-op" onchange="onLinkageChange()">${LK_OPS.map(o=>`<option value="${o[0]}" ${op===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
        ${isSource ? '' : `<select id="lk_vt_${i}" class="lk-input" style="width:76px;flex:none" ${noval?'disabled':''} onchange="onLinkageChange()"><option value="field" ${vt!=='value'?'selected':''}>字段</option><option value="value" ${vt==='value'?'selected':''}>固定值</option></select>`}

    conds.forEach((c,i)=>{
      const r=document.getElementById('lk_ref_'+i), o=document.getElementById('lk_op_'+i),
            v=document.getElementById('lk_vt_'+i), l=document.getElementById('lk_local_'+i),
            val=document.getElementById('lk_val_'+i);

      if(o&&o.value) c.op=o.value;
      if(isSource) c.valType='field';
      else if(v&&v.value) c.valType=v.value;
      if(l&&l.value) c.localField=l.value;
      if(val) c.value=val.value;
    });
  }
  function renderLinkageReturn(lk){

  /* 切换联动表单：关联字段候选变化，清空已选关联字段与带出字段 */

  function renderSnapshotCanvas(s, wrap, empty){

    const labelPos=(s.fc&&s.fc.labelPos)||'top';

        ? `<div class="flex items-start gap-3 pointer-events-none"><label class="label-cell text-sm font-medium text-gray-700" style="width:120px;flex:none;text-align:left;padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.label}${req}</label><div class="flex-1 min-w-0">${preview}${help}</div></div>`
        : `<div class="pointer-events-none"><label class="block text-sm font-medium text-gray-700 mb-1">${f.label}${req}</label><div>${preview}${help}</div></div>`;

  function snapshotFormView(){

  function previewHTML(f){
    if(f.type==='text'){
      const fmt = f.format&&f.format!=='none' ? `（${FORMATS[f.format]}）` : '';

  /* ---- 数据可见范围：默认范围 + 按角色覆盖（规则仅含数据条件，角色由覆盖层指定） ---- */
  const VIS_OPTS=[['creator','仅创建人'],['dept','同部门'],['deptSub','同部门及下级'],['all','全部数据'],['rule','自定义规则（引用登录人属性）']];
  const LOGIN_ATTRS=[['role','登录人.角色'],['region','登录人.区域'],['dept','登录人.部门']];

  function loginAttrOpts(sel){

  }
  function dvRuleCfg(key,c){ if(!c.visibleRulesMap) c.visibleRulesMap={}; if(!c.visibleRulesMap[key]) c.visibleRulesMap[key]={dataLogic:'and',data:[{field:'',op:'=',valType:'value',val:''}],fallback:'none'}; return c.visibleRulesMap[key]; }

        + `<select onchange="dvValType('${key}',${j},this.value)" class="form-input w-24 text-xs py-1"><option value="value" ${cond.valType!=='login'?'selected':''}>值</option><option value="login" ${cond.valType==='login'?'selected':''}>登录人属性</option></select>`
        + right

        + `</div>`;
    });
    const fb = `<div class="flex items-center gap-2 mt-1 text-xs text-gray-500">兜底（该范围数据均不满足下列数据条件时）：<select onchange="dvFallback('${key}',this.value)" class="form-input w-32 text-xs py-1"><option value=value ${cfg.fallback==='none'?'selected':''}>不可见</option><option value="creator" ${cfg.fallback==='creator'?'selected':''}>仅创建人</option><option value="all" ${cfg.fallback==='all'?'selected':''}>全部可见</option></select></div>`;
    return `<div class="border rounded-md p-2 mt-1 bg-gray-50">`

  function dvCondAdd(key){ dvRuleCfg(key,formConfig).data.push({field:'',op:'=',valType:'value',val:''}); renderConfig(); }

  function dvVal(key,j,v){ dvRuleCfg(key,formConfig).data[j].val=v; }
  function dvValAttr(key,j,v){ dvRuleCfg(key,formConfig).data[j].valAttr=v; }
  function dvLogic(key,v){ dvRuleCfg(key,formConfig).dataLogic=v; renderConfig(); }
  function dvFallback(key,v){ dvRuleCfg(key,formConfig).fallback=v; }
  const ROLE_GROUPS=[{name:'管理层',roles:['管理员','部门负责人']},{name:'业务岗',roles:['普通员工','财务审核','HRBP','审批人']}];
  let dvCurrentRole='__global__';
  let dvCollapsed={};
  function dvIsConf(c,r){ return r==='__global__' ? true : !!(c.visibleRoles && c.visibleRoles[r]); }
  function dvNode(key,label,active,isGlobal,conf){
    let dot = isGlobal ? '<span class="w-2 h-2 rounded-full bg-[#EF9F27] inline-block mr-1"></span>'
             : conf ? '<span class="w-2 h-2 rounded-full bg-[#165DFF] inline-block mr-1"></span>'

  }
  function dvTree(c){
    let t='';
    t += dvNode('__global__','全局默认（所有角色）', dvCurrentRole==='__global__', true, true);
    ROLE_GROUPS.forEach(function(g){
      const open = !dvCollapsed[g.name];
      t += `<div class="flex items-center gap-1 px-1 py-1 cursor-pointer select-none" onclick="dvToggleGroup('${g.name}')"><span class="text-gray-400 text-xs w-3">${open?'\u25BE':'\u25B8'}</span><span class="text-xs font-medium text-gray-600">${g.name}</span></div>`;
      if(open){ g.roles.forEach(function(r){ t += dvNode(r, r, dvCurrentRole===r, false, dvIsConf(c,r)); }); }

  }
  function dvSelectRole(r){ dvCurrentRole=r; renderConfig(); }

  function dvScopeSelect(tab, c){
    const isRole = tab!=='__global__';
    let val = isRole ? ((c.visibleRoles&&c.visibleRoles[tab])||'__inherit__') : (c.visibleDefault||'all');
    const opts = (isRole?`<option value="__inherit__" ${val==='__inherit__'?'selected':''}>继承全局</option>`:'')
      + VIS_OPTS.map(o=>`<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('');
    let html = `<select onchange="dvSetScope('${tab}',this.value)" class="form-input border border-gray-300 rounded-md px-2 py-1 text-xs w-full">${opts}</select>`;
    if(val==='rule') html += isRole ? dvRuleFor(tab, c) : dvRuleFor('__default__', c);

    return html;

  function dvSetScope(tab, val){
    const c=formConfig;
    if(tab==='__global__'){ c.visibleDefault=val; }
    else { if(!c.visibleRoles) c.visibleRoles={}; if(val==='__inherit__') delete c.visibleRoles[tab]; else c.visibleRoles[tab]=val; }
    renderConfig();

  /* ===================== 控件配置面板 v2（二期优化） =====================
     设计约定：
     1) 一个配置项 = 一行「标签 + 控件」，说明一律收进 ⓘ 悬停，不占版面；
     2) 必填 = 一个复选框；字段权限 = 只读 / 可编辑 二选一；
     3) 默认值不放在「通用配置」，而是排在决定它候选 / 格式的配置项之后
        （单行文本：格式与长度 → 默认值；后续 @成员：选择范围 → 默认值）；
     4) 当前仅「单行文本」接入 v2，其余控件仍走旧面板，逐个替换。 */
  const CFG2_PERM = [['readonly','只读'],['edit','可编辑']];
  const CFG2_SPAN = [['12','整行'],['6','1/2'],['4','1/3'],['3','1/4']];
  function cfg2Esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function cfg2Tip(t){ return t?`<i class="cfg2-tip" data-tip="${cfg2Esc(t)}">?</i>`:''; }
  function cfg2Sec(t,tip){ return `<div class="cfg2-sec">${t}${cfg2Tip(tip)}</div>`; }
  function cfg2Row(label,ctrl,tip,end){
    return `<div class="cfg2-row"><div class="cfg2-lb">${label}${cfg2Tip(tip)}</div><div class="cfg2-ct${end?' end':''}">${ctrl}</div></div>`;
  }
  /* 块状行：标签在上、控件在下（用于级联选择器等需要整行的控件） */
  function cfg2Block(label,ctrl,tip){
    return `<div class="cfg2-row" style="display:block;padding:6px 6px 8px"><div class="cfg2-lb" style="width:auto;margin-bottom:6px">${label}${cfg2Tip(tip)}</div><div>${ctrl}</div></div>`;
  }
  function cfg2Seg(opts,cur,handler){
    return `<div class="cfg2-seg">`+opts.map(o=>`<label class="${o[0]===cur?'on':''}" onclick="cfg2SegPick(this);${handler}('${o[0]}')">${o[1]}</label>`).join('')+`</div>`;
  }
  function cfg2SegPick(el){
    const p=el.parentNode;
    for(let i=0;i<p.children.length;i++) p.children[i].classList.remove('on');
    el.classList.add('on');
  }
  /* ⓘ 悬停提示（body 级浮层，避免被面板滚动容器裁剪） */
  function cfg2TipInit(){
    if(window.__cfg2TipBound) return;
    window.__cfg2TipBound=true;
    let box=document.getElementById('cfg2Tip');
    if(!box){ box=document.createElement('div'); box.id='cfg2Tip'; document.body.appendChild(box); }
    const show=function(el){
      const t=el.getAttribute('data-tip'); if(!t) return;
      box.textContent=t; box.classList.add('show');
      const r=el.getBoundingClientRect(), w=box.offsetWidth, h=box.offsetHeight;
      let left=r.left-w-10;
      if(left<8) left=Math.min(r.right+10, window.innerWidth-w-8);
      let top=r.top+r.height/2-h/2;
      top=Math.max(8, Math.min(top, window.innerHeight-h-8));
      box.style.left=left+'px'; box.style.top=top+'px';
    };
    const hide=function(){ box.classList.remove('show'); };
    document.addEventListener('mouseover', function(e){ const el=e.target&&e.target.closest&&e.target.closest('.cfg2-tip'); if(el) show(el); });
    document.addEventListener('mouseout', function(e){ const el=e.target&&e.target.closest&&e.target.closest('.cfg2-tip'); if(el) hide(); });
    window.addEventListener('scroll', hide, true);
  }
  function setFieldSpan(v){ const f=activeField(); if(!f) return; f.span=+v; renderCanvas(); }
  function setTextFieldSpan(v){ setFieldSpan(v); }
  function setFieldPerm(m){
    const sub=findSubField(selectedSub);
    const f=sub || fields.find(x=>x.id===selectedId);
    if(!f) return;
    f.readonly=(m==='readonly'); renderCanvas();
  }

  /* ---- v2 通用段：基础 / 布局 / 字段属性（各组件复用） ---- */
  function cfg2BaseHTML(f){
    const lpos=f.labelPos||formConfig.labelPos, lalign=f.labelAlign||formConfig.labelAlign;
    let h=cfg2Sec('基础');
    h+=cfg2Row('标题',`<input id="cfg2_label" class="cfg2-in" value="${cfg2Esc(f.label)}">`,'字段在表单上显示的名称，运行态展示给用户，同时作为「字段名」自动生成的基础。');
    h+=cfg2Row('字段名',`<input class="cfg2-in cfg2-mono" value="${cfg2Esc(f.fieldName)}" readonly>`,'自动生成规则：使用「控件英文标识_13位时间戳_5位小写字母数字」，例如 member_1760000000000_a7k3m。创建字段时一次性生成并锁定，不可手动修改，保证与提交数据 / 接口字段稳定对应。');
    h+=cfg2Row('帮助说明',`<input id="cfg2_help" class="cfg2-in" value="${cfg2Esc(f.helpText||'')}" placeholder="显示在字段下方">`,'显示在输入框下方的灰色说明文字，用于补充填写要求；不参与提交数据。留空则不显示。');
    /* 子表单内的列是子组件：由子表单统一排版，不提供「布局」类配置（宽度 / 标签位置 / 对齐） */
    if(window.CFG_SUB_MODE) return h;
    h+=cfg2Sec('布局');
    h+=cfg2Row('宽度',cfg2Seg(CFG2_SPAN,String(f.span||12),'setFieldSpan'),'基于 12 栅格决定横向占位：整行=12、1/2 行=6、1/3 行=4、1/4 行=3。同一行字段宽度合计超过 12 时自动换行。默认整行。',true);
    h+=cfg2Row('标签',
      `<select id="cfg2_lpos" class="cfg2-in" style="flex:1">${[['top','标题在上'],['left','标题在左']].map(o=>`<option value="${o[0]}" ${lpos===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`+
      `<select id="cfg2_lalign" class="cfg2-in" style="flex:1">${[['left','左对齐'],['right','右对齐']].map(o=>`<option value="${o[0]}" ${lalign===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`,
      '标题在上 / 标题在左：未单独设置时继承表单级「标签位置」，标题在左时列宽取表单级「标签宽度」（窄 80px / 中 110px / 宽 140px）。对齐方式仅在标题在左时生效：右对齐=标签贴齐输入框。');
    return h;
  }
  function cfg2AttrHTML(f, opts){
    opts=opts||{};
    let h=cfg2Sec('字段属性');
    if(!opts.hideRequired) h+=cfg2Row('必填',`<input id="cfg2_req" type="checkbox" class="cfg2-cb" ${f.required?'checked':''}>`,'勾选后运行态该字段不能为空，为空则拦截提交并提示「请填写{标题}」。默认不勾选。字段被「显示条件」隐藏时不参与必填校验。',true);
    if(!opts.hidePermission) h+=cfg2Row('字段权限',cfg2Seg(CFG2_PERM,f.readonly?'readonly':'edit','setFieldPerm'),'只读=运行态仅展示、不可编辑，值由默认值 / 数据联动 / 系统带出；可编辑=用户可填写。默认「可编辑」。只读字段仍参与提交。',true);
    h+=cfg2Row('显示条件',`<select id="cfg_vmode" class="cfg2-in">${[['always','始终显示'],['when','满足条件时显示']].map(o=>`<option value="${o[0]}" ${((f.visible&&f.visible.mode)||'always')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`,'始终显示=任何时候都展示；满足条件时显示=按下方条件动态显隐。隐藏时不参与必填与格式校验，提交值为空。默认「始终显示」。');
    if(f.visible&&f.visible.mode==='when') h+=`<div class="cfg2-cond" style="margin-left:0">${cfg2VisibleConds(f)}</div>`;

  }
  function bindCfg2Base(f){
    const g=id=>document.getElementById(id);
    const relabel=()=>renderCanvas();
    if(!f.visible) f.visible={mode:'always',logic:'and',conditions:[{field:'',op:'eq',value:''}]};
    if(g('cfg2_label')) g('cfg2_label').oninput=e=>{ f.label=e.target.value; relabel(); };
    if(g('cfg2_help')) g('cfg2_help').oninput=e=>{ f.helpText=e.target.value; relabel(); };
    if(g('cfg2_lpos')) g('cfg2_lpos').onchange=e=>{ f.labelPos=e.target.value; relabel(); };
    if(g('cfg2_lalign')) g('cfg2_lalign').onchange=e=>{ f.labelAlign=e.target.value; relabel(); };
    if(g('cfg2_req')) g('cfg2_req').onchange=e=>{ f.required=e.target.checked; relabel(); };
    if(g('cfg_vmode')) g('cfg_vmode').onchange=e=>{ f.visible.mode=e.target.value; renderConfig(); };
    if(g('cfg_vlogic')) g('cfg_vlogic').onchange=e=>{ f.visible.logic=e.target.value; };
    (f.visible.conditions||[]).forEach((c,i)=>{
      if(g('cfg_vfield_'+i)) g('cfg_vfield_'+i).onchange=e=>{ c.field=e.target.value; };
      if(g('cfg_vop_'+i)) g('cfg_vop_'+i).onchange=e=>{ c.op=e.target.value; };

  /* 默认值（按类型渲染输入控件；依赖项见各调用处的 hint） */
  function cfg2DefaultValue(f, opts){
    opts=opts||{}; const kind=opts.kind||'text';
    const dt=f.defaultType||'manual';
    let h=cfg2Row('默认方式',`<select id="cfg2_dtype" class="cfg2-in">`+DEFAULT_TYPES.map(o=>`<option value="${o[0]}" ${dt===o[0]?'selected':''}>${o[1]}</option>`).join('')+`</select>`,
      '手动填写=打开表单即填入固定值；公式编辑=按公式实时计算；当前用户=注入登录人；当前日期=注入当天日期；数据联动=按条件从其他表单取值。默认「手动填写」。');
    if(dt==='manual'){
      let ctrl='', tip='';
      if(kind==='number'){
        ctrl=`<input id="cfg2_dval" type="number" class="cfg2-in" value="${f.defaultValue==null?'':cfg2Esc(f.defaultValue)}" placeholder="打开表单时自动填入">`;
        tip='打开表单时自动填入的数值，提交时原样入库。需落在上方「取值范围」「小数位数」的限制内。';
      } else if(kind==='datetime'){
        const t=(f.dateType==='time')?'time':(f.dateType==='date'?'date':'datetime-local');
        ctrl=`<input id="cfg2_dval" type="${t}" class="cfg2-in" value="${cfg2Esc(f.defaultValue||'')}">`;
        tip='打开表单时自动填入的日期 / 时间，需符合上方「日期类型」；显示时按「显示格式」转换。';
      } else {
        ctrl=`<input id="cfg2_dval" class="cfg2-in" value="${cfg2Esc(f.defaultValue||'')}" placeholder="打开表单时自动填入">`;
        tip='打开表单时自动填入的固定文本，提交时原样入库。字段权限为「可编辑」时用户仍可修改；为「只读」时用户看到的就是该值。';
      }
      h+=cfg2Row('默认值',ctrl,tip);
      if(opts.hint) h+=`<div class="cfg2-hint"><i class="fas fa-level-up-alt"></i><span>${opts.hint}</span></div>`;
    } else if(dt==='formula'){
      h+=cfg2Row('公式',`<input class="cfg2-in" value="${cfg2Esc(f.defaultValue||'')}" placeholder="如 =CONCAT(A,B)" readonly><button class="cfg2-btn" onclick="openFormula()">编辑</button>`,
        '打开表单时及被引用字段发生变化时重新计算；系统只存计算结果、不存公式，避免脏值。引用字段被删除时公式失效并提示重新编辑。');
    } else if(dt==='currentUser'){
      h+=`<div class="cfg2-hint"><i class="fas fa-bolt"></i><span>自动填入当前登录用户（姓名 / 工号），运行态不可编辑，值随表单一起提交。</span></div>`;

      h+=`<div class="cfg2-hint"><i class="fas fa-bolt"></i><span>自动填入打开表单当天的日期（YYYY-MM-DD，示例 ${new Date().toISOString().slice(0,10)}）。需锁定不允许修改时，把「字段权限」设为只读。</span></div>`;
    } else if(dt==='linkage'){
      const lk=f.linkage||{formId:'',formName:'',conditions:[],returnField:''};

      const sum=!fm?'未配置':`${fm.name} · ${rf?rf.label:'未选返回值'} · ${lk.conditions.length}个条件`;

    return h;

  function bindCfg2Default(f){

  /* 显示条件构造器（v2 紧凑版：与「显示条件」行同一套 id，便于复用绑定逻辑） */
  function cfg2VisibleConds(f){

    const conds=v.conditions.map((c,i)=>`<div class="flex items-center gap-1.5" style="margin-bottom:6px">

  /* ---------- 单行文本 ---------- */

  /* ---------- 地址 ---------- */
  function cfg2AddressDefault(f){
    const dt=f.defaultType||'manual';
    const af=getAddrShow(f);
    let h=cfg2Row('默认方式',`<select id="cfg2_dtype" class="cfg2-in">`+DEFAULT_TYPES.map(o=>`<option value="${o[0]}" ${dt===o[0]?'selected':''}>${o[1]}</option>`).join('')+`</select>`,
      '手动填写=打开表单带入预设地址；公式编辑=按公式计算；当前用户 / 当前日期=系统注入；数据联动=按条件从其他表单取地址。默认「手动填写」。');
    if(dt==='manual'){
      let body='';
      if(af.province||af.city||af.district) body+=`<div style="margin-bottom:6px">${addrCascaderBox(f,'cfg')}</div>`;
      if(af.detail){
        const dv=addrDefaultObj(f);
        body+=`<input id="cfg_addr_dv_detail" class="cfg2-in" value="${cfg2Esc(dv.detail||'')}" placeholder="详细地址（留空则由填写人补充）">`;
      }
      h+=cfg2Block('默认地址', body||'<span style="font-size:11px;color:#94a3b8">所选类型不含可填层级</span>','按上方「类型」逐级点选省 / 市 / 区，详细地址单独填写；运行态打开表单即带入该地址。');
    } else if(dt==='formula'){
      h+=cfg2Row('公式',`<input class="cfg2-in" value="${cfg2Esc(typeof f.defaultValue==='string'?f.defaultValue:'')}" placeholder="如 =CONCAT(省,市,区)" readonly><button class="cfg2-btn" onclick="openFormula()">编辑</button>`,
        '按公式拼接地址文本；系统只存结果、不存公式。');
    } else if(dt==='currentUser'){
      h+=`<div class="cfg2-hint"><i class="fas fa-bolt"></i><span>自动填入当前登录用户的地址，运行态不可编辑。</span></div>`;
    } else if(dt==='today'){
      h+=`<div class="cfg2-hint"><i class="fas fa-bolt"></i><span>自动填入打开表单当天的日期，地址组件一般不用此方式。</span></div>`;
    } else if(dt==='linkage'){
      const lk=f.linkage||{formId:'',formName:'',conditions:[],returnField:''};
      const fm=LINKAGE_FORMS.find(x=>x.id===lk.formId);
      const rf=fm?fm.fields.find(x=>x.field===lk.returnField):null;
      const sum=!fm?'未配置':`${fm.name} · ${rf?rf.label:'未选返回值'} · ${lk.conditions.length}个条件`;
      h+=cfg2Row('数据联动',`<input class="cfg2-in" value="${cfg2Esc(sum)}" readonly><button class="cfg2-btn" onclick="openLinkage()">配置</button>`,
        '按条件从关联表单取地址文本；未命中则留空，不阻塞提交。');
    }
    return h;
  }

  function cfg2NextOptValue(f){
    let n=1; const used=(f.options||[]).map(o=>o.value);
    while(used.indexOf('opt'+n)>=0) n++;
    return 'opt'+n;
  }
  function setOptionLabel(i,v){ const f=activeField(); if(!f||!f.options||!f.options[i]) return; f.options[i].label=v; renderCanvas(); }
  function cfg2AddOption(){
    const f=activeField(); if(!f) return;
    f.options=f.options||[];
    f.options.push({label:'选项'+(f.options.length+1), value:cfg2NextOptValue(f)});
    renderConfig(); renderCanvas();
  }
  function cfg2RemoveOption(i){
    const f=activeField(); if(!f||!f.options) return;
    const removed=f.options[i];
    f.options.splice(i,1);
    if(Array.isArray(f.defaultValue)) f.defaultValue=f.defaultValue.filter(v=>!(removed&&v===removed.value));
    else if(removed && f.defaultValue===removed.value) f.defaultValue='';
    renderConfig(); renderCanvas();
  }
  /* 选项拖拽排序 */
  let _optDragFrom=null;
  function optDragStart(e,i){ _optDragFrom=i; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(i)); }
  function optDragOver(e,to){
    e.preventDefault();
    if(_optDragFrom==null||_optDragFrom===to) return;
    e.currentTarget.style.boxShadow='inset 0 2px 0 #165DFF';
    e.currentTarget.style.borderRadius='4px';
  }
  function optDragLeave(e){ e.currentTarget.style.boxShadow=''; }
  function optDrop(e,to){
    e.preventDefault();
    e.currentTarget.style.boxShadow='';
    const f=activeField(); if(!f||!f.options) return;
    let from=_optDragFrom;
    const raw=e.dataTransfer?e.dataTransfer.getData('text/plain'):'';
    if(raw!==''&&!isNaN(+raw)) from=+raw;
    if(from==null||isNaN(from)||from===to) { _optDragFrom=null; return; }
    const item=f.options.splice(from,1)[0];
    f.options.splice(to,0,item);
    _optDragFrom=null;
    renderConfig(); renderCanvas();
  }
  function cfg2OptionsList(f){
    const opts=f.options||[];
    const rows=opts.map((o,i)=>`<div class="flex items-center gap-1.5" draggable="true" style="margin-bottom:6px"
        ondragstart="optDragStart(event,${i})" ondragover="optDragOver(event,${i})" ondragleave="optDragLeave(event)" ondrop="optDrop(event,${i})" ondragend="optDragLeave(event)">
        <i class="fas fa-grip-vertical" style="flex:none;color:#cbd5e1;font-size:10px;cursor:grab" title="拖动调整顺序"></i>
        <input class="cfg2-in" draggable="false" style="flex:1;min-width:0" value="${cfg2Esc(o.label)}" oninput="setOptionLabel(${i},this.value)">
        <button class="text-gray-300 hover:text-red-500 btn-click" style="flex:none;padding:0 4px" title="删除选项" onclick="cfg2RemoveOption(${i})"><i class="fas fa-trash-can" style="font-size:12px"></i></button>
      </div>`).join('');
    return `<div style="padding:0 6px 8px">
      ${rows||'<div style="font-size:11px;color:#94a3b8;margin-bottom:6px">暂无选项，请先添加</div>'}
      <button class="btn-click" style="color:#165DFF;font-size:11.5px" onclick="cfg2AddOption()"><i class="fas fa-plus" style="font-size:9px;margin-right:3px"></i>添加选项</button>
    </div>`;
  }

        const opts=`<option value="">请选择字段</option>`+ws.fields.map(fd=>`<option value="${fd.field}" ${k===fd.field?'selected':''}>${fd.label}</option>`).join('');
        const canDel=keys.length>1;
        return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">`+
          `<span style="flex:none;width:40px;font-size:11.5px;color:#64748b">${nm[i]||('第'+(i+1)+'级')}</span>`+
          `<select class="cfg2-in" style="flex:1" onchange="casSetField('${f.id}',${i},this.value)">${opts}</select>`+
          `<button type="button" style="flex:none;width:20px;height:20px;border:none;background:none;color:${canDel?'#94a3b8':'#e2e8f0'};cursor:${canDel?'pointer':'default'}" title="移除该级" ${canDel?`onclick="casRemoveLevelCfg('${f.id}',${i})"`:'disabled'}><i class="fas fa-times" style="font-size:11px"></i></button>`+
        `</div>`;
      }).join('');
      const canAdd=keys.length < ws.fields.length;
      h+=cfg2Block('各级取值字段',
        `<div>${rows}${canAdd?`<button type="button" onclick="casAddLevelCfg('${f.id}')" style="font-size:12px;color:#00b39a;background:none;border:none;padding:2px 0;cursor:pointer"><i class="fas fa-plus" style="font-size:10px;margin-right:3px"></i>添加一级</button>`:''}</div>`,
        '按顺序逐级选择字段：第 1 个字段作为一级下拉值，第 2 个作为二级下拉值，以此类推。级数 = 已配置字段数，最多可到该工作表全部字段。');
    }

    h+=cfg2Row('可搜索',`<input id="cfg2_search" type="checkbox" class="cfg2-cb" ${f.searchable?'checked':''}>`,'勾选后各级下拉支持输入关键字过滤。层级多、选项长时建议开启。默认关闭。',true);

    h+=cfg2Sec('默认值','默认值是一条完整路径（如 广东省 / 深圳市 / 南山区），候选来自所选工作表按各级字段逐级过滤后的结果；逐级点选后运行态预选该路径。');
    h+=cascaderDefaultV2(f);
    return h;
  }
  function bindCascaderPanelV2(f){
    bindCfg2Base(f);
    const g=id=>document.getElementById(id);
    if(g('cfg2_cas_sheet')) g('cfg2_cas_sheet').onchange=e=>{ casSetSheet(f.id, e.target.value); };
    if(g('cfg2_search')) g('cfg2_search').onchange=e=>{ f.searchable=e.target.checked; renderCanvas(); };
  }
  function cascaderDefaultV2(f){
    const names=casLevelNames(f);
    const sel=Array.isArray(f.defaultValue)?f.defaultValue.slice():[];
    if(!casTreeOf(f).length){
      return `<div class="cfg2-hint"><i class="fas fa-level-up-alt"></i><span>先选择工作表并配置各级取值字段，默认值候选才会出现；不配置则不预选。</span></div>`;
    }
    let sels='';
    for(let i=0;i<names.length;i++){
      const opts=casOptionsAtPath(f,i,sel);
      const o=opts.map(n=>`<option value="${n.label}" ${sel[i]===n.label?'selected':''}>${n.label}</option>`).join('');
      sels+=`<select class="cfg2-in" style="flex:1" id="cfg2_casdef_${i}" onchange="casDefPick('${f.id}',${i},this.value)"><option value="">请选择${names[i]}</option>${o}</select>`;
    }
    return cfg2Block('默认路径',`<div style="display:flex;align-items:center;gap:4px">${sels}</div>`,'逐级点选一条默认路径；改动某一级会自动清空它后面的级别。全部留空则运行态不预选。');
  }
  function casSetSheet(id,v){
    const f=getField(id); if(!f) return;
    if(f.sheetId!==v){
      f.sheetId=v;
      const ws=WORKSHEETS.find(x=>x.id===v);
      f.sheetName=ws?ws.name:'';
      const prev=(f.casFieldKeys&&f.casFieldKeys.length)||2;
      const n=ws?Math.min(prev,ws.fields.length):prev;
      f.casFieldKeys=new Array(n).fill('');
      f.defaultValue=[];
    }
    casSyncLevels(f);
    renderConfig(); renderCanvas();
  }
  function casSetField(id,i,v){
    const f=getField(id); if(!f) return;
    if(!f.casFieldKeys) f.casFieldKeys=[];
    f.casFieldKeys[i]=v;
    f.defaultValue=[];
    casSyncLevels(f);
    renderConfig(); renderCanvas();
  }
  function casAddLevelCfg(id){
    const f=getField(id); const ws=casSheetOf(f); if(!f||!ws) return;
    if(!f.casFieldKeys) f.casFieldKeys=[];
    if(f.casFieldKeys.length>=ws.fields.length) return;
    f.casFieldKeys.push('');
    casSyncLevels(f);
    renderConfig(); renderCanvas();
  }
  function casRemoveLevelCfg(id,i){
    const f=getField(id); if(!f||!f.casFieldKeys||f.casFieldKeys.length<=1) return;
    f.casFieldKeys.splice(i,1);
    f.defaultValue=[];
    casSyncLevels(f);
    renderConfig(); renderCanvas();
  }
  function casDefPick(id,idx,val){
    const f=getField(id); if(!f) return;
    const p=Array.isArray(f.defaultValue)?f.defaultValue.slice():[];
    if(!val){ f.defaultValue=p.slice(0,idx); }
    else { p[idx]=val; f.defaultValue=p.slice(0,idx+1); }
    renderConfig(); renderCanvas();
  }

  function cfg2ToggleFmt(id,fmt,on){
    const f=getField(id); if(!f) return;

  /* 定位示意地图（配置面板选点）：经纬度与百分比互转；示意范围约 1.7km × 2.2km */
  const LOC_MAP = { lng0:116.390, lng1:116.410, lat0:39.900, lat1:39.920 };
  function locXYToLL(x,y){
    const lng=LOC_MAP.lng0 + (x/100)*(LOC_MAP.lng1-LOC_MAP.lng0);
    const lat=LOC_MAP.lat1 - (y/100)*(LOC_MAP.lat1-LOC_MAP.lat0);
    return { lng:+lng.toFixed(6), lat:+lat.toFixed(6) };
  }
  function locLLToXY(lng,lat){
    return { x:((+lng-LOC_MAP.lng0)/(LOC_MAP.lng1-LOC_MAP.lng0))*100, y:((LOC_MAP.lat1-+lat)/(LOC_MAP.lat1-LOC_MAP.lat0))*100 };
  }
  function locPickMapHTML(f, kind){
    const isC=(kind==='center');
    const lng=isC?f.centerLng:f.defLng, lat=isC?f.centerLat:f.defLat;
    const has=(lng!=null&&lat!=null&&!isNaN(lng)&&!isNaN(lat));
    return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button type="button" onclick="openLocPicker('${f.id}','${kind}')" style="padding:6px 11px;border:1px solid #165DFF;color:#165DFF;border-radius:6px;font-size:12px;background:#fff;cursor:pointer"><i class="fas fa-map-location-dot" style="margin-right:4px"></i>${has?'重新选择':'在地图上选择'}</button>
      <span style="font-size:11px;color:#64748b">${has?('经纬度 '+Number(lng).toFixed(6)+', '+Number(lat).toFixed(6)):'未选择'}</span>
      ${has?`<button type="button" onclick="locPickClear('${f.id}','${kind}')" style="color:#94a3b8;background:none;border:none;cursor:pointer;font-size:11px">清除</button>`:''}
    </div>`;
  }
  /* 真实地图选点：弹窗内的 Leaflet 地图 */
  let _locPick={fieldId:null,kind:'center',lng:null,lat:null,map:null,marker:null};
  function locTileLayer(){
    return L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'});
  }
  function openLocPicker(id,kind){
    const f=getField(id); if(!f) return;
    const isC=(kind==='center');
    let lng=isC?f.centerLng:f.defLng, lat=isC?f.centerLat:f.defLat;
    if(lng==null||lat==null){ lng=116.397428; lat=39.90923; }
    _locPick={fieldId:id,kind:kind,lng:+lng,lat:+lat,map:null,marker:null};
    document.getElementById('locMapTitle').textContent = isC?'选择定位中心':'选择默认地点';
    document.getElementById('locPickHint').textContent = isC?'在地图上点击选择打卡 / 考勤的中心点':'在地图上点击选择默认定位点';
    openModal('locMapModal');
    setTimeout(initLocPickMap, 60);
  }
  function initLocPickMap(){
    const el=document.getElementById('locPickMap'); if(!el) return;
    if(!window.L){ el.innerHTML='<div style="padding:20px;font-size:12px;color:#94a3b8">地图组件未加载（需联网加载地图资源）</div>'; return; }
    if(_locPick.map){ try{_locPick.map.remove();}catch(e){} _locPick.map=null; }
    const map=L.map(el,{zoomControl:true,attributionControl:true}).setView([_locPick.lat,_locPick.lng],16);
    locTileLayer().addTo(map);
    const mk=L.marker([_locPick.lat,_locPick.lng],{draggable:true}).addTo(map);
    mk.on('dragend',()=>{ const ll=mk.getLatLng(); _locPick.lat=ll.lat; _locPick.lng=ll.lng; updateLocPickHint(); });
    map.on('click',e=>{ _locPick.lat=e.latlng.lat; _locPick.lng=e.latlng.lng; mk.setLatLng(e.latlng); updateLocPickHint(); });
    _locPick.map=map; _locPick.marker=mk;
    updateLocPickHint();
    setTimeout(()=>map.invalidateSize(),50);
  }
  function updateLocPickHint(){
    const h=document.getElementById('locPickHint'); if(!h) return;
    h.textContent='已选择：'+Number(_locPick.lat).toFixed(6)+', '+Number(_locPick.lng).toFixed(6)+'（可拖动图钉微调）';
  }
  function confirmLocPick(){
    const f=getField(_locPick.fieldId);
    if(f){
      if(_locPick.kind==='center'){ f.centerLng=+Number(_locPick.lng).toFixed(6); f.centerLat=+Number(_locPick.lat).toFixed(6); }
      else { f.defLng=+Number(_locPick.lng).toFixed(6); f.defLat=+Number(_locPick.lat).toFixed(6); }
    }
    closeLocPicker(); renderConfig(); renderCanvas();
  }
  function closeLocPicker(){
    if(_locPick.map){ try{_locPick.map.remove();}catch(e){} _locPick.map=null; }
    closeModal('locMapModal');
  }
  function locPickClear(id,kind){
    const f=getField(id); if(!f) return;
    if(kind==='center'){ f.centerLng=null; f.centerLat=null; }
    else { f.defLng=null; f.defLat=null; }
    renderConfig(); renderCanvas();
  }
  /* 运行态预览地图：Leaflet 真实地图 + 可拖动图钉（限制在可调范围内） */
  function locPreviewMapHTML(f, sel, ctx){
    return `<div data-locmap="${f.fieldName}" style="height:200px;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#f1f5f9"></div>`;
  }
  function initPreviewLocMaps(){
    document.querySelectorAll('[data-locmap]').forEach(el=>{
      const fn=el.getAttribute('data-locmap');
      const f=getFieldByFn(fn); if(!f) return;
      if(!window.L){ el.innerHTML='<div style="padding:16px;font-size:12px;color:#94a3b8">地图组件未加载（需联网）</div>'; return; }
      if(el._lmap){ try{el._lmap.remove();}catch(e){} }
      const sel=locSel[fn];
      const base=sel?[ (sel.baseLat!=null?+sel.baseLat:+sel.lat), (sel.baseLng!=null?+sel.baseLng:+sel.lng) ]:null;
      const hasC=(f.limitRange&&f.centerLng!=null&&f.centerLat!=null);
      const start=hasC?[+f.centerLat,+f.centerLng]:(sel?[+sel.lat,+sel.lng]:[39.90923,116.397428]);
      const map=L.map(el,{zoomControl:true,attributionControl:true}).setView(start,16);
      locTileLayer().addTo(map);
      if(hasC){
        L.marker([+f.centerLat,+f.centerLng]).addTo(map).bindTooltip('定位中心');
        L.circle([+f.centerLat,+f.centerLng],{radius:f.radius||500,color:'#165DFF',weight:1.5,dashArray:'6 4',fillColor:'#165DFF',fillOpacity:.06}).addTo(map);
      }
      if(sel){
        if(base) L.circle(base,{radius:f.adjustRange||50,color:'#10b981',weight:1.5,dashArray:'6 4',fillColor:'#10b981',fillOpacity:.12}).addTo(map);
        const mk=L.marker([+sel.lat,+sel.lng],{draggable:!!f.allowAdjust}).addTo(map).bindTooltip('当前位置');
        mk.on('drag',()=>{
          const ll=mk.getLatLng(); let lat=ll.lat, lng=ll.lng;
          if(base){
            const A=f.adjustRange||50, d=locDistanceM(lng,lat,base[1],base[0]);
            if(d>A && d>0){ const r=A/d; lat=base[0]+(lat-base[0])*r; lng=base[1]+(lng-base[1])*r; mk.setLatLng([lat,lng]); }
          }
          sel.lng=+lng.toFixed(6); sel.lat=+lat.toFixed(6);
          updateLocPvStatus(fn,f);
        });
      }
      el._lmap=map;
      setTimeout(()=>map.invalidateSize(),50);
    });
  }
  function updateLocPvStatus(fn,f){
    const sel=locSel[fn]; if(!sel) return;
    const c=document.getElementById('locpvcoords_'+fn);
    if(c) c.textContent='('+sel.lng+', '+sel.lat+')';
    const m=document.getElementById('locpvmsg_'+fn);
    if(!m) return;
    if(f.limitRange&&f.centerLng!=null&&f.centerLat!=null){
      const d=locDistanceM(+sel.lng,+sel.lat,+f.centerLng,+f.centerLat), R=f.radius||500;
      m.innerHTML = d<=R
        ? `<div class="text-xs text-green-600 flex items-center gap-1"><i class="fas fa-check-circle"></i> 在允许范围内（约 ${Math.round(d)} 米 / 上限 ${R} 米）</div>`
        : `<div class="text-xs text-red-600 flex items-center gap-1"><i class="fas fa-triangle-exclamation"></i> 定位超过规定范围（约 ${Math.round(d)} 米 &gt; ${R} 米）</div>`;
    } else { m.innerHTML=''; }
  }

  function zhInitials(text, maxLen){
    const s=(text==null?'':String(text));
    let out='';
    for(const ch of s){
      const cp=ch.codePointAt(0);
      if(cp>=0x4E00&&cp<=0x9FA5){ const c=PY_INIT_STR.charAt(cp-0x4E00); if(c&&c!==' ') out+=c; }
      else if(/[a-zA-Z0-9]/.test(ch)) out+=ch.toUpperCase();
    }
    const ml=Math.max(1,Math.min(12,maxLen||4));
    return out.slice(0,ml);
  }

  function anSegsFromLegacy(f){
    const out=[];
    if(f.prefix) out.push({kind:'text',text:f.prefix});
    if(f.dateFmt && f.dateFmt!=='none') out.push({kind:'date',fmt:f.dateFmt});
    out.push({kind:'seq',len:f.seqLen||4,step:f.step||1,start:f.start==null?1:f.start,reset:f.reset||'none'});
    if(f.suffix) out.push({kind:'text',text:f.suffix});
    return out;
  }
  function anFieldLabel(fn){
    const x=(typeof fields!=='undefined'?fields:[]).find(v=>v.fieldName===fn);
    return x?x.label:'字段';
  }
  /* 引用字段直接使用填写内容；未填写时以字段标题作占位，不再转换为拼音首字母。 */
  function anFieldCode(fn){
    return anFieldLabel(fn) || '字段';
  }
  function anDate(fmt, base){
    let d;
    if(base){ const t=new Date(base+'T00:00:00'); d=isNaN(t.getTime())?new Date():t; } else d=new Date();
    const p=n=>String(n).padStart(2,'0');
    if(fmt==='YYYY') return String(d.getFullYear());
    if(fmt==='YYYYMM') return d.getFullYear()+''+p(d.getMonth()+1);
    return d.getFullYear()+''+p(d.getMonth()+1)+''+p(d.getDate());
  }
  /* 按片段拼接编号；vals=引用字段的示例值，dateStr=预览日期，seq=预览流水号 */
  function anCompose(f, vals, dateStr, seq){
    const segs=(Array.isArray(f.anSegs)&&f.anSegs.length)?f.anSegs:anSegsFromLegacy(f);
    const sep=f.anSep||'';
    const parts=[];
    segs.forEach(sg=>{
      let p='';
      if(sg.kind==='text') p=sg.text||'';
      else if(sg.kind==='date') p=anDate(sg.fmt||'YYYYMMDD', dateStr);
      else if(sg.kind==='field'){
        const raw=(vals&&vals[sg.field]!=null&&vals[sg.field]!=='')?String(vals[sg.field]):'';
        p=raw||('{'+anFieldCode(sg.field)+'}');
      }
      else if(sg.kind==='seq'){ const n=(seq==null?(sg.start==null?1:sg.start):seq); p=String(n).padStart(Math.max(1,Math.min(8,sg.len||4)),'0'); }
      if(p!=='') parts.push(p);
    });
    return parts.join(sep);
  }
  function anSegRows(f){
    const segs=f.anSegs||[];
    const others=(typeof fields!=='undefined'?fields:[]).filter(x=>x.id!==f.id && ['text','textarea','number','select','radio','datetime','autonumber','address'].includes(x.type));
    return segs.map((sg,i)=>{
      let tag='', ctrl='';
      if(sg.kind==='text'){ tag='文字'; ctrl=`<input draggable="false" class="cfg2-in" style="flex:1" value="${cfg2Esc(sg.text||'')}" placeholder="如 HT" oninput="anSegSet(${i},'text',this.value)">`; }
      else if(sg.kind==='date'){ tag='日期'; ctrl=`<select draggable="false" class="cfg2-in" style="flex:1" onchange="anSegSet(${i},'fmt',this.value)">${[['YYYYMMDD','年月日 20261104'],['YYYYMM','年月 202611'],['YYYY','年 2026']].map(o=>`<option value="${o[0]}" ${(sg.fmt||'YYYYMMDD')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`; }
      else if(sg.kind==='field'){ tag='字段';
        const hint=sg.field?'直接引用字段填写的内容':'请选择需要引用的字段';
        ctrl=`<div style="flex:1;min-width:0">
          <select draggable="false" class="cfg2-in" onchange="anSegSet(${i},'field',this.value)"><option value="">选择字段</option>${others.map(x=>`<option value="${x.fieldName}" ${sg.field===x.fieldName?'selected':''}>${cfg2Esc(x.label)}</option>`).join('')}</select>
          <div style="font-size:10.5px;color:#b6c2d4;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${hint}</div>
        </div>`;
      }
      else { tag='流水'; ctrl=`<div style="display:flex;gap:4px;flex:1"><input draggable="false" type="number" min="1" max="8" class="cfg2-in" style="width:52px" value="${sg.len||4}" title="位数" oninput="anSegSet(${i},'len',Math.max(1,Math.min(8,+this.value||4)))"><select draggable="false" class="cfg2-in" style="flex:1" onchange="anSegSet(${i},'reset',this.value)">${[['none','不重置'],['daily','每日重置'],['monthly','每月重置'],['yearly','每年重置']].map(o=>`<option value="${o[0]}" ${(sg.reset||'none')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`; }
      return `<div draggable="true" ondragstart="anSegDragStart(event,${i})" ondragover="event.preventDefault()" ondrop="anSegDrop(event,${i})" style="display:flex;align-items:center;gap:6px;margin-bottom:6px;border-radius:6px;padding:2px 0"><span title="拖动排序" style="flex:none;width:14px;text-align:center;color:#cbd5e1;cursor:move"><i class="fas fa-grip-vertical" style="font-size:11px"></i></span><span style="flex:none;width:30px;font-size:11px;color:#64748b">${tag}</span>${ctrl}<button type="button" draggable="false" style="flex:none;width:20px;height:20px;border:none;background:none;color:#94a3b8;cursor:pointer" onclick="anSegDel(${i})" title="删除片段"><i class="fas fa-times" style="font-size:11px"></i></button></div>`;
    }).join('');
  }
  function anSegAdd(kind){
    const f=activeField(); if(!f) return;
    if(!Array.isArray(f.anSegs)||!f.anSegs.length) f.anSegs=anSegsFromLegacy(f);
    if(kind==='text') f.anSegs.push({kind:'text',text:''});
    else if(kind==='date') f.anSegs.push({kind:'date',fmt:'YYYYMMDD'});
    else if(kind==='field') f.anSegs.push({kind:'field',field:''});
    else f.anSegs.push({kind:'seq',len:4,step:1,start:1,reset:'none'});
    renderConfig(); renderCanvas();
  }
  function anSegSet(i,key,val){

  /* 编号效果预览：输入引用字段示例值，实时拼接 */
  let _anPvId=null;
  function openAnPreview(){
    const f=activeField(); if(!f) return;
    _anPvId=f.id;
    const segs=(Array.isArray(f.anSegs)&&f.anSegs.length)?f.anSegs:anSegsFromLegacy(f);
    const used=[]; segs.forEach(s=>{ if(s.kind==='field'&&s.field&&used.indexOf(s.field)<0) used.push(s.field); });
    let h='';
    if(used.length){
      h+=`<div style="font-size:12px;color:#64748b;margin-bottom:6px">填写引用字段的示例值（模拟用户输入）</div>`;
      used.forEach(fn=>{ h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px"><span style="flex:none;width:92px;font-size:12px;color:#334155;text-align:right">${cfg2Esc(anFieldLabel(fn))}</span><input id="anpv_f_${fn}" class="cfg2-in" style="flex:1" placeholder="如：研发部" oninput="anPreviewRefresh()"></div>`; });
    } else {
      h+=`<div style="font-size:12px;color:#94a3b8;margin-bottom:10px">当前编号未引用字段；可返回点「＋引用字段」后再预览。</div>`;
    }
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    const today=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    const seqSeg=segs.find(s=>s.kind==='seq');
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px"><span style="flex:none;width:92px;font-size:12px;color:#334155;text-align:right">生成日期</span><input id="anpv_date" type="date" class="cfg2-in" style="flex:1" value="${today}" onchange="anPreviewRefresh()"></div>`;
    if(seqSeg){ h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px"><span style="flex:none;width:92px;font-size:12px;color:#334155;text-align:right">流水号</span><input id="anpv_seq" type="number" min="0" class="cfg2-in" style="width:110px" value="${seqSeg.start==null?1:seqSeg.start}" oninput="anPreviewRefresh()"></div>`; }
    h+=`<div style="background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:12px;margin-top:12px"><div style="font-size:11px;color:#94a3b8;margin-bottom:4px">生成结果</div><div id="anpv_out" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;color:#0f172a;word-break:break-all"></div></div>`;
    document.getElementById('anPreviewBody').innerHTML=h;
    anPreviewRefresh();
    openModal('anPreviewModal');
  }
  function anPreviewRefresh(){
    const f=getField(_anPvId); if(!f) return;
    const vals={};
    (f.anSegs||[]).forEach(s=>{ if(s.kind==='field'&&s.field){ const el=document.getElementById('anpv_f_'+s.field); if(el) vals[s.field]=el.value; } });
    const dt=document.getElementById('anpv_date'), sq=document.getElementById('anpv_seq');
    const out=document.getElementById('anpv_out');
    if(out) out.textContent=anCompose(f, vals, dt?dt.value:null, sq?+sq.value:null);
  }

  /* ── 业务控件 v2（成员 / 部门 / 工作表单 / 动态号）：选择范围=全部或指定 ── */
  function bizCandidates(f){
    const meta=BIZ_PICKER[f.type]; if(!meta) return [];
    if(f.range==='pick') return (f.pickNames||[]).slice();
    const out=[]; meta.groups.forEach(g=>g.items.forEach(n=>{ if(out.indexOf(n)<0) out.push(n); })); return out;
  }
  function bizDefArr(f){ return Array.isArray(f.defaultValue)?f.defaultValue.slice():(f.defaultValue?[f.defaultValue]:[]); }
  /* 按模式取分组：默认值模式下若为「指定」范围，只保留已选项 */
  function bizGroupsFor(f, mode){
    const meta=BIZ_PICKER[f.type]; if(!meta) return [];
    if(mode==='default' && f.range==='pick'){
      const allow=f.pickNames||[];
      return meta.groups.map(g=>({id:g.id,name:g.name,items:g.items.filter(n=>allow.indexOf(n)>=0)})).filter(g=>g.items.length);
    }
    return meta.groups;

  /* 已选摘要：最多展示 3 个标签 + 「+N」，其余进弹窗查看；避免选多后面板撑爆 */
  function bizSelectSummary(names,id,kind){
    const list=names||[];
    if(!list.length) return '<span style="font-size:11.5px;color:#94a3b8">尚未选择</span>';
    const removeFn=kind==='default'?'bizRemoveDefault':'bizRemovePick';
    const clearFn=kind==='default'?'bizClearDefault':'bizClearPick';
    const openMode=kind==='default'?'default':'range';
    const max=3, show=list.slice(0,max), more=list.length-max;
    const chips=show.map((n,i)=>`<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:#eef4ff;color:#165DFF;font-size:11.5px;max-width:120px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cfg2Esc(n)}</span><button type="button" onclick="${removeFn}('${id}',${i})" style="border:none;background:none;color:#94a3b8;cursor:pointer;font-size:10px;padding:0;flex:none"><i class="fas fa-times"></i></button></span>`).join('');
    const moreTag=more>0?`<span style="display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:11px" title="${cfg2Esc(list.join('、'))}">+${more}</span>`:'';
    return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span onclick="openBizPicker('${id}','${openMode}')" style="font-size:11.5px;color:#165DFF;cursor:pointer;flex:none;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px" title="点击查看/修改全部已选">已选 ${list.length} 项</span>${chips}${moreTag}
      <button type="button" onclick="${clearFn}('${id}')" style="border:none;background:none;color:#94a3b8;font-size:11px;cursor:pointer;padding:0">清空</button>
    </div>`;
  }
  function bizClearPick(id){
    const f=getField(id); if(!f) return;
    f.pickNames=[]; f.pickIds=[];
    f.defaultValue=f.multi?[]:'';
    renderConfig(); renderCanvas();
  }
  function bizClearDefault(id){
    const f=getField(id); if(!f) return;
    f.defaultValue=f.multi?[]:'';
    renderConfig(); renderCanvas();
  }
  /* 双栏选择弹窗：左侧分组（整组全选），右侧具体项（本组全选） */
  let _bizPick={fieldId:null,type:null,mode:'range',leftId:null,sel:[],query:'',multi:false};
  function openBizPicker(fieldId, mode){
    const f=getField(fieldId); if(!f) return;
    const meta=BIZ_PICKER[f.type]; if(!meta) return;
    mode=mode||'range';
    const groups=bizGroupsFor(f,mode);
    _bizPick={fieldId:fieldId,type:f.type,mode:mode,leftId:(groups[0]||{}).id,
      sel:(mode==='default'?bizDefArr(f):(f.pickNames||[]).slice()),query:'',multi:!!f.multi};
    document.getElementById('bizPickTitle').textContent=(mode==='default'?'选择默认':'选择')+meta.noun;
    document.getElementById('bizPickSearch').value='';
    renderBizPickLeft(); renderBizPickRight();
    openModal('bizPickerModal');
  }
  function renderBizPickLeft(){
    const meta=BIZ_PICKER[_bizPick.type]; if(!meta) return;
    const f=getField(_bizPick.fieldId); if(!f) return;
    const groups=bizGroupsFor(f,_bizPick.mode);
    const showAll=(_bizPick.mode!=='default'||_bizPick.multi);
    document.getElementById('bizPickLeft').innerHTML=groups.map(g=>{
      const on=g.id===_bizPick.leftId;
      const all=g.items.length&&g.items.every(n=>_bizPick.sel.indexOf(n)>=0);
      return `<div style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;margin-bottom:2px;background:${on?'#eef4ff':'transparent'}">
        ${showAll?`<input type="checkbox" ${all?'checked':''} onclick="event.stopPropagation()" onchange="bizPickGroupAll('${g.id}',this.checked)" style="accent-color:#165DFF;cursor:pointer;flex:none">`:''}
        <span onclick="bizPickLeft('${g.id}')" style="flex:1;min-width:0;font-size:12px;cursor:pointer;color:${on?'#165DFF':'#475569'};font-weight:${on?'600':'400'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${cfg2Esc(g.name)}">${cfg2Esc(g.name)}</span>
      </div>`;
    }).join('');
  }
  function bizPickLeft(id){ _bizPick.leftId=id; _bizPick.query=''; const s=document.getElementById('bizPickSearch'); if(s) s.value=''; renderBizPickLeft(); renderBizPickRight(); }
  function renderBizPickRight(){
    const meta=BIZ_PICKER[_bizPick.type]; if(!meta) return;
    const f=getField(_bizPick.fieldId); if(!f) return;
    const groups=bizGroupsFor(f,_bizPick.mode);
    const g=groups.find(x=>x.id===_bizPick.leftId);
    const q=(document.getElementById('bizPickSearch').value||'').trim();
    const items=(g?g.items:[]).filter(n=>!q||n.indexOf(q)>=0);
    const allSel=items.length&&items.every(n=>_bizPick.sel.indexOf(n)>=0);
    const showAll=(_bizPick.mode!=='default'||_bizPick.multi);
    const head=showAll?`<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#475569;padding:4px 4px 8px;border-bottom:1px dashed #eef2f7;margin-bottom:4px;cursor:pointer"><input type="checkbox" ${allSel?'checked':''} onchange="bizPickGroupAll('${_bizPick.leftId}',this.checked)"> 全选本组（${items.length} 项）</label>`:'';
    document.getElementById('bizPickRight').innerHTML=head+(items.length
      ? items.map(n=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;color:#334155;cursor:pointer"><input type="checkbox" ${_bizPick.sel.indexOf(n)>=0?'checked':''} onchange="bizPickToggle('${esc(n)}',this.checked)"> ${cfg2Esc(n)}</label>`).join('')
      : '<div style="font-size:12px;color:#94a3b8;padding:8px">无匹配项</div>');
    document.getElementById('bizPickCount').textContent='已选 '+_bizPick.sel.length+' 项';
  }
  function bizPickGroupAll(groupId, checked){
    const f=getField(_bizPick.fieldId); if(!f) return;
    const groups=bizGroupsFor(f,_bizPick.mode);
    const g=groups.find(x=>x.id===groupId); if(!g) return;
    if(_bizPick.mode==='default' && !_bizPick.multi){
      _bizPick.sel=checked?[g.items[0]].filter(Boolean):[];
    } else if(checked){
      g.items.forEach(n=>{ if(_bizPick.sel.indexOf(n)<0) _bizPick.sel.push(n); });
    } else {
      _bizPick.sel=_bizPick.sel.filter(n=>g.items.indexOf(n)<0);
    }
    renderBizPickLeft(); renderBizPickRight();
  }
  function bizPickToggle(name, checked){
    if(_bizPick.mode==='default' && !_bizPick.multi){
      _bizPick.sel=checked?[name]:[];
      renderBizPickLeft(); renderBizPickRight();
      return;
    }
    if(checked){ if(_bizPick.sel.indexOf(name)<0) _bizPick.sel.push(name); }
    else { _bizPick.sel=_bizPick.sel.filter(v=>v!==name); }
    renderBizPickLeft(); renderBizPickRight();
  }
  function confirmBizPick(){
    const f=getField(_bizPick.fieldId);
    if(f){
      if(_bizPick.mode==='default'){
        f.defaultValue=_bizPick.multi?_bizPick.sel.slice():(_bizPick.sel[0]||'');
      } else {
        f.pickNames=_bizPick.sel.slice(); f.pickIds=_bizPick.sel.slice(); f.range='pick';
        const cand=bizCandidates(f);
        let cur=bizDefArr(f).filter(v=>cand.indexOf(v)>=0);
        f.defaultValue=f.multi?cur:(cur[0]||'');
      }
    }
    closeBizPicker(); renderConfig(); renderCanvas();
  }
  function closeBizPicker(){ closeModal('bizPickerModal'); }

  /* v2 面板注册表（顶层：顶层字段与子表单列共用） */
  const V2PANELS={ text:[renderTextPanelV2,bindTextPanelV2], label:[renderLabelPanelV2,bindLabelPanelV2], textarea:[renderTextareaPanelV2,bindTextareaPanelV2],
                   number:[renderNumberPanelV2,bindNumberPanelV2], datetime:[renderDatetimePanelV2,bindDatetimePanelV2],
                   divider:[renderDividerPanelV2,bindDividerPanelV2], address:[renderAddressPanelV2,bindAddressPanelV2],
                   radio:[renderRadioPanelV2,bindRadioPanelV2], checkbox:[renderCheckboxPanelV2,bindCheckboxPanelV2],
                   select:[renderSelectPanelV2,bindSelectPanelV2], multiselect:[renderMultiselectPanelV2,bindMultiselectPanelV2],
                   cascader:[renderCascaderPanelV2,bindCascaderPanelV2],
                   signature:[renderSignaturePanelV2,bindSignaturePanelV2], image:[renderImagePanelV2,bindImagePanelV2],
                   attachment:[renderAttachmentPanelV2,bindAttachmentPanelV2], location:[renderLocationPanelV2,bindLocationPanelV2],
                   autonumber:[renderAutonumberPanelV2,bindAutonumberPanelV2], subform:[renderSubformPanelV2,bindSubformPanelV2],
                   member:[renderBizPanelV2,bindBizPanelV2], dept:[renderBizPanelV2,bindBizPanelV2],
                   formref:[renderBizPanelV2,bindBizPanelV2], feed:[renderBizPanelV2,bindBizPanelV2] };

  function renderConfig(){
    const body=document.getElementById('configBody');
    const ctx=document.getElementById('cfgContext');
    setCfgTabStyle();
    if(formViewingVersion){
      const s=snapshotFormView();
      ctx.textContent='历史版本·只读';
      body.innerHTML=`
        <div class="cfg-info"><i class="fas fa-eye mr-1"></i>当前画布展示的是历史版本 <b>v${formViewingVersion}</b> 的字段结构（只读），共 <b>${s&&s.fields?s.fields.length:0}</b> 个字段，发布人为 ${s?(s.publisher||'系统'):''} · ${s?s.time||'—':''}。点击下方按钮返回编辑当前表单。</div>
        <button onclick="exitFormVersionView()" class="mt-3 w-full px-3 py-2 rounded-md text-xs font-medium btn-click bg-[#165DFF] text-white hover:bg-blue-600"><i class="fas fa-arrow-left mr-1"></i>返回编辑</button>`;
      return;
    }
    /* 子表单内选中某一列：显示该列的组件配置（子列是独立组件，但不含布局类配置） */
    if(selectedSub){
      const pf=fields.find(x=>x.id===selectedSub.fid);
      const col=findSubField(selectedSub);
      if(pf && col){ ctx.textContent = isCreating ? '' : '子表单列：'+col.label; renderSubColConfig(pf, col); return; }
      selectedSub=null;
    }
    if(!selectedId){
      if(!isCreating) ctx.textContent='表单配置'; else ctx.textContent='';
      renderFormConfig(body); return;
    }
    const f=activeField();
    ctx.textContent = isCreating ? '' : '控件：'+f.label;
    if(V2PANELS[f.type]){ body.innerHTML=V2PANELS[f.type][0](f); V2PANELS[f.type][1](f); return; }
    let html = `<div class="mb-3 pb-3 border-b border-gray-100 flex items-center gap-2 text-sm font-semibold text-gray-700"><i class="fas ${CONTROL_DEFS[f.type].icon} text-[#165DFF]"></i>${CONTROL_DEFS[f.type].label} · 字段配置</div>`;
    html += renderCommon(f);
    html += renderSpecific(f);
    body.innerHTML = html;
    bindFieldEvents(f);
  }
  function setRightTab(t){ rightTab=t; if(t==='view'){ selectedId=null; selectedSub=null; } renderConfig(); }
  // 表单配置标签：处于字段下钻态时点击返回表单根配置，否则进入表单配置模块
  function onFormTabClick(){ if(rightTab==='config' && (selectedId||selectedSub)){ deselectField(); } else { setRightTab('config'); } }
  function setCfgTabStyle(){
    const a='bg-white text-[#165DFF] shadow-sm font-semibold', b='text-gray-500 hover:text-[#165DFF]';
    const tf=document.getElementById('tabCfgForm');
    const tabs=document.getElementById('cfgTabs');
    // 创建表单流程中：隐藏右侧「表单配置 / 控件配置」标签与「控件：xxx」上下文字样，保持面板简洁
    if(isCreating){ if(tabs) tabs.style.display='none'; return; }
    if(tabs) tabs.style.display='';
    // 选中控件时，顶部标签由「表单配置」下钻为「控件配置」；视图管理不再作为独立 tab，已整合进表单配置面板
    if(tf){ tf.textContent=(rightTab==='config'&&selectedId)?'控件配置':'表单配置'; tf.className='flex-1 px-2 py-1.5 rounded-md font-medium btn-click '+(rightTab==='config'?a:b); }
  }

  /* 默认值逻辑详解（按当前选择的方式动态说明取值链路） */
  function defaultValueLogicBox(f){
    const dt=f.defaultType||'manual';
    const name=(DEFAULT_TYPES.find(x=>x[0]===dt)||[,''])[1];
    const map={
      manual:'<b>手动填写</b>：打开表单时直接填入设计态预设的固定值（文本或默认选项）。提交时原样保存到数据库，适用于固定说明文案、高频默认选项等。',
      formula:'<b>公式编辑</b>：运行态在<b>打开表单</b>以及<b>被引用的字段发生变化</b>时，按公式实时计算并填入结果。支持跨字段引用与函数（SUM / IF / COUNT / CONCAT 等）。系统只存储<b>计算结果</b>、不存储公式本身，从而保证每次打开数据一致、避免脏值。',
      currentUser:'<b>当前用户</b>：由系统在运行态自动注入<b>当前登录用户</b>的身份（姓名/工号），用户不可编辑、无需填写。常用于「申请人 / 负责人 / 填报人」等写死为登录人的字段。',
      today:'<b>当前日期</b>：由系统在运行态注入<b>打开表单当天的日期</b>，用于自动记录「申请日期 / 创建日期」，避免用户手填误差。',
      linkage:'<b>数据联动</b>：打开表单时，依据下方配置的条件到<b>关联表</b>中查询记录，把命中记录的指定字段值作为本字段默认值自动带出（例如选「部门」后自动带出「部门负责人」）。若条件未匹配到记录，字段留空、需用户手动补充。'
    };
    return `<div class="cfg-logic-block"><div class="cfg-logic-title"><i class="fas fa-lightbulb"></i>默认值逻辑说明 · ${name}</div><div class="cfg-logic-body">${map[dt]||''}</div></div>`;
  }

  /* 地址默认值：放在专属配置「显示字段」下方、「占位提示」上方维护。
     手动填写时根据 addrShow 的省/市/区/详细开关渲染级联选择器。 */
  function addrDefaultValueHTML(f){
    const dt=f.defaultType||'manual';
    let h = `<div class="cfg-logic-block" style="margin-top:0"><div class="cfg-logic-title"><i class="fas fa-lightbulb"></i>默认值（地址专属）</div><div class="cfg-logic-body">地址控件按上方「类型」决定可填层级（省/省-市/省-市-区/省-市-区-详细地址），因此默认值放在专属配置中维护；选择「手动填写」时，按已选类型逐级点选。</div></div>`;
    h += row('默认值方式', `<select id="cfg_dtype" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${DEFAULT_TYPES.map(o=>`<option value="${o[0]}" ${dt===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`, '选择默认值来源；地址控件手动填写时按所选「类型」级联。');
    if(dt==='manual'){
      const af=getAddrShow(f);
      let body='';
      if(af.province || af.city || af.district){
        body += `<div class="space-y-1"><div class="text-[12px] text-gray-500">省 / 市 / 区（级联选择）</div>${addrCascaderBox(f,'cfg')}</div>`;
      }
      if(af.detail){
        const dv=addrDefaultObj(f);
        body += `<div class="mt-3 space-y-1"><div class="text-[12px] text-gray-500">详细地址</div><textarea id="cfg_addr_dv_detail" rows="2" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" placeholder="留空则运行态由用户填写">${esc(dv.detail||'')}</textarea></div>`;
      }
      if(!body) body='<span class="text-xs text-gray-400">所选类型未含任何可填层级，无可配置默认值</span>';
      h += row('默认值', body, '手动填写时，省/市/区通过一个级联选择框逐级点选（点开浮层分列联动），详细地址单独填写。');
    } else if(dt==='formula'){
      h += row('公式', `<div class="flex gap-2"><input id="cfg_dval" ${inp(f.defaultValue)} class="form-input flex-1 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm font-mono" placeholder="如 =CONCAT(省,市)" readonly><button class="px-2.5 bg-[#165DFF] text-white rounded-md text-xs whitespace-nowrap btn-click" onclick="openFormula()"><i class="fas fa-function mr-1"></i>公式编辑</button></div>`, '通过公式组合地址字段，支持字段引用与函数。');
    } else if(dt==='currentUser'){
      h += info('运行态将自动填入<b>当前登录用户</b>，但地址控件一般不使用此来源。');
    } else if(dt==='today'){
      h += info(`运行态将自动填入<b>打开表单当天的日期</b>（示例：${new Date().toISOString().slice(0,10)}）。`);
    } else if(dt==='linkage'){
      const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
      const fm=LINKAGE_FORMS.find(x=>x.id===lk.formId);
      const rf=fm?fm.fields.find(x=>x.field===lk.returnField):null;
      const summary = !fm ? '未配置' : `${fm.name} · ${rf?rf.label:'未选返回值'} · ${lk.conditions.length}个条件`;
      h += row('数据联动', `<div class="flex gap-2"><input class="form-input flex-1 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm bg-gray-50" value="${summary}" readonly><button class="px-2.5 bg-[#165DFF] text-white rounded-md text-xs whitespace-nowrap btn-click" onclick="openLinkage()"><i class="fas fa-link mr-1"></i>配置</button></div>`, '按条件从其他关联表单查找记录，并取指定字段作为默认值。');
    }
    h += defaultValueLogicBox(f);
    return h;
  }

  /* 业务控件（成员 / @部门 / @工作表单 / @动态号）默认值：放在「专属配置·选择范围」下方维护。
     原因：业务控件的默认候选必须落在「选择范围」内（只能从范围内选具体实体），
     与通用配置中其他控件「默认值独立于范围」的语义不同，故在此独立渲染。 */
  function bizDefaultValueHTML(f){
    const dt=f.defaultType||'manual';
    const m=PICKER_META[f.type]; const noun=m.noun;
    let h = `<div class="cfg-logic-block" style="margin-top:0"><div class="cfg-logic-title"><i class="fas fa-lightbulb"></i>默认值（业务控件专属）</div><div class="cfg-logic-body">成员 / 部门 / 工作表单 / 动态号 这类<b>业务控件</b>的默认值必须落在「选择范围」内。因此默认值配置放在本专属配置的「选择范围」<b>下方</b>，而非通用配置；运行态打开表单时按此自动带入，且候选受范围约束。</div></div>`;
    h += row('默认值方式', `<select id="cfg_dtype" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${DEFAULT_TYPES.map(o=>`<option value="${o[0]}" ${(f.defaultType||'manual')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`, '选择默认值来源；不同方式对应不同取值逻辑，运行态打开表单时按此自动带入。候选受上方「选择范围」约束。');
    if(dt==='manual'){
      const arr = Array.isArray(f.defaultValue) ? f.defaultValue : (f.defaultValue?[f.defaultValue]:[]);
      const chips = arr.length ? arr.map(v=>`<span class="inline-flex items-center gap-1 pl-2 pr-1 py-0.5 rounded-full bg-[#165DFF]/10 text-[#165DFF] text-[11px]">${esc(v)}<button onclick="removeDefaultPick('${esc(v)}')" class="hover:text-red-600 btn-click"><i class="fas fa-times"></i></button></span>`).join(' ') : '<span class="text-[11px] text-gray-400">尚未选择</span>';
      const btn=`<button onclick="openDefaultPicker('${f.id}')" class="px-3 py-1.5 border border-[#165DFF] text-[#165DFF] rounded-md text-sm hover:bg-blue-50 btn-click"><i class="fas fa-plus mr-1"></i>选择${noun}</button>`;
      h += row('默认'+noun, `<div>${btn}<div class="flex flex-wrap gap-1.5 mt-2">${chips}</div></div>`, `从「选择范围」限定的${noun}中选取具体${noun}作为默认值；运行态打开表单时自动带入。${f.multi?'开启「多选」后可一次选多个。':''}`);
    } else if(dt==='formula'){
      h += row('公式', `<div class="flex gap-2"><input id="cfg_dval" ${inp(f.defaultValue)} class="form-input flex-1 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm font-mono" placeholder="如 =SUM(金额)" readonly><button class="px-2.5 bg-[#165DFF] text-white rounded-md text-xs whitespace-nowrap btn-click" onclick="openFormula()"><i class="fas fa-function mr-1"></i>公式编辑</button></div>`, '通过公式计算得到默认值，支持字段引用与函数（SUM/IF/COUNT 等）。');
    } else if(dt==='currentUser'){
      h += info('运行态将自动填入<b>当前登录用户</b>，无需手动维护（常用于「申请人/负责人」类字段）。');
    } else if(dt==='today'){
      h += info(`运行态将自动填入<b>打开表单当天的日期</b>（示例：${new Date().toISOString().slice(0,10)}）。`);
    } else if(dt==='linkage'){
      const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
      const fm=LINKAGE_FORMS.find(x=>x.id===lk.formId);
      const rf=fm?fm.fields.find(x=>x.field===lk.returnField):null;
      const summary = !fm ? '未配置' : `${fm.name} · ${rf?rf.label:'未选返回值'} · ${lk.conditions.length}个条件`;
      h += row('数据联动', `<div class="flex gap-2"><input class="form-input flex-1 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm bg-gray-50" value="${summary}" readonly><button class="px-2.5 bg-[#165DFF] text-white rounded-md text-xs whitespace-nowrap btn-click" onclick="openLinkage()"><i class="fas fa-link mr-1"></i>配置</button></div>`, '按条件从其他关联表单查找记录，并取指定字段作为默认值。');
    }
    h += defaultValueLogicBox(f);
    return h;
  }

  /* 通用配置（所有控件共有） */
  function renderCommon(f){
    if(f.type==='divider'){

  /* ── 多级查询：取值来源统一为「工作表字段」 ──
     选中一张工作表后，为每一级指定一个字段；按行数据把各级字段值聚合成树（同级去重）。
     例：工作表=行政区划表，一级=省份、二级=城市 → 广东省 下只出现广东的城市。 */
  function casSheetOf(f){ return WORKSHEETS.find(x=>x.id===f.sheetId) || null; }
  function casFieldLabel(f,key){
    const ws=casSheetOf(f); const fd=ws?ws.fields.find(x=>x.field===key):null; return fd?fd.label:'';
  }
  function casTreeFromSheet(f){
    const ws=casSheetOf(f); if(!ws) return [];
    const keys=(f.casFieldKeys||[]);
    if(!keys.length || !keys[0]) return [];
    const walk=(rows,idx)=>{
      const key=keys[idx]; if(!key) return [];
      const map=new Map();
      (rows||[]).forEach(r=>{ const v=r[key]; if(v==null||v==='') return;
        if(!map.has(v)) map.set(v,[]); map.get(v).push(r); });
      return Array.from(map.entries()).map(([v,rs])=>{
        const node={label:String(v)};
        if(idx<keys.length-1){ const ch=walk(rs,idx+1); if(ch.length) node.children=ch; }
        return node;
      });
    };
    return walk(ws.rows||[],0);
  }

  function casSyncLevels(f){

    f.levels = f.casFieldKeys.length || 1;
  }
