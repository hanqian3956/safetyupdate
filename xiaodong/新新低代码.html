<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>低代码平台原型</title>
  <script src="https://cdn.tailwindcss.com">___SCEND___
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F5F7FA; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    .proto-element { position: relative; transition: all 0.2s ease; border-radius: 8px; }
    .proto-element:hover { box-shadow: 0 0 0 2px #165DFF, 0 4px 12px rgba(22,93,255,0.15); background-color: rgba(22,93,255,0.03); }
    .proto-element.active-highlight { box-shadow: 0 0 0 2px #165DFF, 0 4px 12px rgba(22,93,255,0.2); background-color: rgba(22,93,255,0.05); }
    .proto-desc { transition: all 0.2s ease; border-radius: 8px; border: 1px solid #fde68a; background-color: #fffbeb; }
    .proto-desc:hover { background-color: #fef3c7; border-color: #f59e0b; }
    .proto-desc.active-highlight { background-color: #fde68a; border-color: #d97706; }

    #connections { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    .connection-line { fill: none; stroke: #165DFF; stroke-width: 2; opacity: 0.6; transition: all 0.2s ease; }
    .connection-line.active { stroke-width: 3; opacity: 1; }
    .connection-label { fill: #fff; font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    .connection-label-bg { fill: #165DFF; }

    .ctrl-item { cursor: grab; user-select: none; transition: all .15s; }
    .ctrl-item:active { cursor: grabbing; }
    .ctrl-item:hover { border-color: #165DFF !important; color: #165DFF; background: #f0f5ff; }
    .field-card { transition: box-shadow .15s, border-color .15s; cursor: grab; }
    .field-card:active { cursor: grabbing; }
    .field-card:hover { border-color: #165DFF; }
    .field-card.selected { border-color: #165DFF; box-shadow: 0 0 0 2px rgba(22,93,255,.15); }
    .field-card.drop-before { box-shadow: inset 0 3px 0 #165DFF; }
    .field-card.drop-after  { box-shadow: inset 0 -3px 0 #165DFF; }
    .canvas-dragover { background: #eef4ff; }
    .btn-click:active { transform: scale(0.96); }
    .form-input:focus { border-color: #165DFF; box-shadow: 0 0 0 3px rgba(22,93,255,0.1); outline: none; }

    .cfg-sec { font-size:12px; font-weight:600; color:#374151; margin:14px 0 8px; padding:6px 8px; background:#f3f4f6; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; user-select:none; }
    .cfg-sec::after { content:'▼'; font-size:10px; color:#9ca3af; transition:transform .2s; }
    .cfg-sec.collapsed::after { transform:rotate(-90deg); }
    .cfg-sec-body { overflow:hidden; transition:max-height .25s ease; }
    .cfg-logic { font-size:11.5px; color:#475569; margin-top:6px; line-height:1.55; background:#F0F5FF; border-left:3px solid #165DFF; padding:6px 9px; border-radius:0 6px 6px 0; display:flex; gap:6px; align-items:flex-start; }
    .cfg-logic i { color:#165DFF; font-size:10px; margin-top:3px; flex:none; }
    .cfg-logic-block { background:#FFF7E6; border:1px solid #FFD591; border-radius:8px; padding:9px 11px; margin:2px 0 12px; }
    .cfg-logic-title { font-size:11px; font-weight:600; color:#D48806; margin-bottom:4px; display:flex; align-items:center; gap:5px; }
    .cfg-logic-body { font-size:11.5px; color:#8C6A2F; line-height:1.6; }
    .cfg-logic-body b { color:#614B1E; }
    .subform-table-wrap { border:1px solid #e5e7eb; border-radius:6px; overflow:hidden; background:#fff; }
    .subform-table-wrap.subform-dragover, .field-card.subform-dragover { border-color:#165DFF; box-shadow:0 0 0 2px rgba(22,93,255,.3); background:#f0f5ff; }
    .subform-col-row { cursor:grab; }
    .subform-col-row.dragging { opacity:.4; }
    .subform-col-row.drop-target { box-shadow:inset 0 2px 0 #165DFF; }
    .cfg-info { font-size:11px; color:#6b7280; background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; padding:8px 10px; line-height:1.5; }
    .cfg-info i { color:#165DFF; }

    .label-cell { display:inline-block; background:#f9fafb; border:1px dashed #e5e7eb; border-radius:4px; padding:4px 6px; margin:-4px 0; line-height:1.4; }
    .label-cell.auto { background:transparent; border-style:dotted; }

    .modal-overlay { transition: opacity .25s ease; }
    .modal-content { transition: transform .25s ease, opacity .25s ease; }
    .modal-hidden { opacity: 0; pointer-events: none; }
    .modal-hidden .modal-content { transform: scale(.95); opacity: 0; }

    .formula-layout { display:flex; height:420px; overflow:hidden; }
    .formula-sidebar { width:230px; border-right:1px solid #e5e7eb; overflow-y:auto; background:#fafafa; }
    .formula-main { flex:1; display:flex; flex-direction:column; padding:16px; }
    .formula-tip { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:8px 12px; font-size:12px; border-radius:6px; margin-bottom:12px; }
    .formula-input { flex:1; border:1px solid #e5e7eb; border-radius:6px; padding:12px; font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:14px; resize:none; line-height:1.6; }
    .formula-input:focus { border-color:#165DFF; box-shadow:0 0 0 3px rgba(22,93,255,0.1); outline:none; }
    .linkage-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
    .linkage-row .form-input { flex:1; min-width:120px; }

    @media (max-width: 768px) {
      #app { flex-direction: column; }
      #left-panel { width: 100% !important; height: 60vh; }
      #divider { display: none; }
      #right-panel { width: 100% !important; height: 40vh; border-top: 1px solid #e5e7eb; }
      #connections { display: none; }
      .mobile-toggle-btn { display: flex !important; }
    }
    .mobile-toggle-btn { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 100; width: 48px; height: 48px; border-radius: 50%; background: #165DFF; color: white; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22,93,255,0.3); cursor: pointer; border: none; }
    [hidden] { display: none !important; }

    /* 左侧导航菜单 */
    .menu-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-size:13px; color:#C5CDD9; cursor:pointer; user-select:none; transition:all .15s; }
    .menu-item i { width:16px; text-align:center; }
    .menu-item:hover:not(.disabled) { background:rgba(255,255,255,.08); color:#fff; }
    .menu-item.active { background:#165DFF; color:#fff; }
    .menu-item.active i { color:#fff; }
    .menu-item.disabled { opacity:.45; cursor:not-allowed; }
    .menu-item em { font-style:normal; }
    .menu-item.proto-element.active-highlight { box-shadow:0 0 0 2px #F59E0B, 0 4px 12px rgba(245,158,11,.25); background:#165DFF; }
    /* 状态药丸 / 横幅 */
    .status-pill, .version-pill { transition:all .2s; }
    #stateBanner { transition:all .2s; }
  </style>
</head>
<body class="bg-gray-50">

  <button class="mobile-toggle-btn" id="mobileToggle" onclick="toggleMobileView()"><i class="fas fa-info"></i></button>

  <div id="app" class="flex h-screen relative">

    <!-- ============ 产品侧（菜单 + 内容），占 80% ============ -->
    <div id="left-panel" class="flex" style="width:80%">

      <!-- 左侧导航菜单 -->
      <aside id="appMenu" class="bg-[#0E1B33] text-gray-300 flex flex-col relative z-10" style="width:208px;flex:none">
        <div class="px-4 py-4 border-b border-white/10 flex items-center gap-2">
          <div class="w-8 h-8 bg-[#165DFF] rounded-lg flex items-center justify-center text-white"><i class="fas fa-cube"></i></div>
          <div><div class="text-white font-semibold text-sm leading-tight">低代码平台</div><div class="text-[10px] text-gray-400">Light Code</div></div>
        </div>
        <div class="px-3 py-3 flex-1 overflow-y-auto">
          <div class="text-[10px] uppercase tracking-wider text-gray-500 mb-2 px-2">应用 · 行政办公</div>
          <div class="menu-item active"><i class="fas fa-file-signature"></i><span>工作表单</span></div>
          <div class="menu-item" onclick="parent.postMessage({type:'switch',mod:'flow'},'*')"><i class="fas fa-project-diagram"></i><span>流程中心</span></div>
          <div class="menu-item" onclick="parent.postMessage({type:'switch',mod:'app'},'*')"><i class="fas fa-th-large"></i><span>应用中心</span></div>
        </div>
        <div class="px-3 py-3 border-t border-white/10">
          <div class="menu-item"><i class="fas fa-cog"></i><span>平台设置</span></div>
          <div class="flex items-center gap-2 px-2 py-1.5 mt-1 text-xs text-gray-400"><i class="fas fa-user-circle"></i> 产品同学</div>
        </div>
      </aside>

      <!-- 内容主区 -->
      <div id="mainCol" class="flex-1 flex flex-col min-w-0 relative">
      <!-- 顶部导航 -->
      <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <h1 class="text-lg font-semibold text-gray-800">工作表单</h1>
          <span class="text-gray-300">/</span><span id="crumbView" class="text-sm text-gray-500">表单列表</span>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex bg-gray-100 rounded-lg p-0.5 text-sm">
            <button id="tabList" onclick="showView('list')" class="px-3 py-1.5 rounded-md font-medium seg bg-white text-[#165DFF] shadow-sm btn-click">表单列表</button>
            <button id="tabDesign" onclick="showView('designer')" class="px-3 py-1.5 rounded-md font-medium seg text-gray-500 btn-click">表单设计器</button>
          </div>
        </div>
      </header>
      <div id="scrollArea" class="flex-1 overflow-y-auto relative">

      <!-- ===================== 视图一：表单列表 ===================== -->
      <section id="listView" class="p-6">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-xl font-bold text-gray-800">表单列表</h2>
            <p class="text-sm text-gray-500 mt-1">展示当前应用下创建的全部表单，点击任意表单可进入设计器编辑</p>
          </div>
          <div class="proto-element" data-proto-id="1">
            <button onclick="createForm()" class="bg-[#165DFF] hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 btn-click transition-colors"><i class="fas fa-plus"></i> 创建表单</button>
          </div>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-4 mb-4 flex items-center gap-3 flex-wrap">
          <input type="text" placeholder="搜索表单名称" class="form-input border border-gray-300 rounded-lg px-3 py-2 text-sm w-64">
          <select class="form-input border border-gray-300 rounded-lg px-3 py-2 text-sm"><option>全部分类</option><option>人事</option><option>财务</option><option>行政</option></select>
          <button class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm btn-click"><i class="fas fa-search mr-1"></i> 查询</button>
        </div>
        <div class="proto-element bg-white rounded-lg border border-gray-200 overflow-hidden" data-proto-id="1">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-gray-500 bg-[#F5F7FA]">
              <th class="px-4 py-3 font-semibold">表单名称</th><th class="px-4 py-3 font-semibold">分类</th>
              <th class="px-4 py-3 font-semibold">引用数</th><th class="px-4 py-3 font-semibold">状态</th>
              <th class="px-4 py-3 font-semibold">创建人</th><th class="px-4 py-3 font-semibold">创建时间</th><th class="px-4 py-3 font-semibold text-center">操作</th>
            </tr></thead>
            <tbody id="formTableBody"></tbody>
          </table>
          <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200">
            <span class="text-sm text-gray-500" id="formCount"></span>
            <div class="flex items-center gap-1">
              <button class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-500 btn-click">上一页</button>
              <button class="px-3 py-1 bg-[#165DFF] text-white rounded text-sm">1</button>
              <button class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-500 btn-click">下一页</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ===================== 视图二：表单设计器 ===================== -->
      <section id="designerView" class="flex" style="height: calc(100vh - 56px)" hidden>
        <!-- 左：控件面板 -->
        <aside class="bg-white border-r border-gray-200 overflow-y-auto" style="width:220px;flex:none">
          <div class="px-4 py-3 border-b border-gray-100">
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">控件库</div>
            <div class="text-[11px] text-gray-400 mt-1">拖拽或点击控件加入画布</div>
          </div>
          <div class="proto-element p-3 space-y-4" data-proto-id="2" id="palette">
            <div><div class="text-xs font-semibold text-gray-500 mb-2 px-1"><i class="fas fa-shapes mr-1 text-[#165DFF]"></i>基础控件</div><div class="space-y-1.5" id="grpBasic"></div></div>
            <div><div class="text-xs font-semibold text-gray-500 mb-2 px-1"><i class="fas fa-list-ul mr-1 text-[#165DFF]"></i>选择控件</div><div class="space-y-1.5" id="grpSelect"></div></div>
            <div><div class="text-xs font-semibold text-gray-500 mb-2 px-1"><i class="fas fa-layer-group mr-1 text-[#165DFF]"></i>高级控件</div><div class="space-y-1.5" id="grpAdvanced"></div></div>
            <div><div class="text-xs font-semibold text-gray-500 mb-2 px-1"><i class="fas fa-briefcase mr-1 text-[#165DFF]"></i>业务控件</div><div class="space-y-1.5" id="grpBiz"></div></div>
          </div>
        </aside>

        <!-- 中：画布 -->
        <main class="flex-1 overflow-y-auto bg-[#F5F7FA] p-6" id="canvasScroll">
          <div class="mx-auto" id="canvasMaxWrap">
      <div class="bg-white rounded-t-lg border border-b-0 border-gray-200 px-5 py-3 flex items-center justify-between gap-3">
        <!-- 左侧：表单名称 + 状态 + 版本 -->
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <input id="formNameInput" class="text-lg font-bold text-gray-800 border-none focus:ring-0 bg-transparent min-w-0" style="width:100%;max-width:220px" value="未命名表单" oninput="onFormNameChange()">
          <span id="statusPill" class="status-pill px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700 whitespace-nowrap">草稿</span>
          <span id="versionPill" class="version-pill px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-500 whitespace-nowrap">v0</span>
        </div>

        <!-- 右侧：工具组 + 主操作组 -->
        <div class="flex items-center gap-2 flex-shrink-0">
          <!-- 工具组：预览 / 版本 -->
          <div class="flex items-center bg-gray-50 rounded-lg p-0.5 border border-gray-100 flex-shrink-0">
            <button onclick="previewForm()" class="px-2 py-1.5 text-xs text-gray-600 hover:text-[#165DFF] hover:bg-white rounded-md btn-click flex items-center gap-1" title="运行态预览">
              <i class="fas fa-eye"></i><span>预览</span>
            </button>
            <button onclick="showVersions()" data-proto-id="8" class="px-2 py-1.5 text-xs text-gray-600 hover:text-[#165DFF] hover:bg-white rounded-md btn-click flex items-center gap-1" title="版本历史与表锁定">
              <i class="fas fa-history"></i><span>版本</span>
            </button>
            <button onclick="if(currentFormId)openFormData(currentFormId);else alert('请先保存并选择表单');" class="px-2 py-1.5 text-xs text-gray-600 hover:text-[#165DFF] hover:bg-white rounded-md btn-click flex items-center gap-1" title="查看本表单提交数据">
              <i class="fas fa-table"></i><span>数据</span>
            </button>
          </div>

          <div class="w-px h-5 bg-gray-200 mx-0.5 flex-shrink-0"></div>

          <!-- 主操作组：保存 + 发布/下架 -->
          <button onclick="saveForm()" class="px-3 py-1.5 rounded-md text-xs font-medium btn-click border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 hover:text-[#165DFF] flex-shrink-0">
            <i class="fas fa-save mr-1"></i>保存
          </button>
          <button id="publishBtn" onclick="publishForm()" data-proto-id="7" class="px-3 py-1.5 rounded-md text-xs font-medium btn-click bg-[#165DFF] hover:bg-blue-600 text-white shadow-sm flex-shrink-0">
            <i class="fas fa-rocket mr-1"></i>发布
          </button>
          <button id="unpublishBtn" onclick="unpublishForm()" class="hidden px-3 py-1.5 rounded-md text-xs font-medium btn-click bg-white border border-red-200 text-red-600 hover:bg-red-50 hover:text-red-700 flex-shrink-0">
            <i class="fas fa-eye-slash mr-1"></i>下架
          </button>
        </div>
      </div>
      <div id="stateBanner" class="px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-blue-50 text-blue-700" style="display:none"></div>
            <div class="proto-element bg-white border border-gray-200 rounded-b-lg p-5 min-h-[440px]" data-proto-id="3" id="canvas"
                 ondragover="onCanvasDragOver(event)" ondragleave="onCanvasDragLeave(event)" ondrop="onCanvasDrop(event)" onclick="onCanvasClick(event)">
              <div id="canvasFields" style="display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-items:start"></div>
              <div id="canvasEmpty" class="text-center text-gray-400 text-sm py-20">
                <i class="fas fa-arrow-left text-2xl mb-2 block"></i>从左侧拖拽控件到此处开始搭建表单
              </div>
              <div class="mt-4 text-center text-[11px] text-gray-300"><i class="fas fa-arrows-alt mr-1"></i>提示：拖动字段卡片可调整顺序；点击空白处可配置表单</div>
            </div>
          </div>
        </main>

        <!-- 右：配置面板 -->
        <aside class="bg-white border-l border-gray-200 overflow-y-auto" style="width:330px;flex:none">
          <div class="px-4 py-3 border-b border-gray-100">
            <div class="flex items-center gap-2 mb-2">
              <i class="fas fa-sliders-h text-[#165DFF]"></i><span class="text-sm font-semibold text-gray-700">配置面板</span>
              <span id="cfgContext" class="ml-auto text-[11px] text-gray-400"></span>
            </div>
            <div id="cfgTabs" class="flex bg-gray-100 rounded-lg p-0.5 text-xs">
              <button id="tabCfgForm" onclick="onFormTabClick()" class="flex-1 px-2 py-1.5 rounded-md font-medium btn-click">表单配置</button>
            </div>
          </div>
          <div class="proto-element p-4" data-proto-id="4" id="configPanel">
            <div id="configBody"></div>
          </div>
        </aside>
      </section>
      </div><!-- /scrollArea -->
    </div><!-- /mainCol -->
  </div><!-- /left-panel -->

    <div id="divider" class="w-px bg-gray-300"></div>

    <!-- ============ 右 20%：备注逻辑 ============ -->
    <div id="right-panel" class="overflow-y-auto bg-amber-50 border-l-2 border-dashed border-amber-300" style="width:20%">
      <div class="p-4">
        <div class="mb-4 p-3 bg-amber-100 border border-amber-300 rounded-lg">
          <div class="flex items-center gap-2 mb-1">

                <p class="text-xs text-gray-500 mt-1">每次发布生成<b>不可变版本</b>（可点击<b>查看</b>在画布上展示该版本字段结构）；<b>恢复并发布</b>以该版本内容重新上线、版本号不变；<b>表锁定</b>按提交时 schema 渲染历史数据，改版不扰乱在途流程。</p></div></div>
          </div>
          <div class="proto-desc p-3" data-proto-id="9">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">9</span>
              <div><h3 class="text-sm font-semibold text-gray-800">最终结论 · 工作表单与组件开发逻辑</h3>
                <p class="text-xs text-gray-500 mt-1 leading-relaxed">以下为与产品确认后的<b>最终开发逻辑</b>（供开发直接参照）：</p>
                <div class="text-xs text-gray-600 mt-2 space-y-2">
                  <p><b>① 工作表单删除保护：</b>被任一「应用菜单 / 流程任务」引用的表单，删除时<b>拦截并提示"此表单已被引用，不可删除"</b>；仅「无引用」的草稿表单允许删除。解除引用须在对应菜单/流程配置处操作。</p>
                  <p><b>② 工作表单状态与版本号（核心规则）：</b></p>
                  <p class="pl-3">· 三种状态：<b>草稿（未发布）</b> / <b>草稿（已下架）</b>（曾发布后下架）/ <b>已发布（vN）</b>。</p>
                  <p class="pl-3">· <b>版本号变化规则</b>：首次发布生成 <b>v1</b>；后续发布时，将「本次内容与<b>上一个线上版本快照</b>」做全量比对——<b>内容有任意变化 → 版本号 +1</b>；<b>编辑后内容与原线上版本完全相同（无丝毫变化）→ 版本号保持不变</b>，仅刷新发布信息；历史版本可「恢复并发布」以该版本内容重新上线，<b>版本号保持原值</b>。</p>
                  <p class="pl-3">· <b>表单名称全局唯一</b>：发布时校验重名，重复则提示"表单名称需唯一"。</p>
                  <p class="pl-3">· <b>表锁定</b>：每条提交数据记录提交时刻的版本号，历史数据按当时 schema 渲染，改版不扰乱在途流程。</p>
                  <p><b>③ 业务控件默认值位置：</b>成员 / @部门 / @工作表单 / @动态圈 的默认值，移至「<b>专属配置 · 选择范围</b>」下方维护（默认候选受范围约束）；其余控件默认值仍在<b>通用配置</b>。</p>
                  <p><b>④ 工作表单数据列表（设计者自查）：</b>通过「工作表单 · 数据」进入的数据列表为只读自查，<b>不展示新增 / 导入按钮</b>，且<b>不展示预览视图选择器</b>。</p>
                  <p><b>⑤ 列表创建时间：</b>统一格式为 <b>YYYY-MM-DD HH:mm</b>（如 2025-10-16 11:18）。</p>
                  <p><b>⑥ 下拉单选选项来源：</b>选项来源为<b>数据字典 / 远程 API</b> 时，隐藏静态「选项列表」（运行态动态加载）；仅"静态录入"时维护选项列表。</p>
                  <p><b>⑦ 表单画布：</b>设计器工具组去掉 <b>Schema</b> 按钮（Schema 仍可在版本/导出等渠道查看）。</p>
                  <p><b>⑧ 工作表单数据无状态 / 无暂存：</b>工作表单提交后<b>不进入审批流程</b>，故数据列表<b>无审批状态（无审批中 / 已通过 / 已驳回 等）</b>，列表仅展示「表单字段 + 提交人 + 提交时间」；同时<b>不展示「草稿 / 暂存」类记录</b>，未正式提交的暂存草稿不进入数据列表。</p>
                  <p><b>⑨ 表单下架语义（软下线 · 仅阻止新增引用）：</b>下架不改变任何"已建立关系"——已 1:1 绑定该表单的流程<b>仍可正常发起并填表</b>，已将该表单挂载为菜单素材的菜单项<b>仍可正常进入并提交</b>，已发起实例与已提交数据<b>不受影响、保留可查</b>；下架仅阻止"新增引用"：下架后<b>不能再被新流程绑定、不能再被新应用菜单挂载</b>（挂载向导只列"已发布"素材，下架素材天然不可选）；表单自身状态回退"草稿（已下架）"但仍保留历史版本快照可查，可重新「发布」上线。下架横幅文案：「表单『{名称}』已下架。已绑定该表单的流程、已挂载的菜单仍可正常使用；不再接受新的流程绑定与菜单挂载。历史版本（v1…vN）保留可查，可重新发布上线。」</p>
                  <p><b>⑩ 字段字符长度限制（通用规则）：</b>所有「名称类」字段统一上限 <b>20 个字符</b>、「描述类」字段统一上限 <b>500 个字符</b>，超出即禁止继续输入（前端 maxlength 硬限制 + 后端校验，保存 / 发布时若超限提示「{字段}不可超过 N 字」）。本模块适用：表单<b>名称 ≤ 20</b> 字、表单<b>描述 ≤ 500</b> 字。</p>
                </div>
              </div>
            </div>

    <div class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-800" id="dpTitle">选择默认项</h3>
        <button onclick="closeModal('formDefaultPickerModal')" class="text-gray-400 hover:text-gray-600 btn-click"><i class="fas fa-times"></i></button>
      </div>
      <div class="px-6 py-4">
        <input id="dpSearch" oninput="defaultPickerFilter(this)" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm mb-3" placeholder="搜索">
        <div id="dpList" class="max-h-60 overflow-auto border border-gray-100 rounded-md divide-y divide-gray-50"></div>
        <div class="mt-3 text-xs text-gray-500">已选：<span id="dpCount" class="text-[#165DFF] font-medium">0</span> 项</div>
        <div id="dpSel" class="flex flex-wrap gap-1.5 mt-1"></div>
      </div>
      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50">
        <button onclick="closeModal('formDefaultPickerModal')" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 btn-click">取消</button>
        <button onclick="confirmDefaultPicker()" class="px-4 py-2 bg-[#165DFF] hover:bg-blue-600 text-white text-sm rounded-lg font-medium btn-click">确定</button>
      </div>
    </div>
  </div>

  <script>
  /* ===================== 控件定义 ===================== */
  const CONTROL_DEFS = {
    text:    { group:'basic',    icon:'fa-font',         label:'单行文本', fnPrefix:'text',  defaults:()=>({placeholder:'请输入',defaultValue:'',defaultType:'manual',maxLength:50,minLength:0,format:'none',password:false,trim:true,errMsg:'',linkage:{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''}}) },
    textarea:{ group:'basic',    icon:'fa-align-left',   label:'多行文本', fnPrefix:'textarea', defaults:()=>({placeholder:'请输入',defaultValue:'',defaultType:'manual',maxLength:500,minLength:0,rows:4,trim:true,showCount:true,errMsg:'',linkage:{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''}}) },
    number:     { group:'basic',    icon:'fa-hashtag',      label:'数字',     fnPrefix:'number', defaults:()=>({placeholder:'请输入数字',defaultValue:'',defaultType:'manual',min:null,max:null,precision:0,unit:'',showStepper:true,thousand:false,errMsg:''}) },
    radio:      { group:'select',   icon:'fa-dot-circle',   label:'单选按钮组', fnPrefix:'radio', defaults:()=>({source:'static',dictKey:'',apiUrl:'',options:[{label:'选项一',value:'opt1'},{label:'选项二',value:'opt2'}],defaultValue:'',defaultType:'manual'}) },
    checkbox:   { group:'select',   icon:'fa-check-square', label:'多选按钮组', fnPrefix:'checkbox', defaults:()=>({source:'static',dictKey:'',apiUrl:'',options:[{label:'选项一',value:'opt1'},{label:'选项二',value:'opt2'}],limitChoose:false,minChoose:1,maxChoose:3,defaultValue:[],defaultType:'manual'}) },
    datetime:   { group:'basic',    icon:'fa-calendar-alt', label:'日期时间',  fnPrefix:'datetime', defaults:()=>({dateType:'datetime',format:'YYYY-MM-DD HH:mm',defaultValue:'',defaultType:'manual',minDate:'',maxDate:''}) },
    multiselect:{ group:'select',   icon:'fa-list-ul',      label:'下拉多选',  fnPrefix:'multiselect', defaults:()=>({source:'static',dictKey:'',apiUrl:'',options:[{label:'选项一',value:'opt1'},{label:'选项二',value:'opt2'}],limitChoose:false,minChoose:1,maxChoose:3,searchable:true,defaultValue:[],defaultType:'manual'}) },
    divider:    { group:'basic',    icon:'fa-minus',        label:'分隔线',    fnPrefix:'divider', defaults:()=>({showText:false,text:'',divPos:'center',divStyle:'solid'}) },
    select:  { group:'select',   icon:'fa-caret-down',   label:'下拉单选', fnPrefix:'select', defaults:()=>({placeholder:'请选择',searchable:false,allowCustom:false,defaultValue:'',defaultType:'manual',source:'static',apiUrl:'',dictKey:'',options:[{label:'选项一',value:'opt1'},{label:'选项二',value:'opt2'}]}) },
    subform: { group:'advanced', icon:'fa-table',        label:'子表单',   fnPrefix:'subform', defaults:()=>({minRows:0,maxRows:10,allowAdd:true,showSummary:false,defaultValue:'',defaultType:'manual',subFields:[{label:'明细名称',type:'text'},{label:'金额',type:'number'}]}) },
    member:  { group:'biz',      icon:'fa-user-friends', label:'成员',     fnPrefix:'member', defaults:()=>({multi:false,range:'all',depts:[],roles:[],defaultValue:'',defaultType:'manual',includeDept:false}) },
    dept:    { group:'biz',      icon:'fa-sitemap',      label:'@部门',    fnPrefix:'dept',   defaults:()=>({multi:false,range:'all',depts:[],roles:[],defaultValue:'',defaultType:'manual',includeDept:false}) },
    formref: { group:'biz',      icon:'fa-file-alt',     label:'@工作表单', fnPrefix:'formref',defaults:()=>({multi:false,range:'all',depts:[],roles:[],defaultValue:'',defaultType:'manual',includeDept:false}) },
    feed:    { group:'biz',      icon:'fa-comments',     label:'@动态圈',  fnPrefix:'feed',   defaults:()=>({multi:false,range:'all',depts:[],roles:[],defaultValue:'',defaultType:'manual',includeDept:false}) },
    signature:  { group:'advanced', icon:'fa-signature',    label:'电子签名',  fnPrefix:'signature', defaults:()=>({signMode:'hand',penColor:'#165DFF',signHeight:120,showWatermark:false}) },
    address:    { group:'basic',    icon:'fa-map-marker-alt', label:'地址',    fnPrefix:'address',   defaults:()=>({addrShow:{province:true,city:true,district:true,detail:true},requireDetail:true,placeholder:'请选择/输入地址'}) },
    image:      { group:'advanced', icon:'fa-image',        label:'图片',     fnPrefix:'image',     defaults:()=>({uploadMode:'local',maxCount:1,maxSize:5,formats:['png','jpg','jpeg'],compress:true}) },
    attachment: { group:'advanced', icon:'fa-paperclip',    label:'附件',     fnPrefix:'attachment',defaults:()=>({maxCount:3,maxSize:10,formats:['doc','docx','pdf','xls','xlsx'],required:false}) },
    location:   { group:'advanced', icon:'fa-map-pin',      label:'定位',     fnPrefix:'location',  defaults:()=>({accuracy:100,showMap:true,locateMode:'auto',placeholder:'点击获取定位'}) },
    cascader:   { group:'select',   icon:'fa-stream',       label:'多级查询', fnPrefix:'cascader',  defaults:()=>({levels:2,cascadeLevels:[{name:'省'},{name:'市'}],searchable:false,defaultValue:''}) },
    autonumber: { group:'advanced', icon:'fa-barcode',      label:'自动编号', fnPrefix:'autonumber',defaults:()=>({prefix:'XS',dateFmt:'YYYYMMDD',seqLen:4,suffix:'',start:1,step:1,reset:'none'}) },
  };
  const GROUP_MAP = { basic:'grpBasic', select:'grpSelect', advanced:'grpAdvanced', biz:'grpBiz' };
  /* 成员式选择器（@成员 / @部门 / @工作表单 / @动态圈）共用元数据：仅名词与占位不同，交互同构 */
  const PICKER_META = {
    member:  { noun:'成员',     ph:'请选择成员',     scopeAll:'全部成员' },
    dept:    { noun:'部门',     ph:'请选择部门',     scopeAll:'全部部门' },
    formref: { noun:'工作表单', ph:'请选择工作表单', scopeAll:'全部工作表单' },
    feed:    { noun:'动态圈',   ph:'请选择动态',     scopeAll:'全部动态圈' },
  };
  function pickerScope(f){ const m=PICKER_META[f.type]||PICKER_META.member; return f.range==='all'?m.scopeAll:(f.range==='dept'?((f.depts||[]).join('/')||'指定部门'):((f.roles||[]).join('/')||'指定角色')); }
  /* 多级查询（级联）示例数据：国家 → 城市 → 区县（演示逐级下拉），可替换为业务字典 */
  const CASCADER_SAMPLE = [
    { label:'中国', children:[
      { label:'北京', children:[{label:'东城区'},{label:'西城区'},{label:'朝阳区'},{label:'海淀区'}] },
      { label:'上海', children:[{label:'黄浦区'},{label:'徐汇区'},{label:'浦东新区'}] },
      { label:'广东', children:[{label:'广州',children:[{label:'天河区'},{label:'越秀区'}]},{label:'深圳',children:[{label:'南山区'},{label:'福田区'}]}] },
    ]},
    { label:'美国', children:[
      { label:'加利福尼亚', children:[{label:'洛杉矶'},{label:'旧金山'}] },
      { label:'纽约', children:[{label:'曼哈顿'},{label:'布鲁克林'}] },
    ]},
  ];
  function cascadeOptionsAt(f, pathIdx){
    // 根据已选路径返回第 pathIdx 级的可选项
    let nodes = CASCADER_SAMPLE;
    const sel = (f._casSel||[]);
    for(let i=0;i<pathIdx;i++){ const cur = nodes.find(n=>n.label===sel[i]); nodes = cur ? (cur.children||[]) : []; }
    return nodes;
  }
  /* 子表单列类型标签（列类型由拖入的控件决定，不可在面板中更改） */
  const SUB_TYPE_LABEL = { text:'文本', number:'数字', date:'日期', select:'下拉', member:'成员', textarea:'多行', dept:'部门', formref:'表单', feed:'动态', signature:'签名', address:'地址', image:'图片', attachment:'附件', location:'定位', cascader:'级联', autonumber:'编号' };

  const SPAN_OPTS = [['12','整行(100%)'],['6','1/2 行(50%)'],['4','1/3 行(33%)'],['3','1/4 行(25%)']];
  const LABEL_W = { narrow:'80px', medium:'110px', wide:'140px', auto:'auto' };
  const LW_OPTS = [['inherit','继承表单级'],['auto','自动'],['narrow','窄 (80px)'],['medium','中 (110px)'],['wide','宽 (140px)']];
  const FORMATS = { none:'无', phone:'手机号', email:'邮箱', idcard:'身份证', number:'数字', letter:'字母', chinese:'中文' };
  /* 预览态格式校验正则 + 默认失败提示（与「校验失败提示」配置联动） */
  const FORMAT_REGEX = {
    phone:/^1[3-9]\d{9}$/,
    email:/^[^\s@]+@[^\s@]+\.[^\s@]+$/,
    idcard:/^\d{17}[\dXx]$/,
    number:/^-?\d+(\.\d+)?$/,
    letter:/^[a-zA-Z]+$/,
    chinese:/^[\u4e00-\u9fa5]+$/,
  };
  const DEFAULT_FMT_MSG = {
    phone:'请输入正确的手机号（11 位数字）',
    email:'请输入正确的邮箱地址',
    idcard:'请输入正确的身份证号（18 位）',
    number:'只能输入数字',
    letter:'只能输入字母',
    chinese:'只能输入中文',
  };
  const DEFAULT_TYPES = [['manual','手动填写'],['formula','公式编辑'],['currentUser','当前用户'],['today','当前日期'],['linkage','数据联动']];
  const DEPTS = ['产品部','研发部','市场部','财务部','人事部','行政部','销售部'];
  const ROLES = ['管理员','部门负责人','普通员工','财务审核','HRBP','审批人'];
  // 可供数据联动选择的关联表单（演示数据）
  const LINKAGE_FORMS = [
    { id:'dept_info', name:'部门信息表', fields:[{field:'dept_name',label:'部门名称'},{field:'dept_leader',label:'部门负责人'},{field:'leader_phone',label:'负责人电话'}] },
    { id:'user_info', name:'员工档案表', fields:[{field:'user_name',label:'姓名'},{field:'user_phone',label:'手机号'},{field:'user_email',label:'邮箱'}] },
    { id:'project_info', name:'项目信息表', fields:[{field:'project_code',label:'项目编号'},{field:'project_name',label:'项目名称'},{field:'pm_name',label:'项目经理'}] },
  ];
  /* 文本转义（组件名/默认值可能含引号等特殊字符） */
  function esc(s){ return (s==null?'':String(s)).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
  /* 默认值选择器（@成员 / @部门 / @工作表单 / @动态圈 在「默认值·手动填写」时需选具体实体，而非手输文本）
     候选数据取自各类型样例集；单选取 radio，多选取 checkbox，确定后写入 f.defaultValue */
  /* 成员名录（带部门/角色归属），用于「默认值选择器」按可选范围反查候选子集 */
  const MEMBER_DIR = [
    { name:'张三', dept:'研发部', roles:['管理员','审批人'] },
    { name:'李四', dept:'研发部', roles:['普通员工'] },
    { name:'王五', dept:'产品部', roles:['部门负责人'] },
    { name:'赵六', dept:'产品部', roles:['普通员工'] },
    { name:'孙七', dept:'市场部', roles:['普通员工'] },
    { name:'周八', dept:'财务部', roles:['财务审核'] },
    { name:'吴九', dept:'人事部', roles:['HRBP'] },
    { name:'郑十', dept:'行政部', roles:['普通员工'] },
    { name:'钱一', dept:'销售部', roles:['普通员工'] },
  ];
  const DEFAULT_PICKER_DATA = {
    member:  MEMBER_DIR,
    dept:    DEPTS,
    formref: ['报销申请单','请假申请表','采购订单','客户信息登记表','项目周报表','资产领用单'],
    feed:    ['部门公告圈','项目协作圈','公司动态圈','技术分享圈','客户反馈圈','新人交流圈'],
  };
  let dpCtx = { fieldId:null, type:null, multi:false, sel:[], query:'' };
  function openDefaultPicker(fieldId){
    const f=fields.find(x=>x.id===fieldId); if(!f) return;
    dpCtx = { fieldId, type:f.type, multi:!!f.multi, range:f.range||'all', depts:f.depts||[], roles:f.roles||[], sel: Array.isArray(f.defaultValue)?[...f.defaultValue]:(f.defaultValue?[f.defaultValue]:[]), query:'' };
    const se=document.getElementById('dpSearch'); if(se) se.value='';
    renderDefaultPicker(); openModal('formDefaultPickerModal');
  }
  function renderDefaultPicker(){
    const m=PICKER_META[dpCtx.type]||PICKER_META.member; const noun=m.noun;
    const t=document.getElementById('dpTitle'); if(t) t.textContent='选择默认'+noun;
    let all=(DEFAULT_PICKER_DATA[dpCtx.type]||[]);
    let scopeNote='';
    if(dpCtx.type==='member'){
      if(dpCtx.range==='dept'){
        all = all.filter(x=>(dpCtx.depts||[]).includes(x.dept));
        scopeNote = (dpCtx.depts&&dpCtx.depts.length) ? ('仅限部门：'+(dpCtx.depts.join('/'))) : '请先在专属配置选择「指定部门」范围';
      } else if(dpCtx.range==='role'){
        all = all.filter(x=>(x.roles||[]).some(r=>(dpCtx.roles||[]).includes(r)));
        scopeNote = (dpCtx.roles&&dpCtx.roles.length) ? ('仅限角色：'+(dpCtx.roles.join('/'))) : '请先在专属配置选择「指定角色」范围';
      }
    } else if(dpCtx.type==='dept'){
      if(dpCtx.range==='dept'){
        all = (dpCtx.depts&&dpCtx.depts.length)?dpCtx.depts:DEPTS;
        scopeNote = (dpCtx.depts&&dpCtx.depts.length) ? ('仅限部门：'+(dpCtx.depts.join('/'))) : '请先在专属配置选择「指定部门」范围';
      }
    }
    const labelOf = v => (typeof v==='string')?v:v.name;
    const q=(dpCtx.query||'').trim().toLowerCase();
    const list = q ? all.filter(x=>labelOf(x).toLowerCase().includes(q)) : all;
    const lst=document.getElementById('dpList');
    if(lst){
      let html='';
      if(!list.length){ html = '<div class="text-xs text-gray-400 p-4">'+(scopeNote||'无匹配项')+'</div>'; }
      else {
        html = list.map(v=>{ const nm=labelOf(v); return `<label class="flex items-center gap-2 px-3 py-2 text-sm hover:bg-blue-50 cursor-pointer rounded ${dpCtx.sel.includes(nm)?'bg-blue-50':''}"><input type="${dpCtx.multi?'checkbox':'radio'}" name="dpItem" ${dpCtx.sel.includes(nm)?'checked':''} onchange="toggleDefaultPick('${esc(nm)}')"> ${esc(nm)}</label>`; }).join('');
        if(scopeNote) html = `<div class="px-3 py-1.5 text-[11px] text-gray-500 bg-gray-50 border-b border-gray-100">${scopeNote}</div>` + html;
      }
      lst.innerHTML = html;
    }
    const sel=document.getElementById('dpSel');
    if(sel) sel.innerHTML = dpCtx.sel.length ? dpCtx.sel.map(v=>`<span class="inline-flex items-center gap-1 pl-2 pr-1 py-0.5 rounded-full bg-[#165DFF]/10 text-[#165DFF] text-[11px]">${esc(v)}<button onclick="removeDefaultPick('${esc(v)}')" class="hover:text-red-600 btn-click"><i class="fas fa-times"></i></button></span>`).join(' ') : '<span class="text-[11px] text-gray-400">尚未选择</span>';
    const cnt=document.getElementById('dpCount'); if(cnt) cnt.textContent=dpCtx.sel.length;
  }
  function defaultPickerFilter(input){ dpCtx.query=input.value; renderDefaultPicker(); }
  function toggleDefaultPick(v){
    if(dpCtx.multi){ if(dpCtx.sel.includes(v)) dpCtx.sel=dpCtx.sel.filter(x=>x!==v); else dpCtx.sel.push(v); }
    else { dpCtx.sel=[v]; }
    renderDefaultPicker();
  }
  function removeDefaultPick(v){
    dpCtx.sel=dpCtx.sel.filter(x=>x!==v);
    const f=fields.find(x=>x.id===dpCtx.fieldId); if(f){ if(Array.isArray(f.defaultValue)) f.defaultValue=f.defaultValue.filter(x=>x!==v); else f.defaultValue=''; }
    renderDefaultPicker(); renderConfig(); renderCanvas();
  }
  function confirmDefaultPicker(){
    const f=fields.find(x=>x.id===dpCtx.fieldId); if(f){ f.defaultValue = dpCtx.multi ? [...dpCtx.sel] : (dpCtx.sel[0]||''); }
    closeModal('formDefaultPickerModal'); renderConfig(); renderCanvas();
  }

  let uid = 1;
  const nid = () => 'f' + (uid++);
  // 字段名自动生成：取标题做英文规范化（小写、空格/连字符→下划线、仅保留 a-z0-9_）；若标题全为中文/符号则回退到控件类型前缀；同表单内重名自动追加序号。创建时一次性生成并锁定，用户不可修改。
  function genFieldName(label, type){
    let base = (label||'').toString().trim().toLowerCase().replace(/[\s\-]+/g,'_').replace(/[^a-z0-9_]/g,'');
    if(!base) base = (CONTROL_DEFS[type] && CONTROL_DEFS[type].fnPrefix) || 'field';
    let name = base, i = 1;
    while(fields.some(f=>f.fieldName===name)) name = base + '_' + (i++);
    return name;
  }
  const getField = id => fields.find(x=>x.id===id);
  const fieldLabel = fn => { const f=fields.find(x=>x.fieldName===fn); return f?f.label:fn; };

  /* ===================== 表单级配置（完整） ===================== */
  let formName = '未命名表单';
  let formConfig = {
    name:'', desc:'', icon:'fa-file-alt', category:'未分类',
    submitScope:'all', submitDepts:[], submitRoles:[],
    allowDraft:true, allowMultiple:false, afterSubmit:'tip', afterUrl:'',
    editScope:'creator', editDepts:[], editRoles:[],
    labelPos:'top', labelAlign:'left', labelWidth:'medium', formWidth:'standard',
    printable:true, showSubmitTime:true, dedupe:false,
    views:[]
  };
  let currentViewId = 'view_default';
  /* 视图：同一表单可有多个展示视图，分别挂到不同应用菜单，实现差异化呈现（列表/查询/按钮/数据可见均按视图独立） */
  function currentView(){ return (formConfig.views&&formConfig.views.find(v=>v.id===currentViewId)) || (formConfig.views&&formConfig.views[0]) || { id:'__default__', name:'默认视图', isDefault:true, listFields:[], queryFields:[], listButtons:['add','export'], formButtons:{submit:true,draft:true,reset:true}, dataVisible:'creator', dataDept:[] }; }
  function ensureViews(f){
    const fc=f.fc; if(!fc.views||!fc.views.length){
      const allFields=(f.fields||[]).map(x=>({field:x.fieldName,label:x.label,sortable:false}));
      fc.views=[{ id:'view_default', name:'默认视图', isDefault:true,
        listFields:(fc.listFields&&fc.listFields.length)?fc.listFields:allFields,
        queryFields:fc.queryFields||[], listButtons:fc.listButtons||['add','export'],
        formButtons:fc.formButtons||{submit:true,draft:true,reset:true},
        dataVisible:fc.dataVisible||'creator', dataDept:fc.dataDept||[] }];
    }
    delete fc.listFields; delete fc.queryFields; delete fc.listButtons; delete fc.formButtons; delete fc.dataVisible; delete fc.dataDept;
  }
  function dvLabel(v){ return ({creator:'仅创建人',dept:'同部门',deptSub:'同部门及下级',all:'全部数据',rule:'按规则过滤'})[v]||v; }

  let fields = [];
  let selectedId = null;
  let currentFormId = null;
  let formViewingVersion = null; /* 非空=设计器处于历史版本只读查看态（存版本号） */
  let isCreating = false; /* 是否处于「创建表单」流程（进入创建页时隐藏右侧标签与上下文字样） */
  let rightTab = 'config'; /* 右面板一级切换：'config'=表单配置 / 'view'=视图管理（独立大模块） */
  let cfgCollapsed = { common:false, specific:false };

  const SAMPLE_FORMS = [
    { id:'form1', name:'请假申请单', status:'已发布', updatedAt:'2026-08-01', cat:'人事', creator:'王敏', createdAt:'2026-06-10 09:30',
      refs:[{type:'应用菜单',name:'行政办公 / 请假申请'},{type:'流程任务',name:'请假审批流程 · 发起节点'}],

  function currentForm(){ return currentFormId ? SAMPLE_FORMS.find(x=>x.id===currentFormId) : null; }
  function todayStr(){ const d=new Date(); const p=n=>(''+n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  /* 列表「创建时间」统一格式为 YYYY-MM-DD HH:mm；纯日期自动补 00:00，已含时分则保持 */
  function fmtDateTime(s){ if(!s) return '—'; s=String(s); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s+' 00:00' : s; }
  function statusInfo(f){
    if(f.status==='已发布') return { label:'已发布 v'+f.version, cls:'bg-green-100 text-green-600' };
    if(f.version>0) return { label:'草稿（已下架）', cls:'bg-gray-200 text-gray-600' };
    return { label:'草稿（未发布）', cls:'bg-amber-100 text-amber-600' };
  }
  /* 根据当前表单状态刷新设计器顶部状态药丸 / 版本 / 发布·下架按钮 / 横幅 */
  function refreshDesignerChrome(){
    const pill=document.getElementById('statusPill'), vp=document.getElementById('versionPill');
    const pub=document.getElementById('publishBtn'), unp=document.getElementById('unpublishBtn'), banner=document.getElementById('stateBanner');
    if(!pill) return;
    if(formViewingVersion) return; /* 历史版本查看态：保持只读横幅，不覆盖 */
    const f=currentForm();
    if(!f){
      pill.textContent='草稿（未保存）'; pill.className='status-pill px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700 whitespace-nowrap';
      vp.textContent='v0'; vp.className='version-pill px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-500 whitespace-nowrap';
      pub.classList.remove('hidden'); unp.classList.add('hidden'); banner.style.display='none';
      pub.innerHTML='<i class="fas fa-rocket mr-1"></i>发布'; return;
    }
    const si=statusInfo(f);
    pill.textContent=si.label; pill.className='status-pill px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap '+si.cls;
    vp.textContent='v'+f.version;
    const published = f.status==='已发布';
    pub.classList.toggle('hidden', published && !f.hasUnpublished);
    unp.classList.toggle('hidden', !published);
    pub.innerHTML = (published && f.hasUnpublished) ? '<i class="fas fa-rocket mr-1"></i>发布新版本' : '<i class="fas fa-rocket mr-1"></i>发布';
    if(published && f.hasUnpublished){
      banner.style.display='flex';
      banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-amber-50 text-amber-700';
      banner.innerHTML='<i class="fas fa-exclamation-triangle"></i> 本表单已发布（线上 <b>v'+f.version+'</b>），当前为<b>待发布修改</b>。点击「发布」生成 <b>v'+(f.version+1)+'</b> 并生效，已提交数据不受影响。';
    } else if(!published && f.version>0){
      banner.style.display='flex';
      banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-gray-50 text-gray-600';
      banner.innerHTML='<i class="fas fa-eye-slash"></i> 表单已下架，当前为<b>草稿</b>，不再接收提交；历史数据（v1…v'+f.version+'）保留可查。点击「发布」可重新上线为新版本。';
    } else { banner.style.display='none'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200'; banner.innerHTML=''; }
  }

  function buildFdToolbar(id){

  function renderFormData(id){
    const f=SAMPLE_FORMS.find(x=>x.id===id); const subs=(SAMPLE_SUBMISSIONS[id]||[]);
    const fcv=f.fc.views.find(v=>v.id===window.__fdViewId)||f.fc.views.find(v=>v.isDefault)||f.fc.views[0];
    const defs=(fcv.listFields&&fcv.listFields.length)?fcv.listFields:(fields||[]).map(x=>({field:x.fieldName,label:x.label,sortable:false}));
    const cols=defs.map(x=>({key:x.field,label:x.label,sortable:!!x.sortable}));
    const qfs=(fcv.queryFields||[]).map(x=>({field:x.field,label:x.label,mode:x.mode||'like'}));
    const kw=(document.getElementById('fdSearch')?document.getElementById('fdSearch').value:'').trim();
    const qvals=qfs.map(q=>({q, v:(document.getElementById('fdq_'+q.field)?document.getElementById('fdq_'+q.field).value:'').trim()}));
    const rows=subs.filter(s=>{
      if(kw && !(s.submitter.indexOf(kw)>=0||JSON.stringify(s.vals).indexOf(kw)>=0)) return false;
      for(const it of qvals){ if(!it.v) continue; const fv=String(s.vals[it.q.field]==null?'':s.vals[it.q.field]); if(fv.indexOf(it.v)<0) return false; }
      return true;
    });
    const headCols=cols.map(c=>`<th class="px-3 py-2 font-medium">${c.label}${c.sortable?' <i class="fas fa-sort text-gray-300 ml-0.5"></i>':''}</th>`).join('');
    const head=document.getElementById('fdHead'); if(head) head.innerHTML=headCols+'<th class="px-3 py-2 font-medium">提交人</th><th class="px-3 py-2 font-medium">提交时间</th>';
    const body=document.getElementById('fdBody'); if(!body) return;
    body.innerHTML = rows.length? rows.map(function(s){
      const cells=cols.map(function(c){var v=s.vals[c.key];return '<td class="px-3 py-2 text-gray-700">'+(v!==undefined&&v!==''?v:'<span class="text-gray-300">—</span>')+'</td>';}).join('');
      return '<tr class="border-t border-gray-100 hover:bg-[#165DFF]/5 cursor-pointer" onclick="showFormDetail(\''+id+'\',\''+s.id+'\')">'+cells+
        '<td class="px-3 py-2 text-gray-600">'+s.submitter+'</td>'+
        '<td class="px-3 py-2 text-gray-400">'+s.time+'</td>'+
      '</tr>';
    }).join('') : '<tr><td colspan="'+(cols.length+2)+'" class="px-3 py-8 text-center text-gray-400">没有符合条件的提交</td></tr>';
  }
  function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  function showFormDetail(id,sid){

        <div class="flex-1 min-w-0"><div class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm text-gray-800 bg-gray-50/50">${escapeHTML(v)}</div></div>

        '<div class="px-6 py-5 overflow-y-auto">'+
          '<div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-5">'+
            '<div class="flex items-center gap-2 px-5 py-3 border-b border-gray-100 bg-gray-50/70"><span class="w-7 h-7 rounded-lg bg-blue-50 text-[#165DFF] flex items-center justify-center"><i class="fas fa-file-alt text-xs"></i></span><h3 class="text-sm font-semibold text-gray-800">表单内容</h3></div>'+
            '<div class="px-5 py-4">'+fieldsHtml+'</div>'+
          '</div>'+
          '<div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">'+
            '<div class="flex items-center gap-2 px-5 py-3 border-b border-gray-100 bg-gray-50/70"><span class="w-7 h-7 rounded-lg bg-blue-50 text-[#165DFF] flex items-center justify-center"><i class="fas fa-info-circle text-xs"></i></span><h3 class="text-sm font-semibold text-gray-800">提交信息</h3></div>'+
            '<div class="px-5 py-3 space-y-0.5 text-sm">'+
              '<div class="flex justify-between py-1.5 border-b border-gray-50"><span class="text-gray-400">提交人</span><span class="text-gray-800 font-medium">'+escapeHTML(s.submitter)+'</span></div>'+
              '<div class="flex justify-between py-1.5 border-b border-gray-50"><span class="text-gray-400">提交时间</span><span class="text-gray-800 font-medium">'+escapeHTML(s.time)+'</span></div>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="px-6 py-3 border-t border-gray-200 flex justify-end flex-shrink-0"><button onclick="closeFormDetail()" class="px-4 py-1.5 text-sm rounded-md bg-gray-100 text-gray-600 btn-click">关闭</button></div>'+
      '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
  }
  function closeFormDetail(){ const e=document.getElementById('fdDetail'); if(e) e.remove(); }
  function exportFormData(id){ const n=(SAMPLE_SUBMISSIONS[id]||[]).length; alert('导出「'+(SAMPLE_FORMS.find(x=>x.id===id).name)+'」的 '+n+' 条提交数据为 Excel（原型演示）'); }
  function closeFormData(){ const e=document.getElementById('fdOverlay'); if(e) e.remove(); }

  /* ===================== 控件面板 ===================== */
  function renderPalette(){
    const groups = { basic:[], select:[], advanced:[], biz:[] };
    Object.entries(CONTROL_DEFS).forEach(([t,d])=>groups[d.group].push(t));
    Object.entries(groups).forEach(([g,types])=>{
      document.getElementById(GROUP_MAP[g]).innerHTML = types.map(t=>{
        const d=CONTROL_DEFS[t];
        return `<div class="ctrl-item flex items-center gap-2 px-3 py-2 rounded-md border border-gray-200 bg-white text-sm text-gray-700"
                     draggable="true" data-type="${t}" ondragstart="onCtrlDragStart(event,'${t}')" onclick="addFieldAt('${t}')">
                  <i class="fas ${d.icon} text-[#165DFF] w-4 text-center"></i><span>${d.label}</span></div>`;
      }).join('');
    });
  }

  /* ===================== 字段增删 / 排序 ===================== */
  function addFieldAt(type, index){
    const d=CONTROL_DEFS[type];
    const f=Object.assign({ id:nid(), type, label:d.label, fieldName:genFieldName(d.label,type), span:12, required:false, helpText:'', visible:{mode:'always',logic:'and',conditions:[{field:'',op:'eq',value:''}]} }, d.defaults());
    let idx = (index==null)?fields.length:index;
    if(idx<0) idx=0; if(idx>fields.length) idx=fields.length;
    fields.splice(idx,0,f); selectedId=f.id;
    renderCanvas(); renderConfig();
  }
  function moveField(id, toIndex){
    const from = fields.findIndex(f=>f.id===id); if(from<0) return;
    const [item]=fields.splice(from,1);
    let idx=toIndex; if(idx>from) idx--;
    if(idx<0) idx=0; if(idx>fields.length) idx=fields.length;
    fields.splice(idx,0,item); selectedId=id;
    renderCanvas(); renderConfig();
  }
  function deleteField(id){ fields=fields.filter(f=>f.id!==id); if(selectedId===id) selectedId=null; renderCanvas(); renderConfig(); }
  function selectField(id){ selectedId=id; renderCanvas(); renderConfig(); }
  function deselectField(){ selectedId=null; renderCanvas(); renderConfig(); }

  /* ===================== 拖拽（新增 + 排序） ===================== */
  let dragPayload=null, dropIndex=null;
  function onCtrlDragStart(e,type){ dragPayload={kind:'new',type}; e.dataTransfer.effectAllowed='copy'; e.dataTransfer.setData('text/plain',type); }
  function onFieldDragStart(e,id){ dragPayload={kind:'move',id}; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id); }
  function onCanvasDragOver(e){
    if(formViewingVersion) return;
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
    document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
    document.querySelectorAll('.subform-dragover').forEach(s=>s.classList.remove('subform-dragover'));
    // 拖入子表单区域：高亮整个子表单卡片并新增为「列」，不再落到顶层字段
    const subEl=e.target.closest('[data-subform]');
    if(subEl && dragPayload && dragPayload.kind==='new' && dragPayload.type!=='subform'){
      const card=subEl.closest('.field-card')||subEl;
      card.classList.add('subform-dragover'); dropIndex=fields.length; return;
    }
    const card=e.target.closest('.field-card');
    if(card){
      const r=card.getBoundingClientRect();
      const after = e.clientY > r.top + r.height/2;
      card.classList.add(after?'drop-after':'drop-before');
      const idx=fields.findIndex(f=>f.id===card.dataset.id);
      dropIndex = after ? idx+1 : idx;
    } else { dropIndex = fields.length; }
    document.getElementById('canvas').classList.add('canvas-dragover');
  }
  function onCanvasDragLeave(e){ document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('drop-before','drop-after')); document.querySelectorAll('.subform-dragover').forEach(s=>s.classList.remove('subform-dragover')); document.getElementById('canvas').classList.remove('canvas-dragover'); }
  function onCanvasDrop(e){
    if(formViewingVersion) return;
    e.preventDefault();
    document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
    document.querySelectorAll('.subform-dragover').forEach(s=>s.classList.remove('subform-dragover'));
    document.getElementById('canvas').classList.remove('canvas-dragover');
    const p=dragPayload; dragPayload=null;
    if(!p) return;
    // 落入子表单区域：作为一列追加（拖入的控件类型即该列类型）
    const subEl=e.target.closest('[data-subform]');
    if(subEl && p.kind==='new' && p.type!=='subform'){ addSubFromType(subEl.dataset.subform, p.type); dropIndex=null; return; }
    if(p.kind==='new') addFieldAt(p.type, dropIndex==null?fields.length:dropIndex);
    else if(p.kind==='move') moveField(p.id, dropIndex==null?fields.length:dropIndex);
    dropIndex=null;
  }
  /* 子表单：从左侧控件库拖入，新增为子表单的一列（由画布级 onCanvasDragOver/onCanvasDrop 统一处理，见上方） */
  function addSubFromType(fid, type){
    const f=fields.find(x=>x.id===fid); if(!f) return;
    const labelMap={text:'文本列',number:'数字列',date:'日期列',select:'下拉列',member:'成员列',textarea:'多行列',dept:'部门列',formref:'表单列',feed:'动态列',signature:'签名列',address:'地址列',image:'图片列',attachment:'附件列',location:'定位列',cascader:'级联列',autonumber:'编号列'};
    const colType = (type==='subform') ? 'text' : type;   // 子表单内不再嵌套子表单，降级为文本列
    f.subFields.push({ label:labelMap[type]||'列', type:colType });
    renderCanvas(); renderConfig();
  }
  function onCanvasClick(e){ if(formViewingVersion) return; const card=e.target.closest('.field-card'); if(card) selectField(card.dataset.id); else deselectField(); }

  /* ===================== 默认值展示计算 ===================== */
  function defaultDisplay(f){
    const t=f.defaultType||'manual';
    if(t==='manual') return f.defaultValue||'';
    if(t==='currentUser') return '👤 当前登录人';
    if(t==='today') return new Date().toISOString().slice(0,10);
    if(t==='formula') return 'ƒ '+(f.defaultValue||'公式');
    if(t==='linkage'){
      const lk=f.linkage||{};
      if(!lk.formId) return '⛓ 数据联动（未配置）';
      const fm=LINKAGE_FORMS.find(x=>x.id===lk.formId);
      const rf=(fm&&fm.fields.find(x=>x.field===lk.returnField))||{};
      return '⛓ 联动：'+(fm?fm.name:'未知表')+' · '+(rf.label||'未选返回值');
    }
    return '';
  }

  /* ===================== 公式编辑器 ===================== */
  const FUNC_CATEGORIES = [
    { name:'数学函数', funcs:['SUM()','AVG()','MAX()','MIN()','ROUND()','ABS()'] },
    { name:'文本函数', funcs:['CONCAT()','LEFT()','RIGHT()','LEN()','REPLACE()'] },
    { name:'日期函数', funcs:['TODAY()','NOW()','YEAR()','MONTH()','DAY()','DATEDIF()'] },
    { name:'逻辑函数', funcs:['IF()','AND()','OR()','NOT()'] },
  ];
  function openFormula(){
    const f=getField(selectedId); if(!f) return;
    document.getElementById('fmTargetName').textContent = f.label || '当前字段';
    const ta=document.getElementById('fmInput');
    ta.value = (f.defaultValue && f.defaultValue.startsWith('=')) ? f.defaultValue : '='+(f.defaultValue||'');
    document.getElementById('fmFields').innerHTML = fields.filter(x=>x.id!==f.id).map(x=>{
      return `<div class="text-xs text-gray-600 hover:text-[#165DFF] hover:bg-blue-50 rounded px-2 py-1.5 cursor-pointer truncate" onclick="insertAtFormula('{${x.fieldName}}')" title="${x.label}"><i class="fas fa-database text-[10px] mr-1 text-gray-400"></i>${x.label}</div>`;
    }).join('') || '<div class="text-xs text-gray-400 px-2">（暂无其他字段）</div>';
    document.getElementById('fmFuncs').innerHTML = FUNC_CATEGORIES.map(cat=>`
      <div class="mb-2">
        <div class="text-[11px] font-semibold text-gray-500 px-2 py-1">${cat.name}</div>
        ${cat.funcs.map(fn=>`<div class="text-xs text-gray-600 hover:text-[#165DFF] hover:bg-blue-50 rounded px-2 py-1 cursor-pointer font-mono" onclick="insertAtFormula('${fn}')">${fn}</div>`).join('')}
      </div>`).join('');
    openModal('formulaModal');
    ta.focus();
  }
  function insertAtFormula(txt){
    const el=document.getElementById('fmInput'); const s=el.selectionStart||el.value.length, e=el.selectionEnd||s;
    el.value=el.value.slice(0,s)+txt+el.value.slice(e); el.focus();
    if(el.setSelectionRange) el.setSelectionRange(s+txt.length, s+txt.length);
  }
  function saveFormula(){
    const f=getField(selectedId); if(!f) return;
    f.defaultValue=document.getElementById('fmInput').value.trim();
    closeFormula(); renderConfig(); renderCanvas();
  }
  function closeFormula(){ closeModal('formulaModal'); }

  /* ===================== 数据联动 ===================== */
  function openLinkage(){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    // 初始化弹窗
    const formSel=document.getElementById('lkForm');
    formSel.innerHTML = '<option value="">请选择数据库/表单</option>' + LINKAGE_FORMS.map(x=>`<option value="${x.id}" ${lk.formId===x.id?'selected':''}>${x.name}</option>`).join('');
    renderLinkageConditions(lk);
    renderLinkageReturn(lk);
    updateLinkagePreview();
    openModal('linkageModal');
  }
  function renderLinkageConditions(lk){
    const wrap=document.getElementById('lkConditions');
    const conds=lk.conditions||[];
    wrap.innerHTML = conds.map((c,i)=>{
      const localOpts = fields.filter(x=>x.id!==selectedId).map(x=>`<option value="${x.fieldName}" ${c.localField===x.fieldName?'selected':''}>${x.label}</option>`).join('') || '<option value="">（无）</option>';
      const refForm = LINKAGE_FORMS.find(x=>x.id===lk.formId);
      const refOpts = refForm ? refForm.fields.map(x=>`<option value="${x.field}" ${c.refField===x.field?'selected':''}>${x.label}</option>`).join('') : '<option value="">（请先选关联表）</option>';
      return `<div class="linkage-row">
        <select id="lk_local_${i}" class="form-input" onchange="onLinkageChange()">${localOpts}</select>
        <span class="text-sm text-gray-500">值等于</span>
        <select id="lk_ref_${i}" class="form-input" onchange="onLinkageChange()">${refOpts}</select>
        <span class="text-sm text-gray-500">的值时</span>
        ${conds.length>1?`<button class="text-gray-400 hover:text-red-500 btn-click" onclick="removeLinkageCond(${i})"><i class="fas fa-times"></i></button>`:''}
      </div>`;
    }).join('');
  }
  function renderLinkageReturn(lk){
    const sel=document.getElementById('lkReturn');
    const refForm = LINKAGE_FORMS.find(x=>x.id===lk.formId);
    sel.innerHTML = '<option value="">请选择关联表字段</option>' + (refForm?refForm.fields.map(x=>`<option value="${x.field}" ${lk.returnField===x.field?'selected':''}>${x.label}</option>`).join(''):'');
  }
  function readLinkageFromUI(){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    lk.formId = document.getElementById('lkForm').value;
    const fm = LINKAGE_FORMS.find(x=>x.id===lk.formId);
    lk.formName = fm?fm.name:'';
    lk.conditions = (lk.conditions||[]).map((c,i)=>({
      localField: document.getElementById('lk_local_'+i)?.value || '',
      refField: document.getElementById('lk_ref_'+i)?.value || ''
    }));
    lk.returnField = document.getElementById('lkReturn').value;
    f.linkage=lk;
    return lk;
  }
  function onLinkageChange(){
    const lk=readLinkageFromUI();
    // 切换关联表后，条件中的关联字段选项需要重置
    renderLinkageConditions(lk);
    renderLinkageReturn(lk);
    updateLinkagePreview();
  }
  function addLinkageCond(){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    lk.conditions.push({localField:'',refField:''});
    renderLinkageConditions(lk);
    updateLinkagePreview();
  }
  function removeLinkageCond(i){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    lk.conditions.splice(i,1);
    renderLinkageConditions(lk);
    updateLinkagePreview();
  }
  function updateLinkagePreview(){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    const fm=LINKAGE_FORMS.find(x=>x.id===lk.formId);
    const rf=fm?fm.fields.find(x=>x.field===lk.returnField):null;
    const conds=lk.conditions.map(c=>{
      const local=fieldLabel(c.localField)||'当前字段';
      const ref=fm?((fm.fields.find(x=>x.field===c.refField)||{}).label||'关联字段'):'关联字段';
      return `「${local}」=「${ref}」`;
    }).join(' 且 ');
    const html = !fm ? '请先选择数据关联表并配置匹配条件。'
      : `联动预览：当 ${conds||'（无条件）'} 时，本字段自动显示 <b>${fm.name}</b> 中 <b>${rf?rf.label:'未选择字段'}</b> 的对应值。`;
    document.getElementById('lkPreview').innerHTML = html;
  }
  function saveLinkage(){
    readLinkageFromUI();
    closeLinkage(); renderConfig(); renderCanvas();
  }
  function closeLinkage(){ closeModal('linkageModal'); }
  document.getElementById('lkForm').onchange = onLinkageChange;

  /* ===================== 画布渲染（12栅格 + 标签布局） ===================== */
  function renderCanvas(){
    const wrap=document.getElementById('canvasFields');
    const empty=document.getElementById('canvasEmpty');
    if(formViewingVersion){
      const s=snapshotFormView();
      if(s){ renderSnapshotCanvas(s, wrap, empty); return; }
    }
    if(fields.length===0){ empty.style.display='block'; wrap.innerHTML=''; return; }
    empty.style.display='none';
    wrap.innerHTML = fields.map(f=>fieldCardHTML(f)).join('');
  }
  /* 历史版本查看态：用快照字段结构渲染只读画布（不污染当前 fields） */
  function renderSnapshotCanvas(s, wrap, empty){
    const list=s.fields||[];
    empty.style.display = list.length?'none':'block';
    if(!list.length){ wrap.innerHTML=''; return; }
    const labelPos=(s.fc&&s.fc.labelPos)||'top';
    wrap.innerHTML = list.map(f=>{
      const td=(CONTROL_DEFS[f.type]||{label:f.type||'字段',icon:'fa-pen'});
      const req=f.required?'<span class="text-red-500 ml-0.5">*</span>':'';
      const help=f.helpText?`<div class="text-[11px] text-gray-400 mt-1">${f.helpText}</div>`:'';
      const preview=previewHTML(f);
      const lbl = labelPos==='left'
        ? `<div class="flex items-start gap-3 pointer-events-none"><label class="label-cell text-sm font-medium text-gray-700" style="width:120px;flex:none;text-align:left;padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.label}${req}</label><div class="flex-1 min-w-0">${preview}${help}</div></div>`
        : `<div class="pointer-events-none"><label class="block text-sm font-medium text-gray-700 mb-1">${f.label}${req}</label><div>${preview}${help}</div></div>`;
      return `<div class="field-card bg-white border border-gray-200 rounded-lg p-4" style="grid-column: span ${f.span||12}">
        <div class="flex items-center justify-between mb-2">
          <div class="text-[11px] text-gray-400 border border-gray-200 rounded px-1.5 py-0.5"><i class="fas ${td.icon} text-[#165DFF] mr-1"></i>${td.label}</div>
          <span class="text-[10px] text-gray-300"><i class="fas fa-lock mr-1"></i>历史版本·只读</span>
        </div>
        ${lbl}
      </div>`;
    }).join('');
  }
  function snapshotFormView(){
    const f=currentForm();
    return formViewingVersion ? ((f&&f.versions||[]).find(v=>v.version===formViewingVersion)||null) : null;
  }
  function previewHTML(f){
    if(f.type==='text'){
      const fmt = f.format&&f.format!=='none' ? `（${FORMATS[f.format]}）` : '';
      return `<input disabled placeholder="${f.placeholder||''}" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm bg-gray-50 text-gray-400" value="${defaultDisplay(f)}"><span class="text-[11px] text-gray-300">${fmt}</span>`;
    } else if(f.type==='textarea'){
      const fmt = f.format&&f.format!=='none' ? `（${FORMATS[f.format]}）` : '';
      const rows = f.rows||4;
      const count = f.showCount ? `<div class="text-[11px] text-gray-300 mt-1 text-right">0${f.maxLength?' / '+f.maxLength:''}</div>` : '';
      return `<textarea disabled placeholder="${f.placeholder||''}" rows="${rows}" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm bg-gray-50 text-gray-400 resize-none">${defaultDisplay(f)}</textarea><span class="text-[11px] text-gray-300">${fmt}</span>${count}`;
    } else if(f.type==='number'){
      const unit = f.unit ? `<span class="text-sm text-gray-400 ml-1 whitespace-nowrap">${f.unit}</span>` : '';
      const ph = f.placeholder||'请输入数字';
      return `<div class="flex items-center gap-1"><input disabled placeholder="${ph}" class="flex-1 border border-gray-200 rounded-md px-3 py-2 text-sm bg-gray-50 text-gray-400"><span class="text-sm text-gray-400">${unit}</span></div>`;
    } else if(f.type==='radio'){
      const opts=(f.options||[]).map(o=>`<label class="flex items-center gap-1.5 px-3 py-1.5 border border-gray-200 rounded-md text-sm text-gray-500 bg-gray-50"><span class="w-3.5 h-3.5 rounded-full border border-gray-300 inline-block"></span>${o.label}</label>`).join('');
      return `<div class="flex flex-wrap gap-2">${opts||'<span class="text-xs text-gray-300">（暂无选项）</span>'}</div>`;

  const VIS_OPTS=[['creator','仅创建人'],['dept','同部门'],['deptSub','同部门及下级'],['all','全部数据'],['rule','自定义规则（引用登录人属性）']];

  function dvRuleCfg(key,c){ if(!c.visibleRulesMap) c.visibleRulesMap={}; if(!c.visibleRulesMap[key]) c.visibleRulesMap[key]={dataLogic:'and',data:[{field:'',op:'=',valType:'value',val:''}],fallback:'none'}; return c.visibleRulesMap[key]; }

      t += `<div class="flex items-center gap-1 px-1 py-1 cursor-pointer select-none" onclick="dvToggleGroup('${g.name}')"><span class="text-gray-400 text-xs w-3">${open?'\u25BE':'\u25B8'}</span><span class="text-xs font-medium text-gray-600">${g.name}</span></div>`;
      if(open){ g.roles.forEach(function(r){ t += dvNode(r, r, dvCurrentRole===r, false, dvIsConf(c,r)); }); }
    });
    return t;
  }
  function dvSelectRole(r){ dvCurrentRole=r; renderConfig(); }
  function dvToggleGroup(g){ dvCollapsed[g]=!dvCollapsed[g]; renderConfig(); }
  function dvScopeSelect(tab, c){
    const isRole = tab!=='__global__';
    let val = isRole ? ((c.visibleRoles&&c.visibleRoles[tab])||'__inherit__') : (c.visibleDefault||'all');
    const opts = (isRole?`<option value="__inherit__" ${val==='__inherit__'?'selected':''}>继承全局</option>`:'')
      + VIS_OPTS.map(o=>`<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('');
    let html = `<select onchange="dvSetScope('${tab}',this.value)" class="form-input border border-gray-300 rounded-md px-2 py-1 text-xs w-full">${opts}</select>`;
    if(val==='rule') html += isRole ? dvRuleFor(tab, c) : dvRuleFor('__default__', c);
    html += info(isRole ? '选「继承全局」即套用全局默认范围；需特殊范围时单独选择，并可编写自定义规则（可引用登录人属性，如各区督导组只看本地区）。' : '对所有角色生效的默认数据范围；切到具体角色可逐个覆盖。多条件可组合「且 / 或」。');
    return html;
  }
  function dvSetScope(tab, val){
    const c=formConfig;
    if(tab==='__global__'){ c.visibleDefault=val; }
    else { if(!c.visibleRoles) c.visibleRoles={}; if(val==='__inherit__') delete c.visibleRoles[tab]; else c.visibleRoles[tab]=val; }
    renderConfig();
  }


  function renderConfig(){
    const body=document.getElementById('configBody');
    const ctx=document.getElementById('cfgContext');
    setCfgTabStyle();
    if(formViewingVersion){
      const s=snapshotFormView();
      ctx.textContent='历史版本·只读';
      body.innerHTML=`
        <div class="cfg-info"><i class="fas fa-eye mr-1"></i>当前画布展示的是历史版本 <b>v${formViewingVersion}</b> 的字段结构（只读），共 <b>${s&&s.fields?s.fields.length:0}</b> 个字段，发布人为 ${s?(s.publisher||'系统'):''} · ${s?s.time||'—':''}。点击下方按钮返回编辑当前表单。</div>
        <button onclick="exitFormVersionView()" class="mt-3 w-full px-3 py-2 rounded-md text-xs font-medium btn-click bg-[#165DFF] text-white hover:bg-blue-600"><i class="fas fa-arrow-left mr-1"></i>返回编辑</button>`;
      return;
    }
    if(!selectedId){
      if(!isCreating) ctx.textContent='表单配置'; else ctx.textContent='';
      renderFormConfig(body); return;
    }
    const f=fields.find(x=>x.id===selectedId);
    ctx.textContent = isCreating ? '' : '控件：'+f.label;
    let html = `<div class="mb-3 pb-3 border-b border-gray-100 flex items-center gap-2 text-sm font-semibold text-gray-700"><i class="fas ${CONTROL_DEFS[f.type].icon} text-[#165DFF]"></i>${CONTROL_DEFS[f.type].label} · 字段配置</div>`;
    html += renderCommon(f);
    html += renderSpecific(f);
    body.innerHTML = html;
    bindFieldEvents(f);
  }
  function setRightTab(t){ rightTab=t; if(t==='view') selectedId=null; renderConfig(); }
  // 表单配置标签：处于字段下钻态时点击返回表单根配置，否则进入表单配置模块
  function onFormTabClick(){ if(rightTab==='config' && selectedId){ deselectField(); } else { setRightTab('config'); } }
  function setCfgTabStyle(){

    if(tf){ tf.textContent=(rightTab==='config'&&selectedId)?'控件配置':'表单配置'; tf.className='flex-1 px-2 py-1.5 rounded-md font-medium btn-click '+(rightTab==='config'?a:b); }
  }

  /* 默认值逻辑详解（按当前选择的方式动态说明取值链路） */
  function defaultValueLogicBox(f){
    const dt=f.defaultType||'manual';
    const name=(DEFAULT_TYPES.find(x=>x[0]===dt)||[,''])[1];
    const map={
      manual:'<b>手动填写</b>：打开表单时直接填入设计态预设的固定值（文本或默认选项）。提交时原样保存到数据库，适用于固定说明文案、高频默认选项等。',
      formula:'<b>公式编辑</b>：运行态在<b>打开表单</b>以及<b>被引用的字段发生变化</b>时，按公式实时计算并填入结果。支持跨字段引用与函数（SUM / IF / COUNT / CONCAT 等）。系统只存储<b>计算结果</b>、不存储公式本身，从而保证每次打开数据一致、避免脏值。',
      currentUser:'<b>当前用户</b>：由系统在运行态自动注入<b>当前登录用户</b>的身份（姓名/工号），用户不可编辑、无需填写。常用于「申请人 / 负责人 / 填报人」等写死为登录人的字段。',
      today:'<b>当前日期</b>：由系统在运行态注入<b>打开表单当天的日期</b>，用于自动记录「申请日期 / 创建日期」，避免用户手填误差。',
      linkage:'<b>数据联动</b>：打开表单时，依据下方配置的条件到<b>关联表</b>中查询记录，把命中记录的指定字段值作为本字段默认值自动带出（例如选「部门」后自动带出「部门负责人」）。若条件未匹配到记录，字段留空、需用户手动补充。'
    };
    return `<div class="cfg-logic-block"><div class="cfg-logic-title"><i class="fas fa-lightbulb"></i>默认值逻辑说明 · ${name}</div><div class="cfg-logic-body">${map[dt]||''}</div></div>`;
  }

  /* 业务控件（成员 / @部门 / @工作表单 / @动态圈）默认值：放在「专属配置·选择范围」下方维护。
     原因：业务控件的默认候选必须落在「选择范围」内（只能从范围内选具体实体），

    h += row('默认值方式', `<select id="cfg_dtype" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${DEFAULT_TYPES.map(o=>`<option value="${o[0]}" ${(f.defaultType||'manual')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`, '选择默认值来源；不同方式对应不同取值逻辑，运行态打开表单时按此自动带入。候选受上方「选择范围」约束。');
    if(dt==='manual'){

      const chips = arr.length ? arr.map(v=>`<span class="inline-flex items-center gap-1 pl-2 pr-1 py-0.5 rounded-full bg-[#165DFF]/10 text-[#165DFF] text-[11px]">${esc(v)}<button onclick="removeDefaultPick('${esc(v)}')" class="hover:text-red-600 btn-click"><i class="fas fa-times"></i></button></span>`).join(' ') : '<span class="text-[11px] text-gray-400">尚未选择</span>';
      const btn=`<button onclick="openDefaultPicker('${f.id}')" class="px-3 py-1.5 border border-[#165DFF] text-[#165DFF] rounded-md text-sm hover:bg-blue-50 btn-click"><i class="fas fa-plus mr-1"></i>选择${noun}</button>`;
      h += row('默认'+noun, `<div>${btn}<div class="flex flex-wrap gap-1.5 mt-2">${chips}</div></div>`, `从「选择范围」限定的${noun}中选取具体${noun}作为默认值；运行态打开表单时自动带入。${f.multi?'开启「多选」后可一次选多个。':''}`);
    } else if(dt==='formula'){
      h += row('公式', `<div class="flex gap-2"><input id="cfg_dval" ${inp(f.defaultValue)} class="form-input flex-1 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm font-mono" placeholder="如 =SUM(金额)" readonly><button class="px-2.5 bg-[#165DFF] text-white rounded-md text-xs whitespace-nowrap btn-click" onclick="openFormula()"><i class="fas fa-function mr-1"></i>公式编辑</button></div>`, '通过公式计算得到默认值，支持字段引用与函数（SUM/IF/COUNT 等）。');
    } else if(dt==='currentUser'){
      h += info('运行态将自动填入<b>当前登录用户</b>，无需手动维护（常用于「申请人/负责人」类字段）。');
    } else if(dt==='today'){
      h += info(`运行态将自动填入<b>打开表单当天的日期</b>（示例：${new Date().toISOString().slice(0,10)}）。`);
    } else if(dt==='linkage'){
      const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
      const fm=LINKAGE_FORMS.find(x=>x.id===lk.formId);
      const rf=fm?fm.fields.find(x=>x.field===lk.returnField):null;
      const summary = !fm ? '未配置' : `${fm.name} · ${rf?rf.label:'未选返回值'} · ${lk.conditions.length}个条件`;
      h += row('数据联动', `<div class="flex gap-2"><input class="form-input flex-1 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm bg-gray-50" value="${summary}" readonly><button class="px-2.5 bg-[#165DFF] text-white rounded-md text-xs whitespace-nowrap btn-click" onclick="openLinkage()"><i class="fas fa-link mr-1"></i>配置</button></div>`, '按条件从其他表单/数据库查找记录，并取指定字段作为默认值。');
    }
    h += defaultValueLogicBox(f);
    return h;
  }

    h += row('必填', sw('cfg_req', f.required, '提交时该项不能为空，否则拦截提交并提示。'), '控制字段是否必填校验。');
    // 默认值（多来源）
    const dt=f.defaultType||'manual';

    const NO_DEFAULT = ['signature','image','attachment','location','autonumber'];
    if(NO_DEFAULT.includes(f.type)){
      h += info('本控件为<b>运行时采集/系统生成</b>类（'+(CONTROL_DEFS[f.type].label)+'），无需预设默认值：运行态由用户上传/签名/定位或系统自动生成编号，故不在通用配置中提供「默认值方式」。');
    } else if(['member','dept','formref','feed'].includes(f.type)){
      // 业务控件（成员/部门/工作表单/动态圈）的「默认值」与「选择范围」强相关，默认候选必须落在范围内；
      // 故默认值配置统一放在「专属配置·选择范围」下方维护，通用配置此处不重复渲染。

      }
    } else if(dt==='formula'){
      h += row('公式', `<div class="flex gap-2"><input id="cfg_dval" ${inp(f.defaultValue)} class="form-input flex-1 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm font-mono" placeholder="如 =SUM(金额)" readonly><button class="px-2.5 bg-[#165DFF] text-white rounded-md text-xs whitespace-nowrap btn-click" onclick="openFormula()"><i class="fas fa-function mr-1"></i>公式编辑</button></div>`, '通过公式计算得到默认值，支持字段引用与函数（SUM/IF/COUNT 等）。点击「公式编辑」打开可视化弹窗：左侧面板选择字段与函数分类，中间输入公式，底部含提示与示例。');

    } else if(dt==='today'){
      h += info(`运行态将自动填入<b>打开表单当天的日期</b>（示例：${new Date().toISOString().slice(0,10)}）。`);
    } else if(dt==='linkage'){
