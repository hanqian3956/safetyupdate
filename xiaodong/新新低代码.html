  function casNodeName(id,path,v){
    const f=getField(id); if(!f||!path||!path.length) return;

  function casPathPick(id,idx,val){

  function casTreeRows(f,nodes,path,depth){
    let out='';
    const maxL=Math.max(1,Math.min(5,f.levels||2));
    (nodes||[]).forEach((n,i)=>{
      if(depth>=maxL) return;                      // 超出「显示级数」的层级不再维护
      const p=path.concat(i); const ps=JSON.stringify(p);
      const ro=(f.source==='dict'||f.source==='api');
      const last=(i===(nodes.length-1));
      const conn=depth===0?'':(last?'└':'├');
      const indent=depth===0?0:16+(depth-1)*24;
      const canAdd=!ro && (depth<maxL-1);          // 已到末级 → 不再提供「添加子级」
      out += `<div class="flex items-center gap-1 mb-1.5" style="padding-left:${indent}px">`+
        `<span class="text-[10px] ${depth===0?'text-gray-500':'text-gray-400'} w-6 flex-none">L${depth+1}</span>`+
        `<span class="text-[11px] text-gray-300 w-3 flex-none">${conn}</span>`+
        `<input class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm ${ro?'bg-gray-50 text-gray-500':''}" value="${n.label}" ${ro?'disabled':''} oninput="casNodeName('${f.id}',${ps},this.value)">`+
        (canAdd?`<button class="text-gray-400 hover:text-[#165DFF] btn-click" onclick="casAddNode('${f.id}',${ps})" title="给「${n.label}」添加子级"><i class="fas fa-plus"></i></button>`:'')+
        (ro?'':`<button class="text-gray-400 hover:text-red-500 btn-click" onclick="casDelNode('${f.id}',${ps})" title="删除「${n.label}」及其所有子级"><i class="fas fa-times"></i></button>`)+
        `</div>`;
      if(n.children && n.children.length) out += casTreeRows(f,n.children,p,depth+1);
    });
    return out;
  }

  function casPreviewPick(id,idx,val){

      h += sec('默认值','att_default');
      h += `<div class="space-y-3 mb-3.5">`;
      const attDt=f.attachmentDefaultType||'none';
      h += row('默认值方式', `<select id="cfg_att_dtype" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="none" ${attDt==='none'?'selected':''}>无默认值</option><option value="preset" ${attDt==='preset'?'selected':''}>预设附件（手动上传）</option></select>`, '运行态打开表单时是否预置一个附件；选「预设附件」可上传一个默认文件，常用于固定模板 / 标准协议等场景。');
      if(attDt==='preset'){
        const prev=f.defaultAttachment?`<div class="mt-1 inline-flex items-center gap-2 rounded-md border border-gray-300 bg-gray-50 px-2.5 py-1.5 text-xs"><i class="fas fa-paperclip text-[#165DFF]"></i><span class="text-gray-700 max-w-[160px] truncate">${f.defaultAttachmentName||'默认附件'}</span><button type="button" onclick="clearAttachmentDefault('${f.id}')" class="ml-1 w-4 h-4 rounded-full bg-red-500 text-white text-[10px] leading-4 btn-click" title="移除默认附件">×</button></div>`:'<span class="text-xs text-gray-400">（未上传默认附件）</span>';
        h += row('默认附件', `<div class="space-y-2"><button type="button" onclick="openAttachmentDefaultPicker('${f.id}')" class="px-3 py-1.5 border border-[#165DFF] text-[#165DFF] rounded-md text-xs btn-click"><i class="fas fa-upload mr-1"></i>上传默认附件</button><input type="file" id="attdef_file" style="display:none" onchange="attachmentDefaultFileSelected('${f.id}',this)">${prev}</div>`, '上传一个文件作为运行态默认附件，将以文件名展示；提交时随表单携带。');
      }
      h += `</div>`+secEnd();
    } else if(f.type==='location'){
      const modes=[['auto','自动定位'],['manual','手动选择'],['both','自动+手动']];
      h += row('获取方式', `<select id="cfg_locmode" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${modes.map(([v,l])=>`<option value="${v}" ${f.locateMode===v?'selected':''}>${l}</option>`).join('')}</select>`, '自动：运行态点击「获取定位」即时取得当前坐标；手动：运行态提供可交互地图，点击落点或搜索地点选点；两者皆可时用户自选。');
      h += row('定位精度(米)', `<input id="cfg_locacc" type="number" ${inp(f.accuracy)}>`, '期望定位精度阈值，越小越精确；移动端受设备/环境限制可能略偏差。');
      h += row('显示地图', sw('cfg_locmap', f.showMap, '在定位结果旁展示地图缩略图。'), '直观呈现位置，便于核对（如打卡地点、上门地址）。');
      h += row('占位提示', `<input id="cfg_locph" ${inp(f.placeholder)}>`, '未获取定位时的引导文字。');
    } else if(f.type==='cascader'){
      h += row('显示级数', `<div class="flex items-center gap-2"><input id="cfg_caslevels" type="number" min="1" max="5" value="${f.levels}" class="form-input w-20 border border-gray-300 rounded-md px-2 py-1 text-sm"><button onclick="setCasLevels('${f.id}')" class="px-2 py-1 bg-[#165DFF] text-white rounded-md text-xs btn-click">应用</button></div>`, '<b>先定一共几级</b>，再去配置下面的选项来源与选项树。该级数决定从数据源这棵树里<b>截取前 N 级</b>显示（1–5 级）：数据源层级多于 N 时，多出的层级不展示、也<b>不必维护</b>；少于 N 时以数据源实际层级为准。');
      const lvs=(f.cascadeLevels||[]).map((lv,i)=>`<div class="flex items-center gap-1.5 mb-1.5"><span class="text-[11px] text-gray-400 w-6 text-center">${i+1}</span><input class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm" value="${lv.name}" oninput="casName('${f.id}',${i},this.value)"><button class="text-gray-400 hover:text-red-500 btn-click" onclick="casDelLevel('${f.id}',${i})" title="删除该级"><i class="fas fa-times"></i></button></div>`).join('');
      h += `<div class="mb-3.5"><label class="block text-xs font-medium text-gray-600 mb-1">各级名称</label>${lvs}<button onclick="casAddLevel('${f.id}')" class="text-[#165DFF] text-xs btn-click"><i class="fas fa-plus mr-1"></i>添加一级</button><div class="cfg-logic">每一级对应一个下拉，下级选项随上级联动。名称只是<b>显示名 / 占位文字</b>（如「请选择费用类型」），<b>这一级共用一个名字</b>，但每个上级节点下面能选到哪些值由下方「选项来源」决定；选择树形字典后会自动带出该字典的各级名称，可再修改。</div></div>`;
      h += row('选项来源', `<select id="cfg_src" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="static" ${(f.source||'static')==='static'?'selected':''}>静态录入</option><option value="dict" ${f.source==='dict'?'selected':''}>数据字典</option><option value="api" ${f.source==='api'?'selected':''}>远程 API</option></select>`, '这棵层级树的来源：<b>静态录入</b>=设计态手工维护一棵树；<b>数据字典</b>=选一个树形字典，运行态动态加载；<b>远程 API</b>=从接口拉取层级数据。');
      if(f.source==='dict'){
        h += row('树形字典', `<select id="cfg_dict" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${TREE_DICTS.map(([v,l])=>`<option value="${v}" ${f.dictKey===v?'selected':''}>${l}</option>`).join('')}</select>`, '树形字典与「数据字典」不同：它带层级（children）结构，供多级查询逐级展开。选定后会只读展示该字典的树，并自动带出各级名称。');
      } else if(f.source==='api'){
        h += row('接口地址', `<input id="cfg_api" ${inp(f.apiUrl)} class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" placeholder="https://api.example.com/tree">`, '运行态从此接口拉取层级数据。');
        h += row('拉取方式', `<select id="cfg_apimode" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="tree" ${(f.apiMode||'tree')==='tree'?'selected':''}>一次性返回整棵树</option><option value="level" ${f.apiMode==='level'?'selected':''}>按上级值逐级查询</option></select>`, '「一次性返回整树」：接口直接返回 {label, value, children} 嵌套结构；「逐级查询」：每一级用上级 value 作参数查下一级（如先查大区、再按大区查门店），适合末级是业务数据的场景。');
        h += `<div class="mb-3.5"><button onclick="alert('测试连接（演示）')" class="text-xs text-[#165DFF] btn-click"><i class="fas fa-plug mr-1"></i>测试连接</button><div class="cfg-logic">远程 API 运行态动态加载，设计态<b>不维护静态选项</b>，也不预置默认值候选；联动效果见下方「运行态预览」。</div></div>`;
      }
      h += treeEditorHTML(f);
      h += casRuntimePreviewHTML(f);
      h += cascaderDefaultHTML(f);
      h += row('可搜索', sw('cfg_cassearch', f.searchable, '各级支持输入关键字过滤。'), '层级多、选项长时开启，便于快速定位。');
    } else if(f.type==='autonumber'){
      h += row('前缀', `<input id="cfg_anprefix" ${inp(f.prefix)}>`, '编号固定前缀（如 XS=销售、CG=采购），用于区分业务类型。');
      const dfmts=[['none','无'],['YYYYMMDD','年月日'],['YYYYMM','年月'],['YYYY','年']];
      h += row('日期格式', `<select id="cfg_andate" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${dfmts.map(([v,l])=>`<option value="${v}" ${f.dateFmt===v?'selected':''}>${l}</option>`).join('')}</select>`, '在编号中插入生成日期，便于按时间归档检索。');
      h += row('流水位长', `<input id="cfg_anlen" type="number" min="1" ${inp(f.seqLen)}>`, '序号位数，不足左侧补零（如 4 位 → 0001）。');
      h += row('后缀', `<input id="cfg_ansuffix" ${inp(f.suffix)}>`, '编号末尾固定文字（可选）。');
      h += row('起始值', `<input id="cfg_anstart" type="number" min="0" ${inp(f.start)}>`, '流水号从几开始计数。');
      h += row('步长', `<input id="cfg_anstep" type="number" min="1" ${inp(f.step)}>`, '每次新增记录序号递增的量。');
      const resets=[['none','不重置'],['daily','每日重置'],['monthly','每月重置'],['yearly','每年重置']];
      h += row('重置周期', `<select id="cfg_anreset" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${resets.map(([v,l])=>`<option value="${v}" ${f.reset===v?'selected':''}>${l}</option>`).join('')}</select>`, '按周期归零流水号（如每日单号从 0001 重排），避免无限增长。');
      h += info(`预览示例：<b>${genAutoNumber(f)}</b>（运行态按规则自动生成，不可手改）。`);
    }
    h += secEnd();
    return h;
  }
  /* 地址显示字段开关 / 图片附件格式勾选 / 级联级别 */
  function toggleAddrField(id,k,on){ const f=getField(id); if(!f.addrShow)f.addrShow={}; f.addrShow[k]=on; renderConfig(); }
  /* setAddrDefault(f,key,val) 已迁移至「地址级联选择器」辅助区（带省/市联动清空逻辑）。 */
  function toggleFmt(id,fmt,on){ const f=getField(id); if(on){ if(!f.formats.includes(fmt))f.formats.push(fmt); } else { f.formats=f.formats.filter(x=>x!==fmt); } renderConfig(); }
  /* 图片「默认值」：预设一张默认图片（手动上传，不走通用文本默认值） */
  function openImageDefaultPicker(id){ const inp=document.getElementById('imgdef_file'); if(inp) inp.click(); }
  function imageDefaultFileSelected(id, input){
    const f=getField(id); if(!f) return;
    const file=input.files && input.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{ f.defaultImage=ev.target.result; f.imageDefaultType='preset'; renderConfig(); };
    reader.readAsDataURL(file);
  }
  function clearImageDefault(id){ const f=getField(id); if(!f) return; f.defaultImage=''; f.imageDefaultType='none'; renderConfig(); }
  function previewClearImageDefault(fn){ const f=getFieldByFn(fn); if(!f) return; f.defaultImage=''; f.imageDefaultType='none'; previewForm(); }
  /* 附件「默认值」：预设一个默认附件（手动上传，不走通用文本默认值） */
  function openAttachmentDefaultPicker(id){ const inp=document.getElementById('attdef_file'); if(inp) inp.click(); }
  function attachmentDefaultFileSelected(id, input){
    const f=getField(id); if(!f) return;
    const file=input.files && input.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{ f.defaultAttachment=ev.target.result; f.defaultAttachmentName=file.name; f.attachmentDefaultType='preset'; renderConfig(); };
    reader.readAsDataURL(file);
  }
  function clearAttachmentDefault(id){ const f=getField(id); if(!f) return; f.defaultAttachment=''; f.defaultAttachmentName=''; f.attachmentDefaultType='none'; renderConfig(); }
  function previewClearAttachmentDefault(fn){ const f=getFieldByFn(fn); if(!f) return; f.defaultAttachment=''; f.defaultAttachmentName=''; f.attachmentDefaultType='none'; previewForm(); }
  function casName(id,i,v){ const f=getField(id); if(f.cascadeLevels[i]) f.cascadeLevels[i].name=v; renderConfig(); }
  function casAddLevel(id){ const f=getField(id); f.cascadeLevels.push({name:'级别'+(f.cascadeLevels.length+1)}); f.levels=f.cascadeLevels.length; renderConfig(); }
  function casDelLevel(id,i){ const f=getField(id); f.cascadeLevels.splice(i,1); f.levels=f.cascadeLevels.length; renderConfig(); }
  function setCasLevels(id){ const f=getField(id); const n=Math.max(1,Math.min(5, +document.getElementById('cfg_caslevels').value||1)); const cur=f.cascadeLevels||[]; const next=[]; for(let i=0;i<n;i++){ next.push(cur[i]||{name:(['一级','二级','三级','四级','五级'][i]||('级别'+(i+1)))}); } f.cascadeLevels=next; f.levels=n; f.defaultValue=[]; renderConfig(); }
  function genAutoNumber(f){
    return anCompose(f, null, null, null);
  }

  /* 字段事件绑定 */
  function bindFieldEvents(f){
    const g=id=>document.getElementById(id);
    const relabel=()=>renderCanvas();
    if(!f.visible) f.visible={mode:'always',logic:'and',conditions:[]};   // 兼容示例字段（可能无 visible 属性）
    if(g('cfg_label')) g('cfg_label').oninput=e=>{f.label=e.target.value;relabel();};
    if(g('cfg_span')) g('cfg_span').onchange=e=>{f.span=+e.target.value;relabel();};
    if(g('cfg_lpos')) g('cfg_lpos').onchange=e=>{f.labelPos=e.target.value;relabel();};
    if(g('cfg_lalign')) g('cfg_lalign').onchange=e=>{f.labelAlign=e.target.value;relabel();};
    if(g('cfg_lw')) g('cfg_lw').onchange=e=>{f.labelWidth=e.target.value;relabel();};
    if(g('cfg_req')) g('cfg_req').onchange=e=>{f.required=e.target.checked;relabel();};
    // 默认值
    if(g('cfg_dtype')) g('cfg_dtype').onchange=e=>{f.defaultType=e.target.value;renderConfig();};
    if(g('cfg_dval')) g('cfg_dval').oninput=e=>{f.defaultValue=e.target.value;relabel();};
    if(g('cfg_help')) g('cfg_help').oninput=e=>{f.helpText=e.target.value;relabel();};
    if(g('cfg_ro')) g('cfg_ro').onchange=e=>{f.readonly=e.target.checked;};
    if(g('cfg_print')) g('cfg_print').onchange=e=>{f.printShow=e.target.checked;};
    // 显示条件
    if(g('cfg_vmode')) g('cfg_vmode').onchange=e=>{f.visible.mode=e.target.value;renderConfig();};
    if(g('cfg_vlogic')) g('cfg_vlogic').onchange=e=>{f.visible.logic=e.target.value;};
    (f.visible.conditions||[]).forEach((c,i)=>{
      if(g('cfg_vfield_'+i)) g('cfg_vfield_'+i).onchange=e=>{f.visible.conditions[i].field=e.target.value;};
      if(g('cfg_vop_'+i)) g('cfg_vop_'+i).onchange=e=>{f.visible.conditions[i].op=e.target.value;};
      if(g('cfg_vval_'+i)) g('cfg_vval_'+i).oninput=e=>{f.visible.conditions[i].value=e.target.value;};
    });
    // text
    if(g('cfg_fmt')) g('cfg_fmt').onchange=e=>{f.format=e.target.value;};
    if(g('cfg_max')) g('cfg_max').oninput=e=>{f.maxLength=+e.target.value;};
    if(g('cfg_min')) g('cfg_min').oninput=e=>{f.minLength=+e.target.value;};
    if(g('cfg_pwd')) g('cfg_pwd').onchange=e=>{f.password=e.target.checked;};
    if(g('cfg_trim')) g('cfg_trim').onchange=e=>{f.trim=e.target.checked;};
    if(g('cfg_err')) g('cfg_err').oninput=e=>{f.errMsg=e.target.value;};
    // textarea
    if(g('cfg_max')) g('cfg_max').oninput=e=>{f.maxLength=+e.target.value;};
    if(g('cfg_min')) g('cfg_min').oninput=e=>{f.minLength=+e.target.value;};
    if(g('cfg_rows')) g('cfg_rows').oninput=e=>{f.rows=+e.target.value;relabel();};
    if(g('cfg_trim')) g('cfg_trim').onchange=e=>{f.trim=e.target.checked;};
    if(g('cfg_count')) g('cfg_count').onchange=e=>{f.showCount=e.target.checked;relabel();};
    if(g('cfg_err')) g('cfg_err').oninput=e=>{f.errMsg=e.target.value;};
    // select
    if(g('cfg_src')) g('cfg_src').onchange=e=>{
      f.source=e.target.value;
      // 选项来源改变 → 默认值候选随之改变，旧值可能失效，清空后重新选择
      if(['radio','checkbox','multiselect','cascader'].includes(f.type)) f.defaultValue = (f.type==='radio') ? '' : [];
      // 多级查询：切换来源时同步各级名称，避免级别名与数据源对不上
      if(f.type==='cascader'){
        const n=f.levels||2;
        if(f.source==='dict'){
          const t=TREE_DICTS.find(x=>x[0]===(f.dictKey||'region'));
          if(t&&t[2]) f.cascadeLevels=t[2].slice(0,n).map(x=>({name:x}));
        } else if(f.source==='static'){
          f.cascadeLevels=['一级','二级','三级','四级','五级'].slice(0,n).map(x=>({name:x}));
        }
      }
      renderConfig();
    };
    if(g('cfg_dict')) g('cfg_dict').onchange=e=>{
      f.dictKey=e.target.value;
      // 数据字典切换 → 默认值候选改变，清空
      if(['radio','checkbox','multiselect'].includes(f.type)) f.defaultValue = (f.type==='radio') ? '' : [];
      if(f.type==='cascader'){
        f.defaultValue=[];
        const t=TREE_DICTS.find(x=>x[0]===e.target.value);
        if(t&&t[2]) f.cascadeLevels=t[2].slice(0,f.levels||2).map(x=>({name:x}));
      }
      renderConfig();
    };
    if(g('cfg_apimode')) g('cfg_apimode').onchange=e=>{f.apiMode=e.target.value;renderConfig();};
    if(g('cfg_api')) g('cfg_api').oninput=e=>{f.apiUrl=e.target.value;};
    if(g('cfg_search')) g('cfg_search').onchange=e=>{f.searchable=e.target.checked;};
    // number / radio / checkbox / multiselect / datetime / divider
    if(g('cfg_min')) g('cfg_min').oninput=e=>{ const v=e.target.value; f.min = v==='' ? null : +v; };
    if(g('cfg_max')) g('cfg_max').oninput=e=>{ const v=e.target.value; f.max = v==='' ? null : +v; };
    if(g('cfg_prec')) g('cfg_prec').oninput=e=>{f.precision=+e.target.value;};
    if(g('cfg_unit')) g('cfg_unit').oninput=e=>{f.unit=e.target.value;};
    if(g('cfg_step')) g('cfg_step').onchange=e=>{f.showStepper=e.target.checked;};
    if(g('cfg_thousand')) g('cfg_thousand').onchange=e=>{f.thousand=e.target.checked;};
    if(g('cfg_err')) g('cfg_err').oninput=e=>{f.errMsg=e.target.value;};
    if(g('cfg_limit')) g('cfg_limit').onchange=e=>{f.limitChoose=e.target.checked;renderConfig();relabel();};
    if(g('cfg_minchoose')) g('cfg_minchoose').oninput=e=>{f.minChoose=+e.target.value;};
    if(g('cfg_maxchoose')) g('cfg_maxchoose').oninput=e=>{f.maxChoose=+e.target.value;};
    if(g('cfg_datetype')) g('cfg_datetype').onchange=e=>{f.dateType=e.target.value;renderConfig();};
    if(g('cfg_format')) g('cfg_format').onchange=e=>{f.format=e.target.value;};
    if(g('cfg_mindate')) g('cfg_mindate').onchange=e=>{f.minDate=e.target.value;};
    if(g('cfg_maxdate')) g('cfg_maxdate').onchange=e=>{f.maxDate=e.target.value;};
    if(g('cfg_showtext')) g('cfg_showtext').onchange=e=>{f.showText=e.target.checked;renderConfig();relabel();};
    if(g('cfg_divtext')) g('cfg_divtext').oninput=e=>{f.text=e.target.value;relabel();};
    if(g('cfg_divpos')) g('cfg_divpos').onchange=e=>{f.divPos=e.target.value;relabel();};
    if(g('cfg_divstyle')) g('cfg_divstyle').onchange=e=>{f.divStyle=e.target.value;relabel();};
    // subform
    if(g('cfg_minr')) g('cfg_minr').oninput=e=>{f.minRows=+e.target.value;};
    if(g('cfg_maxr')) g('cfg_maxr').oninput=e=>{f.maxRows=+e.target.value;};
    if(g('cfg_allow')) g('cfg_allow').onchange=e=>{f.allowAdd=e.target.checked;relabel();};
    if(g('cfg_sum')) g('cfg_sum').onchange=e=>{f.showSummary=e.target.checked;relabel();};
    // member
    if(g('cfg_range')) g('cfg_range').onchange=e=>{f.range=e.target.value;relabel();renderConfig();};
    if(g('cfg_multi')) g('cfg_multi').onchange=e=>{f.multi=e.target.checked;relabel();};
    if(g('cfg_idept')) g('cfg_idept').onchange=e=>{f.includeDept=e.target.checked;relabel();};
    // signature / address / image / attachment / location / cascader / autonumber
    if(g('cfg_signtime')) g('cfg_signtime').onchange=e=>{f.signTime=e.target.checked;renderConfig();};
    if(g('cfg_timefmt')) g('cfg_timefmt').onchange=e=>{f.timeFormat=e.target.value;renderConfig();};
    if(g('cfg_signh')) g('cfg_signh').oninput=e=>{f.signHeight=+e.target.value;renderCanvas();};

  let subColDrag=null;

  /* ---- 列数据权限（字段级）---- 角色视角：全局默认 + 角色差异覆盖 + 批量 ---- */
  var fpCurrentRole='global';   // 当前编辑的角色视图：'global' | 角色名
  var fpCollapsed={};           // 角色组展开/折叠状态（key=组名）
  const FP_MODES=[['edit','可编辑'],['readonly','只读'],['hidden','隐藏']];
  function fpEffMode(c, fn, view){
    if(view==='global') return (c.colGlobal&&c.colGlobal[fn])||'edit';
    if(c.colRoles && c.colRoles[view] && c.colRoles[view][fn]) return c.colRoles[view][fn];
    return (c.colGlobal&&c.colGlobal[fn])||'edit';
  }
  function fpIsOverridden(c, fn, view){
    return view!=='global' && !!(c.colRoles && c.colRoles[view] && c.colRoles[view][fn]);
  }
  function fpIsConf(c,r){ return r==='global' ? !!(c.colGlobal&&Object.keys(c.colGlobal).length) : !!(c.colRoles&&c.colRoles[r]&&Object.keys(c.colRoles[r]||{}).length); }
  function fpNode(key,label,active,isGlobal,conf){
    let dot = isGlobal ? '<span class="w-2 h-2 rounded-full bg-[#EF9F27] inline-block mr-1"></span>'
             : conf ? '<span class="w-2 h-2 rounded-full bg-[#165DFF] inline-block mr-1"></span>'
             : '<span class="w-2 h-2 rounded-full border border-gray-300 inline-block mr-1"></span>';
    return `<div class="flex items-center ${active?'bg-[#E8F3FF]':'hover:bg-gray-50'} rounded px-1 py-1 cursor-pointer text-sm ${active?'text-[#165DFF] font-medium':'text-gray-700'}" onclick="fpSelectRole('${key}')"><span class="pl-3"></span>${dot}${label}</div>`;
  }
  function fpTree(c){
    let t='';
    t += fpNode('global','全局默认（所有角色）', fpCurrentRole==='global', true, fpIsConf(c,'global'));
    ROLE_GROUPS.forEach(function(g){
      const open = !fpCollapsed[g.name];
      t += `<div class="flex items-center gap-1 px-1 py-1 cursor-pointer select-none" onclick="fpToggleGroup('${g.name}')"><span class="text-gray-400 text-xs w-3">${open?'\u25BE':'\u25B8'}</span><span class="text-xs font-medium text-gray-600">${g.name}</span></div>`;
      if(open){ g.roles.forEach(function(r){ t += fpNode(r, r, fpCurrentRole===r, false, fpIsConf(c,r)); }); }
    });
    return t;
  }
  function fpPanel(c){
    if(!fields || !fields.length) return info('当前表单还没有字段，请先在画布添加字段，再回来配置列数据权限。');
    const allFields = fields.filter(function(f){ return f.fieldName||f.name; });
    if(!c.colGlobal) c.colGlobal={};
    if(!c.colRoles) c.colRoles={};
    const view = fpCurrentRole;
    const roles = (typeof ROLES!=='undefined'?ROLES:[]);
    const batch = '<div class="flex items-center gap-2 my-2 text-xs flex-wrap">'
      +'<span class="text-gray-500">批量设置：</span>'
      +'<select onchange="if(this.value){ fpAll(this.value); }" class="form-input border border-gray-300 rounded-md px-2 py-1 text-xs">'
      +'<option value="">请选择…</option>'
      +'<option value="edit">全部可编辑</option>'
      +'<option value="readonly">全部只读</option>'
      +'<option value="hidden">全部隐藏</option>'
      +'</select>'
      +'<span class="text-gray-400">（作用于当前视图：全局默认=全员基准，具体角色=该角色覆盖）</span>'
      +'</div>';
    const header = '<th class="text-left font-medium text-gray-500 text-xs py-1 pr-3 border-b border-gray-200">字段</th>'
      +FP_MODES.map(function(m){return '<th class="text-center font-medium text-gray-500 text-xs py-1 px-3 border-b border-gray-200">'+m[1]+'</th>';}).join('');
    const rows = allFields.map(function(f){
      const fn=f.fieldName||f.name; const label=f.label||fn;
      const cells = FP_MODES.map(function(m){
        const mode=fpEffMode(c, fn, view);
        const inherited = view!=='global' && !fpIsOverridden(c, fn, view);
        const on = mode===m[0];
        return '<td class="text-center '+(on?'bg-[#E8F3FF]':'')+' '+(inherited?'opacity-50':'')+'"><span class="cursor-pointer select-none text-base '+(on?'text-[#165DFF]':'text-gray-400')+'" onclick="fpSetMode(\'+fn+\',\'+m[0]+\')">'+(on?'\u2611':'\u2610')+'</span></td>';
      }).join('');
      let tag='';
      if(view!=='global'){ tag = fpIsOverridden(c, fn, view) ? '<span class="text-[11px] text-[#165DFF] ml-1">覆盖</span>' : '<span class="text-[11px] text-gray-400 ml-1">继承</span>'; }
      return '<tr><td class="py-1 pr-3 text-sm text-gray-700">'+label+tag+'</td>'+cells+'</tr>';
    }).join('');
    const grid='<table class="w-full"><thead><tr>'+header+'</tr></thead><tbody>'+rows+'</tbody></table>';
    const note = info('列数据权限与「三、数据可见范围」（行级）互补：行级决定能否看到这一<b>行</b>，列级决定能否看清这一<b>列</b>。先配「全局默认」（全员基准），切到具体角色只改差异字段（其余继承）。顶部下拉可对本视图全部字段一次性套用模式。左侧角色树中，蓝点=已自定义配置，橙点=全局默认基准，空心=继承默认。');
    const tree = fpTree(c);
    return `<div class="flex gap-3 items-start">`
      + `<div class="w-44 shrink-0 border rounded-md p-2 bg-gray-50 max-h-80 overflow-auto">${tree}</div>`
      + `<div class="flex-1 min-w-0">${batch+grid+note}</div>`
      + `</div>`;
  }
  function fpSelectRole(r){ fpCurrentRole=r; renderConfig(); }
  function fpToggleGroup(name){ if(fpCollapsed[name]) delete fpCollapsed[name]; else fpCollapsed[name]=true; renderConfig(); }
  function fpSetMode(fn, mode){
    const c=formConfig; const view=fpCurrentRole||'global';
    if(view==='global'){ if(!c.colGlobal) c.colGlobal={}; c.colGlobal[fn]=mode; }
    else { if(!c.colRoles) c.colRoles={}; if(!c.colRoles[view]) c.colRoles[view]={}; c.colRoles[view][fn]=mode; }

  function fpAll(mode){
    const c=formConfig; const view=fpCurrentRole||'global';
    const allFields=(fields||[]).filter(function(f){return f.fieldName||f.name;}).map(function(f){return f.fieldName||f.name;});
    if(view==='global'){ if(!c.colGlobal) c.colGlobal={}; allFields.forEach(function(fn){ c.colGlobal[fn]=mode; }); }
    else { if(!c.colRoles) c.colRoles={}; if(!c.colRoles[view]) c.colRoles[view]={}; allFields.forEach(function(fn){ c.colRoles[view][fn]=mode; }); }

  /* ===================== 列表 / 查询 / 按钮 配置 ===================== */
  const QUERY_MODES=[['like','包含'],['eq','精确'],['range','区间'],['date','日期']];
  const LIST_BTN_DEFS=[['add','新增'],['import','导入'],['export','导出']];
  const ROW_BTN_DEFS=[];
  function listFieldDefs(c){

    return c.listFields;
  }
  function listConfigHTML(c){

  function toggleListField(field,label,checked){

  function bindFormEvents(){
    const g=id=>document.getElementById(id); const c=formConfig;
    if(g('fc_name')) g('fc_name').oninput=e=>{c.name=e.target.value; formName=c.name; document.getElementById('formNameInput').value=c.name;};
    if(g('fc_desc')) g('fc_desc').oninput=e=>{c.desc=e.target.value;};
    if(g('fc_icon')) g('fc_icon').onchange=e=>{c.icon=e.target.value;};
    if(g('fc_cat')) g('fc_cat').onchange=e=>{c.category=e.target.value;};
    if(g('fc_multi')) g('fc_multi').onchange=e=>{c.allowMultiple=e.target.checked;};
    if(g('fc_after')) g('fc_after').onchange=e=>{c.afterSubmit=e.target.value; renderConfig();};
    if(g('fc_afterurl')) g('fc_afterurl').oninput=e=>{c.afterUrl=e.target.value;};
    if(g('fc_colperm')) g('fc_colperm').onchange=e=>{ formConfig.colPermEnabled=e.target.checked; renderConfig(); };
    if(g('fv_dvis')) g('fv_dvis').onchange=e=>{ currentView().dataVisible=e.target.value; renderConfig(); };
    if(g('fv_name')) g('fv_name').oninput=e=>{ currentView().name=e.target.value; };

    if(g('fc_lpos')) g('fc_lpos').onchange=e=>{c.labelPos=e.target.value; renderCanvas();};
    if(g('fc_lalign')) g('fc_lalign').onchange=e=>{c.labelAlign=e.target.value; renderCanvas();};
    if(g('fc_lw')) g('fc_lw').onchange=e=>{c.labelWidth=e.target.value; renderCanvas();};
    if(g('fc_fw')) g('fc_fw').onchange=e=>{c.formWidth=e.target.value; applyFormWidth();};
    if(g('fc_print')) g('fc_print').onchange=e=>{c.printable=e.target.checked;};
    if(g('fc_stime')) g('fc_stime').onchange=e=>{c.showSubmitTime=e.target.checked;};
    if(g('fc_dedupe')) g('fc_dedupe').onchange=e=>{c.dedupe=e.target.checked;};
  }
  function applyFormWidth(){
    const map={narrow:'520px',standard:'680px',wide:'860px'};
    document.getElementById('canvasMaxWrap').style.maxWidth = map[formConfig.formWidth]||'680px';
  }

  /* ===================== 顶部 & 保存 / 发布 / 下架 ===================== */
  function onFormNameChange(){ formName=document.getElementById('formNameInput').value; formConfig.name=formName; }
  /* 保存：持久化当前设计。
     草稿 → 仍保持草稿；已发布 → 标记为「待发布修改」（线上版本不变，黄条提示）。
     新表单（未入列表）→ 首次保存即写入列表，状态为草稿 v0。 */
  function saveForm(){
    let f=currentForm();
    if(!f){
      const id='form'+Date.now();
      f={ id, name:formName||'未命名表单', status:'草稿', version:0, publishedAt:'', publishedBy:'', hasUnpublished:false,
          updatedAt:todayStr(), cat:formConfig.category||'未分类',
          creator:'产品同学', createdAt:todayStr(), refs:[],
          fc:JSON.parse(JSON.stringify(formConfig)), fields:JSON.parse(JSON.stringify(fields)), versions:[] };
      SAMPLE_FORMS.unshift(f); currentFormId=id;
    } else {
      f.name=formName; f.fc=JSON.parse(JSON.stringify(formConfig)); f.fields=JSON.parse(JSON.stringify(fields));
      f.updatedAt=todayStr(); f.cat=formConfig.category||'未分类';
      if(f.status==='已发布') f.hasUnpublished=true;   // 线上版本保持不变，仅标记有未发布修改
    }
    isCreating=false;
    renderFormTable(); refreshDesignerChrome();
    const isPublished = f.status==='已发布';
    alert('已保存「'+(formName||'未命名表单')+'」\n'+(isPublished?'（已发布表单：修改已存为待发布草稿，发布后生效）':'（状态：草稿，未被他人提交）'));
  }
  /* 发布：版本 +1，快照当前设计为线上锁定版本，状态变「已发布」 */
  function publishForm(){
    const name=(formName||'').trim();
    if(!name){ alert('请先填写表单名称，再发布。'); return; }
    const dup=SAMPLE_FORMS.find(x=>x.name.trim()===name && x.id!==currentFormId);
    if(dup){ alert('已存在同名表单「'+name+'」（'+(dup.status||'')+'），表单名称需唯一，请修改名称后再发布。'); return; }
    let f=currentForm();
    if(!f){ saveForm(); f=currentForm(); }              // 未保存过则先落库再发布
    if(!f) return;
    // 版本号规则（最终结论）：
    // ① 首次发布（此前从未发布过，version=0）→ 生成 v1；
    // ② 已发布/已下架后再次发布时，将「本次发布内容与上一个线上版本快照」做全量比对；
    //    内容有任何变化 → 版本号 +1；编辑后内容与原线上版本完全相同（无丝毫变化）→ 版本号保持不变，仅刷新发布信息；
    // ③ 历史版本「恢复并发布」由 restoreFormVersion 处理，版本号保持原值。
    const prevSnap = (f.version>0) ? (f.versions||[]).find(v=>v.version===f.version) : null;
    const curContent  = JSON.stringify({ fields, fc:formConfig });
    const prevContent = prevSnap ? JSON.stringify({ fields:prevSnap.fields, fc:prevSnap.fc }) : null;
    const contentChanged = !prevContent || (curContent !== prevContent);
    if(contentChanged){ f.version = (f.version||0)+1; }
    f.status='已发布'; f.publishedAt=todayStr(); f.publishedBy='产品同学'; f.hasUnpublished=false;
    f.fc=JSON.parse(JSON.stringify(formConfig)); f.fields=JSON.parse(JSON.stringify(fields)); f.updatedAt=todayStr();
    if(!f.versions) f.versions=[];
    if(contentChanged){
      f.versions.push({ version:f.version, time:f.publishedAt, publisher:f.publishedBy,
                        note: f.version===1?'首次发布，锁定该版本 schema':'基于 v'+(f.version-1)+' 的修改发布',
                        name:f.name, cat:f.cat, icon:f.fc.icon,
                        fields:JSON.parse(JSON.stringify(f.fields)), fc:JSON.parse(JSON.stringify(f.fc)) });
    } else {
      // 内容无变化：版本号不变，仅刷新该线上版本的发布时间/发布人
      const ex=(f.versions||[]).find(v=>v.version===f.version);
      if(ex){ ex.time=f.publishedAt; ex.publisher=f.publishedBy; ex.note='内容无变化，重新发布（版本号保持 v'+f.version+'）'; }
    }
    renderFormTable(); refreshDesignerChrome();
    alert('发布成功！当前线上版本 v'+f.version+'，表单已可被全员提交。\n（该版本 schema 已锁定，历史数据按版本渲染）');
  }
  /* 下架：状态回退草稿（已下架），停止接收提交，保留历史数据 */
  function unpublishForm(){
    const f=currentForm(); if(!f) return;
    f.status='草稿'; f.hasUnpublished=false;
    renderFormTable(); refreshDesignerChrome();
    alert('已下架。表单停止接收提交；历史数据（至 v'+f.version+'）保留可查。\n如需重新上线，点击「发布」生成新版本。');
  }
  /* 版本历史弹窗 */
  function showVersions(){
    const f=currentForm();
    const wrap=document.getElementById('versionList');
    const vers = f ? (f.versions||[]).slice().sort((a,b)=>b.version-a.version) : [];
    if(vers.length===0){
      wrap.innerHTML='<div class="text-sm text-gray-400 text-center py-6">暂无发布版本。点击「发布」后会生成 v1 并锁定该版本结构。</div>';
    } else {
      wrap.innerHTML = vers.map(v=>{
        const cur = v.version===f.version && f.status==='已发布';
        const hasSnap = !!(v.fields && v.fc);
        return `<div class="border border-gray-200 rounded-lg p-3 ${cur?'ring-2 ring-[#165DFF] border-[#165DFF]':''}">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-gray-800">v${v.version} ${cur?'<span class="ml-1 px-1.5 py-0.5 rounded text-[10px] bg-green-100 text-green-600">当前线上</span>':''}</span>
            <span class="text-xs text-gray-400">${v.time} · ${v.publisher}</span>
          </div>
          <div class="text-xs text-gray-500 mt-1">${v.note||''}${hasSnap?` · ${v.fields.length} 个字段`:''}</div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-[11px] text-gray-400"><i class="fas fa-lock mr-1"></i>该版本 schema 已锁定，提交数据按此版本渲染</span>
            ${cur?'':`<span class="flex gap-2">
              <button onclick="viewFormVersion(${v.version})" class="px-2.5 py-1 rounded-md text-xs btn-click border border-gray-300 text-gray-600 hover:border-[#165DFF] hover:text-[#165DFF]"><i class="fas fa-eye mr-1"></i>查看</button>
              <button onclick="restoreFormVersion(${v.version})" class="px-2.5 py-1 rounded-md text-xs btn-click border border-[#165DFF] text-[#165DFF] hover:bg-blue-50"><i class="fas fa-rotate-left mr-1"></i>恢复并发布</button>
            </span>`}
          </div>
        </div>`;
      }).join('');
    }
    openModal('versionsModal');
  }
  /* 查看历史版本：在设计器画布上直接展示该版本的字段结构（只读） */
  function viewFormVersion(v){
    const f=currentForm(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.version===v); if(!s) return;
    if(!s.fields || !s.fc){ alert('该历史版本未保存结构快照，无法预览。'); return; }
    formViewingVersion=v; selectedId=null;
    closeModal('versionsModal');
    const banner=document.getElementById('stateBanner');
    banner.style.display='flex';
    banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-blue-50 text-blue-700';
    banner.innerHTML='<i class="fas fa-eye"></i> 正在查看历史版本 <b>v'+v+'</b>（只读 · '+(s.publisher||'系统')+' · '+(s.time||'—')+'）<button onclick="exitFormVersionView()" class="ml-auto px-2.5 py-1 rounded-md text-[11px] font-medium bg-[#165DFF] text-white hover:bg-blue-600 btn-click">返回编辑</button>';
    renderCanvas(); renderConfig();
  }
  function exitFormVersionView(){
    formViewingVersion=null; selectedId=null;
    renderCanvas(); renderConfig(); refreshDesignerChrome();
  }
  /* 恢复历史版本：以该版本内容覆盖当前表单并重新发布，版本号不变 */
  function restoreFormVersion(v){
    const f=currentForm(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.version===v); if(!s) return;
    if(!s.fields || !s.fc){ alert('该历史版本未保存结构快照，无法恢复。'); return; }
    if(!confirm('确认恢复历史版本 v'+v+'？\n将把当前表单内容替换为该版本内容并重新发布，版本号保持 v'+v+'，不生成新版本。')) return;
    f.name=s.name||f.name; f.cat=s.cat||f.cat; f.icon=s.icon||f.icon;
    f.fc=JSON.parse(JSON.stringify(s.fc)); f.fields=JSON.parse(JSON.stringify(s.fields));
    f.version=v; f.status='已发布'; f.hasUnpublished=false;
    f.publishedAt=s.time||f.publishedAt; f.publishedBy=s.publisher||f.publishedBy; f.updatedAt=todayStr();
    formName=f.name; formConfig=JSON.parse(JSON.stringify(f.fc)); ensureViews({fc:formConfig});
    fields=JSON.parse(JSON.stringify(f.fields)); selectedId=null; formViewingVersion=null;
    currentViewId=(formConfig.views.find(x=>x.isDefault)||formConfig.views[0]).id;
    document.getElementById('formNameInput').value=formName;
    applyFormWidth();
    closeModal('versionsModal');
    renderFormTable(); renderCanvas(); renderConfig(); refreshDesignerChrome();
    alert('已恢复历史版本 v'+v+' 并重新发布（版本号保持 v'+v+'，不新增版本号）');
  }

  /* ===================== 预览态子表单（可增删行 + 实时汇总） ===================== */
  const previewSubRows = {};
  function previewSubform(f){
    const fid=f.id;
    if(!previewSubRows[fid]){
      const n=(f.minRows&&f.minRows>0)?f.minRows:1;
      previewSubRows[fid]=Array.from({length:n},()=>(f.subFields||[]).map(()=>''));
    }
    const sf=f.subFields||[];
    const head=sf.map(s=>`<th class="px-3 py-2 text-left text-xs font-medium text-gray-600 whitespace-nowrap">${s.label}${s.required?'<span class="text-red-500 ml-0.5">*</span>':''}${s.type==='number'?' <span class="font-normal text-gray-400">数字</span>':''}</th>`).join('')+'<th class="w-8"></th>';
    /* 列多时横向滚动，避免单元格被压得过窄（如成员/下拉控件无法阅读） */
    return `<div class="subprev border border-gray-200 rounded-md overflow-x-auto" id="subprev_${fid}">
      <table class="text-sm" style="width:100%;min-width:max-content"><thead class="bg-gray-50">${head}</thead>
      <tbody id="subbody_${fid}">${subRowsHTML(f)}</tbody>
      ${f.showSummary?`<tfoot id="subfoot_${fid}">${subFootHTML(f)}</tfoot>`:''}
      </table>
      <div class="px-3 py-2 text-xs flex items-center gap-3 bg-gray-50 border-t">
        <button class="text-[#165DFF] btn-click" onclick="subAddRow('${fid}')"><i class="fas fa-plus mr-1"></i>添加一行</button>
        ${f.allowAdd?'':`<span class="text-gray-400">（已锁定增删，固定 ${previewSubRows[fid].length} 行）</span>`}
        ${f.maxRows?`<span class="text-gray-400 ml-auto">最多 ${f.maxRows} 行</span>`:''}
      </div>
    </div>`;
  }
  function subRowsHTML(f){
    const rows=previewSubRows[f.id]||[];
    const sf=f.subFields||[];
    return rows.map((row,ri)=>`<tr>${sf.map((s,ci)=>
      `<td class="px-3 py-2 border-t align-middle whitespace-nowrap" style="min-width:104px">${subCellHTML(f,s,ri,ci)}</td>`
    ).join('')}<td class="px-3 py-2 border-t text-center"><button class="text-gray-400 hover:text-red-500 btn-click" onclick="subDelRow('${f.id}',${ri})"><i class="fas fa-trash-alt"></i></button></td></tr>`).join('');
  }
  /* 子表单单元格：按列组件类型渲染对应的运行态控件（表格内紧凑样式） */
  function subCellHTML(f, s, ri, ci){
    const val=((previewSubRows[f.id]||[])[ri]||[])[ci]||'';
    const attrs=`data-r="${ri}" data-c="${ci}" oninput="subOnInput('${f.id}',this)"`;
    const box='w-full border border-gray-200 rounded px-2 py-1 text-sm bg-white';
    const t=s.type;
    if(t==='number') return `<input type="number" value="${esc(val)}" placeholder="0.00" ${attrs} class="${box}">`;
    if(t==='datetime'){
      const it=s.dateType==='time'?'time':(s.dateType==='date'?'date':'datetime-local');
      return `<input type="${it}" value="${esc(val)}" ${attrs} class="${box}">`;
    }
    if(t==='textarea') return `<textarea rows="2" ${attrs} class="${box}" placeholder="请输入">${esc(val)}</textarea>`;
    if(t==='radio'||t==='checkbox'){
      const opts=s.options||[]; const multi=(t==='checkbox');
      const picked=multi?(val?String(val).split(','):[]):[val];
      if(!opts.length) return '<span class="text-xs text-gray-300">未配置选项</span>';
      return `<div class="flex flex-wrap items-center gap-x-3 gap-y-1">`+opts.map(o=>
        `<label class="inline-flex items-center gap-1 text-xs whitespace-nowrap cursor-pointer"><input type="${multi?'checkbox':'radio'}" ${multi?'data-multi="1"':''} ${attrs} value="${o.value}" ${picked.indexOf(o.value)>=0?'checked':''} class="cursor-pointer">${cfg2Esc(o.label)}</label>`
      ).join('')+`</div>`;
    }
    if(t==='select'){
      return `<select ${attrs} class="${box}"><option value="">请选择</option>${(s.options||[]).map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
    }
    if(t==='multiselect'){
      const picked=val?String(val).split(','):[];
      return `<select multiple ${attrs} class="${box}" style="height:34px">${(s.options||[]).map(o=>`<option value="${o.value}" ${picked.indexOf(o.value)>=0?'selected':''}>${o.label}</option>`).join('')}</select>`;
    }
    if(t==='member'||t==='dept'||t==='formref'||t==='feed'){
      const noun={member:'成员',dept:'部门',formref:'表单',feed:'动态'}[t];
      const icon={member:'fa-user-plus',dept:'fa-sitemap',formref:'fa-file-alt',feed:'fa-comments'}[t];
      return `<div class="${box} text-gray-400 flex items-center gap-1 cursor-pointer" style="min-width:92px" onclick="alert('选择${noun}（演示）')"><i class="fas ${icon} text-[#165DFF]" style="font-size:11px"></i><span class="text-xs">选择${noun}</span></div>`;
    }
    if(t==='address') return `<input readonly placeholder="请选择地址" onclick="alert('地址选择器（演示）')" class="${box} text-gray-400 cursor-pointer">`;
    if(t==='cascader'){
      const lv=(f.cascadeLevels&&f.cascadeLevels[0]&&f.cascadeLevels[0].name)||'一级';
      return `<select ${attrs} class="${box}"><option value="">请选择${lv}</option></select>`;
    }
    if(t==='signature') return `<button type="button" class="w-full border border-dashed border-gray-300 rounded px-2 py-1 text-xs text-gray-500 bg-white hover:border-[#165DFF]" onclick="alert('签名板（演示）')"><i class="fas fa-signature mr-1"></i>点击签名</button>`;
    if(t==='image') return `<button type="button" class="w-full border border-dashed border-gray-300 rounded px-2 py-1 text-xs text-gray-500 bg-white hover:border-[#165DFF]" onclick="alert('上传图片（演示）')"><i class="fas fa-image mr-1"></i>上传图片</button>`;
    if(t==='attachment') return `<button type="button" class="w-full border border-dashed border-gray-300 rounded px-2 py-1 text-xs text-gray-500 bg-white hover:border-[#165DFF]" onclick="alert('上传附件（演示）')"><i class="fas fa-paperclip mr-1"></i>上传附件</button>`;
    if(t==='location') return `<button type="button" class="w-full border border-gray-200 rounded px-2 py-1 text-xs text-gray-500 bg-gray-50 hover:border-[#165DFF]" onclick="alert('定位（演示）')"><i class="fas fa-map-pin mr-1 text-[#165DFF]"></i>获取定位</button>`;
    if(t==='autonumber') return `<span class="text-xs text-gray-400 font-mono"><i class="fas fa-barcode mr-1"></i>自动生成</span>`;
    return `<input value="${esc(val)}" placeholder="请输入" ${attrs} class="${box}">`;
  }
  function subFootHTML(f){
    const sf=f.subFields||[];
    const lead=sf.findIndex(s=>s.type!=='number'); const li=lead<0?0:lead;
    const cells=sf.map((s,ci)=>{
      if(s.type!=='number') return ci===li?`<td class="px-3 py-2 text-xs font-semibold text-[#165DFF] border-t border-gray-200 bg-[#F0F5FF]">合计</td>`:`<td class="border-t border-gray-200 bg-[#F0F5FF]"></td>`;
      return `<td class="px-3 py-2 text-xs font-semibold text-[#165DFF] border-t border-gray-200 bg-[#F0F5FF]" id="subsum_${f.id}_${ci}">0</td>`;
    }).join('')+'<td class="border-t border-gray-200 bg-[#F0F5FF]"></td>';
    return `<tr>${cells}</tr>`;
  }
  function subAddRow(fid){ const f=fields.find(x=>x.id===fid); if(!f) return; const rows=previewSubRows[fid]||(previewSubRows[fid]=[]); if(f.maxRows&&rows.length>=f.maxRows) return; rows.push((f.subFields||[]).map(()=>'')); subRebuild(fid); }
  function subDelRow(fid,ri){ const f=fields.find(x=>x.id===fid); if(!f) return; const rows=previewSubRows[fid]||[]; if(f.minRows&&rows.length<=f.minRows) return; rows.splice(ri,1); subRebuild(fid); }
  function subOnInput(fid,el){
    const f=fields.find(x=>x.id===fid); if(!f) return;
    const r=+el.dataset.r, c=+el.dataset.c;
    if(!previewSubRows[fid]||!previewSubRows[fid][r]) return;
    if(el.dataset.multi==='1'){
      const td=el.closest('td');
      const vals=Array.from(td.querySelectorAll('input[type=checkbox]:checked')).map(x=>x.value);
      previewSubRows[fid][r][c]=vals.join(',');
    } else if(el.multiple){
      previewSubRows[fid][r][c]=Array.from(el.selectedOptions).map(o=>o.value).join(',');
    } else {
      previewSubRows[fid][r][c]=el.value;
    }
    subRecalc(fid);
  }
  function subRecalc(fid){ const f=fields.find(x=>x.id===fid); if(!f||!f.showSummary) return; (f.subFields||[]).forEach((s,ci)=>{ if(s.type!=='number') return; const sum=previewSubRows[fid].reduce((a,row)=>a+(parseFloat(row[ci])||0),0); const cell=document.getElementById('subsum_'+fid+'_'+ci); if(cell) cell.textContent=sum.toFixed(2).replace(/\.00$/,''); }); }
  function subRebuild(fid){ const f=fields.find(x=>x.id===fid); if(!f) return; const body=document.getElementById('subbody_'+fid); if(body) body.innerHTML=subRowsHTML(f); subRecalc(fid); }

  /* ===================== 预览 / Schema ===================== */
  /* 预览设备：pc（默认）/ mobile（375px 手机框，内部可滚动） */
  let previewDevice='pc';
  function setPreviewDevice(d, el){
    previewDevice = (d==='mobile') ? 'mobile' : 'pc';
    const wrap=document.getElementById('previewDeviceSwitch');
    if(wrap){
      Array.prototype.forEach.call(wrap.querySelectorAll('label'), l=>l.classList.remove('on'));
      const ls=wrap.querySelectorAll('label');
      const i=(previewDevice==='mobile')?1:0;
      if(el) el.classList.add('on'); else if(ls[i]) ls[i].classList.add('on');
    }
    applyPreviewDevice();
  }
  function applyPreviewDevice(){
    const body=document.getElementById('previewBody');
    const shell=document.querySelector('#previewModal .modal-content');
    const btns=document.getElementById('previewBtns');
    if(!body) return;
    const mobile=(previewDevice==='mobile');
    body.classList.toggle('pv-mobile', mobile);
    body.classList.toggle('pv-pc', !mobile);
    if(shell) shell.classList.toggle('preview-mobile', mobile);
    if(mobile){
      if(shell){ shell.style.maxWidth='410px'; shell.style.maxHeight='92vh'; }

  /* 两点球面距离（米） */
  function locDistanceM(lng1,lat1,lng2,lat2){
    const R=6371000, rad=x=>x*Math.PI/180;

    return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));

    .proto-desc:hover { background-color: #fef3c7; border-color: #f59e0b; box-shadow: 0 2px 8px rgba(245,158,11,0.15); }
    .proto-desc.active-highlight { background-color: #fde68a; border-color: #d97706; box-shadow: 0 2px 8px rgba(245,158,11,0.25); }

    #connections { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    .connection-line { fill: none; stroke: #165DFF; stroke-width: 2; opacity: 0.6; transition: all 0.2s ease; }
    .connection-line.active { stroke-width: 3; opacity: 1; }
    .connection-label { fill: #fff; font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    .connection-label-bg { fill: #165DFF; }

    .sidebar-menu-item { transition: all 0.2s; cursor: pointer; }
    .sidebar-menu-item:hover { background-color: rgba(22,93,255,0.08); color: #165DFF; }
    .sidebar-menu-item.active { background-color: rgba(22,93,255,0.12); color: #165DFF; border-right: 3px solid #165DFF; }

    .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .tag-blue { background-color: rgba(22,93,255,0.1); color: #165DFF; }
    .tag-green { background-color: rgba(0,180,42,0.1); color: #00B42A; }
    .tag-gray { background-color: #F5F7FA; color: #666; }
    .tag-orange { background-color: rgba(245,158,11,0.12); color: #d97706; }
    .tag-purple { background-color: rgba(124,92,255,0.12); color: #7c5cff; }

    .modal-overlay { transition: opacity 0.3s ease; }
    .modal-content { transition: transform 0.3s ease, opacity 0.3s ease; }
    .modal-hidden { opacity: 0; pointer-events: none; }
    .modal-hidden .modal-content { transform: scale(0.95); opacity: 0; }

    .btn-click:active { transform: scale(0.96); }
    .form-input:focus { border-color: #165DFF; box-shadow: 0 0 0 3px rgba(22,93,255,0.1); outline: none; }

    /* ===== 流程节点卡片（绝对定位，可拖动） ===== */
    .node-card { position:absolute; width:210px; border:2px solid #e5e7eb; background:#fff; border-radius:12px; padding:12px 14px; cursor:grab; transition:border-color .15s, box-shadow .15s; pointer-events:auto; user-select:none; }
    .node-card:hover { border-color:#9db8ff; }
    .node-card.sel { border-color:#165DFF; box-shadow:0 0 0 3px rgba(22,93,255,0.15); }
    .node-start, .node-end { width:180px; margin:0; text-align:center; border-radius:999px; }
    .node-start { background:#165DFF; color:#fff; border-color:#165DFF; }
    .node-end { background:#00B42A; color:#fff; border-color:#00B42A; }
    .node-approval { border-left:4px solid #165DFF; }
    .node-cc { border-left:4px solid #7c5cff; }
    .node-del { position:absolute; top:-9px; right:-9px; width:20px; height:20px; border-radius:50%; background:#fff; border:1px solid #fca5a5; color:#ef4444; font-size:11px; display:none; align-items:center; justify-content:center; }
    .node-card:hover .node-del { display:flex; }

    /* 连接点 */
    .port { position:absolute; width:12px; height:12px; border-radius:50%; background:#fff; border:2px solid #165DFF; left:50%; transform:translateX(-50%); z-index:15; cursor:crosshair; transition:all .15s; }
    .port:hover { background:#165DFF; transform:translateX(-50%) scale(1.2); }
    .port.in { top:-7px; }
    .port.out { bottom:-7px; }
    .node-end .port.in { border-color:#00B42A; }
    .node-start .port.out { border-color:#fff; background:#165DFF; }
    .node-start .port.out:hover { background:#fff; }
    .node-dragging { cursor:grabbing; opacity:.9; }

    /* ===== 画布与连线（SVG） ===== */
    #flowCanvas { position:relative; overflow:hidden; min-width:640px; }
    #edgesSvg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
    #nodeLayer { position:absolute; inset:0; z-index:10; pointer-events:none; }
    #edgeLabelLayer { position:absolute; inset:0; pointer-events:none; z-index:12; }
    .edge-hit { fill:none; stroke:transparent; stroke-width:14; pointer-events:stroke; cursor:pointer; }
    .edge-path { fill:none; stroke:#165DFF; stroke-width:2; opacity:.6; transition:stroke .15s; }
    .edge-path.sel { stroke-width:3; opacity:1; }
    .edge-path.else { stroke:#7c5cff; }
    .edge-bend { fill:#fff; stroke:#165DFF; stroke-width:2; cursor:move; pointer-events:all; }
    .edge-lbl { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-size:11px; padding:3px 10px; border-radius:999px; border:1px dashed #cbd5e1; background:#fff; color:#64748b; cursor:pointer; transition:all .15s; box-shadow:0 1px 3px rgba(0,0,0,.06); pointer-events:auto; }
    .edge-lbl:hover { border-color:#165DFF; color:#165DFF; }
    .edge-lbl.has { border-style:solid; border-color:#f59e0b; color:#d97706; background:#fffbeb; }
    .edge-lbl.else { border-style:solid; border-color:#7c5cff; color:#7c5cff; background:#f5f3ff; }
    .edge-lbl.warn { border-style:solid; border-color:#ef4444; color:#ef4444; background:#fef2f2; }
    .edge-lbl.sel { background:#165DFF; color:#fff; border-color:#165DFF; }

    /* ===== 配置面板 ===== */
    .cfg-logic { font-size:11px; color:#6b7280; margin-top:4px; line-height:1.5; background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; padding:6px 8px; }
    .cfg-info { font-size:11px; color:#6b7280; background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; padding:8px 10px; line-height:1.5; margin-top:6px; }
    .cfg-sec { margin-top:14px; border-top:1px dashed #e5e7eb; padding-top:12px; }
    .cfg-sec-h { font-size:12px; font-weight:700; color:#334155; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .cfg-sec-h::before { content:""; width:3px; height:13px; background:#165DFF; border-radius:2px; display:inline-block; }
    .cfg-tabs { gap:2px; }
    .cfg-tab { flex:1; padding:8px 6px; font-size:12px; font-weight:600; color:#64748b; border-bottom:2px solid transparent; transition:all .15s; white-space:nowrap; }
    .cfg-tab:hover { color:#165DFF; }
    .cfg-tab.on { color:#165DFF; border-bottom-color:#165DFF; background:rgba(22,93,255,0.04); }
    .cfg-warn { font-size:11px; color:#b45309; background:#fffbeb; border:1px solid #fcd34d; border-radius:6px; padding:6px 8px; line-height:1.5; margin-top:8px; }

    .status-pill { font-weight:600; }
    .version-pill { font-weight:600; }

    .tool-pill { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; border:1px solid #e5e7eb; background:#fff; color:#374151; font-size:12px; font-weight:500; cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:all .15s; }
    .tool-pill:hover { border-color:#165DFF; color:#165DFF; box-shadow:0 2px 6px rgba(22,93,255,.1); }
    .tool-pill.approval { border-left:3px solid #165DFF; }
    .tool-pill.cc { border-left:3px solid #7c5cff; }
    .tool-pill.dragging { opacity:.7; }

    /* 节点复制按钮 */
    .node-copy { position:absolute; top:-9px; left:-9px; width:20px; height:20px; border-radius:50%; background:#fff; border:1px solid #9db8ff; color:#165DFF; font-size:10px; display:none; align-items:center; justify-content:center; z-index:3; }
    .node-card:hover .node-copy { display:flex; }
    .node-copy:hover { background:#165DFF; color:#fff; }

    /* 组织架构选人面板 */
    .org-dept-head { user-select:none; }
    .org-cb, .org-mb { width:14px; height:14px; accent-color:#165DFF; cursor:pointer; flex-shrink:0; }
    .org-dept, .org-dept-children { margin-top:1px; }

    [hidden] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50">

  <button class="mobile-toggle-btn" id="mobileToggle" onclick="toggleMobileView()"><i class="fas fa-info"></i></button>

  <div id="app" class="flex h-screen relative">

            <i class="fas fa-th-large w-5 text-center"></i><span class="text-sm">应用中心</span>
          </div>

      </aside>

      <!-- 主内容 -->
      <div class="flex-1 flex flex-col min-w-0 bg-gray-50">

        <!-- ===== 流程列表视图 ===== -->
        <section id="listView" class="flex-1 flex flex-col min-h-0">
          <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between flex-shrink-0">

              <h1 class="text-lg font-semibold text-gray-800">流程中心</h1>

              </div>
            </div>

              <button onclick="openNewFlow()" class="bg-[#165DFF] hover:bg-blue-600 text-white px-3.5 py-1.5 rounded-md text-sm font-medium btn-click"><i class="fas fa-plus mr-1"></i>新建流程</button>
            </div>

                  <th class="px-4 py-3 font-medium">创建人</th><th class="px-4 py-3 font-medium">创建时间</th><th class="px-4 py-3 text-center font-medium">操作</th>

            <div>
              <div class="flex items-center gap-2 mb-2">
                <div class="flex bg-gray-100 rounded-lg p-0.5 text-sm">
                  <button id="mtList" onclick="showView('list')" class="px-3 py-1.5 rounded-md font-medium seg text-gray-500 btn-click">流程列表</button>
                  <button id="mtMonitor" onclick="showView('monitor')" class="px-3 py-1.5 rounded-md font-medium seg bg-white text-[#165DFF] shadow-sm btn-click">实例监控</button>
                </div>

          <div class="proto-desc p-3" data-proto-id="6">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-500 text-white rounded-full text-xs font-bold flex items-center justify-center">6</span>

              <div><h3 class="text-sm font-semibold text-gray-800">版本管理 + 流程锁定</h3>
                <p class="text-xs text-gray-500 mt-1">每次发布生成<b>不可变版本</b>（可点击<b>查看</b>在画布上展示历史版本节点结构）；<b>恢复并发布</b>以该版本内容重新上线、版本号不变；<b>流程锁定</b>按发起时版本渲染在途单据，改版不影响在途。</p></div></div>

          <div class="proto-desc p-3 border border-amber-300 bg-amber-50" data-proto-id="8">
            <div class="flex items-start gap-2"><span class="flex-shrink-0 w-6 h-6 bg-amber-600 text-white rounded-full text-xs font-bold flex items-center justify-center"><i class="fas fa-check"></i></span>
              <div><h3 class="text-sm font-semibold text-gray-800">最终结论 · 流程列表与实例监控开发逻辑</h3>
                <p class="text-xs text-gray-500 mt-1 leading-relaxed">以下为与产品确认后的<b>最终开发逻辑</b>（供开发直接参照）：</p>
                <div class="text-xs text-gray-600 mt-2 space-y-2">
                  <p><b>① 引用数：</b>流程被<b>应用菜单 / 流程任务</b>引用时，列表「引用数」= <code>refs.length</code>；点击可查看引用来源清单（与工作表单一致）。</p>
                  <p><b>② 状态与版本合并：</b>列表「状态」列将状态与版本合并为单标签，三态——<b>已发布 vN</b> / <b>草稿（已下架）</b>(version&gt;0) / <b>草稿（未发布）</b>。</p>
                  <p><b>③ 删除保护：</b>仅<b>「无引用」的草稿流程</b>可删除；被引用的流程删除时<b>拦截并提示"此流程已被引用，不可删除"</b>；已发布流程需先下架再删。</p>
                  <p><b>④ 流程名称唯一：</b>发布时校验重名，重复则提示"流程名称已存在，请修改名称后再发布"。</p>
                  <p><b>⑤ 实例监控 · 实例详情（点击实例行 或「查看」按钮）：</b>弹出<b>流程实例详情</b>，分左右两部分：<b>左侧</b>为绑定表单的<b>具体内容</b>，按「申请信息 / 详细信息」分卡片 section，字段以「标签 + 值」两列网格排版（优先用真实提交数据，缺失回退占位）；<b>右侧</b>为<b>流程流转日志</b>，按节点维度展示「状态徽章 + 当前审批人及各自审批状态（✓已审批 / ○待审批）+ 审批进度 + 操作按钮」。页面<b>下方</b>三个操作按钮：</p>
                  <p class="pl-3"><b>· 调整审批人：</b>仅展示<b>当前审批中节点「未审批」的人</b>（可移除标签）；<b>已完成审批的人以灰色只读标签展示、不可调整</b>；弹窗下方候选池点击可<b>增选 / 重新加回原审批人</b>（如把张三划掉、改加王武）。确定后该节点 <code>actor = 已完成人员 + 未审批人员</code>。</p>
                  <p class="pl-3"><b>· 催办：</b>弹窗列出<b>当前节点未审批人</b>（按 <code>、</code> 拆分），勾选后发送催办提醒；已审批人不出现在可催办列表。</p>
                  <p class="pl-3"><b>· 撤回流程：</b>填写撤回原因，确定后实例状态置「已撤回」并追加一条「撤回」步骤日志。</p>
                  <p class="pl-3"><b>· 前往处理：</b>流转日志中「前往处理」按钮打开<b>真实处理页面</b>——<b>上方为「单据详情」（即左侧表单内容，申请人填写内容）</b>，<b>下方为「当前审批人 + 审批意见」文本框 + 「通过 / 驳回」按钮</b>；点「通过」后把该节点所有审批人写入 <code>done</code> 并将节点置「通过」、流转至下一节点，点「驳回」则实例状态置「已驳回」并终止。</p>
                  <p class="pl-3"><b>· 流转图（右上角）：</b>BFS 分层 + 节点按状态着色 + SVG 连线 + 缩放 + 图例；<b>鼠标悬浮节点</b>显示「节点名称 + 状态 + 全部审批人（✓/○）+ 审批进度」；节点状态仅 3 种：<b>处理中=蓝 / 已流转=绿 / 未流转=灰</b>。开始节点一旦提交即视为「已流转」（绿）；<b>已完成类动作（通过/完成/提交/抄送）视为整节点通过，该节点全部审批人标记为已审批</b>；<b>多人审批节点：只要还有人未审批即显示蓝（处理中），全部通过才显示绿（已流转）——不单独区分"部分通过"状态</b>，悬浮卡仍展示全部审批人（✓已审批 / ○待审批）及进度 N/M。示例实例 I1 的「直属主管审批」李强已通过→整节点绿且李强显示<b>已审批</b>，「部门总监审批」为 张三✓/李四○ 的<b>处理中（蓝）</b>，I2（已通过）全绿；驳回节点（如 I4「部门总监审批」）归为<b>未流转（灰）</b>。</p>
                  <p><b>⑥ 实例入口统一：</b>点击实例行与「查看」按钮均打开上述<b>统一详情</b>（左表单 / 右日志 / 底三按钮 / 右上流转图）；<b>不再提供按人员维度的任务列表聚合</b>。</p>
                  <p><b>⑦ 流程版本号（与工作表单一致）：</b>首次发布生成 <b>v1</b>；后续发布时，将「本次内容与<b>上一个线上版本快照</b>」做全量比对——<b>内容有任意变化 → 版本号 +1</b>；<b>编辑后内容与原线上版本完全相同（无丝毫变化）→ 版本号保持不变</b>，仅刷新发布信息；历史版本「恢复并发布」以该版本内容重新上线，<b>版本号保持原值</b>；发布成功后，全员可发起。</p>
                  <p><b>⑧ 表锁定：</b>流程发起时锁定版本号，在途单据按当时 schema 渲染，改版不扰乱历史数据。</p>
                  <p><b>⑨ 找不到节点负责人时的兜底策略：</b>节点配置面板 → 审批人 Tab →「找不到节点负责人时」仅提供「转给指定成员 / 自动提交」两种兜底；选「转给指定成员」则自动指派到指定成员继续流转，选「自动提交」则跳过该节点并按流转条件进入下一节点。</p>
                  <p><b>⑩ 时限超时站内消息模板（节点 Tab · 时限超时 · 发送站内消息提醒）：</b>向该节点<b>全部未审批人</b>各发送一条站内消息，标题固定为「<b>【流程超时提醒】您的审批任务已超时</b>」，正文模板：<code>您有待审批单据《{流程名称}》（编号：{单据编号}，节点：{节点名称}）已超时 {N}{小时/天}，请尽快处理。点击查看详情 →</code>。变量名固定、不可编辑；若同时配置了邮件通道则同步发送邮件。</p>
                  <p><b>⑪ 流程结束动作「通知发起人」站内消息模板：</b>结束节点选择「通知发起人」时，实例进入「已结束」即向<b>发起人</b>发送站内消息，标题固定为「<b>【流程已结束】您发起的 {流程名称} 已处理完成</b>」，正文模板：<code>您于 {发起时间} 发起的《{流程名称}》（编号：{单据编号}）已于 {结束时间} 处理完成，最终结果：{全部通过 / 被驳回于{驳回节点} / 审批异常}。点击查看详情 →</code>。</p>
                  <p><b>⑫ 流程实例无暂存数据：</b>流程实例监控列表不展示「草稿 / 暂存」类单据；新建发起即进入「审批中」等正式状态，未正式提交的暂存草稿不进入实例监控。</p>
                  <p><b>⑬ 审批节点的「驳回」与「拒绝」为两种独立动作：</b>「驳回」（配置项「允许驳回」+「驳回至 发起人/上一节点」）将单据退回指定位置，实例进入「已驳回」状态，发起人修改后可重新提交流转；「拒绝」（配置项「允许拒绝」）视为流程终止，实例直接进入「已拒绝」状态，不可再流转。两者状态互不相同，运行态审批处理页按节点配置独立显示「驳回」「拒绝」两个按钮。</p>
                  <p><b>⑭ 流程下架语义（软下线 · 仅阻止新增引用）：</b>下架不改变"已建立关系"——已将该流程挂载为菜单素材的菜单项<b>仍可正常发起</b>，已发起的流程实例<b>不受影响、继续流转、保留可查</b>；下架仅阻止"新增引用"：下架后<b>不能再被新应用菜单挂载</b>（仅"已发布"素材可挂载）；流程自身状态回退"草稿（已下架）"保留历史版本快照可查，可重新「发布」上线；流程下架<b>不影响其绑定的表单</b>（表单是否下架为独立决策）。下架横幅文案：「流程『{名称}』已下架。已挂载该流程的菜单仍可正常发起；不再接受新的菜单挂载。历史版本保留可查，可重新发布上线。」</p>
                  <p><b>⑮ 字段字符长度限制（通用规则）：</b>所有「名称类」字段统一上限 <b>20 个字符</b>、「描述类」字段统一上限 <b>500 个字符</b>，超出即禁止继续输入（前端 maxlength 硬限制 + 后端校验，发布时若超限提示「{字段}不可超过 N 字」）。本模块适用：流程<b>名称 ≤ 20</b> 字、流程<b>描述 ≤ 500</b> 字。</p>
                </div>
              </div></div>
          </div>
        </div>
      </div>
    </div>

  /* ===================== 流程实例监控（设计端） ===================== */
  function renderInstanceMonitor(){
    const tb=document.getElementById('instBody'); if(!tb) return;

    const rows=FLOW_INSTANCES.filter(function(s){return (!kw||(s.flowName.indexOf(kw)>=0||s.initiator.indexOf(kw)>=0))&&(!st||s.status===st)&&(!app||s.appName===app);});

      return '<tr class="border-t border-gray-100 hover:bg-[#165DFF]/5 cursor-pointer" onclick="openInstanceDetail(\''+s.id+'\')">'+
        '<td class="px-4 py-3 font-medium text-gray-800">'+s.id+'</td>'+
        '<td class="px-4 py-3">'+s.flowName+'</td>'+
        '<td class="px-4 py-3 text-gray-600">'+s.appName+'</td>'+
        '<td class="px-4 py-3 text-gray-600">'+s.initiator+'</td>'+
        '<td class="px-4 py-3 text-gray-400">'+s.startTime+'</td>'+
        '<td class="px-4 py-3"><span class="tag px-2 py-0.5 rounded text-xs '+instStatusCls(s.status)+'">'+s.status+'</span></td>'+
        '<td class="px-4 py-3 text-gray-500">'+s.currentNode+'</td>'+
        '<td class="px-4 py-3 text-center"><button class="text-[#165DFF] hover:text-blue-700 text-sm font-medium btn-click" onclick="event.stopPropagation();openInstanceDetail(\''+s.id+'\')"><i class="fas fa-eye mr-1"></i>查看</button></td>'+
      '</tr>';
    }).join('') : '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-400">没有流程实例</td></tr>';
    const cnt=document.getElementById('instCount'); if(cnt) cnt.textContent='共 '+rows.length+' 条实例';

  function instStatusCls(s){return ({'审批中':'bg-blue-100 text-blue-600','已通过':'bg-green-100 text-green-600','已驳回':'bg-red-100 text-red-600','已拒绝':'bg-red-100 text-red-600','已撤回':'bg-amber-100 text-amber-600'})[s]||'bg-gray-100 text-gray-500';}
  /* ===================== 实例监控：实例详情(点击实例行) + 流转图 ===================== */
  /* openInstanceDetail：整个流程实例详情 — 左=表单内容(分section,2列) | 右=流转日志(节点+负责人+开始处理+处理耗时+操作) | 底部=调整审批人/催办/撤回流程 | 右上=流转图/显示内容切换 */
  function openInstanceDetail(id){

          <button onclick="openInstanceFlowChart('${s.id}')" class="px-3 py-1.5 text-sm rounded-md border border-gray-300 text-gray-600 hover:text-[#165DFF] hover:border-[#165DFF] btn-click"><i class="fas fa-project-diagram mr-1"></i>流转图</button>

  function toggleInstLog(){
    const p=document.getElementById('instLogPanel'); const b=document.getElementById('logToggleBtn');
    if(!p) return;
    const hidden=p.classList.toggle('hidden');
    if(b) b.innerHTML=hidden?'<i class="fas fa-eye-slash mr-1"></i>隐藏内容':'<i class="fas fa-eye mr-1"></i>显示内容';
  }
  /* 左：表单内容(卡片式分section排版) —— 优先展示该实例的真实提交数据 */
  const INSTANCE_FORM_DATA={
    I1:{ leaveType:'事假', days:'3', startDate:'2026-08-05', endDate:'2026-08-07', reason:'家中有事需处理，已安排同事代为跟进手头工作，请假期间手机保持畅通。' },
    I2:{ leaveType:'年假', days:'5', startDate:'2026-08-04', endDate:'2026-08-08', reason:'暑期家庭出游，提前安排好工作交接。' },
    I3:{ amount:'2,380.00', costType:'差旅', remark:'北京客户拜访差旅费用（高铁 + 住宿）。' },
    I4:{ leaveType:'病假', days:'2', startDate:'2026-08-06', endDate:'2026-08-07', reason:'感冒发烧，医嘱居家休息两天。' }
  };
  function buildFormSections(s){
    const flow=FLOWS.find(x=>x.id===s.flowId);
    const form=flow?FORM(flow.formId):null;
    if(!form||!form.fields||!form.fields.length) return '<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8 text-center text-sm text-gray-400">该流程未绑定表单或无字段。</div>';
    const f=form.fields;
    const data=INSTANCE_FORM_DATA[s.id]||{};
    const groups=[
      { title:'申请信息', icon:'fa-file-alt', fields:f.slice(0, Math.min(4, f.length)) },
      { title:'详细信息', icon:'fa-align-left', fields:f.slice(4) }
    ].filter(g=>g.fields.length);
    return `<div class="space-y-5">
      ${groups.map(g=>`
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
          <div class="flex items-center gap-2 px-5 py-3.5 border-b border-gray-100 bg-gray-50/70">
            <span class="w-7 h-7 rounded-lg bg-blue-50 text-[#165DFF] flex items-center justify-center"><i class="fas ${g.icon} text-xs"></i></span>
            <h3 class="text-sm font-semibold text-gray-800">${escapeHTML(g.title)}</h3>
          </div>
          <div class="px-5 py-2 grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-0">
            ${g.fields.map(fld=>fieldRow(fld, data)).join('')}
          </div>
        </div>`).join('')}
    </div>`;
  }
  function fieldRow(fld, data){
    const key=fld.fieldName||fld.name;
    const val=(data && (key in data) && data[key]!=='' && data[key]!==undefined) ? data[key] : mockFieldValue(fld);
    return `<div class="flex flex-col gap-1 py-3.5 border-b border-gray-50 sm:border-0">
      <span class="text-xs text-gray-400">${escapeHTML(fld.label||fld.name||'字段')}</span>
      <span class="text-sm text-gray-800 font-medium leading-5">${escapeHTML(val)}</span>
    </div>`;
  }
  function mockFieldValue(fld){
    const t=fld.type, lb=(fld.label||'');
    if(['member','dept','formref','feed'].indexOf(t)>=0) return '李四';
    if(t==='number'||lb.indexOf('天数')>=0) return '3 天';
    if(t==='date'||t==='datetime'||lb.indexOf('日期')>=0) return '2026-08-05';
    if(lb.indexOf('类型')>=0) return '事假';
    if(t==='select'||t==='radio'||t==='multiselect'||t==='checkbox') return (fld.options&&fld.options[0])?fld.options[0].label:'选项A';
    if(t==='textarea'||lb.indexOf('事由')>=0) return '家中事务处理，需请假三天，工作已交接。';
    return '—';
  }
  /* 右：流转日志(节点维度) */
  function buildRichLog(s){
    const flow=FLOWS.find(x=>x.id===s.flowId);
    const nodeObjs=flow?(flow.nodes||[]):[];
    const names=s.nodes||[];
    if(!names.length) return '<p class="text-sm text-gray-400">暂无流程节点。</p>';
    const rels=['40分钟前','1小时前','2小时前','3小时前','4小时前','5小时前'];
    const costs=['2小时','34秒','1秒','37秒','1秒','10秒'];
    return names.map((nm,i)=>{
      const n=nodeObjs.find(x=>x.name===nm)||{name:nm, type:'approval'};
      const stt=nodeApprovalState(s,n); const a=stt.key;
      const isP=(a==='审批中');
      const isD=a==='已流转';
      let badge;
      if(isP) badge='<span class="tag px-1.5 py-0.5 rounded text-[10px] bg-blue-100 text-blue-600">处理中</span>';
      else if(isD) badge='<span class="tag px-1.5 py-0.5 rounded text-[10px] bg-green-100 text-green-600">已完成</span>';
      else badge='<span class="tag px-1.5 py-0.5 rounded text-[10px] bg-gray-100 text-gray-400">未开始</span>';
      const rel=rels[i]||rels[rels.length-1];
      const cost=costs[i]||'—';
      const rawStep=(s.steps||[]).find(st=>st.node===n);
      let body='';
      if(isP){
        const approversHtml = stt.approvers.length ? '<div class="mt-2 space-y-1">'+stt.approvers.map(x=>`<div class="flex items-center gap-2 text-xs"><i class="fas ${x.done?'fa-check-circle text-green-500':'fa-clock text-orange-400'}"></i><span class="text-gray-700">${escapeHTML(x.name)}</span>${x.done?'<span class="text-green-500">已审批</span>':'<span class="text-orange-500">待审批</span>'}</div>`).join('')+'</div>' : '';
        body=`<div class="text-xs text-gray-500 mt-1.5">当前审批进度：<span class="text-gray-800 font-medium">${stt.doneCount}/${stt.total}</span></div>${approversHtml}
          <button class="mt-2 px-2.5 py-1 text-xs rounded-md border border-[#165DFF] text-[#165DFF] hover:bg-blue-50 btn-click" onclick="openHandleNode('${s.id}','${escapeHTML(nm)}')">前往处理</button>`;
      } else if(isD){
        const approversHtml = stt.approvers.length ? '<div class="mt-1.5 space-y-1">'+stt.approvers.map(x=>`<div class="flex items-center gap-2 text-xs"><i class="fas fa-check-circle text-green-500"></i><span class="text-gray-700">${escapeHTML(x.name)}</span><span class="text-green-500">已审批</span></div>`).join('')+'</div>' : `<div class="text-xs text-gray-500 mt-1.5">${escapeHTML(rawStep?rawStep.actor:'—')}</div>`;
        body=approversHtml+`<div class="text-xs text-gray-400 mt-0.5">开始处理：${rel}</div><div class="text-xs text-gray-400">处理耗时：${cost}</div>`;
      } else {
        // 未开始 / 已驳回等未通过流转的节点：统一归为“未开始”（仅保留3种状态，不再使用已驳回）
        if(rawStep && rawStep.action==='驳回'){
          body=`<div class="text-xs text-gray-500 mt-1.5">${escapeHTML(rawStep.actor||'—')}</div>`+(rawStep.comment?`<div class="text-xs text-gray-400 mt-0.5">驳回意见：${escapeHTML(rawStep.comment)}</div>`:'');
        } else {
          body='<div class="text-xs text-gray-300 mt-1.5">未开始</div>';
        }
      }
      return `<div class="border-b border-gray-100 pb-3 mb-3 last:border-0">
        <div class="flex items-center justify-between"><span class="text-sm font-semibold text-gray-800">${escapeHTML(n)}</span>${badge}</div>
        ${body}
      </div>`;
    }).join('');
  }
  /* 前往处理：真实处理页面(上=单据详情, 下=审批意见+通过/驳回) */
  function openHandleNode(id, nodeName){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const flow=FLOWS.find(x=>x.id===s.flowId);
    const nodeObj=(flow?(flow.nodes||[]):[]).find(n=>n.name===nodeName) || {name:nodeName, type:'approval'};
    const stt=nodeApprovalState(s, nodeObj);
    const formHtml=buildFormSections(s);
    const approversHtml = stt.approvers && stt.approvers.length ? stt.approvers.map(x=>`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full ${x.done?'bg-green-50 text-green-600':'bg-amber-50 text-amber-600'} text-xs"><i class="fas ${x.done?'fa-check-circle':'fa-clock'}"></i>${escapeHTML(x.name)}</span>`).join(' ') : '<span class="text-sm text-gray-500">—</span>';
    const html=`<div id="handleModal" class="fixed inset-0 z-[225] flex items-center justify-center bg-black/40" onclick="if(event.target===this)closeHandleModal()">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 max-h-[92vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 flex-shrink-0"><h3 class="text-lg font-semibold text-gray-800"><i class="fas fa-tasks mr-2 text-[#165DFF]"></i>审批处理 · ${escapeHTML(nodeName)}</h3><button onclick="closeHandleModal()" class="text-gray-400 hover:text-gray-600 btn-click"><i class="fas fa-times"></i></button></div>
        <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
          <div>
            <div class="text-xs text-gray-400 mb-2">单据详情（申请人填写内容）</div>
            ${formHtml}
          </div>
          <div class="bg-gray-50 rounded-xl border border-gray-200 p-4">
            <div class="flex items-center justify-between mb-3"><span class="text-sm font-medium text-gray-700">当前审批人</span><div class="flex flex-wrap gap-1.5">${approversHtml}</div></div>
            <label class="block text-xs text-gray-400 mb-1">审批意见</label>
            <textarea id="handleOpinion" rows="3" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-[#165DFF] focus:outline-none" placeholder="请输入审批意见（可选）..."></textarea>
          </div>
        </div>
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 flex-shrink-0">
          ${nodeObj.allowBounceBack?'<button onclick="confirmBounceBack(\''+s.id+'\',\''+escapeHTML(nodeName)+'\')" class="px-4 py-2 text-sm rounded-lg border border-red-400 text-red-500 hover:bg-red-50 btn-click"><i class="fas fa-undo mr-1"></i>驳回</button>':''}
          ${nodeObj.allowReject?'<button onclick="confirmReject(\''+s.id+'\',\''+escapeHTML(nodeName)+'\')" class="px-4 py-2 text-sm rounded-lg border border-red-500 text-red-500 hover:bg-red-50 btn-click"><i class="fas fa-ban mr-1"></i>拒绝</button>':''}
          <button onclick="confirmApprove('${s.id}','${escapeHTML(nodeName)}')" class="px-4 py-2 bg-[#165DFF] hover:bg-blue-600 text-white text-sm rounded-lg font-medium btn-click"><i class="fas fa-check mr-1"></i>通过</button>
        </div>
      </div></div>`;
    document.body.insertAdjacentHTML('beforeend', html);
  }
  function closeHandleModal(){ const e=document.getElementById('handleModal'); if(e) e.remove(); }
  function nextNodeName(s, nodeName){ const arr=s.nodes||[]; const i=arr.indexOf(nodeName); return (i>=0 && i<arr.length-1)?arr[i+1]:null; }
  function confirmApprove(id, nodeName){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const opinion=(document.getElementById('handleOpinion')||{}).value||'';
    const st=(s.steps||[]).find(x=>x.node===nodeName);
    if(st){ const approvers=(st.actor||'').split(/[、,， ]/).filter(Boolean); st.done=approvers.slice(); st.action='通过'; st.time=fmtDateTimeNow(); st.comment=opinion; }
    const nx=nextNodeName(s, nodeName);
    if(nx && nx!=='结束'){ s.currentNode=nx; (s.steps=s.steps||[]).push({ node:nx, actor:'—', action:'审批中', time:'—', comment:'' }); }
    else { s.currentNode='结束'; s.status='已通过'; (s.steps=s.steps||[]).push({ node:'结束', actor:'系统', action:'完成', time:fmtDateTimeNow(), comment:'' }); }
    closeHandleModal(); closeInstance(); openInstanceDetail(id); renderInstanceMonitor();
    alert('已通过，流程已流转至下一节点（原型演示）');
  }
  function confirmReject(id, nodeName){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const opinion=(document.getElementById('handleOpinion')||{}).value||'';
    const st=(s.steps||[]).find(x=>x.node===nodeName); if(st){ st.action='拒绝'; st.time=fmtDateTimeNow(); st.comment=opinion; }
    s.status='已拒绝'; s.currentNode=nodeName;
    closeHandleModal(); closeInstance(); openInstanceDetail(id); renderInstanceMonitor();
    alert('已拒绝，流程终止（原型演示）');
  }
  function confirmBounceBack(id, nodeName){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const opinion=(document.getElementById('handleOpinion')||{}).value||'';
    const st=(s.steps||[]).find(x=>x.node===nodeName); if(st){ st.action='驳回'; st.time=fmtDateTimeNow(); st.comment=opinion; }
    s.status='已驳回'; s.currentNode=nodeName;
    closeHandleModal(); closeInstance(); openInstanceDetail(id); renderInstanceMonitor();
    alert('已驳回，单据退回修改（原型演示）');
  }

  /* 调整审批人 */
  let _adjSel=[], _adjDone=[];
  const APPROVER_POOL=['张三','李四','王武','张伟','李强','王芳','赵敏','孙磊','周婷','吴昊'];
  function openAdjustApprover(id){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const curStep=(s.steps||[]).find(st=>st.action==='审批中');
    if(!curStep){ alert('当前流程没有处于审批中的节点，无法调整审批人。'); return; }
    const approvers=String(curStep.actor||'').split(/[、,， ]/).filter(Boolean);
    const done=(curStep.done||[]).filter(d=>approvers.indexOf(d)>=0);
    _adjDone=done.slice();
    _adjSel=approvers.filter(a=>done.indexOf(a)<0);
    const html=`<div id="adjModal" class="fixed inset-0 z-[220] flex items-center justify-center bg-black/40" onclick="if(event.target===this)closeAdjModal()">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200"><h3 class="text-lg font-semibold text-gray-800"><i class="fas fa-user-edit mr-2 text-[#165DFF]"></i>调整审批人</h3><button onclick="closeAdjModal()" class="text-gray-400 hover:text-gray-600 btn-click"><i class="fas fa-times"></i></button></div>
        <div class="px-6 py-5">
          <p class="text-sm text-gray-500 mb-2">当前节点：<b class="text-gray-800">${escapeHTML(s.currentNode||'')}</b></p>
          <p class="text-sm text-gray-500 mb-2">当前未审批的审批人（可删减 / 增选）：</p>
          <div id="adjSelBox" class="flex flex-wrap gap-2 mb-3 min-h-[40px] p-3 rounded-lg bg-blue-50/40 border border-blue-200"></div>
          ${_adjDone.length?`<p class="text-xs text-gray-400 mb-1">以下人员已完成审批（不可调整）：</p><div class="flex flex-wrap gap-2 mb-4">${_adjDone.map(n=>`<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-gray-100 text-gray-400 text-xs"><i class="fas fa-check-circle"></i>${escapeHTML(n)}</span>`).join('')}</div>`:''}
          <p class="text-xs text-gray-400 mb-2">点击下方姓名可添加 / 移除审批人：</p>
          <div id="adjPoolBox" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50">
          <button onclick="closeAdjModal()" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 btn-click">取消</button>
          <button onclick="confirmAdjustApprover('${s.id}')" class="px-4 py-2 bg-[#165DFF] hover:bg-blue-600 text-white text-sm rounded-lg font-medium btn-click">确定调整</button>
        </div>
      </div></div>`;
    document.body.insertAdjacentHTML('beforeend', html);
    renderAdjChips();
  }

  function openInstanceFlowChart(id){
    const s=FLOW_INSTANCES.find(x=>x.id===id); if(!s) return;
    const flow=FLOWS.find(x=>x.id===s.flowId); if(!flow) return;
    const nodes=flow.nodes||[]; const edges=flow.edges||[];
    const steps=s.steps||[];
    // 开始/结束节点在流程定义中的默认名是「发起人/流程结束」，而实例步骤里写的是「开始/结束」，
    // 这里按类型兜底匹配，保证状态判定正确。
    const dispName=nObj=>(nObj.type==='start'?'开始':(nObj.type==='end'?'结束':nObj.name));
    const statusOf=nObj=>nodeApprovalState(s, nObj).key;
    const adj={}; nodes.forEach(n=>{adj[n.id]=[];});
    edges.forEach(e=>{ if(adj[e.from]) adj[e.from].push(e.to); });
    const startNode=nodes.find(n=>n.type==='start')||nodes[0];
    const layer={}; const visited=new Set();
    if(startNode){ visited.add(startNode.id); layer[startNode.id]=0; const q=[startNode.id];
      while(q.length){ const id=q.shift(); (adj[id]||[]).forEach(to=>{ if(!visited.has(to)){ visited.add(to); layer[to]=(layer[id]||0)+1; q.push(to); } }); }
    }
    let ml=Math.max(0,...Object.values(layer));
    nodes.forEach(n=>{ if(!(n.id in layer)){ ml++; layer[n.id]=ml; } });
    const groups={}; nodes.forEach(n=>{ const l=layer[n.id]; (groups[l]=groups[l]||[]).push(n); });
    const layerKeys=Object.keys(groups).map(Number).sort((a,b)=>a-b);
    const NW=180,NH=52,GAP_Y=90,GAP_X=40;
    const positions={};
    layerKeys.forEach(l=>{
      const row=groups[l];
      const totalW=row.length*NW+(row.length-1)*GAP_X;
      const rowStartX=-(totalW/2);
      row.forEach((n,j)=>{ positions[n.id]={x:rowStartX+j*(NW+GAP_X), y:l*(NH+GAP_Y)}; });
    });
    let minX=Infinity,maxX=-Infinity,maxY=0;
    Object.keys(positions).forEach(id=>{ const p=positions[id]; if(p.x<minX) minX=p.x; if(p.x+NW>maxX) maxX=p.x+NW; if(p.y+NH>maxY) maxY=p.y+NH; });
    const pad=60;
    const offX=-minX+pad, offY=pad;
    const CW=maxX-minX+pad*2, CH=maxY+pad*2;
    const statusCls={'审批中':'border-blue-500 bg-blue-50 text-blue-700','已流转':'border-green-500 bg-green-50 text-green-700','未流转':'border-gray-300 bg-gray-50 text-gray-500'};
    const nodeHTML=nodes.map(n=>{
      const stt=nodeApprovalState(s,n); const p=positions[n.id];
      return `<div class="absolute flex items-center justify-center gap-2 rounded-full border-2 ${statusCls[stt.key]} px-5 py-2.5 cursor-pointer hover:shadow-md bg-white" style="left:${p.x+offX}px;top:${p.y+offY}px;width:${NW}px;height:${NH}px;" onmouseenter="showNodeChartHover('${s.id}','${n.id}')" onmouseleave="hideNodeChartHover()">
        <i class="fas ${FLOW_NODE_ICON[n.type]||'fa-circle'}"></i>
        <span class="text-sm font-medium">${escapeHTML(dispName(n))}</span>
      </div>`;
    }).join('');
    let edgePaths='<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker></defs>';
    edges.forEach(e=>{
      const a=positions[e.from], b=positions[e.to]; if(!a||!b) return;
      const ax=a.x+offX+NW/2, ay=a.y+offY+NH;
      const bx=b.x+offX+NW/2, by=b.y+offY;
      const my=(ay+by)/2;
      edgePaths+=`<path d="M${ax},${ay} C${ax},${my} ${bx},${my} ${bx},${by}" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>`;
    });
    window._chartPositions=positions; window._chartOffX=offX; window._chartOffY=offY;
    const ver='V'+(s.currentIdx||1);
    const html=`<div id="flowChartPage" class="fixed inset-0 z-[230] flex flex-col bg-white" onclick="if(event.target===this)closeFlowChart()">
      <div class="flex items-center justify-between px-6 py-3 border-b border-gray-200 flex-shrink-0" onclick="event.stopPropagation()">
        <div class="flex items-center gap-3"><span class="px-2.5 py-1 rounded-full border border-[#165DFF] text-[#165DFF] text-xs font-medium">流程版本 ${ver}</span></div>
        <div class="flex items-center gap-4 text-xs text-gray-600">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded border-2 border-blue-500 bg-blue-50 inline-block"></span>处理中</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded border-2 border-green-500 bg-green-50 inline-block"></span>已流转</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded border-2 border-gray-300 bg-gray-50 inline-block"></span>未流转</span>
        </div>
        <button onclick="closeFlowChart()" class="w-8 h-8 rounded-md text-gray-400 hover:bg-gray-100 btn-click"><i class="fas fa-times"></i></button>
      </div>
      <div class="flex items-center gap-2 px-6 py-2 border-b border-gray-100 text-sm text-gray-600 flex-shrink-0" onclick="event.stopPropagation()">
        <button onclick="zoomChart(-0.1)" class="w-7 h-7 rounded border border-gray-300 hover:border-[#165DFF] btn-click">−</button>
        <span id="chartZoomLabel" class="w-12 text-center">100%</span>

    document.body.insertAdjacentHTML('beforeend', html);
