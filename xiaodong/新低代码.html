    const fcv=f.fc.views.find(v=>v.id===window.__fdViewId)||f.fc.views.find(v=>v.isDefault)||f.fc.views[0];
    const defs=(fcv.listFields&&fcv.listFields.length)?fcv.listFields:(fields||[]).map(x=>({field:x.fieldName,label:x.label,sortable:false}));
    const cols=defs.map(x=>({key:x.field,label:x.label,sortable:!!x.sortable}));
    const qfs=(fcv.queryFields||[]).map(x=>({field:x.field,label:x.label,mode:x.mode||'like'}));
    const kw=(document.getElementById('fdSearch')?document.getElementById('fdSearch').value:'').trim();
    const st=document.getElementById('fdStatus')?document.getElementById('fdStatus').value:'';
    const qvals=qfs.map(q=>({q, v:(document.getElementById('fdq_'+q.field)?document.getElementById('fdq_'+q.field).value:'').trim()}));
    const rows=subs.filter(s=>{
      if(kw && !(s.submitter.indexOf(kw)>=0||JSON.stringify(s.vals).indexOf(kw)>=0)) return false;
      if(st && s.status!==st) return false;
      for(const it of qvals){ if(!it.v) continue; const fv=String(s.vals[it.q.field]==null?'':s.vals[it.q.field]); if(fv.indexOf(it.v)<0) return false; }
      return true;
    });
    const headCols=cols.map(c=>`<th class="px-3 py-2 font-medium">${c.label}${c.sortable?' <i class="fas fa-sort text-gray-300 ml-0.5"></i>':''}</th>`).join('');
    const head=document.getElementById('fdHead'); if(head) head.innerHTML=headCols+'<th class="px-3 py-2 font-medium">提交人</th><th class="px-3 py-2 font-medium">提交时间</th><th class="px-3 py-2 font-medium">状态</th>';
    const stl=function(s){return ({'已通过':'bg-green-100 text-green-600','审批中':'bg-blue-100 text-blue-600','草稿':'bg-gray-100 text-gray-500','已驳回':'bg-red-100 text-red-600'})[s.status]||'bg-gray-100 text-gray-500';};
    const body=document.getElementById('fdBody'); if(!body) return;
    body.innerHTML = rows.length? rows.map(function(s){
      const cells=cols.map(function(c){var v=s.vals[c.key];return '<td class="px-3 py-2 text-gray-700">'+(v!==undefined&&v!==''?v:'<span class="text-gray-300">—</span>')+'</td>';}).join('');
      return '<tr class="border-t border-gray-100 hover:bg-[#165DFF]/5 cursor-pointer" onclick="showFormDetail(\''+id+'\',\''+s.id+'\')">'+cells+
        '<td class="px-3 py-2 text-gray-600">'+s.submitter+'</td>'+
        '<td class="px-3 py-2 text-gray-400">'+s.time+'</td>'+
        '<td class="px-3 py-2"><span class="tag px-2 py-0.5 rounded text-xs '+stl(s.status)+'">'+s.status+'</span></td>'+
      '</tr>';
    }).join('') : '<tr><td colspan="'+(cols.length+3)+'" class="px-3 py-8 text-center text-gray-400">没有符合条件的提交</td></tr>';
  }
  function showFormDetail(id,sid){
    const f=SAMPLE_FORMS.find(x=>x.id===id); const s=(SAMPLE_SUBMISSIONS[id]||[]).find(x=>x.id===sid); if(!s) return;
    const rows=f.fields.map(x=>'<div class="flex py-2 border-b border-gray-100"><span class="w-32 text-gray-400 text-sm flex-none">'+x.label+'</span><span class="text-gray-800 text-sm">'+(s.vals[x.fieldName]||'—')+'</span></div>').join('');
    const html='<div id="fdDetail" class="fixed inset-0 z-[210] flex items-center justify-center bg-black/30" onclick="if(event.target===this)closeFormDetail()">'+
      '<div class="bg-white rounded-lg shadow-xl w-[460px] max-w-[92vw]">'+
        '<div class="flex items-center justify-between px-5 py-3 border-b border-gray-200"><div class="font-semibold text-gray-800">提交详情 · '+s.id+'</div><button onclick="closeFormDetail()" class="w-8 h-8 rounded-md text-gray-400 hover:bg-gray-100 btn-click"><i class="fas fa-times"></i></button></div>'+
        '<div class="px-5 py-3">'+rows+'<div class="flex py-2 border-b border-gray-100"><span class="w-32 text-gray-400 text-sm flex-none">提交人</span><span class="text-gray-800 text-sm">'+s.submitter+'</span></div><div class="flex py-2"><span class="w-32 text-gray-400 text-sm flex-none">提交时间</span><span class="text-gray-800 text-sm">'+s.time+'</span></div></div>'+
        '<div class="px-5 py-3 border-t border-gray-200 flex justify-end"><button onclick="closeFormDetail()" class="px-3 py-1.5 text-sm rounded-md bg-gray-100 text-gray-600 btn-click">关闭</button></div>'+
      '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
  }
  function closeFormDetail(){ const e=document.getElementById('fdDetail'); if(e) e.remove(); }
  function exportFormData(id){ const n=(SAMPLE_SUBMISSIONS[id]||[]).length; alert('导出「'+(SAMPLE_FORMS.find(x=>x.id===id).name)+'」的 '+n+' 条提交数据为 Excel（原型演示）'); }
  function closeFormData(){ const e=document.getElementById('fdOverlay'); if(e) e.remove(); }

  /* ===================== 控件面板 ===================== */
  function renderPalette(){
    const groups = { basic:[], select:[], advanced:[], biz:[] };
    Object.entries(CONTROL_DEFS).forEach(([t,d])=>groups[d.group].push(t));
    Object.entries(groups).forEach(([g,types])=>{
      document.getElementById(GROUP_MAP[g]).innerHTML = types.map(t=>{
        const d=CONTROL_DEFS[t];
        return `<div class="ctrl-item flex items-center gap-2 px-3 py-2 rounded-md border border-gray-200 bg-white text-sm text-gray-700"
                     draggable="true" data-type="${t}" ondragstart="onCtrlDragStart(event,'${t}')" onclick="addFieldAt('${t}')">
                  <i class="fas ${d.icon} text-[#165DFF] w-4 text-center"></i><span>${d.label}</span></div>`;
      }).join('');
    });
  }

  /* ===================== 字段增删 / 排序 ===================== */
  function addFieldAt(type, index){
    const d=CONTROL_DEFS[type];
    const f=Object.assign({ id:nid(), type, label:d.label, fieldName:genFieldName(d.label,type), span:12, required:false, helpText:'', visible:{mode:'always',logic:'and',conditions:[{field:'',op:'eq',value:''}]} }, d.defaults());
    let idx = (index==null)?fields.length:index;
    if(idx<0) idx=0; if(idx>fields.length) idx=fields.length;
    fields.splice(idx,0,f); selectedId=f.id;
    renderCanvas(); renderConfig();
  }
  function moveField(id, toIndex){
    const from = fields.findIndex(f=>f.id===id); if(from<0) return;
    const [item]=fields.splice(from,1);
    let idx=toIndex; if(idx>from) idx--;
    if(idx<0) idx=0; if(idx>fields.length) idx=fields.length;
    fields.splice(idx,0,item); selectedId=id;
    renderCanvas(); renderConfig();
  }
  function deleteField(id){ fields=fields.filter(f=>f.id!==id); if(selectedId===id) selectedId=null; renderCanvas(); renderConfig(); }
  function selectField(id){ selectedId=id; renderCanvas(); renderConfig(); }
  function deselectField(){ selectedId=null; renderCanvas(); renderConfig(); }

  /* ===================== 拖拽（新增 + 排序） ===================== */
  let dragPayload=null, dropIndex=null;
  function onCtrlDragStart(e,type){ dragPayload={kind:'new',type}; e.dataTransfer.effectAllowed='copy'; e.dataTransfer.setData('text/plain',type); }
  function onFieldDragStart(e,id){ dragPayload={kind:'move',id}; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id); }
  function onCanvasDragOver(e){
    if(formViewingVersion) return;
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
    document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
    document.querySelectorAll('.subform-dragover').forEach(s=>s.classList.remove('subform-dragover'));
    // 拖入子表单区域：高亮整个子表单卡片并新增为「列」，不再落到顶层字段
    const subEl=e.target.closest('[data-subform]');
    if(subEl && dragPayload && dragPayload.kind==='new' && dragPayload.type!=='subform'){
      const card=subEl.closest('.field-card')||subEl;
      card.classList.add('subform-dragover'); dropIndex=fields.length; return;
    }
    const card=e.target.closest('.field-card');
    if(card){
      const r=card.getBoundingClientRect();
      const after = e.clientY > r.top + r.height/2;
      card.classList.add(after?'drop-after':'drop-before');
      const idx=fields.findIndex(f=>f.id===card.dataset.id);
      dropIndex = after ? idx+1 : idx;
    } else { dropIndex = fields.length; }
    document.getElementById('canvas').classList.add('canvas-dragover');
  }
  function onCanvasDragLeave(e){ document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('drop-before','drop-after')); document.querySelectorAll('.subform-dragover').forEach(s=>s.classList.remove('subform-dragover')); document.getElementById('canvas').classList.remove('canvas-dragover'); }
  function onCanvasDrop(e){
    if(formViewingVersion) return;
    e.preventDefault();
    document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
    document.querySelectorAll('.subform-dragover').forEach(s=>s.classList.remove('subform-dragover'));
    document.getElementById('canvas').classList.remove('canvas-dragover');
    const p=dragPayload; dragPayload=null;
    if(!p) return;
    // 落入子表单区域：作为一列追加（拖入的控件类型即该列类型）
    const subEl=e.target.closest('[data-subform]');
    if(subEl && p.kind==='new' && p.type!=='subform'){ addSubFromType(subEl.dataset.subform, p.type); dropIndex=null; return; }
    if(p.kind==='new') addFieldAt(p.type, dropIndex==null?fields.length:dropIndex);
    else if(p.kind==='move') moveField(p.id, dropIndex==null?fields.length:dropIndex);
    dropIndex=null;
  }
  /* 子表单：从左侧控件库拖入，新增为子表单的一列（由画布级 onCanvasDragOver/onCanvasDrop 统一处理，见上方） */
  function addSubFromType(fid, type){
    const f=fields.find(x=>x.id===fid); if(!f) return;
    const labelMap={text:'文本列',number:'数字列',date:'日期列',select:'下拉列',member:'成员列'};
    const colType = (type==='subform') ? 'text' : type;   // 子表单内不再嵌套子表单，降级为文本列
    f.subFields.push({ label:labelMap[type]||'列', type:colType });
    renderCanvas(); renderConfig();
  }
  function onCanvasClick(e){ if(formViewingVersion) return; const card=e.target.closest('.field-card'); if(card) selectField(card.dataset.id); else deselectField(); }

  /* ===================== 默认值展示计算 ===================== */
  function defaultDisplay(f){
    const t=f.defaultType||'manual';
    if(t==='manual') return f.defaultValue||'';
    if(t==='currentUser') return '👤 当前登录人';
    if(t==='today') return new Date().toISOString().slice(0,10);
    if(t==='formula') return 'ƒ '+(f.defaultValue||'公式');
    if(t==='linkage'){
      const lk=f.linkage||{};
      if(!lk.formId) return '⛓ 数据联动（未配置）';
      const fm=LINKAGE_FORMS.find(x=>x.id===lk.formId);
      const rf=(fm&&fm.fields.find(x=>x.field===lk.returnField))||{};
      return '⛓ 联动：'+(fm?fm.name:'未知表')+' · '+(rf.label||'未选返回值');
    }
    return '';
  }

  /* ===================== 公式编辑器 ===================== */
  const FUNC_CATEGORIES = [
    { name:'数学函数', funcs:['SUM()','AVG()','MAX()','MIN()','ROUND()','ABS()'] },
    { name:'文本函数', funcs:['CONCAT()','LEFT()','RIGHT()','LEN()','REPLACE()'] },
    { name:'日期函数', funcs:['TODAY()','NOW()','YEAR()','MONTH()','DAY()','DATEDIF()'] },
    { name:'逻辑函数', funcs:['IF()','AND()','OR()','NOT()'] },
  ];
  function openFormula(){
    const f=getField(selectedId); if(!f) return;
    document.getElementById('fmTargetName').textContent = f.label || '当前字段';
    const ta=document.getElementById('fmInput');
    ta.value = (f.defaultValue && f.defaultValue.startsWith('=')) ? f.defaultValue : '='+(f.defaultValue||'');
    document.getElementById('fmFields').innerHTML = fields.filter(x=>x.id!==f.id).map(x=>{
      return `<div class="text-xs text-gray-600 hover:text-[#165DFF] hover:bg-blue-50 rounded px-2 py-1.5 cursor-pointer truncate" onclick="insertAtFormula('{${x.fieldName}}')" title="${x.label}"><i class="fas fa-database text-[10px] mr-1 text-gray-400"></i>${x.label}</div>`;
    }).join('') || '<div class="text-xs text-gray-400 px-2">（暂无其他字段）</div>';
    document.getElementById('fmFuncs').innerHTML = FUNC_CATEGORIES.map(cat=>`
      <div class="mb-2">
        <div class="text-[11px] font-semibold text-gray-500 px-2 py-1">${cat.name}</div>
        ${cat.funcs.map(fn=>`<div class="text-xs text-gray-600 hover:text-[#165DFF] hover:bg-blue-50 rounded px-2 py-1 cursor-pointer font-mono" onclick="insertAtFormula('${fn}')">${fn}</div>`).join('')}
      </div>`).join('');
    openModal('formulaModal');
    ta.focus();
  }
  function insertAtFormula(txt){
    const el=document.getElementById('fmInput'); const s=el.selectionStart||el.value.length, e=el.selectionEnd||s;
    el.value=el.value.slice(0,s)+txt+el.value.slice(e); el.focus();
    if(el.setSelectionRange) el.setSelectionRange(s+txt.length, s+txt.length);
  }
  function saveFormula(){
    const f=getField(selectedId); if(!f) return;
    f.defaultValue=document.getElementById('fmInput').value.trim();
    closeFormula(); renderConfig(); renderCanvas();
  }
  function closeFormula(){ closeModal('formulaModal'); }

  /* ===================== 数据联动 ===================== */
  function openLinkage(){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    // 初始化弹窗
    const formSel=document.getElementById('lkForm');
    formSel.innerHTML = '<option value="">请选择数据库/表单</option>' + LINKAGE_FORMS.map(x=>`<option value="${x.id}" ${lk.formId===x.id?'selected':''}>${x.name}</option>`).join('');
    renderLinkageConditions(lk);
    renderLinkageReturn(lk);
    updateLinkagePreview();
    openModal('linkageModal');
  }
  function renderLinkageConditions(lk){
    const wrap=document.getElementById('lkConditions');
    const conds=lk.conditions||[];
    wrap.innerHTML = conds.map((c,i)=>{
      const localOpts = fields.filter(x=>x.id!==selectedId).map(x=>`<option value="${x.fieldName}" ${c.localField===x.fieldName?'selected':''}>${x.label}</option>`).join('') || '<option value="">（无）</option>';
      const refForm = LINKAGE_FORMS.find(x=>x.id===lk.formId);
      const refOpts = refForm ? refForm.fields.map(x=>`<option value="${x.field}" ${c.refField===x.field?'selected':''}>${x.label}</option>`).join('') : '<option value="">（请先选关联表）</option>';
      return `<div class="linkage-row">
        <select id="lk_local_${i}" class="form-input" onchange="onLinkageChange()">${localOpts}</select>
        <span class="text-sm text-gray-500">值等于</span>
        <select id="lk_ref_${i}" class="form-input" onchange="onLinkageChange()">${refOpts}</select>
        <span class="text-sm text-gray-500">的值时</span>
        ${conds.length>1?`<button class="text-gray-400 hover:text-red-500 btn-click" onclick="removeLinkageCond(${i})"><i class="fas fa-times"></i></button>`:''}
      </div>`;
    }).join('');
  }
  function renderLinkageReturn(lk){
    const sel=document.getElementById('lkReturn');
    const refForm = LINKAGE_FORMS.find(x=>x.id===lk.formId);
    sel.innerHTML = '<option value="">请选择关联表字段</option>' + (refForm?refForm.fields.map(x=>`<option value="${x.field}" ${lk.returnField===x.field?'selected':''}>${x.label}</option>`).join(''):'');
  }
  function readLinkageFromUI(){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    lk.formId = document.getElementById('lkForm').value;
    const fm = LINKAGE_FORMS.find(x=>x.id===lk.formId);
    lk.formName = fm?fm.name:'';
    lk.conditions = (lk.conditions||[]).map((c,i)=>({
      localField: document.getElementById('lk_local_'+i)?.value || '',
      refField: document.getElementById('lk_ref_'+i)?.value || ''
    }));
    lk.returnField = document.getElementById('lkReturn').value;
    f.linkage=lk;
    return lk;
  }
  function onLinkageChange(){
    const lk=readLinkageFromUI();
    // 切换关联表后，条件中的关联字段选项需要重置
    renderLinkageConditions(lk);
    renderLinkageReturn(lk);
    updateLinkagePreview();
  }
  function addLinkageCond(){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    lk.conditions.push({localField:'',refField:''});
    renderLinkageConditions(lk);
    updateLinkagePreview();
  }
  function removeLinkageCond(i){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    lk.conditions.splice(i,1);
    renderLinkageConditions(lk);
    updateLinkagePreview();
  }
  function updateLinkagePreview(){
    const f=getField(selectedId); if(!f) return;
    const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
    const fm=LINKAGE_FORMS.find(x=>x.id===lk.formId);
    const rf=fm?fm.fields.find(x=>x.field===lk.returnField):null;
    const conds=lk.conditions.map(c=>{
      const local=fieldLabel(c.localField)||'当前字段';
      const ref=fm?((fm.fields.find(x=>x.field===c.refField)||{}).label||'关联字段'):'关联字段';
      return `「${local}」=「${ref}」`;
    }).join(' 且 ');
    const html = !fm ? '请先选择数据关联表并配置匹配条件。'
      : `联动预览：当 ${conds||'（无条件）'} 时，本字段自动显示 <b>${fm.name}</b> 中 <b>${rf?rf.label:'未选择字段'}</b> 的对应值。`;
    document.getElementById('lkPreview').innerHTML = html;
  }
  function saveLinkage(){
    readLinkageFromUI();
    closeLinkage(); renderConfig(); renderCanvas();
  }
  function closeLinkage(){ closeModal('linkageModal'); }
  document.getElementById('lkForm').onchange = onLinkageChange;

  /* ===================== 画布渲染（12栅格 + 标签布局） ===================== */
  function renderCanvas(){
    const wrap=document.getElementById('canvasFields');
    const empty=document.getElementById('canvasEmpty');
    if(formViewingVersion){
      const s=snapshotFormView();
      if(s){ renderSnapshotCanvas(s, wrap, empty); return; }
    }
    if(fields.length===0){ empty.style.display='block'; wrap.innerHTML=''; return; }
    empty.style.display='none';
    wrap.innerHTML = fields.map(f=>fieldCardHTML(f)).join('');
  }
  /* 历史版本查看态：用快照字段结构渲染只读画布（不污染当前 fields） */
  function renderSnapshotCanvas(s, wrap, empty){
    const list=s.fields||[];
    empty.style.display = list.length?'none':'block';
    if(!list.length){ wrap.innerHTML=''; return; }
    const labelPos=(s.fc&&s.fc.labelPos)||'top';
    wrap.innerHTML = list.map(f=>{
      const td=(CONTROL_DEFS[f.type]||{label:f.type||'字段',icon:'fa-pen'});
      const req=f.required?'<span class="text-red-500 ml-0.5">*</span>':'';
      const help=f.helpText?`<div class="text-[11px] text-gray-400 mt-1">${f.helpText}</div>`:'';
      const preview=previewHTML(f);
      const lbl = labelPos==='left'
        ? `<div class="flex items-start gap-3 pointer-events-none"><label class="label-cell text-sm font-medium text-gray-700" style="width:120px;flex:none;text-align:left;padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.label}${req}</label><div class="flex-1 min-w-0">${preview}${help}</div></div>`
        : `<div class="pointer-events-none"><label class="block text-sm font-medium text-gray-700 mb-1">${f.label}${req}</label><div>${preview}${help}</div></div>`;
      return `<div class="field-card bg-white border border-gray-200 rounded-lg p-4" style="grid-column: span ${f.span||12}">
        <div class="flex items-center justify-between mb-2">
          <div class="text-[11px] text-gray-400 border border-gray-200 rounded px-1.5 py-0.5"><i class="fas ${td.icon} text-[#165DFF] mr-1"></i>${td.label}</div>
          <span class="text-[10px] text-gray-300"><i class="fas fa-lock mr-1"></i>历史版本·只读</span>
        </div>
        ${lbl}
      </div>`;
    }).join('');
  }
  function snapshotFormView(){
    const f=currentForm();
    return formViewingVersion ? ((f&&f.versions||[]).find(v=>v.version===formViewingVersion)||null) : null;
  }
  function previewHTML(f){
    if(f.type==='text'){
      const fmt = f.format&&f.format!=='none' ? `（${FORMATS[f.format]}）` : '';
      return `<input disabled placeholder="${f.placeholder||''}" class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm bg-gray-50 text-gray-400" value="${defaultDisplay(f)}"><span class="text-[11px] text-gray-300">${fmt}</span>`;
    } else if(f.type==='select'){
      let ph = f.placeholder||'请选择';
      const dt=f.defaultType||'manual';
      if(dt==='manual' && f.defaultValue){ const o=(f.options||[]).find(o=>o.value===f.defaultValue); ph=o?o.label:f.defaultValue; }
      else if(dt==='currentUser') ph='当前登录人';
      else if(dt==='today') ph=new Date().toISOString().slice(0,10);
      else if(dt==='linkage') ph=defaultDisplay(f);
      const opts=(f.options||[]).map(o=>`<option ${o.value===f.defaultValue?'selected':''}>${o.label}</option>`).join('');
      const srcTag = f.source==='dict'?'<span class="text-[11px] text-[#165DFF] ml-1">字典</span>':f.source==='api'?'<span class="text-[11px] text-[#165DFF] ml-1">API</span>':'';
      return `<select disabled class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm bg-gray-50 text-gray-400">${opts||`<option>${ph}</option>`}</select>${srcTag}`;
    } else if(f.type==='subform'){
      const subs=(f.subFields||[]);
      const SUB_TL={text:'文本',number:'数字',date:'日期',select:'下拉',member:'成员'};
      const cols=subs.map(s=>`<th class="px-2 py-1.5 text-left font-medium text-gray-600 border-b border-gray-200 whitespace-nowrap">${s.label} <span class="text-[10px] font-normal text-gray-400">${SUB_TL[s.type]||s.type}</span></th>`).join('')+'<th class="w-7 border-b border-gray-200"></th>';
      const sampleRow=subs.map(s=>{ const ph=s.type==='number'?'0.00':(s.type==='date'?'年/月/日':'请填写'); return `<td class="px-2 py-1.5 border-t border-gray-100"><input disabled placeholder="${ph}" class="w-full border border-gray-200 rounded px-2 py-1 text-xs bg-gray-50 text-gray-400"></td>`;}).join('')+'<td class="px-2 py-1.5 border-t border-gray-100 text-center"><i class="fas fa-trash-alt text-gray-300"></i></td>';
      const sumRow = f.showSummary ? `<tfoot><tr class="bg-[#F0F5FF]"><td class="px-2 py-1.5 text-xs font-semibold text-[#165DFF] border-t border-gray-200 whitespace-nowrap">合计</td>${subs.map(s=>s.type==='number'?'<td class="px-2 py-1.5 text-xs text-[#165DFF] border-t border-gray-200 font-semibold">Σ 自动求和</td>':'<td class="border-t border-gray-200"></td>').join('')}<td class="border-t border-gray-200"></td></tr></tfoot>` : '';
      const foot = subs.length
        ? `<div class="p-2 bg-gray-50 border-t text-center flex items-center justify-center gap-3"><button class="text-[#165DFF] text-xs btn-click"><i class="fas fa-plus mr-1"></i>添加一行</button><span class="text-[11px] text-[#165DFF]"><i class="fas fa-hand-pointer mr-1"></i>拖左侧控件到此表即可新增一列</span></div>`
        : `<div class="p-3 bg-blue-50/60 border-t border-dashed border-[#165DFF] text-center text-[11px] text-[#165DFF]"><i class="fas fa-hand-pointer mr-1"></i>从左侧控件库拖拽控件到此处，新增为子表单的一列</div>`;
      return `<div class="subform-table-wrap" data-subform="${f.id}"><table class="w-full text-xs"><thead class="bg-gray-100">${cols}</thead><tbody>${sampleRow}</tbody>${sumRow}</table>${foot}</div>`;
    } else if(f.type==='member'){
      let ph='请选择成员';
      const dt=f.defaultType||'manual';
      if(dt==='currentUser') ph='当前登录人';
      else if(dt==='linkage') ph=defaultDisplay(f);
      const scope = f.range==='all'?'全部成员':(f.range==='dept'?((f.depts||[]).join('/')||'指定部门'):((f.roles||[]).join('/')||'指定角色'));
      return `<div class="border border-gray-200 rounded-md px-3 py-2 text-sm bg-gray-50 text-gray-400 flex items-center gap-2"><i class="fas fa-user-plus text-[#165DFF]"></i> ${ph}${f.multi?'（可多选）':''}<span class="ml-auto text-xs">${scope}${f.includeDept?' · 含部门':''}</span></div>`;
    }
    return '';
  }
  function fieldCardHTML(f){
    const sel = f.id===selectedId ? 'selected' : '';
    const typeLabel = CONTROL_DEFS[f.type].label;
    const drag = `draggable="true" data-id="${f.id}" ondragstart="onFieldDragStart(event,'${f.id}')"`;
    const subAttr = (f.type==='subform') ? ` data-subform="${f.id}"` : '';
    const lp = f.labelPos || formConfig.labelPos;
    const la = f.labelAlign || formConfig.labelAlign;
    const lwKey = f.labelWidth || 'inherit';
    const lw = lwKey==='inherit' ? formConfig.labelWidth : lwKey;
    const req = f.required ? '<span class="text-red-500 ml-0.5">*</span>' : '';
    const help = f.helpText ? `<div class="text-[11px] text-gray-400 mt-1">${f.helpText}</div>` : '';
    const preview = previewHTML(f);
    let layoutWrap;
    if(lp==='left'){
      const lwStyle = lw==='auto' ? 'width:auto;flex:none;' : `width:${LABEL_W[lw]};flex:none;`;
      const lbl = `<label class="label-cell text-sm font-medium text-gray-700 ${lw==='auto'?'auto':''}" style="${lwStyle}text-align:${la};padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.label}${req}</label>`;
      layoutWrap = `<div class="flex items-start gap-3 pointer-events-none">${lbl}<div class="flex-1 min-w-0">${preview}${help}</div></div>`;
    } else {
      const lbl = `<label class="block text-sm font-medium text-gray-700 mb-1" style="text-align:${la}">${f.label}${req}</label>`;
      layoutWrap = `<div class="pointer-events-none">${lbl}<div>${preview}${help}</div></div>`;
    }
    return `<div class="field-card group bg-white border border-gray-200 rounded-lg p-4 ${sel}" style="grid-column: span ${f.span||12}" ${drag}${subAttr}>
        <div class="flex items-center justify-between mb-2">
          <div class="text-[11px] text-gray-400 border border-gray-200 rounded px-1.5 py-0.5"><i class="fas ${CONTROL_DEFS[f.type].icon} text-[#165DFF] mr-1"></i>${typeLabel}</div>
          <div class="flex items-center gap-2 text-gray-400" onclick="event.stopPropagation()">
            <button class="hover:text-red-500 btn-click opacity-0 group-hover:opacity-100 transition" title="删除" onclick="deleteField('${f.id}')"><i class="fas fa-trash"></i></button>
          </div>
        </div>
        ${layoutWrap}
      </div>`;
  }

  /* ===================== 配置面板 ===================== */
  const inp = (v)=>`class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" value="${v==null?'':v}"`;
  function sec(t, key){
    const collapsed = key && cfgCollapsed[key];
    return `<div class="cfg-sec ${collapsed?'collapsed':''}" onclick="toggleSection('${key}',this)">${t}</div><div class="cfg-sec-body" id="sec_${key}" style="${collapsed?'max-height:0;':'max-height:2000px;'}">`;
  }
  function secEnd(){ return '</div>'; }
  function toggleSection(key,el){
    cfgCollapsed[key] = !cfgCollapsed[key];
    el.classList.toggle('collapsed', cfgCollapsed[key]);
    const body=document.getElementById('sec_'+key);
    body.style.maxHeight = cfgCollapsed[key] ? '0' : '2000px';
  }
  const row = (label, ctrl, logic)=>`<div class="mb-3.5"><label class="block text-xs font-medium text-gray-600 mb-1">${label}</label>${ctrl}${logic?`<div class="cfg-logic"><i class="fas fa-info-circle"></i><span>${logic}</span></div>`:''}</div>`;
  const sw = (id, checked, logic)=>`<label class="flex items-center gap-2 cursor-pointer text-sm text-gray-700"><input id="${id}" type="checkbox" ${checked?'checked':''} class="rounded text-[#165DFF]"> ${logic||''}</label>`;
  const info = (html)=>`<div class="cfg-info mb-3.5"><i class="fas fa-info-circle mr-1"></i>${html}</div>`;
  function chipsHTML(arrAccessor, selected, kind){
    const list = kind==='dept'?DEPTS:ROLES;
    return `<div class="flex flex-wrap gap-1.5">`+list.map(v=>{
      const on = (selected||[]).includes(v);
      return `<span class="px-2 py-1 rounded-md text-xs cursor-pointer border ${on?'bg-[#165DFF] text-white border-[#165DFF]':'bg-white text-gray-600 border-gray-200'}" onclick="chipToggle(${arrAccessor},'${v}',this)">${v}</span>`;
    }).join('')+`</div>`;
  }
  function chipToggle(arr, val, el){
    const i=arr.indexOf(val);
    if(i>=0) arr.splice(i,1); else arr.push(val);
    const on=arr.includes(val);
    el.className=`px-2 py-1 rounded-md text-xs cursor-pointer border ${on?'bg-[#165DFF] text-white border-[#165DFF]':'bg-white text-gray-600 border-gray-200'}`;
  }

  /* ---- 数据可见范围：默认范围 + 按角色覆盖（规则仅含数据条件，角色由覆盖层指定） ---- */
  const VIS_OPTS=[['creator','仅创建人'],['dept','同部门'],['deptSub','同部门及下级'],['all','全部数据'],['rule','自定义规则（引用登录人属性）']];
  const LOGIN_ATTRS=[['role','登录人.角色'],['region','登录人.区域'],['dept','登录人.部门']];
  const RULE_OPS=[['=','='],['≠','≠'],['包含','包含']];
  function loginAttrOpts(sel){
    return LOGIN_ATTRS.map(a=>`<option value="${a[0]}" ${sel===a[0]?'selected':''}>${a[1]}</option>`).join('');
  }
  function ruleOpOpts(sel){ return RULE_OPS.map(o=>`<option value="${o[0]}" ${sel===o[0]?'selected':''}>${o[1]}</option>`).join(''); }
  function fieldOptsHTML(sel){
    const flds=(typeof fields!=='undefined'&&fields)?fields:[];
    if(!flds.length) return '<option value="">（无可用字段）</option>';
    return flds.map(f=>{ const v=f.fieldName||f.name||''; const l=f.label||v; return v?`<option value="${v}" ${sel===v?'selected':''}>${l}</option>`:''; }).join('');
  }
  function dvRuleCfg(key,c){ if(!c.visibleRulesMap) c.visibleRulesMap={}; if(!c.visibleRulesMap[key]) c.visibleRulesMap[key]={dataLogic:'and',data:[{field:'',op:'=',valType:'value',val:''}],fallback:'none'}; return c.visibleRulesMap[key]; }
  function dvRuleFor(key, c){
    const cfg=dvRuleCfg(key,c);
    const dataLogic=cfg.dataLogic||'and';
    let data='';
    (cfg.data||[]).forEach(function(cond,j){
      const right = cond.valType==='login'
        ? `<select onchange="dvValAttr('${key}',${j},this.value)" class="form-input w-32 text-xs py-1">${loginAttrOpts(cond.valAttr)}</select>`
        : `<input oninput="dvVal('${key}',${j},this.value)" value="${cond.val||''}" placeholder="如：红河区 / 华东区" class="form-input w-32 text-xs py-1">`;
      data += `<div class="flex items-center gap-1.5 mb-1.5 flex-wrap">`
        + (j>0?`<span class="text-xs px-1.5 py-0.5 rounded bg-gray-200 text-gray-600 whitespace-nowrap">${dataLogic==='and'?'且':'或'}</span>`:`<span class="text-xs text-gray-400 whitespace-nowrap">条件</span>`)
        + `<select onchange="dvField('${key}',${j},this.value)" class="form-input w-32 text-xs py-1">${fieldOptsHTML(cond.field)}</select>`
        + `<select onchange="dvOp('${key}',${j},this.value)" class="form-input w-16 text-xs py-1">${ruleOpOpts(cond.op)}</select>`
        + `<select onchange="dvValType('${key}',${j},this.value)" class="form-input w-24 text-xs py-1"><option value="value" ${cond.valType!=='login'?'selected':''}>值</option><option value="login" ${cond.valType==='login'?'selected':''}>登录人属性</option></select>`
        + right
        + `<button onclick="dvCondDel('${key}',${j})" class="text-gray-400 hover:text-red-500 text-xs btn-click" title="删除条件"><i class="fas fa-times"></i></button>`
        + `</div>`;
    });
    const fb = `<div class="flex items-center gap-2 mt-1 text-xs text-gray-500">兜底（该范围数据均不满足下列数据条件时）：<select onchange="dvFallback('${key}',this.value)" class="form-input w-32 text-xs py-1"><option value=value ${cfg.fallback==='none'?'selected':''}>不可见</option><option value="creator" ${cfg.fallback==='creator'?'selected':''}>仅创建人</option><option value="all" ${cfg.fallback==='all'?'selected':''}>全部可见</option></select></div>`;
    return `<div class="border rounded-md p-2 mt-1 bg-gray-50">`
      + `<div class="text-xs text-gray-500 mb-1">仅可见满足以下<b>数据条件</b>的行：</div>`
      + data
      + `<button onclick="dvCondAdd('${key}')" class="text-xs text-[#165DFF] btn-click"><i class="fas fa-plus"></i> 添加数据条件</button>`
      + `<div class="flex items-center gap-2 mt-1 mb-1"><span class="text-xs text-gray-500">数据条件间关系</span><select onchange="dvLogic('${key}',this.value)" class="form-input w-32 text-xs py-1"><option value="and" ${dataLogic==='and'?'selected':''}>且（全部满足）</option><option value="or" ${dataLogic==='or'?'selected':''}>或（任一满足）</option></select></div>`
      + fb
      + `</div>`
      + info(`示例：字段[区域] = 华东区 → 仅看华东区数据。依赖登录人在角色 / 部门主数据上携带「区域」维度；多条件可组合「且 / 或」。`);
  }
  function dvCondAdd(key){ dvRuleCfg(key,formConfig).data.push({field:'',op:'=',valType:'value',val:''}); renderConfig(); }
  function dvCondDel(key,j){ dvRuleCfg(key,formConfig).data.splice(j,1); renderConfig(); }
  function dvField(key,j,v){ dvRuleCfg(key,formConfig).data[j].field=v; }
  function dvOp(key,j,v){ dvRuleCfg(key,formConfig).data[j].op=v; }
  function dvValType(key,j,v){ const d=dvRuleCfg(key,formConfig).data[j]; d.valType=v; if(v==='login'&&!d.valAttr)d.valAttr='region'; renderConfig(); }
  function dvVal(key,j,v){ dvRuleCfg(key,formConfig).data[j].val=v; }
  function dvValAttr(key,j,v){ dvRuleCfg(key,formConfig).data[j].valAttr=v; }
  function dvLogic(key,v){ dvRuleCfg(key,formConfig).dataLogic=v; renderConfig(); }
  function dvFallback(key,v){ dvRuleCfg(key,formConfig).fallback=v; }
  const ROLE_GROUPS=[{name:'管理层',roles:['管理员','部门负责人']},{name:'业务岗',roles:['普通员工','财务审核','HRBP','审批人']}];
  let dvCurrentRole='__global__';
  let dvCollapsed={};
  function dvIsConf(c,r){ return r==='__global__' ? true : !!(c.visibleRoles && c.visibleRoles[r]); }
  function dvNode(key,label,active,isGlobal,conf){
    let dot = isGlobal ? '<span class="w-2 h-2 rounded-full bg-[#EF9F27] inline-block mr-1"></span>'
             : conf ? '<span class="w-2 h-2 rounded-full bg-[#165DFF] inline-block mr-1"></span>'
             : '<span class="w-2 h-2 rounded-full border border-gray-300 inline-block mr-1"></span>';
    return `<div class="flex items-center ${active?'bg-[#E8F3FF]':'hover:bg-gray-50'} rounded px-1 py-1 cursor-pointer text-sm ${active?'text-[#165DFF] font-medium':'text-gray-700'}" onclick="dvSelectRole('${key}')"><span class="pl-3"></span>${dot}${label}</div>`;
  }
  function dvTree(c){
    let t='';
    t += dvNode('__global__','全局默认（所有角色）', dvCurrentRole==='__global__', true, true);
    ROLE_GROUPS.forEach(function(g){
      const open = !dvCollapsed[g.name];
      t += `<div class="flex items-center gap-1 px-1 py-1 cursor-pointer select-none" onclick="dvToggleGroup('${g.name}')"><span class="text-gray-400 text-xs w-3">${open?'\u25BE':'\u25B8'}</span><span class="text-xs font-medium text-gray-600">${g.name}</span></div>`;
      if(open){ g.roles.forEach(function(r){ t += dvNode(r, r, dvCurrentRole===r, false, dvIsConf(c,r)); }); }
    });
    return t;
  }
  function dvSelectRole(r){ dvCurrentRole=r; renderConfig(); }
  function dvToggleGroup(g){ dvCollapsed[g]=!dvCollapsed[g]; renderConfig(); }
  function dvScopeSelect(tab, c){
    const isRole = tab!=='__global__';
    let val = isRole ? ((c.visibleRoles&&c.visibleRoles[tab])||'__inherit__') : (c.visibleDefault||'all');
    const opts = (isRole?`<option value="__inherit__" ${val==='__inherit__'?'selected':''}>继承全局</option>`:'')
      + VIS_OPTS.map(o=>`<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('');
    let html = `<select onchange="dvSetScope('${tab}',this.value)" class="form-input border border-gray-300 rounded-md px-2 py-1 text-xs w-full">${opts}</select>`;
    if(val==='rule') html += isRole ? dvRuleFor(tab, c) : dvRuleFor('__default__', c);
    html += info(isRole ? '选「继承全局」即套用全局默认范围；需特殊范围时单独选择，并可编写自定义规则（可引用登录人属性，如各区督导组只看本地区）。' : '对所有角色生效的默认数据范围；切到具体角色可逐个覆盖。多条件可组合「且 / 或」。');
    return html;
  }
  function dvSetScope(tab, val){
    const c=formConfig;
    if(tab==='__global__'){ c.visibleDefault=val; }
    else { if(!c.visibleRoles) c.visibleRoles={}; if(val==='__inherit__') delete c.visibleRoles[tab]; else c.visibleRoles[tab]=val; }
    renderConfig();
  }


  function renderConfig(){
    const body=document.getElementById('configBody');
    const ctx=document.getElementById('cfgContext');
    setCfgTabStyle();
    if(formViewingVersion){
      const s=snapshotFormView();
      ctx.textContent='历史版本·只读';
      body.innerHTML=`
        <div class="cfg-info"><i class="fas fa-eye mr-1"></i>当前画布展示的是历史版本 <b>v${formViewingVersion}</b> 的字段结构（只读），共 <b>${s&&s.fields?s.fields.length:0}</b> 个字段，发布人为 ${s?(s.publisher||'系统'):''} · ${s?s.time||'—':''}。点击下方按钮返回编辑当前表单。</div>
        <button onclick="exitFormVersionView()" class="mt-3 w-full px-3 py-2 rounded-md text-xs font-medium btn-click bg-[#165DFF] text-white hover:bg-blue-600"><i class="fas fa-arrow-left mr-1"></i>返回编辑</button>`;
      return;
    }
    if(!selectedId){
      if(!isCreating) ctx.textContent='表单配置'; else ctx.textContent='';
      renderFormConfig(body); return;
    }
    const f=fields.find(x=>x.id===selectedId);
    ctx.textContent = isCreating ? '' : '控件：'+f.label;
    let html = `<div class="mb-3 pb-3 border-b border-gray-100 flex items-center gap-2 text-sm font-semibold text-gray-700"><i class="fas ${CONTROL_DEFS[f.type].icon} text-[#165DFF]"></i>${CONTROL_DEFS[f.type].label} · 字段配置</div>`;
    html += renderCommon(f);
    html += renderSpecific(f);
    body.innerHTML = html;
    bindFieldEvents(f);
  }
  function setRightTab(t){ rightTab=t; if(t==='view') selectedId=null; renderConfig(); }
  // 表单配置标签：处于字段下钻态时点击返回表单根配置，否则进入表单配置模块
  function onFormTabClick(){ if(rightTab==='config' && selectedId){ deselectField(); } else { setRightTab('config'); } }
  function setCfgTabStyle(){
    const a='bg-white text-[#165DFF] shadow-sm font-semibold', b='text-gray-500 hover:text-[#165DFF]';
    const tf=document.getElementById('tabCfgForm');
    const tabs=document.getElementById('cfgTabs');
    // 创建表单流程中：隐藏右侧「表单配置 / 控件配置」标签与「控件：xxx」上下文字样，保持面板简洁
    if(isCreating){ if(tabs) tabs.style.display='none'; return; }
    if(tabs) tabs.style.display='';
    // 选中控件时，顶部标签由「表单配置」下钻为「控件配置」；视图管理不再作为独立 tab，已整合进表单配置面板
    if(tf){ tf.textContent=(rightTab==='config'&&selectedId)?'控件配置':'表单配置'; tf.className='flex-1 px-2 py-1.5 rounded-md font-medium btn-click '+(rightTab==='config'?a:b); }
  }

  /* 默认值逻辑详解（按当前选择的方式动态说明取值链路） */
  function defaultValueLogicBox(f){
    const dt=f.defaultType||'manual';
    const name=(DEFAULT_TYPES.find(x=>x[0]===dt)||[,''])[1];
    const map={
      manual:'<b>手动填写</b>：打开表单时直接填入设计态预设的固定值（文本或默认选项）。提交时原样保存到数据库，适用于固定说明文案、高频默认选项等。',
      formula:'<b>公式编辑</b>：运行态在<b>打开表单</b>以及<b>被引用的字段发生变化</b>时，按公式实时计算并填入结果。支持跨字段引用与函数（SUM / IF / COUNT / CONCAT 等）。系统只存储<b>计算结果</b>、不存储公式本身，从而保证每次打开数据一致、避免脏值。',
      currentUser:'<b>当前用户</b>：由系统在运行态自动注入<b>当前登录用户</b>的身份（姓名/工号），用户不可编辑、无需填写。常用于「申请人 / 负责人 / 填报人」等写死为登录人的字段。',
      today:'<b>当前日期</b>：由系统在运行态注入<b>打开表单当天的日期</b>，用于自动记录「申请日期 / 创建日期」，避免用户手填误差。',
      linkage:'<b>数据联动</b>：打开表单时，依据下方配置的条件到<b>关联表</b>中查询记录，把命中记录的指定字段值作为本字段默认值自动带出（例如选「部门」后自动带出「部门负责人」）。若条件未匹配到记录，字段留空、需用户手动补充。'
    };
    return `<div class="cfg-logic-block"><div class="cfg-logic-title"><i class="fas fa-lightbulb"></i>默认值逻辑说明 · ${name}</div><div class="cfg-logic-body">${map[dt]||''}</div></div>`;
  }

  /* 通用配置（所有控件共有） */
  function renderCommon(f){
    let h = sec('通用配置（所有控件共有）','common');
    h += row('标题', `<input id="cfg_label" ${inp(f.label)}>`, '字段在表单上显示的名称，运行态展示给用户。');
    h += row('字段名（API 标识·自动生成）', `<input id="cfg_field" value="${f.fieldName}" disabled class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm bg-gray-100 text-gray-500 cursor-not-allowed">`, '<b>自动生成规则：</b>取「标题」做英文规范化（转小写、空格/连字符→下划线、仅保留 a–z / 0–9 / _）；标题全为中文或符号时回退为控件类型前缀（单行文本=text、下拉单选=select、子表单=subform、成员=member 等）；同表单内重名自动追加序号（如 name、name_2）。字段名在创建字段时一次性生成并锁定，<b>不可手动修改</b>，以保证与提交数据 / 接口稳定对应。');
    h += row('字段宽度（单元格长度）', `<select id="cfg_span" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${SPAN_OPTS.map(o=>`<option value="${o[0]}" ${(f.span||12)==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`, '基于 12 栅格系统决定该字段横向占位（整行/1/2/1/3/1/4），实现不同字段并排布局，提升空间利用率。');
    h += row('标签位置', `<select id="cfg_lpos" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="top" ${(f.labelPos||formConfig.labelPos)==='top'?'selected':''}>标题在上</option><option value="left" ${(f.labelPos||formConfig.labelPos)==='left'?'selected':''}>标题在左</option></select>`, '字段标题相对输入框的位置；不设置时继承表单级「标签位置」。切换后画布即时呈现上下/左右两种版式。');
    h += row('标签对齐', `<select id="cfg_lalign" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="left" ${(f.labelAlign||formConfig.labelAlign)==='left'?'selected':''}>左对齐</option><option value="right" ${(f.labelAlign||formConfig.labelAlign)==='right'?'selected':''}>右对齐</option></select>`, '标签文字对齐方式；标题在左时常用右对齐更整齐。切换即时反映在画布。');
    h += row('必填', sw('cfg_req', f.required, '提交时该项不能为空，否则拦截提交并提示。'), '控制字段是否必填校验。');
    // 默认值（多来源）
    h += row('默认值方式', `<select id="cfg_dtype" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${DEFAULT_TYPES.map(o=>`<option value="${o[0]}" ${(f.defaultType||'manual')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`, '选择默认值来源；不同方式对应不同取值逻辑，运行态打开表单时按此自动带入，减少重复录入。');
    const dt=f.defaultType||'manual';
    if(dt==='manual'){
      if(f.type==='select'){
        const osel=(f.options||[]).map(o=>`<option value="${o.value}" ${f.defaultValue===o.value?'selected':''}>${o.label}</option>`).join('');
        h += row('默认选项', `<select id="cfg_dval" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${osel||'<option value="">（暂无选项）</option>'}</select>`, '打开表单时默认选中该项（按存储值），常用于高频选项预置。');
      } else {
        h += row('手动默认值', `<input id="cfg_dval" ${inp(f.defaultValue)}>`, '打开表单时自动填入的固定值（如固定说明文案）。');
      }
    } else if(dt==='formula'){
      h += row('公式', `<div class="flex gap-2"><input id="cfg_dval" ${inp(f.defaultValue)} class="form-input flex-1 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm font-mono" placeholder="如 =SUM(金额)" readonly><button class="px-2.5 bg-[#165DFF] text-white rounded-md text-xs whitespace-nowrap btn-click" onclick="openFormula()"><i class="fas fa-function mr-1"></i>公式编辑</button></div>`, '通过公式计算得到默认值，支持字段引用与函数（SUM/IF/COUNT 等）。点击「公式编辑」打开可视化弹窗：左侧面板选择字段与函数分类，中间输入公式，底部含提示与示例。');
    } else if(dt==='currentUser'){
      h += info('运行态将自动填入<b>当前登录用户</b>，无需手动维护（常用于「申请人/负责人」类字段）。');
    } else if(dt==='today'){
      h += info(`运行态将自动填入<b>打开表单当天的日期</b>（示例：${new Date().toISOString().slice(0,10)}）。`);
    } else if(dt==='linkage'){
      const lk=f.linkage||{formId:'',formName:'',conditions:[{localField:'',refField:''}],returnField:''};
      const fm=LINKAGE_FORMS.find(x=>x.id===lk.formId);
      const rf=fm?fm.fields.find(x=>x.field===lk.returnField):null;
      const summary = !fm ? '未配置' : `${fm.name} · ${rf?rf.label:'未选返回值'} · ${lk.conditions.length}个条件`;
      h += row('数据联动', `<div class="flex gap-2"><input class="form-input flex-1 border border-gray-300 rounded-md px-2.5 py-1.5 text-sm bg-gray-50" value="${summary}" readonly><button class="px-2.5 bg-[#165DFF] text-white rounded-md text-xs whitespace-nowrap btn-click" onclick="openLinkage()"><i class="fas fa-link mr-1"></i>配置</button></div>`, '按条件从其他表单/数据库查找记录，并取指定字段作为默认值。点击「配置」打开数据联动弹窗：先选关联表，再设匹配条件，最后选返回值。');
    }
    h += defaultValueLogicBox(f);
    h += row('帮助说明', `<input id="cfg_help" ${inp(f.helpText)}>`, '显示在字段下方的灰色提示文字，用于解释填写要求，不参与提交数据。');
    // 显示条件（条件构造器）
    h += row('显示条件（动态显隐）', renderVisible(f.visible), '运行态根据规则动态显示/隐藏本字段：选「满足条件时显示」后展开条件行，不满足时字段自动隐藏，实现动态表单。');
    h += row('只读', sw('cfg_ro', f.readonly, '勾选后运行态不可编辑，仅展示值。'), '字段仅展示、不可修改（如系统自动带出的值）。');
    h += secEnd();
    return h;
  }
  function renderVisible(v){
    v = v||{mode:'always',logic:'and',conditions:[{field:'',op:'eq',value:''}]};
    const fieldOpts = fields.filter(f=>f.id!==selectedId).map(f=>`<option value="${f.fieldName}" ${v.conditions[0]&&v.conditions[0].field===f.fieldName?'selected':''}>${f.label}</option>`).join('') || '<option value="">（暂无其他字段）</option>';
    const modeSel = `<select id="cfg_vmode" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm mb-2"><option value="always" ${v.mode==='always'?'selected':''}>始终显示</option><option value="when" ${v.mode==='when'?'selected':''}>满足条件时显示</option></select>`;
    if(v.mode!=='when') return modeSel;
    const logicSel = `<select id="cfg_vlogic" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm mb-2"><option value="and" ${v.logic==='and'?'selected':''}>且（全部满足）</option><option value="or" ${v.logic==='or'?'selected':''}>或（满足其一）</option></select>`;
    const conds = (v.conditions||[]).map((c,i)=>{
      const fsel = fields.filter(f=>f.id!==selectedId).map(f=>`<option value="${f.fieldName}" ${c.field===f.fieldName?'selected':''}>${f.label}</option>`).join('') || '<option value="">（无）</option>';
      return `<div class="flex items-center gap-1.5 mb-1.5">
        <select id="cfg_vfield_${i}" class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm">${fsel}</select>
        <select id="cfg_vop_${i}" class="form-input border border-gray-300 rounded-md px-2 py-1 text-sm"><option value="eq" ${c.op==='eq'?'selected':''}>等于</option><option value="ne" ${c.op==='ne'?'selected':''}>不等于</option><option value="contains" ${c.op==='contains'?'selected':''}>包含</option></select>
        <input id="cfg_vval_${i}" class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm" value="${c.value||''}" placeholder="值">
        ${v.conditions.length>1?`<button class="text-gray-400 hover:text-red-500 btn-click" onclick="removeVisibleCond(${i})"><i class="fas fa-times"></i></button>`:''}
      </div>`;
    }).join('');
    return modeSel + logicSel + conds + `<button onclick="addVisibleCond()" class="text-[#165DFF] text-xs btn-click mt-1"><i class="fas fa-plus mr-1"></i>添加条件</button>`;
  }
  function addVisibleCond(){ const f=fields.find(x=>x.id===selectedId); f.visible.conditions.push({field:'',op:'eq',value:''}); renderConfig(); }
  function removeVisibleCond(i){ const f=fields.find(x=>x.id===selectedId); f.visible.conditions.splice(i,1); renderConfig(); }

  /* 专属配置（按类型） */
  function renderSpecific(f){
    let h = sec('专属配置（'+CONTROL_DEFS[f.type].label+'）','specific');
    if(f.type==='text'){
      const fmts=Object.entries(FORMATS).map(([k,v])=>`<option value="${k}" ${f.format===k?'selected':''}>${v}</option>`).join('');
      h += row('输入格式（校验）', `<select id="cfg_fmt" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm">${fmts}</select>`, '限制输入内容类型；提交时按规则校验，不通过则拦截并提示（如手机号必须 11 位数字）。');
      h += row('最大长度', `<input id="cfg_max" type="number" ${inp(f.maxLength)}>`, '允许输入的最大字符数，超出无法继续输入，防止超长脏数据。');
      h += row('最小长度', `<input id="cfg_min" type="number" ${inp(f.minLength)}>`, '低于该长度则校验不通过（如身份证必须 18 位）。');
      h += row('密码模式', sw('cfg_pwd', f.password, '输入内容以圆点掩码显示。'), '适用于敏感文本输入（如密钥、密码）。');
      h += row('自动去除首尾空格', sw('cfg_trim', f.trim, '提交前自动清理用户输入的首尾空格。'), '默认开启，避免「 张三 」这类脏数据。');
      h += row('校验失败提示', `<input id="cfg_err" ${inp(f.errMsg)}>`, '校验不通过时展示的自定义文案，留空则用默认提示，提升友好度。');
    } else if(f.type==='select'){
      const optRows=(f.options||[]).map((o,i)=>`<div class="flex items-center gap-1.5 mb-1.5"><input class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm" value="${o.label}" oninput="updateOption(${i},this.value)"><button class="text-gray-400 hover:text-red-500 btn-click" onclick="removeOption(${i})"><i class="fas fa-times"></i></button></div>`).join('');
      h += row('选项来源', `<select id="cfg_src" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="static" ${f.source==='static'?'selected':''}>静态录入</option><option value="dict" ${f.source==='dict'?'selected':''}>数据字典</option><option value="api" ${f.source==='api'?'selected':''}>远程 API</option></select>`, '选项数据来源：静态为设计态固定；数据字典/API 为运行态动态拉取（对接集成能力）。');
      if(f.source==='dict'){
        h += row('数据字典', `<select id="cfg_dict" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="region" ${f.dictKey==='region'?'selected':''}>行政区划</option><option value="industry" ${f.dictKey==='industry'?'selected':''}>行业分类</option><option value="bank" ${f.dictKey==='bank'?'selected':''}>银行列表</option></select>`, '选择平台内置或企业自定义的数据字典，运行态选项从该字典动态加载，保证全平台口径一致。');
      } else if(f.source==='api'){
        h += row('接口地址', `<input id="cfg_api" ${inp(f.apiUrl)} class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" placeholder="https://api.example.com/options">`, '运行态从此接口拉取选项，需返回 {label,value} 数组；常用于对接第三方系统枚举。');
        h += `<div class="mb-3.5"><button onclick="alert('测试连接（演示）')" class="text-xs text-[#165DFF] btn-click"><i class="fas fa-plug mr-1"></i>测试连接</button><div class="cfg-logic">配置后将展示返回字段映射，确保接口字段与 label/value 对应。</div></div>`;
      }
      h += `<div class="mb-3.5"><label class="block text-xs font-medium text-gray-600 mb-1">选项列表</label>${optRows}<button onclick="addOption()" class="text-[#165DFF] text-xs btn-click"><i class="fas fa-plus mr-1"></i>添加选项</button><div class="cfg-logic">每个选项含「显示名(label)」与「存储值(value)」，value 参与数据提交与流程条件判断。</div></div>`;
      h += row('可搜索', sw('cfg_search', f.searchable, '选项超过一定数量时可输入关键字过滤。'), '选项较多时开启，预览/运行态将渲染为「可输入过滤的下拉选择框」，输入关键字即时筛选项；关闭则为普通下拉。');
    } else if(f.type==='subform'){
      h += `<div class="cfg-logic-block" style="margin-top:0"><div class="cfg-logic-title"><i class="fas fa-table"></i>子表单的作用与场景</div><div class="cfg-logic-body">子表单用于承载<b>「一对多」明细</b>：一笔主数据下挂多条结构相同的子记录（如一张报销单下的多条费用明细、一个订单下的多个商品）。每个<b>子字段</b>相当于一条独立字段，整体以<b>二维数组</b>存储，便于后续按行统计、汇总及在流程节点中做条件判断。<br>典型场景：① 费用报销 / 采购申请的明细清单 ② 订单中的商品行 ③ 家庭成员 / 紧急联系人 ④ 考勤 / 课时记录。当某条主信息需要重复结构的数据时，就用子表单，而不是在主表单堆 N 个相同字段。</div></div>`;
      const subs=(f.subFields||[]).map((s,i)=>`<div class="subform-col-row flex items-center gap-1.5 mb-1.5 p-1 rounded border border-gray-200 bg-white" draggable="true" data-col="${i}" ondragstart="onSubColDragStart(event,'${f.id}',${i})" ondragover="onSubColDragOver(event)" ondrop="onSubColDrop(event,'${f.id}',${i})" ondragend="this.classList.remove('dragging');document.querySelectorAll('.subform-col-row').forEach(r=>r.classList.remove('drop-target'))"><i class="fas fa-grip-vertical text-gray-300 cursor-grab"></i><span class="text-[10px] text-gray-400 w-8 flex-none text-center">${SUB_TYPE_LABEL[s.type]||s.type}</span><input class="form-input flex-1 border border-gray-300 rounded-md px-2 py-1 text-sm" value="${s.label}" oninput="updateSub(${i},this.value)"><button class="text-gray-400 hover:text-red-500 btn-click" onclick="removeSub(${i})" title="删除该列"><i class="fas fa-times"></i></button></div>`).join('');
      h += `<div class="mb-3.5"><label class="block text-xs font-medium text-gray-600 mb-1">子表单列（类型由拖入控件决定，不可改）</label>${subs}<div class="cfg-logic"><i class="fas fa-info-circle"></i><span><b>新增列</b>：从左侧控件库拖控件到画布中的子表单区域，松手即成一列（列类型＝拖入控件类型，表头标「文本/数字/日期/下拉/成员」）。<b>排序</b>：在本列表中拖动每行（⠿ 手柄）调整列顺序；<b>删除</b>：点 ✕。列类型不可在此修改，需换类型时删除后重新拖入对应控件。</span></div></div>`;
      h += row('显示汇总行', sw('cfg_sum', f.showSummary, '在子表单底部增加「合计」行，对所有「数字」类型子字段自动求和。'), '开启后，画布表格底部立即出现蓝色合计行（标「Σ 自动求和」），运行态随用户录入实时累加。文本 / 日期列不参与汇总。');
    } else if(f.type==='member'){
      h += row('选择范围', `<select id="cfg_range" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="all" ${f.range==='all'?'selected':''}>全部成员</option><option value="dept" ${f.range==='dept'?'selected':''}>指定部门</option><option value="role" ${f.range==='role'?'selected':''}>指定角色</option></select>`, '限定可选成员的范围；选部门/角色时需勾选具体对象（对接组织架构集成）。切换后画布即时显示范围摘要。');
      if(f.range==='dept'){
        h += row('指定部门', chipsHTML(`getField('${f.id}').depts`, f.depts, 'dept'), '仅可从所选部门中选择成员；点击标签切换选中，画布范围摘要同步更新。');
      } else if(f.range==='role'){
        h += row('指定角色', chipsHTML(`getField('${f.id}').roles`, f.roles, 'role'), '仅可从所选角色中选择成员；点击标签切换选中，画布范围摘要同步更新。');
      }
      h += row('多选', sw('cfg_multi', f.multi, '可同时选择多名成员，存储为数组。'), '如「抄送人」「会签人」场景。');
      h += row('包含部门信息', sw('cfg_idept', f.includeDept, '返回值同时携带部门字段。'), '流程节点可按部门做条件分支。');
    }
    h += secEnd();
    return h;
  }

  /* 字段事件绑定 */
  function bindFieldEvents(f){
    const g=id=>document.getElementById(id);
    const relabel=()=>renderCanvas();
    if(!f.visible) f.visible={mode:'always',logic:'and',conditions:[]};   // 兼容示例字段（可能无 visible 属性）
    if(g('cfg_label')) g('cfg_label').oninput=e=>{f.label=e.target.value;relabel();};
    if(g('cfg_span')) g('cfg_span').onchange=e=>{f.span=+e.target.value;relabel();};
    if(g('cfg_lpos')) g('cfg_lpos').onchange=e=>{f.labelPos=e.target.value;relabel();};
    if(g('cfg_lalign')) g('cfg_lalign').onchange=e=>{f.labelAlign=e.target.value;relabel();};
    if(g('cfg_lw')) g('cfg_lw').onchange=e=>{f.labelWidth=e.target.value;relabel();};
    if(g('cfg_req')) g('cfg_req').onchange=e=>{f.required=e.target.checked;relabel();};
    // 默认值
    if(g('cfg_dtype')) g('cfg_dtype').onchange=e=>{f.defaultType=e.target.value;renderConfig();};
    if(g('cfg_dval')) g('cfg_dval').oninput=e=>{f.defaultValue=e.target.value;relabel();};
    if(g('cfg_help')) g('cfg_help').oninput=e=>{f.helpText=e.target.value;relabel();};
    if(g('cfg_ro')) g('cfg_ro').onchange=e=>{f.readonly=e.target.checked;};
    if(g('cfg_print')) g('cfg_print').onchange=e=>{f.printShow=e.target.checked;};
    // 显示条件
    if(g('cfg_vmode')) g('cfg_vmode').onchange=e=>{f.visible.mode=e.target.value;renderConfig();};
    if(g('cfg_vlogic')) g('cfg_vlogic').onchange=e=>{f.visible.logic=e.target.value;};
    (f.visible.conditions||[]).forEach((c,i)=>{
      if(g('cfg_vfield_'+i)) g('cfg_vfield_'+i).onchange=e=>{f.visible.conditions[i].field=e.target.value;};
      if(g('cfg_vop_'+i)) g('cfg_vop_'+i).onchange=e=>{f.visible.conditions[i].op=e.target.value;};
      if(g('cfg_vval_'+i)) g('cfg_vval_'+i).oninput=e=>{f.visible.conditions[i].value=e.target.value;};
    });
    // text
    if(g('cfg_fmt')) g('cfg_fmt').onchange=e=>{f.format=e.target.value;};
    if(g('cfg_max')) g('cfg_max').oninput=e=>{f.maxLength=+e.target.value;};
    if(g('cfg_min')) g('cfg_min').oninput=e=>{f.minLength=+e.target.value;};
    if(g('cfg_pwd')) g('cfg_pwd').onchange=e=>{f.password=e.target.checked;};
    if(g('cfg_trim')) g('cfg_trim').onchange=e=>{f.trim=e.target.checked;};
    if(g('cfg_err')) g('cfg_err').oninput=e=>{f.errMsg=e.target.value;};
    // select
    if(g('cfg_src')) g('cfg_src').onchange=e=>{f.source=e.target.value;renderConfig();};
    if(g('cfg_dict')) g('cfg_dict').onchange=e=>{f.dictKey=e.target.value;};
    if(g('cfg_api')) g('cfg_api').oninput=e=>{f.apiUrl=e.target.value;};
    if(g('cfg_search')) g('cfg_search').onchange=e=>{f.searchable=e.target.checked;};
    // subform
    if(g('cfg_minr')) g('cfg_minr').oninput=e=>{f.minRows=+e.target.value;};
    if(g('cfg_maxr')) g('cfg_maxr').oninput=e=>{f.maxRows=+e.target.value;};
    if(g('cfg_allow')) g('cfg_allow').onchange=e=>{f.allowAdd=e.target.checked;relabel();};
    if(g('cfg_sum')) g('cfg_sum').onchange=e=>{f.showSummary=e.target.checked;relabel();};
    // member
    if(g('cfg_range')) g('cfg_range').onchange=e=>{f.range=e.target.value;relabel();renderConfig();};
    if(g('cfg_multi')) g('cfg_multi').onchange=e=>{f.multi=e.target.checked;relabel();};
    if(g('cfg_idept')) g('cfg_idept').onchange=e=>{f.includeDept=e.target.checked;relabel();};
  }
  function addOption(){ const f=fields.find(x=>x.id===selectedId); f.options.push({label:'新选项',value:'opt'+(f.options.length+1)}); renderConfig(); renderCanvas(); }
  function removeOption(i){ const f=fields.find(x=>x.id===selectedId); f.options.splice(i,1); renderConfig(); renderCanvas(); }
  function updateOption(i,v){ const f=fields.find(x=>x.id===selectedId); f.options[i].label=v; renderCanvas(); }
  function removeSub(i){ const f=fields.find(x=>x.id===selectedId); f.subFields.splice(i,1); renderConfig(); renderCanvas(); }
  function updateSub(i,v){ const f=fields.find(x=>x.id===selectedId); f.subFields[i].label=v; renderCanvas(); }
  /* 右侧面板子表单列：整行拖动调整顺序（类型不可改，由拖入控件决定） */
  let subColDrag=null;
  function onSubColDragStart(e, fid, i){ subColDrag={fid, i}; e.currentTarget.classList.add('dragging'); }
  function onSubColDragOver(e){ const row=e.currentTarget; if(!subColDrag) return; e.preventDefault(); row.classList.add('drop-target'); }
  function onSubColDrop(e, fid, i){
    e.preventDefault();
    document.querySelectorAll('.subform-col-row').forEach(r=>r.classList.remove('drop-target','dragging'));
    if(!subColDrag || subColDrag.fid!==fid){ subColDrag=null; return; }
    const f=fields.find(x=>x.id===fid); if(!f) { subColDrag=null; return; }
    const from=subColDrag.i, to=i;
    if(from===to){ subColDrag=null; return; }
    const [item]=f.subFields.splice(from,1);
    f.subFields.splice(to,0,item);
    subColDrag=null; renderConfig(); renderCanvas();
  }

  /* ===================== 表单级配置（完整，无关联流程） ===================== */
  /* ---- 列数据权限（字段级）---- 角色视角：全局默认 + 角色差异覆盖 + 批量 ---- */
  var fpCurrentRole='global';   // 当前编辑的角色视图：'global' | 角色名
  var fpCollapsed={};           // 角色组展开/折叠状态（key=组名）
  const FP_MODES=[['edit','可编辑'],['readonly','只读'],['hidden','隐藏']];
  function fpEffMode(c, fn, view){
    if(view==='global') return (c.colGlobal&&c.colGlobal[fn])||'edit';
    if(c.colRoles && c.colRoles[view] && c.colRoles[view][fn]) return c.colRoles[view][fn];
    return (c.colGlobal&&c.colGlobal[fn])||'edit';
  }
  function fpIsOverridden(c, fn, view){
    return view!=='global' && !!(c.colRoles && c.colRoles[view] && c.colRoles[view][fn]);
  }
  function fpIsConf(c,r){ return r==='global' ? !!(c.colGlobal&&Object.keys(c.colGlobal).length) : !!(c.colRoles&&c.colRoles[r]&&Object.keys(c.colRoles[r]||{}).length); }
  function fpNode(key,label,active,isGlobal,conf){
    let dot = isGlobal ? '<span class="w-2 h-2 rounded-full bg-[#EF9F27] inline-block mr-1"></span>'
             : conf ? '<span class="w-2 h-2 rounded-full bg-[#165DFF] inline-block mr-1"></span>'
             : '<span class="w-2 h-2 rounded-full border border-gray-300 inline-block mr-1"></span>';
    return `<div class="flex items-center ${active?'bg-[#E8F3FF]':'hover:bg-gray-50'} rounded px-1 py-1 cursor-pointer text-sm ${active?'text-[#165DFF] font-medium':'text-gray-700'}" onclick="fpSelectRole('${key}')"><span class="pl-3"></span>${dot}${label}</div>`;
  }
  function fpTree(c){
    let t='';
    t += fpNode('global','全局默认（所有角色）', fpCurrentRole==='global', true, fpIsConf(c,'global'));
    ROLE_GROUPS.forEach(function(g){
      const open = !fpCollapsed[g.name];
      t += `<div class="flex items-center gap-1 px-1 py-1 cursor-pointer select-none" onclick="fpToggleGroup('${g.name}')"><span class="text-gray-400 text-xs w-3">${open?'\u25BE':'\u25B8'}</span><span class="text-xs font-medium text-gray-600">${g.name}</span></div>`;
      if(open){ g.roles.forEach(function(r){ t += fpNode(r, r, fpCurrentRole===r, false, fpIsConf(c,r)); }); }
    });
    return t;
  }
  function fpPanel(c){
    if(!fields || !fields.length) return info('当前表单还没有字段，请先在画布添加字段，再回来配置列数据权限。');
    const allFields = fields.filter(function(f){ return f.fieldName||f.name; });
    if(!c.colGlobal) c.colGlobal={};
    if(!c.colRoles) c.colRoles={};
    const view = fpCurrentRole;
    const roles = (typeof ROLES!=='undefined'?ROLES:[]);
    const batch = '<div class="flex items-center gap-2 my-2 text-xs flex-wrap">'
      +'<span class="text-gray-500">批量设置：</span>'
      +'<select onchange="if(this.value){ fpAll(this.value); }" class="form-input border border-gray-300 rounded-md px-2 py-1 text-xs">'
      +'<option value="">请选择…</option>'
      +'<option value="edit">全部可编辑</option>'
      +'<option value="readonly">全部只读</option>'
      +'<option value="hidden">全部隐藏</option>'
      +'</select>'
      +'<span class="text-gray-400">（作用于当前视图：全局默认=全员基准，具体角色=该角色覆盖）</span>'
      +'</div>';
    const header = '<th class="text-left font-medium text-gray-500 text-xs py-1 pr-3 border-b border-gray-200">字段</th>'
      +FP_MODES.map(function(m){return '<th class="text-center font-medium text-gray-500 text-xs py-1 px-3 border-b border-gray-200">'+m[1]+'</th>';}).join('');
    const rows = allFields.map(function(f){
      const fn=f.fieldName||f.name; const label=f.label||fn;
      const cells = FP_MODES.map(function(m){
        const mode=fpEffMode(c, fn, view);
        const inherited = view!=='global' && !fpIsOverridden(c, fn, view);
        const on = mode===m[0];
        return '<td class="text-center '+(on?'bg-[#E8F3FF]':'')+' '+(inherited?'opacity-50':'')+'"><span class="cursor-pointer select-none text-base '+(on?'text-[#165DFF]':'text-gray-400')+'" onclick="fpSetMode(\'+fn+\',\'+m[0]+\')">'+(on?'\u2611':'\u2610')+'</span></td>';
      }).join('');
      let tag='';
      if(view!=='global'){ tag = fpIsOverridden(c, fn, view) ? '<span class="text-[11px] text-[#165DFF] ml-1">覆盖</span>' : '<span class="text-[11px] text-gray-400 ml-1">继承</span>'; }
      return '<tr><td class="py-1 pr-3 text-sm text-gray-700">'+label+tag+'</td>'+cells+'</tr>';
    }).join('');
    const grid='<table class="w-full"><thead><tr>'+header+'</tr></thead><tbody>'+rows+'</tbody></table>';
    const note = info('列数据权限与「三、数据可见范围」（行级）互补：行级决定能否看到这一<b>行</b>，列级决定能否看清这一<b>列</b>。先配「全局默认」（全员基准），切到具体角色只改差异字段（其余继承）。顶部下拉可对本视图全部字段一次性套用模式。左侧角色树中，蓝点=已自定义配置，橙点=全局默认基准，空心=继承默认。');
    const tree = fpTree(c);
    return `<div class="flex gap-3 items-start">`
      + `<div class="w-44 shrink-0 border rounded-md p-2 bg-gray-50 max-h-80 overflow-auto">${tree}</div>`
      + `<div class="flex-1 min-w-0">${batch+grid+note}</div>`
      + `</div>`;
  }
  function fpSelectRole(r){ fpCurrentRole=r; renderConfig(); }
  function fpToggleGroup(name){ if(fpCollapsed[name]) delete fpCollapsed[name]; else fpCollapsed[name]=true; renderConfig(); }
  function fpSetMode(fn, mode){
    const c=formConfig; const view=fpCurrentRole||'global';
    if(view==='global'){ if(!c.colGlobal) c.colGlobal={}; c.colGlobal[fn]=mode; }
    else { if(!c.colRoles) c.colRoles={}; if(!c.colRoles[view]) c.colRoles[view]={}; c.colRoles[view][fn]=mode; }
    renderConfig();
  }
  function fpAll(mode){
    const c=formConfig; const view=fpCurrentRole||'global';
    const allFields=(fields||[]).filter(function(f){return f.fieldName||f.name;}).map(function(f){return f.fieldName||f.name;});
    if(view==='global'){ if(!c.colGlobal) c.colGlobal={}; allFields.forEach(function(fn){ c.colGlobal[fn]=mode; }); }
    else { if(!c.colRoles) c.colRoles={}; if(!c.colRoles[view]) c.colRoles[view]={}; allFields.forEach(function(fn){ c.colRoles[view][fn]=mode; }); }
    renderConfig();
  }

  function renderFormConfig(body){
    const c=formConfig;
    const cv=currentView();
    let h = `<div class="mb-3 pb-3 border-b border-gray-100 flex items-center gap-2 text-sm font-semibold text-gray-700"><i class="fas fa-cog text-[#165DFF]"></i>表单配置</div>`;
    h += sec('一、基础信息','form_basic');
    h += row('表单名称', `<input id="fc_name" ${inp(c.name)}>`, '该表单的显示名称，出现在列表与运行态顶部。');
    h += row('表单描述', `<textarea id="fc_desc" rows="2" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm resize-none">${c.desc||''}</textarea>`, '运行态表单顶部展示的说明文字，帮助用户理解用途。');
    h += row('表单图标', `<select id="fc_icon" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option value="fa-file-alt" ${c.icon==='fa-file-alt'?'selected':''}>📄 通用文件</option><option value="fa-umbrella-beach" ${c.icon==='fa-umbrella-beach'?'selected':''}>🌴 请假</option><option value="fa-receipt" ${c.icon==='fa-receipt'?'selected':''}>🧾 报销</option><option value="fa-id-card" ${c.icon==='fa-id-card'?'selected':''}>🪪 登记</option></select>`, '列表与入口处展示的图标，便于区分业务。');
    h += row('表单分类', `<select id="fc_cat" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm"><option>未分类</option><option>人事</option><option>财务</option><option>行政</option></select>`, '用于列表分组与权限批量管理。');
    h += secEnd();

    // 表单设置仅保留「一、基本信息」与「二、列表与交互」两块；二（提交设置）/三（数据可见范围）/四（字段权限）/五（展示设置）已移除

    // 第二大项：列表与交互（列表配置 / 查询配置 / 按钮配置）；不再有独立「视图管理」入口，也不再支持新建视图与数据可见范围
    h += `<div class="mt-5 pt-4 border-t border-gray-100 mb-3 pb-3 flex items-center gap-2 text-sm font-semibold text-gray-700"><i class="fas fa-table text-[#165DFF]"></i>二、列表与交互</div>`;
    h += sec('列表配置','form_list'); h += listConfigHTML(currentView()); h += secEnd();
    h += sec('查询配置','form_query'); h += queryConfigHTML(currentView()); h += secEnd();
    h += sec('按钮配置','form_buttons'); h += buttonConfigHTML(currentView()); h += secEnd();

    body.innerHTML = h;
    bindFormEvents();
  }
  /* ===================== 列表 / 查询 / 按钮 配置 ===================== */
  const QUERY_MODES=[['like','包含'],['eq','精确'],['range','区间'],['date','日期']];
  const LIST_BTN_DEFS=[['add','新增'],['import','导入'],['export','导出'],['batchDelete','批量删除']];
  const ROW_BTN_DEFS=[['edit','修改'],['delete','删除']];
  function listFieldDefs(c){
    if(!c.listFields || !c.listFields.length) c.listFields = (fields||[]).map(f=>({field:f.fieldName,label:f.label,sortable:false}));
    return c.listFields;
  }
  function listConfigHTML(c){
    const defs=listFieldDefs(c);
    if(!fields.length) return info('当前表单还没有字段，请先在画布添加字段，再回来配置列表展示。');
    const rows = fields.map(f=>{
      const idx=defs.findIndex(d=>d.field===f.fieldName);
      const shown=idx>=0; const sortable=shown?defs[idx].sortable:false;
      const up=shown?`<button class="text-gray-400 hover:text-[#165DFF] btn-click text-xs px-1" ${idx===0?'disabled style="opacity:.3"':''} onclick="moveListField('${f.fieldName}',-1)"><i class="fas fa-arrow-up"></i></button>`:'';
      const down=shown?`<button class="text-gray-400 hover:text-[#165DFF] btn-click text-xs px-1" ${idx===defs.length-1?'disabled style="opacity:.3"':''} onclick="moveListField('${f.fieldName}',1)"><i class="fas fa-arrow-down"></i></button>`:'';
      const sortChk=shown?`<label class="flex items-center gap-1 text-xs text-gray-400 ml-1"><input type="checkbox" ${sortable?'checked':''} onchange="setListSortable('${f.fieldName}',this.checked)" class="rounded text-[#165DFF]">可排序</label>`:'';
      return `<div class="flex items-center gap-2 mb-1.5 text-sm"><input type="checkbox" ${shown?'checked':''} onchange="toggleListField('${f.fieldName}','${f.label}',this.checked)" class="rounded text-[#165DFF]"><span class="flex-1 text-gray-700">${f.label}</span>${up}${down}${sortChk}</div>`;
    }).join('');
    return `<div class="mb-2">${rows}</div><div class="cfg-logic"><i class="fas fa-info-circle"></i><span>勾选字段即出现在运行态数据列表；用 ▲▼ 调整列左右顺序；「可排序」开启后该列支持点击排序。未勾选字段仅在提交详情中可见。</span></div>`;
  }
  function toggleListField(field,label,checked){
    const c=currentView(); if(!c.listFields) c.listFields=[];
    const i=c.listFields.findIndex(d=>d.field===field);
    if(checked && i<0) c.listFields.push({field,label,sortable:false});
    else if(!checked && i>=0) c.listFields.splice(i,1);
    renderConfig();
  }
  function moveListField(field,dir){
    const c=currentView(); const a=c.listFields; if(!a) return; const i=a.findIndex(d=>d.field===field); const j=i+dir;
    if(i<0||j<0||j>=a.length) return; const t=a[i];a[i]=a[j];a[j]=t; renderConfig();
  }
  function setListSortable(field,checked){ const c=currentView(); const d=c.listFields&&c.listFields.find(x=>x.field===field); if(d) d.sortable=checked; }
  function queryConfigHTML(c){
    if(!fields.length) return info('当前表单还没有字段，请先在画布添加字段，再回来配置查询条件。');
    const qfs=c.queryFields||[];
    const rows=fields.map(f=>{
      const qf=qfs.find(x=>x.field===f.fieldName); const on=!!qf; const mode=qf?qf.mode:'like';
      const modeSel=on?`<select onchange="setQueryMode('${f.fieldName}',this.value)" class="form-input border border-gray-300 rounded-md px-2 py-1 text-xs">${QUERY_MODES.map(m=>`<option value="${m[0]}" ${mode===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select>`:'';
      return `<div class="flex items-center gap-2 mb-1.5 text-sm"><input type="checkbox" ${on?'checked':''} onchange="toggleQueryField('${f.fieldName}','${f.label}',this.checked)" class="rounded text-[#165DFF]"><span class="flex-1 text-gray-700">${f.label}</span>${modeSel}</div>`;
    }).join('');
    return `<div class="mb-2">${rows}</div><div class="cfg-logic"><i class="fas fa-info-circle"></i><span>勾选字段即作为运行态数据列表的查询条件；「查询方式」决定匹配规则（包含/精确/区间/日期）。</span></div>`;
  }
  function toggleQueryField(field,label,checked){
    const c=currentView(); if(!c.queryFields) c.queryFields=[];
    const i=c.queryFields.findIndex(x=>x.field===field);
    if(checked && i<0) c.queryFields.push({field,label,mode:'like'});
    else if(!checked && i>=0) c.queryFields.splice(i,1);
    renderConfig();
  }
  function setQueryMode(field,mode){ const c=currentView(); const q=c.queryFields&&c.queryFields.find(x=>x.field===field); if(q) q.mode=mode; }
  function buttonConfigHTML(c){
    const lb=c.listButtons||['add','export'];
    const rb=c.rowButtons||['edit','delete'];
    const fb=c.formButtons||{submit:true,draft:true,reset:true};
    const listBtns=LIST_BTN_DEFS.map(b=>`<label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${(lb.includes(b[0]))?'checked':''} onchange="toggleListBtn('${b[0]}',this.checked)" class="rounded text-[#165DFF]"> ${b[1]}</label>`).join('');
    const rowBtns=ROW_BTN_DEFS.map(b=>`<label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${(rb.includes(b[0]))?'checked':''} onchange="toggleRowBtn('${b[0]}',this.checked)" class="rounded text-[#165DFF]"> ${b[1]}</label>`).join('');
    const formBtns=`
      <label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${fb.submit?'checked':''} onchange="currentView().formButtons.submit=this.checked" class="rounded text-[#165DFF]"> 提交</label>
      <label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${fb.draft?'checked':''} onchange="currentView().formButtons.draft=this.checked" class="rounded text-[#165DFF]"> 保存草稿</label>
      <label class="flex items-center gap-2 text-sm text-gray-700 mb-1.5"><input type="checkbox" ${fb.reset?'checked':''} onchange="currentView().formButtons.reset=this.checked" class="rounded text-[#165DFF]"> 取消</label>`;
    return `<div class="mb-2"><div class="text-xs font-semibold text-gray-500 mb-1">列表按钮（数据列表上方工具栏）</div>${listBtns}</div>`+
      `<div class="mb-2"><div class="text-xs font-semibold text-gray-500 mb-1">行操作按钮（每条数据的操作）</div>${rowBtns}</div>`+
      `<div class="mb-2"><div class="text-xs font-semibold text-gray-500 mb-1">表单按钮（填写页底部）</div>${formBtns}</div>`+
      `<div class="cfg-logic"><i class="fas fa-info-circle"></i><span>「提交 / 保存草稿 / 取消」均为<b>可选项</b>，按业务勾选是否出现在填写页底部（取消用于关闭当前填写页、不保存）。「修改 / 删除」按钮决定每条数据能否被操作，具体<b>哪些角色能用</b>由角色权限中的按钮权限授权（如仅创建人可改）。</span></div>`;
  }
  function toggleListBtn(key,checked){ const c=currentView(); if(!c.listButtons) c.listButtons=['add','export']; if(checked&&!c.listButtons.includes(key)) c.listButtons.push(key); else if(!checked) c.listButtons=c.listButtons.filter(x=>x!==key); }
  function toggleRowBtn(key,checked){ const c=currentView(); if(!c.rowButtons) c.rowButtons=['edit','delete']; if(checked&&!c.rowButtons.includes(key)) c.rowButtons.push(key); else if(!checked) c.rowButtons=c.rowButtons.filter(x=>x!==key); }

  function bindFormEvents(){
    const g=id=>document.getElementById(id); const c=formConfig;
    if(g('fc_name')) g('fc_name').oninput=e=>{c.name=e.target.value; formName=c.name; document.getElementById('formNameInput').value=c.name;};
    if(g('fc_desc')) g('fc_desc').oninput=e=>{c.desc=e.target.value;};
    if(g('fc_icon')) g('fc_icon').onchange=e=>{c.icon=e.target.value;};
    if(g('fc_cat')) g('fc_cat').onchange=e=>{c.category=e.target.value;};
    if(g('fc_multi')) g('fc_multi').onchange=e=>{c.allowMultiple=e.target.checked;};
    if(g('fc_after')) g('fc_after').onchange=e=>{c.afterSubmit=e.target.value; renderConfig();};
    if(g('fc_afterurl')) g('fc_afterurl').oninput=e=>{c.afterUrl=e.target.value;};
    if(g('fc_colperm')) g('fc_colperm').onchange=e=>{ formConfig.colPermEnabled=e.target.checked; renderConfig(); };
    if(g('fv_dvis')) g('fv_dvis').onchange=e=>{ currentView().dataVisible=e.target.value; renderConfig(); };
    if(g('fv_name')) g('fv_name').oninput=e=>{ currentView().name=e.target.value; };

    if(g('fc_lalign')) g('fc_lalign').onchange=e=>{c.labelAlign=e.target.value; renderCanvas();};
    if(g('fc_lw')) g('fc_lw').onchange=e=>{c.labelWidth=e.target.value; renderCanvas();};
    if(g('fc_fw')) g('fc_fw').onchange=e=>{c.formWidth=e.target.value; applyFormWidth();};
    if(g('fc_print')) g('fc_print').onchange=e=>{c.printable=e.target.checked;};
    if(g('fc_stime')) g('fc_stime').onchange=e=>{c.showSubmitTime=e.target.checked;};
    if(g('fc_dedupe')) g('fc_dedupe').onchange=e=>{c.dedupe=e.target.checked;};

  function applyFormWidth(){
    const map={narrow:'520px',standard:'680px',wide:'860px'};

  /* ===================== 顶部 & 保存 / 发布 / 下架 ===================== */
  function onFormNameChange(){ formName=document.getElementById('formNameInput').value; formConfig.name=formName; }
  /* 保存：持久化当前设计。
     草稿 → 仍保持草稿；已发布 → 标记为「待发布修改」（线上版本不变，黄条提示）。
     新表单（未入列表）→ 首次保存即写入列表，状态为草稿 v0。 */
  function saveForm(){
    let f=currentForm();
    if(!f){
      const id='form'+Date.now();
      f={ id, name:formName||'未命名表单', status:'草稿', version:0, publishedAt:'', publishedBy:'', hasUnpublished:false,
          updatedAt:todayStr(), cat:formConfig.category||'未分类',
          creator:'产品同学', createdAt:todayStr(), refs:[],
          fc:JSON.parse(JSON.stringify(formConfig)), fields:JSON.parse(JSON.stringify(fields)), versions:[] };
      SAMPLE_FORMS.unshift(f); currentFormId=id;
    } else {
      f.name=formName; f.fc=JSON.parse(JSON.stringify(formConfig)); f.fields=JSON.parse(JSON.stringify(fields));
      f.updatedAt=todayStr(); f.cat=formConfig.category||'未分类';
      if(f.status==='已发布') f.hasUnpublished=true;   // 线上版本保持不变，仅标记有未发布修改
    }
    isCreating=false;
    renderFormTable(); refreshDesignerChrome();
    const isPublished = f.status==='已发布';
    alert('已保存「'+(formName||'未命名表单')+'」\n'+(isPublished?'（已发布表单：修改已存为待发布草稿，发布后生效）':'（状态：草稿，未被他人提交）'));
  }
  /* 发布：版本 +1，快照当前设计为线上锁定版本，状态变「已发布」 */
  function publishForm(){
    const name=(formName||'').trim();
    if(!name){ alert('请先填写表单名称，再发布。'); return; }
    const dup=SAMPLE_FORMS.find(x=>x.name.trim()===name && x.id!==currentFormId);
    if(dup){ alert('已存在同名表单「'+name+'」（'+(dup.status||'')+'），表单名称需唯一，请修改名称后再发布。'); return; }
    let f=currentForm();
    if(!f){ saveForm(); f=currentForm(); }              // 未保存过则先落库再发布
    if(!f) return;
    f.version = (f.version||0)+1;
    f.status='已发布'; f.publishedAt=todayStr(); f.publishedBy='产品同学'; f.hasUnpublished=false;
    f.fc=JSON.parse(JSON.stringify(formConfig)); f.fields=JSON.parse(JSON.stringify(fields)); f.updatedAt=todayStr();
    if(!f.versions) f.versions=[];
    f.versions.push({ version:f.version, time:f.publishedAt, publisher:f.publishedBy,
                      note: f.version===1?'首次发布，锁定该版本 schema':'基于 v'+(f.version-1)+' 的修改发布',
                      name:f.name, cat:f.cat, icon:f.fc.icon,
                      fields:JSON.parse(JSON.stringify(f.fields)), fc:JSON.parse(JSON.stringify(f.fc)) });
    renderFormTable(); refreshDesignerChrome();
    alert('发布成功！当前线上版本 v'+f.version+'，表单已可被全员提交。\n（该版本 schema 已锁定，历史数据按版本渲染）');
  }
  /* 下架：状态回退草稿（已下架），停止接收提交，保留历史数据 */
  function unpublishForm(){
    const f=currentForm(); if(!f) return;
    f.status='草稿'; f.hasUnpublished=false;
    renderFormTable(); refreshDesignerChrome();
    alert('已下架。表单停止接收提交；历史数据（至 v'+f.version+'）保留可查。\n如需重新上线，点击「发布」生成新版本。');
  }
  /* 版本历史弹窗 */
  function showVersions(){
    const f=currentForm();
    const wrap=document.getElementById('versionList');
    const vers = f ? (f.versions||[]).slice().sort((a,b)=>b.version-a.version) : [];
    if(vers.length===0){
      wrap.innerHTML='<div class="text-sm text-gray-400 text-center py-6">暂无发布版本。点击「发布」后会生成 v1 并锁定该版本结构。</div>';
    } else {
      wrap.innerHTML = vers.map(v=>{
        const cur = v.version===f.version && f.status==='已发布';
        const hasSnap = !!(v.fields && v.fc);
        return `<div class="border border-gray-200 rounded-lg p-3 ${cur?'ring-2 ring-[#165DFF] border-[#165DFF]':''}">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-gray-800">v${v.version} ${cur?'<span class="ml-1 px-1.5 py-0.5 rounded text-[10px] bg-green-100 text-green-600">当前线上</span>':''}</span>
            <span class="text-xs text-gray-400">${v.time} · ${v.publisher}</span>
          </div>
          <div class="text-xs text-gray-500 mt-1">${v.note||''}${hasSnap?` · ${v.fields.length} 个字段`:''}</div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-[11px] text-gray-400"><i class="fas fa-lock mr-1"></i>该版本 schema 已锁定，提交数据按此版本渲染</span>
            ${cur?'':`<span class="flex gap-2">
              <button onclick="viewFormVersion(${v.version})" class="px-2.5 py-1 rounded-md text-xs btn-click border border-gray-300 text-gray-600 hover:border-[#165DFF] hover:text-[#165DFF]"><i class="fas fa-eye mr-1"></i>查看</button>
              <button onclick="restoreFormVersion(${v.version})" class="px-2.5 py-1 rounded-md text-xs btn-click border border-[#165DFF] text-[#165DFF] hover:bg-blue-50"><i class="fas fa-rotate-left mr-1"></i>恢复并发布</button>
            </span>`}
          </div>
        </div>`;
      }).join('');

    openModal('versionsModal');

  /* 查看历史版本：在设计器画布上直接展示该版本的字段结构（只读） */
  function viewFormVersion(v){
    const f=currentForm(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.version===v); if(!s) return;
    if(!s.fields || !s.fc){ alert('该历史版本未保存结构快照，无法预览。'); return; }
    formViewingVersion=v; selectedId=null;
    closeModal('versionsModal');

    banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-blue-50 text-blue-700';
    banner.innerHTML='<i class="fas fa-eye"></i> 正在查看历史版本 <b>v'+v+'</b>（只读 · '+(s.publisher||'系统')+' · '+(s.time||'—')+'）<button onclick="exitFormVersionView()" class="ml-auto px-2.5 py-1 rounded-md text-[11px] font-medium bg-[#165DFF] text-white hover:bg-blue-600 btn-click">返回编辑</button>';

  function exitFormVersionView(){
    formViewingVersion=null; selectedId=null;
    renderCanvas(); renderConfig(); refreshDesignerChrome();
  }
  /* 恢复历史版本：以该版本内容覆盖当前表单并重新发布，版本号不变 */
  function restoreFormVersion(v){
    const f=currentForm(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.version===v); if(!s) return;
    if(!s.fields || !s.fc){ alert('该历史版本未保存结构快照，无法恢复。'); return; }
    if(!confirm('确认恢复历史版本 v'+v+'？\n将把当前表单内容替换为该版本内容并重新发布，版本号保持 v'+v+'，不生成新版本。')) return;
    f.name=s.name||f.name; f.cat=s.cat||f.cat; f.icon=s.icon||f.icon;
    f.fc=JSON.parse(JSON.stringify(s.fc)); f.fields=JSON.parse(JSON.stringify(s.fields));
    f.version=v; f.status='已发布'; f.hasUnpublished=false;
    f.publishedAt=s.time||f.publishedAt; f.publishedBy=s.publisher||f.publishedBy; f.updatedAt=todayStr();
    formName=f.name; formConfig=JSON.parse(JSON.stringify(f.fc)); ensureViews({fc:formConfig});
    fields=JSON.parse(JSON.stringify(f.fields)); selectedId=null; formViewingVersion=null;

    applyFormWidth();
    closeModal('versionsModal');
