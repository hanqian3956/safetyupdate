  }

  /* ===================== 预览态子表单（可增删行 + 实时汇总） ===================== */
  const previewSubRows = {};
  function previewSubform(f){
    const fid=f.id;
    if(!previewSubRows[fid]){
      const n=(f.minRows&&f.minRows>0)?f.minRows:1;
      previewSubRows[fid]=Array.from({length:n},()=>(f.subFields||[]).map(()=>''));
    }
    const sf=f.subFields||[];
    const head=sf.map(s=>`<th class="px-3 py-2 text-left text-xs font-medium text-gray-600">${s.label}${s.type==='number'?' <span class="font-normal text-gray-400">数字</span>':''}</th>`).join('')+'<th class="w-8"></th>';
    return `<div class="subprev border border-gray-200 rounded-md overflow-hidden" id="subprev_${fid}">
      <table class="w-full text-sm"><thead class="bg-gray-50">${head}</thead>
      <tbody id="subbody_${fid}">${subRowsHTML(f)}</tbody>
      ${f.showSummary?`<tfoot id="subfoot_${fid}">${subFootHTML(f)}</tfoot>`:''}
      </table>
      <div class="px-3 py-2 text-xs flex items-center gap-3 bg-gray-50 border-t">
        <button class="text-[#165DFF] btn-click" onclick="subAddRow('${fid}')"><i class="fas fa-plus mr-1"></i>添加一行</button>
        ${f.allowAdd?'':`<span class="text-gray-400">（已锁定增删，固定 ${previewSubRows[fid].length} 行）</span>`}
        ${f.maxRows?`<span class="text-gray-400 ml-auto">最多 ${f.maxRows} 行</span>`:''}
      </div>
    </div>`;
  }
  function subRowsHTML(f){
    const rows=previewSubRows[f.id]||[];
    const sf=f.subFields||[];
    return rows.map((row,ri)=>`<tr>${sf.map((s,ci)=>{
      const ph=s.type==='number'?'0.00':(s.type==='date'?'年/月/日':'请输入');
      const t=s.type==='date'?'date':(s.type==='number'?'number':'text');
      return `<td class="px-3 py-2 border-t"><input type="${t}" value="${row[ci]||''}" placeholder="${ph}" data-r="${ri}" data-c="${ci}" oninput="subOnInput('${f.id}',this)" class="w-full border border-gray-200 rounded px-2 py-1 text-sm"></td>`;
    }).join('')}<td class="px-3 py-2 border-t text-center"><button class="text-gray-400 hover:text-red-500 btn-click" onclick="subDelRow('${f.id}',${ri})"><i class="fas fa-trash-alt"></i></button></td></tr>`).join('');
  }
  function subFootHTML(f){
    const sf=f.subFields||[];
    const lead=sf.findIndex(s=>s.type!=='number'); const li=lead<0?0:lead;
    const cells=sf.map((s,ci)=>{
      if(s.type!=='number') return ci===li?`<td class="px-3 py-2 text-xs font-semibold text-[#165DFF] border-t border-gray-200 bg-[#F0F5FF]">合计</td>`:`<td class="border-t border-gray-200 bg-[#F0F5FF]"></td>`;
      return `<td class="px-3 py-2 text-xs font-semibold text-[#165DFF] border-t border-gray-200 bg-[#F0F5FF]" id="subsum_${f.id}_${ci}">0</td>`;
    }).join('')+'<td class="border-t border-gray-200 bg-[#F0F5FF]"></td>';
    return `<tr>${cells}</tr>`;
  }
  function subAddRow(fid){ const f=fields.find(x=>x.id===fid); if(!f) return; const rows=previewSubRows[fid]||(previewSubRows[fid]=[]); if(f.maxRows&&rows.length>=f.maxRows) return; rows.push((f.subFields||[]).map(()=>'')); subRebuild(fid); }
  function subDelRow(fid,ri){ const f=fields.find(x=>x.id===fid); if(!f) return; const rows=previewSubRows[fid]||[]; if(f.minRows&&rows.length<=f.minRows) return; rows.splice(ri,1); subRebuild(fid); }
  function subOnInput(fid,el){ const f=fields.find(x=>x.id===fid); if(!f) return; const r=+el.dataset.r,c=+el.dataset.c; previewSubRows[fid][r][c]=el.value; subRecalc(fid); }
  function subRecalc(fid){ const f=fields.find(x=>x.id===fid); if(!f||!f.showSummary) return; (f.subFields||[]).forEach((s,ci)=>{ if(s.type!=='number') return; const sum=previewSubRows[fid].reduce((a,row)=>a+(parseFloat(row[ci])||0),0); const cell=document.getElementById('subsum_'+fid+'_'+ci); if(cell) cell.textContent=sum.toFixed(2).replace(/\.00$/,''); }); }
  function subRebuild(fid){ const f=fields.find(x=>x.id===fid); if(!f) return; const body=document.getElementById('subbody_'+fid); if(body) body.innerHTML=subRowsHTML(f); subRecalc(fid); }

  /* ===================== 预览 / Schema ===================== */
  function previewForm(){
    document.getElementById('previewTitle').textContent = formName + ' · 预览';
    for(const k in previewSubRows) delete previewSubRows[k];
    const body=document.getElementById('previewBody');
    if(fields.length===0){ body.innerHTML='<p class="text-sm text-gray-400">画布暂无字段，请先添加控件。</p>'; }
    else body.innerHTML = (formConfig.desc?`<p class="text-sm text-gray-500 mb-4">${formConfig.desc}</p>`:'') + fields.map(f=>{
      const lp = f.labelPos || formConfig.labelPos;
      const la = f.labelAlign || formConfig.labelAlign;
      const lwKey = f.labelWidth==='inherit'||!f.labelWidth ? formConfig.labelWidth : f.labelWidth;
      let c='';
      if(f.type==='text') c=`<input class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm" placeholder="${f.placeholder||''}" value="${defaultDisplay(f)}">`;
      else if(f.type==='select'){
        let ph=f.placeholder||'请选择'; const dt=f.defaultType||'manual';
        let defLabel='';
        if(dt==='manual'&&f.defaultValue){const o=(f.options||[]).find(o=>o.value===f.defaultValue);defLabel=o?o.label:f.defaultValue;}
        else if(dt==='currentUser')defLabel='当前登录人'; else if(dt==='today')defLabel=new Date().toISOString().slice(0,10); else if(dt==='linkage')defLabel=defaultDisplay(f);
        if(f.searchable){
          c=`<div class="relative" onfocusin="previewShowSelect('${f.fieldName}')" onfocusout="setTimeout(()=>previewHideSelect('${f.fieldName}'),150)">
            <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 text-sm bg-white">
              <i class="fas fa-search text-gray-400 mr-2"></i>
              <input id="ps_${f.fieldName}" class="flex-1 outline-none text-sm" placeholder="${ph}" value="${defLabel}" oninput="previewFilterSelect(this,'${f.fieldName}')">
            </div>
            <div id="pslist_${f.fieldName}" class="absolute z-10 mt-1 w-full bg-white border border-gray-200 rounded-md shadow-lg max-h-40 overflow-auto" style="display:none">
              ${(f.options||[]).map(o=>`<div class="px-3 py-1.5 text-sm hover:bg-blue-50 cursor-pointer" data-val="${o.label}" onclick="previewPickSelect('${f.fieldName}','${(o.label||'').replace(/'/g,'')}')">${o.label}</div>`).join('')}
            </div>
          </div>`;
        } else {
          c=`<select class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm"><option>请选择</option>${(f.options||[]).map(o=>`<option ${o.value===f.defaultValue?'selected':''}>${o.label}</option>`).join('')}</select>`;
        }
      }
      else if(f.type==='subform'){
        c=previewSubform(f);
      } else if(f.type==='member'){
        let ph='请选择成员'; const dt=f.defaultType||'manual';
        if(dt==='currentUser')ph='当前登录人'; else if(dt==='linkage')ph=defaultDisplay(f);
        const scope=f.range==='all'?'全部成员':(f.range==='dept'?((f.depts||[]).join('/')||'指定部门'):((f.roles||[]).join('/')||'指定角色'));
        c=`<div class="border border-gray-300 rounded-md px-3 py-2 text-sm flex items-center gap-2 cursor-pointer"><i class="fas fa-user-plus text-[#165DFF]"></i> 选择成员（${scope}）</div>`;
      }
      let label;
      if(lp==='left'){
        const lwStyle = lwKey==='auto' ? 'width:auto;flex:none;' : `width:${LABEL_W[lwKey]};flex:none;`;
        label = `<label class="label-cell text-sm font-medium text-gray-700 ${lwKey==='auto'?'auto':''}" style="${lwStyle}text-align:${la};padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.label}${(f.required?'<span class="text-red-500 ml-0.5">*</span>':'')}</label>`;
      } else {
        label = `<label class="block text-sm font-medium text-gray-700 mb-1" style="text-align:${la}">${f.label}${(f.required?'<span class="text-red-500 ml-0.5">*</span>':'')}</label>`;
      }
      const wrap = lp==='left' ? `<div class="flex items-start gap-3">${label}<div class="flex-1 min-w-0">${c}${f.helpText?`<div class="text-[11px] text-gray-400 mt-1">${f.helpText}</div>`:''}</div></div>` : `<div>${label}<div>${c}${f.helpText?`<div class="text-[11px] text-gray-400 mt-1">${f.helpText}</div>`:''}</div></div>`;
      return `<div class="mb-4">${wrap}</div>`;
    }).join('');
    const fb=currentView().formButtons||{submit:true,draft:true,reset:true};
    let btns='';
    if(fb.draft) btns+='<button class="px-4 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg btn-click" onclick="closeModal(\'previewModal\')">保存草稿</button>';
    if(fb.reset) btns+='<button class="px-4 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg btn-click" onclick="closeModal(\'previewModal\')">取消</button>';
    if(fb.submit) btns+='<button class="px-4 py-2 bg-[#165DFF] hover:bg-blue-600 text-white text-sm rounded-lg font-medium btn-click" onclick="alert(\'提交成功（演示）\')">提交</button>';
    document.getElementById('previewBtns').innerHTML = btns || '<span class="text-xs text-gray-400">未配置任何表单按钮</span>';
    openModal('previewModal');
  }
  // 预览态：下拉单选「可搜索」效果（可输入关键字即时过滤 + 点选回填）
  function previewShowSelect(fn){ const l=document.getElementById('pslist_'+fn); if(l) l.style.display=''; }
  function previewHideSelect(fn){ const l=document.getElementById('pslist_'+fn); if(l) l.style.display='none'; }
  function previewFilterSelect(input, fn){
    const l=document.getElementById('pslist_'+fn); if(!l) return;
    const q=input.value.trim().toLowerCase();
    l.querySelectorAll('div[data-val]').forEach(d=>{ d.style.display = d.getAttribute('data-val').toLowerCase().includes(q) ? '' : 'none'; });
  }
  function previewPickSelect(fn, label){
    const i=document.getElementById('ps_'+fn); if(i) i.value=label;
    previewHideSelect(fn);
  }
  function showSchema(){
    const schema = {
      formName, version:1, config: formConfig,
      fields: fields.map(f=>{
        const base={ field:f.fieldName, label:f.label, type:f.type, span:f.span||12, required:!!f.required, helpText:f.helpText||'',
          visible:f.visible||{mode:'always',logic:'and',conditions:[]}, readonly:!!f.readonly, printShow:f.printShow!==false,
          defaultType:f.defaultType||'manual', defaultValue:f.defaultValue||'', linkage:f.linkage||{formId:'',formName:'',conditions:[],returnField:''} };
        if(f.type==='text') Object.assign(base,{placeholder:f.placeholder,maxLength:f.maxLength,minLength:f.minLength,format:f.format,password:!!f.password,trim:!!f.trim});
        if(f.type==='select') Object.assign(base,{source:f.source,apiUrl:f.apiUrl||'',dictKey:f.dictKey||'',options:f.options,searchable:!!f.searchable,allowCustom:!!f.allowCustom});
        if(f.type==='subform') Object.assign(base,{minRows:f.minRows,maxRows:f.maxRows,allowAdd:!!f.allowAdd,showSummary:!!f.showSummary,subFields:f.subFields});
        if(f.type==='member') Object.assign(base,{range:f.range,depts:f.depts||[],roles:f.roles||[],multi:!!f.multi,includeDept:!!f.includeDept});
        return base;
      })
    };
    document.getElementById('schemaBody').textContent = JSON.stringify(schema,null,2);

  }

  /* ===================== 模态 ===================== */
  function openModal(id){ document.getElementById(id).classList.remove('modal-hidden'); }
  function closeModal(id){ document.getElementById(id).classList.add('modal-hidden'); }
  document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.add('modal-hidden'); }));

  /* ===================== 连线 ===================== */
  const svg=document.getElementById('connections'); const connections=[];
  function drawConnections(){
    svg.innerHTML=''; connections.length=0;
    document.querySelectorAll('.proto-element[data-proto-id]').forEach(leftEl=>{
      const pid=leftEl.getAttribute('data-proto-id');
      const rightEl=document.querySelector(`.proto-desc[data-proto-id="${pid}"]`); if(!rightEl) return;
      const lr=leftEl.getBoundingClientRect(), rr=rightEl.getBoundingClientRect(), sr=svg.getBoundingClientRect();
      if(!lr.width||!lr.height||!rr.width) return;
      const x1=lr.right-sr.left, y1=lr.top+lr.height/2-sr.top, x2=rr.left-sr.left, y2=rr.top+rr.height/2-sr.top, cx=x1+(x2-x1)*0.5;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`);
      path.setAttribute('class','connection-line'); path.setAttribute('data-proto-id',pid); svg.appendChild(path);
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const bg=document.createElementNS('http://www.w3.org/2000/svg','circle'); bg.setAttribute('cx',mx); bg.setAttribute('cy',my); bg.setAttribute('r',11); bg.setAttribute('class','connection-label-bg'); svg.appendChild(bg);
      const tx=document.createElementNS('http://www.w3.org/2000/svg','text'); tx.setAttribute('x',mx); tx.setAttribute('y',my); tx.setAttribute('dy','0.05em'); tx.setAttribute('class','connection-label'); tx.textContent=pid; svg.appendChild(tx);
      connections.push({pid,path,leftEl,rightEl});
    });
  }
  function highlight(pid,on){ const c=connections.find(x=>x.pid===pid); if(!c) return; c.path.classList.toggle('active',on); c.leftEl.classList.toggle('active-highlight',on); c.rightEl.classList.toggle('active-highlight',on); }
  function bindHover(){
    document.querySelectorAll('.proto-element[data-proto-id]').forEach(el=>{ el.addEventListener('mouseenter',()=>highlight(el.getAttribute('data-proto-id'),true)); el.addEventListener('mouseleave',()=>highlight(el.getAttribute('data-proto-id'),false)); });
    document.querySelectorAll('.proto-desc[data-proto-id]').forEach(el=>{ el.addEventListener('mouseenter',()=>highlight(el.getAttribute('data-proto-id'),true)); el.addEventListener('mouseleave',()=>highlight(el.getAttribute('data-proto-id'),false)); });
  }
  let mobileDesc=false;

  /* ===================== 初始化 ===================== */
  function init(){

    SAMPLE_FORMS.forEach(f=>{
      if(f.version==null) f.version = (f.status==='已发布')?1:0;
      if(f.publishedAt==null) f.publishedAt = (f.status==='已发布')?f.updatedAt:'';
      if(f.publishedBy==null) f.publishedBy = (f.status==='已发布')?'系统':'';
      if(f.hasUnpublished==null) f.hasUnpublished=false;

            fields:JSON.parse(JSON.stringify(f.fields||[])), fc:JSON.parse(JSON.stringify(f.fc))}]
        : [];
    });
    renderFormTable(); renderPalette(); applyFormWidth(); renderCanvas(); renderConfig(); drawConnections(); bindHover();
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(init,120));
  let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(init,150); });
  document.getElementById('left-panel').addEventListener('scroll',()=>requestAnimationFrame(drawConnections));
  document.getElementById('right-panel').addEventListener('scroll',()=>requestAnimationFrame(drawConnections));

    .edge-lbl.warn { border-style:solid; border-color:#ef4444; color:#ef4444; background:#fef2f2; }

    .cfg-sec-h::before { content:""; width:3px; height:13px; background:#165DFF; border-radius:2px; display:inline-block; }
    .cfg-tabs { gap:2px; }
    .cfg-tab { flex:1; padding:8px 6px; font-size:12px; font-weight:600; color:#64748b; border-bottom:2px solid transparent; transition:all .15s; white-space:nowrap; }
    .cfg-tab:hover { color:#165DFF; }
    .cfg-tab.on { color:#165DFF; border-bottom-color:#165DFF; background:rgba(22,93,255,0.04); }

    .status-pill { font-weight:600; }

    .tool-pill { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; border:1px solid #e5e7eb; background:#fff; color:#374151; font-size:12px; font-weight:500; cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:all .15s; }
    .tool-pill:hover { border-color:#165DFF; color:#165DFF; box-shadow:0 2px 6px rgba(22,93,255,.1); }
    .tool-pill.approval { border-left:3px solid #165DFF; }
    .tool-pill.cc { border-left:3px solid #7c5cff; }

    /* 节点复制按钮 */
    .node-copy { position:absolute; top:-9px; left:-9px; width:20px; height:20px; border-radius:50%; background:#fff; border:1px solid #9db8ff; color:#165DFF; font-size:10px; display:none; align-items:center; justify-content:center; z-index:3; }

  function nodeHTML(n, i){
    const sel = n.id===selectedNodeId ? 'sel':'';
    const x = n.x||0, y = n.y||0;
    const style = `position:absolute; left:${x}px; top:${y}px;`;

    const evAttrs = viewOnly ? '' : `onmousedown="startNodeDrag(event,'${n.id}')" onclick="selectNode('${n.id}');event.stopPropagation()"`;

      return `<div id="node-${n.id}" class="node-card node-start ${sel}" style="${style}" ${evAttrs}>${portIn}<i class="fas fa-play mr-1"></i>${n.name}${portOut}</div>`;
    }

    }
    if(n.type==='approval'){
      let who = approverText(n);
      return `<div id="node-${n.id}" class="node-card node-approval ${sel}" style="${style}" ${evAttrs}>
        ${portIn}${copyBtn}${delBtn}
        <div class="flex items-center gap-2 mb-1"><span class="w-6 h-6 rounded bg-[#165DFF]/10 text-[#165DFF] flex items-center justify-center text-xs"><i class="fas fa-check"></i></span><span class="text-sm font-semibold text-gray-800">${n.name}</span></div>

    }

        ${portIn}${copyBtn}${delBtn}

        <div class="text-xs text-gray-500"><i class="fas fa-users mr-1"></i>${who}</div>${portOut}</div>`;
    }
    return '';
  }

  function approverText(n){
    switch(n.approverType){
      case 'initiator': return '发起人本人';
      case 'initiator_manager': return '发起人直属主管';
      case 'manager_level': return '第 '+n.level+' 级主管';
      case 'member': return n.members.length? (n.members.length>3? '已选 '+n.members.length+' 人' : n.members.join('、')) : '未指定成员';
      case 'role': return (n.roles.join('、')||'未指定角色')+'（角色）';
      case 'dept_head': return (n.depts.join('、')||'未指定部门')+' 主管';
      case 'field': return '表单字段：'+(n.fieldRef||'未选择');
      case 'post': return '指定岗位：'+(n.posts.join('、')||'未选择岗位');
    }
    return '未配置';
  }
  function modeText(m){ return m==='and'?'会签（全部通过）':m==='seq'?'依次审批':'或签（一人通过）'; }

  /* ===================== 手动连线：从 out 端口拖到 in 端口 ===================== */
  function startConnect(e,nid,kind){
    if(kind==='in') return; // 只能从下连到上
    e.preventDefault(); e.stopPropagation();
    const f=currentFlow();
    drawingEdge={ from:nid, startX:e.clientX, startY:e.clientY };
    document.addEventListener('mousemove', drawTempEdge);
    document.addEventListener('mouseup', endConnect);
  }
  function drawTempEdge(ev){
    if(!drawingEdge) return;
    const svg=g('edgesSvg');
    // 清掉旧的临时线
    let tmp=svg.querySelector('#tempEdge'); if(tmp) tmp.remove();
    const canvas=g('flowCanvas'); const cr=canvas.getBoundingClientRect();
    const fromEl=g('node-'+drawingEdge.from); if(!fromEl) return;
    const ar=fromEl.getBoundingClientRect();
    const sx=ar.left+ar.width/2-cr.left, sy=ar.bottom-cr.top;
    const tx=ev.clientX-cr.left, ty=ev.clientY-cr.top;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    const d=`M ${sx} ${sy} C ${sx} ${sy+60}, ${tx} ${ty-60}, ${tx} ${ty}`;
    path.setAttribute('d',d); path.setAttribute('id','tempEdge'); path.setAttribute('stroke','#165DFF'); path.setAttribute('stroke-width','2'); path.setAttribute('stroke-dasharray','5,3'); path.setAttribute('fill','none'); svg.appendChild(path);
  }
  function endConnect(ev){
    document.removeEventListener('mousemove', drawTempEdge);
    document.removeEventListener('mouseup', endConnect);
    const tmp=g('edgesSvg').querySelector('#tempEdge'); if(tmp) tmp.remove();
    if(!drawingEdge) return;
    // 查找落点是否在 in 端口上
    const t=ev.target;
    if(t.classList && t.classList.contains('port') && t.classList.contains('in')){
      const toId=t.getAttribute('data-nid');
      if(toId && toId!==drawingEdge.from){
        const f=currentFlow();
        // 避免重复连接或自连
        const exists=f.edges.some(e=>e.from===drawingEdge.from && e.to===toId);
        const fromNode=f.nodes.find(x=>x.id===drawingEdge.from);
        const toNode=f.nodes.find(x=>x.id===toId);
        if(fromNode && fromNode.type==='cc' && (!toNode || toNode.type!=='end')){
          alert('抄送节点为流程终止节点，其后只能连接「流程结束」节点。');
        } else if(!exists){
          f.edges.push({ id:'e_'+Date.now(), from:drawingEdge.from, to:toId, mode:'always', logic:'and', conditions:[] });
          selectedEdgeId=f.edges[f.edges.length-1].id; selectedNodeId=null;
          renderCanvas(); renderConfig();
        }
      }
    }
    drawingEdge=null;
  }

  /* ===================== 节点拖动 ===================== */
  function startNodeDrag(e, id){
    if(e.button!==0) return;

    e.preventDefault();
    const f=currentFlow(); const n=f.nodes.find(x=>x.id===id); if(!n) return;
    const canvas=g('flowCanvas');
    const startX=e.clientX, startY=e.clientY, ox=n.x||0, oy=n.y||0;
    const el=g('node-'+id); if(el) el.classList.add('node-dragging');
    selectNode(id);
    function mv(ev){
      let nx = ox + (ev.clientX-startX);
      let ny = oy + (ev.clientY-startY);
      nx=Math.max(0,Math.min(nx, canvas.clientWidth-210));
      ny=Math.max(0,Math.min(ny, canvas.clientHeight-90));
      n.x=nx; n.y=ny;
      const el=g('node-'+id); if(el){ el.style.left=nx+'px'; el.style.top=ny+'px'; }
      drawNodeEdges();
    }
    function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); const el=g('node-'+id); if(el) el.classList.remove('node-dragging'); }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  }
  function startBendDrag(e, eid){
    e.preventDefault(); e.stopPropagation();
    const f=currentFlow(); const ed=f.edges.find(x=>x.id===eid); if(!ed) return;
    const canvas=g('flowCanvas');
    function mv(ev){ const cr=canvas.getBoundingClientRect(); ed.bend={x:ev.clientX-cr.left, y:ev.clientY-cr.top}; drawNodeEdges(); }
    function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  }

  /* ===================== SVG 连线绘制 ===================== */
  const SVGNS='http://www.w3.org/2000/svg';
  function cubicPoint(x0,y0,x1,y1,x2,y2,x3,y3,t){
    const mt=1-t;
    const a=mt*mt*mt, b=3*mt*mt*t, c=3*mt*t*t, d=t*t*t;
    return { x:a*x0+b*x1+c*x2+d*x3, y:a*y0+b*y1+c*y2+d*y3 };
  }
  function drawNodeEdges(){
    const svg=g('edgesSvg'); if(!svg) return;
    const f=snapshotOfView() || currentFlow(); if(!f) return;
    // 保留临时线
    const tmp=svg.querySelector('#tempEdge');
    svg.innerHTML='';
    if(tmp) svg.appendChild(tmp);
    const canvas=g('flowCanvas'); const cr=canvas.getBoundingClientRect();
    f.edges.forEach(e=>{
      const a=g('node-'+e.from), b=g('node-'+e.to); if(!a||!b) return;
      const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
      const sx=ar.left+ar.width/2-cr.left, sy=ar.bottom-cr.top;
      const tx=br.left+br.width/2-cr.left, ty=br.top-cr.top;
      let c1x=sx, c1y=sy+70, c2x=tx, c2y=ty-70;
      if(e.bend){ c1x=e.bend.x;c1y=e.bend.y;c2x=e.bend.x;c2y=e.bend.y; }
      const d=`M ${sx} ${sy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tx} ${ty}`;
      const hit=document.createElementNS(SVGNS,'path'); hit.setAttribute('d',d); hit.setAttribute('class','edge-hit'); hit.setAttribute('data-eid',e.id); hit.onclick=(ev)=>{ev.stopPropagation(); selectEdge(e.id);}; svg.appendChild(hit);
      const p=document.createElementNS(SVGNS,'path'); p.setAttribute('d',d); p.setAttribute('class','edge-path'+(e.id===selectedEdgeId?' sel':'')+(e.mode==='else'?' else':'')); svg.appendChild(p);
      // 箭头
      const arrow=document.createElementNS(SVGNS,'polygon');
      const ang=Math.atan2(ty-c2y, tx-c2x);
      const arrLen=8;
      const ax1=tx-arrLen*Math.cos(ang-Math.PI/6), ay1=ty-arrLen*Math.sin(ang-Math.PI/6);
      const ax2=tx-arrLen*Math.cos(ang+Math.PI/6), ay2=ty-arrLen*Math.sin(ang+Math.PI/6);
      arrow.setAttribute('points',`${tx},${ty} ${ax1},${ay1} ${ax2},${ay2}`);
      arrow.setAttribute('fill', e.mode==='else'?'#7c5cff':'#165DFF');
      arrow.setAttribute('opacity', e.id===selectedEdgeId?'1':'.6');
      svg.appendChild(arrow);
      // 中点控制点
      if(e.id===selectedEdgeId || e.mode==='else' || e.mode==='condition'){
        const mid=cubicPoint(sx,sy,c1x,c1y,c2x,c2y,tx,ty,0.5);
        const h=document.createElementNS(SVGNS,'circle'); h.setAttribute('cx',mid.x);h.setAttribute('cy',mid.y);h.setAttribute('r',5);h.setAttribute('class','edge-bend');h.setAttribute('data-eid',e.id);h.onmousedown=(ev)=>{ev.stopPropagation();startBendDrag(ev,e.id);}; svg.appendChild(h);
      }
      const mid=cubicPoint(sx,sy,c1x,c1y,c2x,c2y,tx,ty,0.5); e._mx=mid.x; e._my=mid.y;
    });
    f.edges.forEach(e=>{
      const lb=g('elabel-'+e.id); if(lb && e._mx!=null){ lb.style.left=e._mx+'px'; lb.style.top=e._my+'px'; }
    });
  }
  function edgeLabelHTML(e){

    names.forEach(nm=>{ if(checked) pickerDeptSel.add(nm); else pickerDeptSel.delete(nm); });
    renderDeptPicker();
  }
  function toggleDeptSelByName(nm){ if(pickerDeptSel.has(nm)) pickerDeptSel.delete(nm); else pickerDeptSel.add(nm); renderDeptPicker(); }
  function deptTreeNode(dept, path, depth){
    const allSub = deptAllSubNames(dept);
    const selAll = allSub.length && allSub.every(d=>pickerDeptSel.has(d));
    const someSel = allSub.some(d=>pickerDeptSel.has(d)) && !selAll;
    const expanded = deptExpand[path]!==false;
    const caret = (dept.children&&dept.children.length) ? `<i class="fas ${expanded?'fa-chevron-down':'fa-chevron-right'} text-gray-400 text-[10px] w-3 cursor-pointer" onclick="toggleDeptExpand('${path}')"></i>` : `<span class="w-3 inline-block"></span>`;
    let h = `<div class="org-dept">
      <div class="org-dept-head flex items-center gap-2 py-1.5 px-2 rounded hover:bg-gray-50">
        ${caret}
        <input type="checkbox" class="org-cb" ${selAll?'checked':''} ${someSel?'data-indet="1"':''} onchange="toggleDeptSel('${path}',this.checked)">
        <span class="text-sm font-medium text-gray-700 flex-1 cursor-pointer" onclick="toggleDeptExpand('${path}')">${dept.name} <span class="text-[11px] text-gray-400">(${allSub.length})</span></span>
      </div>`;
    if(expanded && dept.children && dept.children.length){
      let inner='';
      dept.children.forEach(c=> inner+=deptTreeNode(c, path+'/'+c.name, depth+1));
      h += `<div class="org-dept-children">${inner}</div>`;
    }
    h += `</div>`;
    return h;
  }

      g('configBody').innerHTML = `

  function fieldPermMatrix(f,n){
    const fields=FORM_FIELDS(f.formId);
    if(!fields.length) return '<div class="cfg-logic">（当前表单无字段）</div>';
    const seg=(name,val)=>`<div class="inline-flex rounded-md overflow-hidden border border-gray-200 text-[11px]">`+[['edit','可编辑'],['read','只读'],['hide','隐藏']].map(o=>`<button onclick="setFieldPerm('${name}','${o[0]}')" class="px-2 py-1 ${val===o[0]?'bg-[#165DFF] text-white':'bg-white text-gray-500 hover:bg-gray-50'} btn-click">${o[1]}</button>`).join('')+`</div>`;
    const rows=fields.map(fl=>{
      const v=n.fieldPerm[fl.fieldName]||'edit';
      return `<tr class="border-b border-gray-100"><td class="py-1.5 pr-2 text-xs text-gray-700">${fl.label}</td><td class="py-1.5 text-right">${seg(fl.fieldName, v)}</td></tr>`;
    }).join('');
    return `
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] text-gray-500">字段权限（审批人本节点可见/可改范围）</span>
        <select onchange="bulkFieldPerm(this.value)" class="text-[11px] border border-gray-300 rounded px-1.5 py-1 text-gray-600">
          <option value="">批量设置…</option><option value="edit">全部可编辑</option><option value="read">全部只读</option><option value="hide">全部隐藏</option>
        </select>
      </div>
      <div class="border border-gray-100 rounded-lg overflow-hidden">
        <table class="w-full"><tbody>${rows}</tbody></table>
      </div>
      <div class="cfg-logic mt-2"><i class="fas fa-info-circle mr-1"></i><b>可编辑</b>可改、<b>只读</b>仅看、<b>隐藏</b>不可见。常用于让主管看全部但只能改特定字段；批量设置可快速统一，再个别调整。</div>`;
  }
  function setFieldPerm(name, val){
    const f=currentFlow(); if(!f) return; const n=f.nodes.find(x=>x.id===selectedNodeId);
    if(n){ n.fieldPerm[name]=val; renderConfig(); }
  }
  function bulkFieldPerm(v){
    const f=currentFlow(); if(!f||!v) return; const n=f.nodes.find(x=>x.id===selectedNodeId);
    if(n){ FORM_FIELDS(f.formId).forEach(fl=>n.fieldPerm[fl.fieldName]=v); renderConfig(); }

      ${row('节点名称', `<input id="n_name" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" ${inp(n.name)}>`, '抄送节点名称，如「通知HR」。')}`;
    const tabs = tabsHTML(cfgTab, [['base','抄送设置'],['perm','字段权限']]);
    let body='';

      body = fieldPermMatrix(f,n);
    } else {
      body = `
        ${row('抄送人类型', select('n_ctype',[['member','指定成员'],['role','指定角色'],['dept','指定部门'],['post','指定岗位']], n.ccType), '被抄送人仅接收知会，不参与审批、不影响流转。')}
        ${n.ccType==='member'?memberPickerBlock(n, '指定成员', 'members'):''}
        ${n.ccType==='role'?rolePickerBlock(n, '指定角色', 'roles'):''}
        ${n.ccType==='dept'?deptPickerBlock(n, '指定部门', 'depts'):''}
        ${n.ccType==='post'?postPickerBlock(n, '指定岗位', 'posts'):''}
        ${info('抄送人类型决定「抄送给谁」；在「字段权限」中配置抄送人可见/可改的字段范围。')}`;
    }
    g('configBody').innerHTML = head + tabs + body;
    bindCommon(n); bindCC(n);
  }

  /* ---- 结束节点 ---- */
  function renderEnd(f,n){
    g('configBody').innerHTML = `
      <div class="flex items-center gap-2 mb-3"><span class="w-6 h-6 rounded bg-[#00B42A] text-white flex items-center justify-center text-xs"><i class="fas fa-flag-checkered"></i></span><h3 class="text-sm font-bold text-gray-800">结束节点</h3></div>
      ${row('节点名称', `<input id="n_name" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" ${inp(n.name)}>`, '流程终点名称。')}
      ${row('结束动作', select('n_end',[['archive','归档'],['notify','通知发起人'],['webhook','触发Webhook']], n.endAction), '流程正常结束后的系统动作：归档留痕、或通知发起人、或回调外部系统。')}
      ${n.endAction==='webhook'?`
        ${row('回调地址', `<input id="n_webhook" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm" placeholder="https://" ${inp(n.webhook)}>`, '流程结束时系统向该地址发送单据数据（回调目标）。')}
        ${row('请求方式', select('n_wmethod',[['POST','POST'],['GET','GET']], n.webhookMethod), '调用回调地址使用的 HTTP 方法，默认 POST 携带 JSON 数据。')}
        ${row('请求头（JSON）', `<textarea id="n_wheaders" rows="2" class="form-input w-full border border-gray-300 rounded-md px-2.5 py-1.5 text-sm resize-none font-mono" placeholder='如 {"Authorization":"Bearer xxx"}'>${n.webhookHeaders||''}</textarea>`, '可选：自定义请求头，用于鉴权或指定 Content-Type。')}
        ${info('流程结束归档时触发回调，发送单据数据至上述地址；失败自动重试 3 次。')}
      `:''}
      ${info('结束节点表示审批链路完成，实例进入「已结束」终态，不再流转。')}`;

  function bindEnd(n){

    const wh=g('n_webhook'); if(wh) wh.oninput=e=>{ n.webhook=e.target.value; };

    const whd=g('n_wheaders'); if(whd) whd.oninput=e=>{ n.webhookHeaders=e.target.value; };
  }

  /* ===================== 配置事件绑定 ===================== */

  function bindFlowConfig(){

  /* ---- 依次审批顺序 ---- */
  function seqKeyOf(type){ return ({member:'members',role:'roles',post:'posts',dept_head:'depts'})[type]||null; }
  function seqBlock(n){
    const key=seqKeyOf(n.approverType);
    if(!key) return info('当前审批人来源为单审批对象，无需设置顺序；依次审批自动按所选审批人逐个处理。');
    const arr=n[key]||[];
    if(!arr.length) return info('尚未选择审批人，请先在上方指定审批人，再设置依次审批顺序。');
    if(arr.length<2) return row('审批顺序', '<div class="cfg-logic">当前仅 1 个审批人，无需排序。</div>', '');
    const rows=arr.map((it,i)=>`<div class="flex items-center gap-2 mb-1">
      <span class="w-5 h-5 rounded-full bg-[#165DFF]/10 text-[#165DFF] text-[11px] flex items-center justify-center font-semibold">${i+1}</span>
      <span class="flex-1 text-xs text-gray-700">${esc(it)}</span>
      <button onclick="moveSeq(${i},-1)" ${i===0?'disabled':''} class="w-6 h-6 text-gray-400 hover:text-[#165DFF] btn-click ${i===0?'opacity-30':''}"><i class="fas fa-chevron-up"></i></button>
      <button onclick="moveSeq(${i},1)" ${i===arr.length-1?'disabled':''} class="w-6 h-6 text-gray-400 hover:text-[#165DFF] btn-click ${i===arr.length-1?'opacity-30':''}"><i class="fas fa-chevron-down"></i></button>
    </div>`).join('');
    return row('审批顺序', rows, '依次审批将按下述顺序逐个审批，可通过上下箭头调整顺序。');
  }
  function moveSeq(i,dir){
    const f=currentFlow(); const n=f.nodes.find(x=>x.id===selectedNodeId); if(!n) return;
    const key=seqKeyOf(n.approverType); if(!key) return;
    const arr=n[key]||[]; const j=i+dir; if(j<0||j>=arr.length) return;
    const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    renderConfig();
  }

  function bindCC(n){
    const ct=g('n_ctype'); if(ct) ct.onchange=e=>{ n.ccType=e.target.value; renderConfig(); };
  }
  function bindConfig(){ /* 分派由各 render 调用具体 bind */ }

  /* ===================== 流转条件（参考图：自定义条件 / else） ===================== */
  const OPS=[['eq','等于'],['ne','不等于'],['gt','大于'],['lt','小于'],['gte','大于等于'],['lte','小于等于'],['contains','包含'],['empty','为空'],['notempty','不为空']];
  function condSummaryOf(c){
    const fs=FORM_FIELDS(currentFlow().formId);
    const label=x=>{ const f=fs.find(y=>y.fieldName===x); return f?f.label:x; };
    const opT=o=>{ const m=OPS.find(y=>y[0]===o); return m?m[1]:o; };
    return c.conditions.map(cd=>`${label(cd.field)}${opT(cd.op)}${cd.val||''}`).join(c.logic==='and'?'且':'或');
  }

  function renderEdgeConfig(f){
    const eid=selectedEdgeId; const e=getEdge(eid); if(!e) return;
    const src=f.nodes.find(x=>x.id===e.from), tgt=f.nodes.find(x=>x.id===e.to);
    const outs=getOutgoing(e.from);
    const hasElseElsewhere = outs.some(o=>o.id!==e.id && o.mode==='else');
    const h = `
      <div class="flex items-center gap-2 mb-3"><i class="fas fa-share text-[#165DFF]"></i><h3 class="text-sm font-bold text-gray-800">节点连接线</h3></div>
      <div class="mb-3 text-[11px] text-gray-500"><b>${src?src.name:'?'}</b> → <b>${tgt?tgt.name:'?'}</b></div>
      <div class="cfg-sec" style="margin-top:0;border-top:none;padding-top:0">
        <div class="cfg-sec-h">数据流转条件</div>
        ${row('条件模式', select('edge_mode',[
          ['condition','使用自定义流转条件'],
          ['else','使用 else 条件']
        ], e.mode), '自定义流转条件：满足下方条件的数据才进入这条连接线下的节点；else 条件：当同源其他线的条件都不满足时走此线（兜底）。每一条连接线均需配置流转条件或设为 else。')}
        <div class="cfg-logic mb-3"><i class="fas fa-info-circle mr-1"></i>${e.mode==='else'?'当其他分支条件都不满足时，数据会走这一条 else 连线。':'添加后，满足流转条件的数据，才会进入这条连接线下的节点。'}</div>
        ${e.mode==='condition'?`
          <div class="mb-2 text-xs text-gray-600">符合以下 ${select('edge_logic',[['and','所有'],['or','任一']], e.logic)} 流转条件的数据</div>
          ${e.conditions.length?e.conditions.map((cd,i)=>edgeRowHTML(cd,i)).join(''):'<div class="cfg-logic">尚未添加条件，可点击下方按钮新增。</div>'}
          <button onclick="edgeAddRow()" class="mt-2 text-[#165DFF] text-xs btn-click"><i class="fas fa-plus mr-1"></i>添加流转条件</button>
          <div class="cfg-info mt-2">${edgePreview()}</div>
        `:''}
        ${e.mode==='else'?`<div class="cfg-info"><i class="fas fa-code-branch mr-1"></i>本分支为 <b>else 默认分支</b>：当「${src?src.name:''}」的其他流出分支条件都不满足时自动走此线，无需配置条件。</div>`:''}
      </div>`;
    g('configBody').innerHTML=h;
    bindEdgeConfig(e);
  }
  function edgeRowHTML(cd,i){
    const fields=FORM_FIELDS(currentFlow().formId);
    const fopts = fields.length? fields.map(fl=>`<option value="${fl.fieldName}" ${cd.field===fl.fieldName?'selected':''}>${fl.label}</option>`).join('') : '<option value="">（无字段）</option>';
    const oopts = OPS.map(o=>`<option value="${o[0]}" ${cd.op===o[0]?'selected':''}>${o[1]}</option>`).join('');
    const hide = (cd.op==='empty'||cd.op==='notempty');
    return `<div class="flex items-center gap-1.5 mb-2">
      <select onchange="updEdgeCond(${i},'field',this.value)" class="form-input border border-gray-300 rounded px-2 py-1 text-xs flex-1">${fopts}</select>
      <select onchange="updEdgeCond(${i},'op',this.value)" class="form-input border border-gray-300 rounded px-2 py-1 text-xs w-24">${oopts}</select>
      <input oninput="updEdgeCond(${i},'val',this.value)" value="${cd.val||''}" ${hide?'disabled':''} class="form-input border border-gray-300 rounded px-2 py-1 text-xs w-20" placeholder="值">
      <button onclick="edgeDelRow(${i})" class="text-gray-400 hover:text-red-500 btn-click"><i class="fas fa-times"></i></button>
    </div>`;
  }
  function edgeAddRow(){ const e=getEdge(selectedEdgeId); e.conditions.push({field:'',op:'eq',val:''}); renderEdgeConfig(currentFlow()); }
  function edgeDelRow(i){ const e=getEdge(selectedEdgeId); e.conditions.splice(i,1); renderEdgeConfig(currentFlow()); }
  function updEdgeCond(i,key,val){ const e=getEdge(selectedEdgeId); e.conditions[i][key]=val; if(key==='op'){ renderEdgeConfig(currentFlow()); } else { const p=g('configBody').querySelector('.cfg-info'); if(p) p.innerHTML=edgePreview(); } }
  function edgePreview(){
    const e=getEdge(selectedEdgeId); if(!e||!e.conditions.length) return '（未配置条件，默认直接流转）';
    const fs=FORM_FIELDS(currentFlow().formId);
    const label=x=>{ const f=fs.find(y=>y.fieldName===x); return f?f.label:x; };
    const opT=o=>{ const m=OPS.find(y=>y[0]===o); return m?m[1]:o; };
    const parts=e.conditions.map(cd=>`${label(cd.field)} ${opT(cd.op)} ${cd.val||'?'}`);
    return (e.logic==='and'?'且：':'或：') + parts.join(e.logic==='and'?' ， ':' 或 ');
  }
  function edgeApply(){ renderCanvas(); }
  function edgeClear(){ const e=getEdge(selectedEdgeId); if(e){ e.mode='always'; e.logic='and'; e.conditions=[]; renderEdgeConfig(currentFlow()); renderCanvas(); } }
  function delEdge(eid){
    const f=currentFlow(); const e=getEdge(eid); if(!e) return;
    f.edges=f.edges.filter(x=>x.id!==eid);
    selectedEdgeId=null; renderCanvas(); renderConfig();
  }
  function bindEdgeConfig(e){
    const el=getEdge(selectedEdgeId);
    const m=g('edge_mode'); if(m) m.onchange=()=>{
      const val=g('edge_mode').value;
      if(val==='else'){
        // 取消其他同源线的 else
        getOutgoing(el.from).forEach(o=>{ if(o.id!==el.id && o.mode==='else') o.mode='always'; });
      }
      el.mode=val;
      renderEdgeConfig(currentFlow()); renderCanvas();
    };
    const l=g('edge_logic'); if(l) l.onchange=()=>{ el.logic=g('edge_logic').value; renderEdgeConfig(currentFlow()); };
  }

  /* 键盘 Delete 删除选中的连线 */
  document.addEventListener('keydown', e=>{
    if((e.key==='Delete' || e.key==='Backspace') && selectedEdgeId){ delEdge(selectedEdgeId); }
  });

  /* ===================== 顶部 & 保存/发布 ===================== */
  function statusInfo(f){
    if(f.status==='已发布') return f.hasUnpublished
      ? { label:'待发布', cls:'px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700' }
      : { label:'已发布', cls:'px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-600' };
    return { label:(f.version>0?'草稿（已下架）':'草稿'), cls:'px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700' };
  }
  function updateHeader(){
    const f=currentFlow(); if(!f) return;
    const pill=g('statusPill'), vp=g('versionPill'), pub=g('publishBtn'), unp=g('unpublishBtn'), banner=g('stateBanner');
    const si=statusInfo(f);
    pill.textContent=si.label; pill.className='status-pill '+si.cls;
    vp.textContent='v'+f.version;
    const published=f.status==='已发布';
    pub.classList.toggle('hidden', published && !f.hasUnpublished);
    unp.classList.toggle('hidden', !published);
    pub.innerHTML = (published && f.hasUnpublished) ? '<i class="fas fa-rocket mr-1"></i>发布新版本' : '<i class="fas fa-rocket mr-1"></i>发布';
    if(published && f.hasUnpublished){
      banner.style.display='flex'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-amber-50 text-amber-700';
      banner.innerHTML='<i class="fas fa-exclamation-triangle"></i> 本流程已发布（线上 <b>v'+f.version+'</b>），当前为<b>待发布修改</b>。点击「发布」生成 <b>v'+(f.version+1)+'</b> 并生效，在途单据不受影响。';
    } else if(!published && f.version>0){
      banner.style.display='flex'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-gray-50 text-gray-600';
      banner.innerHTML='<i class="fas fa-eye-slash"></i> 流程已下架，当前为<b>草稿</b>，不再接收发起；历史数据（v1…v'+f.version+'）保留可查。点击「发布」可重新上线为新版本。';
    } else { banner.style.display='none'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200'; banner.innerHTML=''; }
  }
  function saveFlow(){
    const f=currentFlow(); if(!f) return;
    if(f.status!=='已发布'){ f.status='草稿'; if(f.version===0) f.version=0; }
    else { f.hasUnpublished=true; }
    f.publishedAt=f.publishedAt||'—';
    updateHeader(); renderFlowTable();
    alert('已保存流程「'+f.name+'」\n共 '+f.nodes.length+' 个节点（演示）');
  }
  function snapshotOf(f){
    return { v:f.version, publishedAt:f.publishedAt, publishedBy:f.publishedBy, name:f.name, desc:f.desc, icon:f.icon, formId:f.formId,
      category:f.category,
      allowRecall:f.allowRecall, recallHours:f.recallHours, recallUnit:f.recallUnit,
      nodes:JSON.parse(JSON.stringify(f.nodes)), edges:JSON.parse(JSON.stringify(f.edges)) };
  }
  function publishFlow(){
    const f=currentFlow(); if(!f) return;
    const maxV=(f.versions&&f.versions.length)?Math.max.apply(null, f.versions.map(s=>s.v)):(f.version||0);
    if(!confirm('确认发布流程「'+f.name+'」？\n将生成 v'+(maxV+1)+' 并作为线上锁定版本。')) return;
    f.version=maxV+1; f.status='已发布'; f.hasUnpublished=false; f.publishedAt=new Date().toISOString().slice(0,10); f.publishedBy='产品同学';
    if(!f.versions) f.versions=[];
    f.versions.push(snapshotOf(f));
    updateHeader(); renderFlowTable(); renderCanvas();
    alert('已发布：'+f.name+' v'+f.version+'（线上锁定版本生效）');
  }
  function unpublishFlow(id){
    const f = id?FLOWS.find(x=>x.id===id):currentFlow(); if(!f) return;
    if(!confirm('确认下架流程「'+f.name+'」？\n下架后停止接收发起，历史数据保留。')) return;
    f.status='草稿'; f.hasUnpublished=false;
    if(currentFlowId===f.id) updateHeader();
    renderFlowTable();
  }
  function quickPublish(id){ const f=FLOWS.find(x=>x.id===id); if(!f) return; currentFlowId=id; publishFlow(); }
  function copyFlow(id){
    const f=FLOWS.find(x=>x.id===id); if(!f) return;
    const idMap={};
    const newNodes=f.nodes.map(n=>{ const c=JSON.parse(JSON.stringify(n)); const nid='n_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); idMap[n.id]=nid; c.id=nid; return c; });
    const newEdges=f.edges.map(e=>{ const c=JSON.parse(JSON.stringify(e)); c.id='e_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); c.from=idMap[e.from]; c.to=idMap[e.to]; c.bend=undefined; return c; });
    const nf=JSON.parse(JSON.stringify(f));
    nf.id='p_'+Date.now(); nf.name=f.name+' 副本'; nf.status='草稿'; nf.version=0; nf.hasUnpublished=false; nf.publishedAt='—'; nf.versions=[]; nf.nodes=newNodes; nf.edges=newEdges;
    FLOWS.push(nf); renderFlowTable();
  }

  /* ===================== 版本历史 ===================== */
  function showVersions(){
    const f=currentFlow(); if(!f) return;
    const vers=(f.versions&&f.versions.length)?f.versions.slice().sort((a,b)=>b.v-a.v):[];
    let list=vers.map(s=>{
      const cur = s.v===f.version && f.status==='已发布';
      return `<div class="flex items-center gap-3 p-3 border rounded-lg ${cur?'border-[#165DFF] bg-blue-50':'border-gray-200'}">
        <span class="px-2 py-0.5 rounded-full text-xs font-medium ${cur?'bg-[#165DFF] text-white':'bg-gray-100 text-gray-500'}">v${s.v}</span>
        <div class="flex-1 min-w-0"><div class="text-sm text-gray-800">${cur?'线上版本（当前生效）':'历史版本'}</div><div class="text-xs text-gray-400">${s.publishedBy||'系统'} · ${s.publishedAt||'—'} · ${s.nodes?s.nodes.length:0} 个节点</div></div>
        ${cur?'<span class="text-xs text-[#165DFF]"><i class="fas fa-lock mr-1"></i>已锁定</span>':
          `<button onclick="viewVersion(${s.v})" class="px-3 py-1 rounded-md text-xs btn-click border border-gray-300 text-gray-600 hover:border-[#165DFF] hover:text-[#165DFF]"><i class="fas fa-eye mr-1"></i>查看</button>
           <button onclick="restoreVersion(${s.v})" class="px-3 py-1 rounded-md text-xs btn-click border border-[#165DFF] text-[#165DFF] hover:bg-blue-50"><i class="fas fa-rotate-left mr-1"></i>恢复并发布</button>`}
      </div>`;
    }).join('');
    if(!vers.length) list='<div class="text-xs text-gray-400 p-2">尚未发布，暂无版本记录。</div>';
    g('versionList').innerHTML=list;
    openModal('versionsModal');
  }
  function viewVersion(v){
    const f=currentFlow(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.v===v); if(!s) return;
    // 直接把画布切换为该历史版本的节点结构（只读）
    viewingVersion=v; selectedNodeId=null; selectedEdgeId=null;
    closeModal('versionsModal');
    const banner=g('stateBanner');
    banner.style.display='flex'; banner.className='px-5 py-2 text-xs flex items-center gap-2 border-b border-gray-200 bg-blue-50 text-blue-700';
    banner.innerHTML='<i class="fas fa-eye"></i> 正在查看历史版本 <b>v'+v+'</b>（只读 · '+(s.publishedBy||'系统')+' · '+(s.publishedAt||'—')+'）<button onclick="exitVersionView()" class="ml-auto px-2.5 py-1 rounded-md text-[11px] font-medium bg-[#165DFF] text-white hover:bg-blue-600 btn-click">返回编辑</button>';
    renderCanvas(); renderConfig();
  }
  function exitVersionView(){
    viewingVersion=null; selectedNodeId=null; selectedEdgeId=null;
    renderCanvas(); renderConfig(); updateHeader();
  }
  function restoreVersion(v){
    const f=currentFlow(); if(!f) return;
    const s=(f.versions||[]).find(x=>x.v===v); if(!s) return;
    if(!confirm('确认恢复历史版本 v'+v+'？\n将把当前流程内容替换为该版本内容并重新发布，版本号保持 v'+v+'，不生成新版本。')) return;
    f.name=s.name; f.desc=s.desc; f.icon=s.icon; f.formId=s.formId; f.category=s.category||'';
    f.allowRecall=s.allowRecall; f.recallHours=s.recallHours; f.recallUnit=s.recallUnit;
    f.nodes=JSON.parse(JSON.stringify(s.nodes)); f.edges=JSON.parse(JSON.stringify(s.edges));
    f.version=v; f.status='已发布'; f.hasUnpublished=false;
    f.publishedAt=s.publishedAt; f.publishedBy=s.publishedBy;
    selectedNodeId=null; selectedEdgeId=null;
    closeModal('versionsModal');
    updateHeader(); renderFlowTable(); renderCanvas(); renderConfig();
    alert('已恢复历史版本 v'+v+' 并重新发布（版本号保持 v'+v+'，不新增版本号）');
  }

  /* ===================== 模态框 ===================== */
  function openModal(id){ g(id).classList.remove('modal-hidden'); }
  function closeModal(id){ g(id).classList.add('modal-hidden'); }
  document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.add('modal-hidden'); }));

  /* ===================== 逻辑说明高亮连线 ===================== */
  const svg0=document.getElementById('connections');
  function drawConnections(){
    svg0.innerHTML='';
    document.querySelectorAll('.proto-element[data-proto-id]').forEach(leftEl=>{
      const pid=leftEl.getAttribute('data-proto-id');
      const rightEl=document.querySelector('.proto-desc[data-proto-id="'+pid+'"]'); if(!rightEl) return;
      const lr=leftEl.getBoundingClientRect(), rr=rightEl.getBoundingClientRect(), sr=svg0.getBoundingClientRect();
      if(lr.width===0||rr.width===0) return;
      const x1=lr.right-sr.left, y1=lr.top+lr.height/2-sr.top;
      const x2=rr.left-sr.left, y2=rr.top+rr.height/2-sr.top;
      const cx=x1+(x2-x1)*0.5;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`);
      p.setAttribute('class','connection-line'); p.setAttribute('data-proto-id',pid); svg0.appendChild(p);
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
      bg.setAttribute('cx',mx); bg.setAttribute('cy',my); bg.setAttribute('r',11); bg.setAttribute('class','connection-label-bg'); svg0.appendChild(bg);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',mx); t.setAttribute('y',my); t.setAttribute('dy','0.05em'); t.setAttribute('class','connection-label'); t.textContent=pid; svg0.appendChild(t);
    });
  }
  function highlight(pid,active){
    document.querySelectorAll('.connection-line[data-proto-id="'+pid+'"]').forEach(p=>p.classList.toggle('active',active));
    const l=document.querySelector('.proto-element[data-proto-id="'+pid+'"]'); if(l) l.classList.toggle('active-highlight',active);
    const r=document.querySelector('.proto-desc[data-proto-id="'+pid+'"]'); if(r) r.classList.toggle('active-highlight',active);
  }
  function bindHover(){
    document.querySelectorAll('.proto-element[data-proto-id]').forEach(el=>{ const p=el.getAttribute('data-proto-id'); el.addEventListener('mouseenter',()=>highlight(p,true)); el.addEventListener('mouseleave',()=>highlight(p,false)); });
    document.querySelectorAll('.proto-desc[data-proto-id]').forEach(el=>{ const p=el.getAttribute('data-proto-id'); el.addEventListener('mouseenter',()=>highlight(p,true)); el.addEventListener('mouseleave',()=>highlight(p,false)); });
  }

  /* ===================== 移动端 ===================== */
  let mobileShowDesc=false;
  function toggleMobileView(){ mobileShowDesc=!mobileShowDesc; const lp=g('left-panel'),rp=g('right-panel'),b=g('mobileToggle'); if(mobileShowDesc){ lp.style.display='none'; rp.style.height='100vh'; b.innerHTML='<i class="fas fa-desktop"></i>'; } else { lp.style.display=''; rp.style.height=''; b.innerHTML='<i class="fas fa-info"></i>'; } }

  /* ===================== 初始化 ===================== */
  function init(){
    orgInitExpand();
    renderFlowTable(); renderCanvas();
    drawConnections(); bindHover();
    document.getElementById('left-panel').addEventListener('scroll',()=>requestAnimationFrame(drawConnections));
    document.getElementById('right-panel').addEventListener('scroll',()=>requestAnimationFrame(drawConnections));
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(init,100));
  let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ drawConnections(); drawNodeEdges(); },150); });
  ___SCEND___
</body>
</html>

</script>

<script>
/* ===================== 数据模型 ===================== */

/* ===================== 工具函数 ===================== */

function roleById(id){for(const g of ROLE_GROUPS){const r=g.roles.find(x=>x.id===id);if(r)return r;}return null;}

/* ===================== 全局状态 ===================== */

/* ===================== 模块一：应用中心 ===================== */

    <div class="grid grid-cols-2 gap-4">
      ${APPS.map(a=>`<div class="card p-4 cursor-pointer hover:shadow-md" onclick="openApp('${a.id}')">
        <div class="flex items-center gap-3 mb-2">

function renderAppMenuTab(a){

function addMenuGroup(parentId){

  if(parentId){ const p=findMenu(a,parentId); if(!p)return; p.children=p.children||[]; p.children.push(node); }

function menuTree(a,menus){
  if(!menus.length) return '<div class="text-[12px] text-gray-400 py-2">暂无菜单，点击「添加菜单」挂载。</div>';

      return `<div class="tree-node" draggable="true" ondragstart="dragMenu('${a.id}','${m.id}')" ondragover="event.preventDefault()" ondrop="dropMenu('${a.id}','${m.id}')">

          <i class="fas fa-grip-vertical text-gray-300 mr-1 cursor-move"></i>

        </div>

      </div>`;
    }
    const ref=(m.type==='form'?FORMS:m.type==='flow'?FLOWS:TASKS).find(x=>x.id===m.refId);
    const icon=m.type==='form'?'file-alt':(m.type==='flow'?'project-diagram':'clipboard-list');
    const tag=m.type==='form'?'表单':(m.type==='flow'?'流程':'任务');
    return `<div class="tree-node" draggable="true" ondragstart="dragMenu('${a.id}','${m.id}')" ondragover="event.preventDefault()" ondrop="dropMenu('${a.id}','${m.id}')">
      <div class="flex items-center gap-2 py-1">
        <i class="fas fa-grip-vertical text-gray-300 mr-1 cursor-move"></i>
        <i class="fas fa-${icon} text-[#165DFF]"></i>
        <span>${m.name}</span>
        <span class="text-[11px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">${tag}${ref?' · '+ref.name:''}</span>
        <span class="text-[11px] text-red-400 cursor-pointer ml-1" onclick="delMenu('${a.id}','${m.id}')">删除</span>
      </div>
      ${(m.children&&m.children.length)?`<div class="pl-5">${menuTree(a,m.children)}</div>`:''}

}
/* 添加菜单向导：先填名称 → 选类型（表单/流程/任务） → 从已发布素材中多选 */
const ADD_MENU_TYPES={form:{label:'表单',list:()=>FORMS},flow:{label:'流程',list:()=>FLOWS},task:{label:'任务',list:()=>TASKS}};
let _addm={appId:null,parentId:null,name:'',type:'form',query:'',cat:'',sel:[]};
function openAddMenu(appId,parentId){ _addm={appId,parentId,name:'',type:'form',query:'',cat:'',sel:[]}; renderAddMenu(); }
function addMenuAssets(type){ return ADD_MENU_TYPES[type].list().filter(x=>!x.status||x.status==='published'); }
function renderAddMenu(){
  const meta=ADD_MENU_TYPES[_addm.type];
  let items=addMenuAssets(_addm.type);
  const q=_addm.query.trim().toLowerCase();
  if(q) items=items.filter(x=>x.name.toLowerCase().includes(q));
  if(_addm.cat) items=items.filter(x=>x.cat===_addm.cat);
  const cats=[...new Set(addMenuAssets(_addm.type).map(x=>x.cat).filter(Boolean))];
  const rows=items.map(x=>{
    const on=_addm.sel.includes(x.id);
    return `<div class="picker-row ${on?'am-sel':''}" onclick="pickAddMenu('${x.id}')">
    <div class="flex items-center gap-2">
      <input type="checkbox" class="am-cb" ${on?'checked':''} onclick="event.stopPropagation()" onchange="pickAddMenu('${x.id}')">
      <span class="flex-1">${x.name}</span>
      ${x.cat?`<span class="text-[11px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">${x.cat}</span>`:''}
      ${on?'<i class="fas fa-check text-[#165DFF]"></i>':''}
    </div>
    ${x.desc?`<div class="text-[11px] text-gray-400 mt-0.5 pl-6">${x.desc}</div>`:''}
  </div>`;
  }).join('') || '<div class="text-[12px] text-gray-400 py-2">没有匹配的已发布素材</div>';
  openModal(`<div class="font-bold mb-3">添加菜单${_addm.parentId?'（到分组）':''}</div>
    <div class="field"><label>菜单名称</label><input id="am_name" value="${_addm.name}" placeholder="单选时可自定义；多选时每个菜单以素材名命名" oninput="amName(this.value)"></div>
    <div class="field"><label>菜单类型</label><select id="am_type" onchange="amType(this.value)">
      <option value="form" ${_addm.type==='form'?'selected':''}>表单</option>
      <option value="flow" ${_addm.type==='flow'?'selected':''}>流程</option>
      <option value="task" ${_addm.type==='task'?'selected':''}>任务</option>
    </select></div>
    <div class="field"><label>选择${meta.label}（已发布，可多选）</label>
      <div class="flex gap-2 mb-2">
        <input placeholder="搜索名称…" value="${_addm.query}" oninput="amQuery(this.value)" style="flex:1;min-width:0">
        ${cats.length?`<select onchange="amCat(this.value)" style="width:auto"><option value="">全部类型</option>${cats.map(c=>`<option value="${c}" ${_addm.cat===c?'selected':''}>${c}</option>`).join('')}</select>`:''}
      </div>
      <div class="max-h-56 overflow-auto space-y-1 border rounded p-1">${rows}</div>
      <div class="text-[11px] text-gray-400 mt-1.5">已选 <b class="text-[#165DFF]">${_addm.sel.length}</b> 项：每个素材将生成一个菜单；点击行或勾选复选框均可选中/取消。</div>
    </div>
    <div class="flex justify-end gap-2 mt-3"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doAddMenu()">确定添加（${_addm.sel.length}）</button></div>`);
}
function amName(v){_addm.name=v;}
function amType(v){_addm.type=v;_addm.query='';_addm.cat='';_addm.sel=[];renderAddMenu();}
function amQuery(v){_addm.query=v;renderAddMenu();}
function amCat(v){_addm.cat=v;renderAddMenu();}
function pickAddMenu(id){const i=_addm.sel.indexOf(id);if(i>=0)_addm.sel.splice(i,1);else _addm.sel.push(id);renderAddMenu();}
function doAddMenu(){
  const a=APPS.find(x=>x.id===_addm.appId); if(!a)return;
  if(!_addm.sel.length){alert('请至少选择一个'+(ADD_MENU_TYPES[_addm.type].label));return;}
  const custom=_addm.name.trim();
  const single=_addm.sel.length===1;
  let parent=null;
  if(_addm.parentId){ parent=findMenu(a,_addm.parentId); if(!parent){closeModal();return;} }
  _addm.sel.forEach(refId=>{
    const ref=ADD_MENU_TYPES[_addm.type].list().find(x=>x.id===refId); if(!ref)return;
    const node={id:uid('am'),name:(single&&custom?custom:ref.name),type:_addm.type,refId:ref.id,roleIds:null};
    if(_addm.type==='form'&&ref.views&&ref.views.length){ node.viewId=ref.views[0].id; node.viewName=ref.views[0].name; }
    if(parent){ parent.children=parent.children||[]; parent.children.push(node); }
    else a.menus.push(node);
  });
  closeModal(); render();
}

/* 拖拽排序：菜单可在树内调整顺序/层级 */
let _drag=null;
function dragMenu(appId,id){_drag={appId,id};}
function dropMenu(appId,targetId){
  if(!_drag||_drag.id===targetId)return;
  const a=APPS.find(x=>x.id===appId);
  const dragged=findMenu(a,_drag.id);if(!dragged)return;
  if(dragged.type==='folder'&&isDescendant(dragged,targetId))return;
  detachMenu(a,_drag.id);
  const tgt=findMenu(a,targetId);
  if(tgt.type==='folder'){tgt.children=tgt.children||[];tgt.children.push(dragged);}
  else{const p=findParent(a,targetId);const arr=p?p.children:a.menus;const idx=arr.findIndex(x=>x.id===targetId);arr.splice(idx+1,0,dragged);}
  _drag=null;render();
}
function detachMenu(a,id,list){list=list||a.menus;for(let i=0;i<list.length;i++){if(list[i].id===id){list.splice(i,1);return;}if(list[i].children)detachMenu(a,id,list[i].children);}}
function isDescendant(folder,id,list){list=list||folder.children;if(!list)return false;for(const c of list){if(c.id===id)return true;if(c.children&&isDescendant(c,id,c.children))return true;}return false;}

/* 预览应用 */
function previewApp(appId){
  const a=APPS.find(x=>x.id===appId);
  if(!state.previewMenuId){const lf=firstLeaf(a.menus);state.previewMenuId=lf?lf.id:null;}
  const leaf=state.previewMenuId?findMenu(a,state.previewMenuId):null;
  const content=leaf?`<div class="p-1">
      <div class="text-[12px] text-gray-400 mb-1">${leaf.type==='form'?'工作表单'+(leaf.viewName?' · 视图：'+leaf.viewName:''):(leaf.type==='flow'?'流程':'任务中心')}</div>
      <div class="text-xl font-bold mb-3">${leaf.name}</div>
      <div class="border rounded-lg p-6 bg-gray-50 text-center text-gray-400 text-[13px]">此处为「${leaf.name}」的运行态页面，实际由对应模块渲染；原型中仅作占位展示。</div>
    </div>`:'<div class="text-gray-400 text-center py-10">该应用暂无菜单</div>';
  const body=`<div class="flex" style="height:66vh">
    <div class="w-56 border-r p-3 overflow-auto bg-gray-50">
      <div class="text-[12px] font-semibold text-gray-500 mb-2">${a.name} · 菜单</div>
      ${previewMenuList(a,a.menus)}
    </div>
    <div class="flex-1 p-5 overflow-auto">${content}</div>
  </div>`;
  openPreviewModal(`<div class="flex items-center justify-between mb-2"><h3 class="text-base font-semibold">应用预览 · ${a.name}</h3><button class="text-gray-400 hover:text-gray-600" onclick="closeModal();state.previewMenuId=null"><i class="fas fa-times"></i></button></div>${body}`);
}
function firstLeaf(menus){for(const m of menus){if(m.type!=='folder')return m;if(m.children){const f=firstLeaf(m.children);if(f)return f;}}return null;}
function previewMenuList(a,menus){
  return menus.map(m=>{
    if(m.type==='folder')return `<div class="mb-1"><div class="text-[12px] font-medium text-gray-500 py-0.5"><i class="fas fa-folder text-amber-500 mr-1"></i>${m.name}</div><div class="pl-3">${previewMenuList(a,m.children)}</div></div>`;
    const on=state.previewMenuId===m.id;
    const vtag=(m.type==='form'&&m.viewName&&m.viewName!=='默认视图')?`<span class="text-[10px] text-gray-400 ml-1">· ${m.viewName}</span>`:'';
    const icon=m.type==='form'?'file-alt':(m.type==='flow'?'project-diagram':'clipboard-list');
    return `<div class="flex items-center gap-2 text-[13px] py-1 px-1 rounded cursor-pointer ${on?'bg-[#eff4ff] text-[#165DFF]':'hover:bg-gray-100'}" onclick="state.previewMenuId='${m.id}';previewApp('${a.id}')"><i class="fas fa-${icon}"></i>${m.name}${vtag}</div>`;
  }).join('');
}
function openPreviewModal(html){
  document.getElementById('modal').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div style="background:#fff;border-radius:12px;width:820px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)"><div style="padding:16px 20px">${html}</div></div></div>`;
}
function delMenu(appId,id){
  if(!confirm('确认删除该菜单？删除后其下子菜单一并移除。'))return;
  const a=APPS.find(x=>x.id===appId);
  const p=findParent(a,id);
  if(p)p.children=p.children.filter(c=>c.id!==id);else a.menus=a.menus.filter(m=>m.id!==id);
  render();
}

function deptTree(){
  const depts=DEPTS.filter(d=>d.parentId===null);
  return depts.map(d=>{
    const groups=DEPTS.filter(g=>g.parentId===d.id);
    const cnt=MEMBERS.filter(m=>m.deptId===d.id||groups.some(g=>g.id===m.deptId)).length;
    return `<div class="mb-1">
      <div class="flex items-center gap-1 py-1 cursor-pointer ${state.deptId===d.id?'bg-[#eff4ff] rounded px-1':''}" onclick="state.deptId='${d.id}';render()">
        <i class="fas fa-sitemap text-gray-400"></i><span class="font-medium">${d.name}</span><span class="text-[11px] text-gray-400">(${cnt})</span>
        <span class="ml-auto text-[11px] text-[#165DFF]" onclick="event.stopPropagation();addDept('${d.id}')">+小组</span>
      </div>
      <div class="pl-4">${groups.map(g=>{
        const c=MEMBERS.filter(m=>m.deptId===g.id).length;
        return `<div class="flex items-center gap-1 py-0.5 cursor-pointer ${state.deptId===g.id?'bg-[#eff4ff] rounded px-1':''}" onclick="state.deptId='${g.id}';render()"><i class="fas fa-users text-gray-300"></i><span>${g.name}</span><span class="text-[11px] text-gray-400">(${c})</span></div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
}
function addDept(parentId){
  const name=prompt(parentId?'小组名称':'部门名称');if(!name)return;
  DEPTS.push({id:uid('d'),name,type:parentId?'group':'dept',parentId:parentId||null});
  render();
}
function importUser(){
  openModal(`<div class="font-bold mb-3">导入 / 新增用户</div>
   <div class="field"><label>姓名</label><input id="iu_name" placeholder="如：孙琳"></div>
   <div class="field"><label>职位</label><input id="iu_title" placeholder="如：产品经理"></div>
   <div class="field"><label>归属部门/小组</label><select id="iu_dept">${DEPTS.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}</select></div>
   <div class="text-[11px] text-gray-400 mb-2">实际系统支持 Excel 批量导入 / 从企业微信同步；此处演示单条录入。</div>
   <div class="flex justify-end gap-2 mt-2"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doImportUser()">确定</button></div>`);
}
function doImportUser(){
  const name=document.getElementById('iu_name').value.trim();if(!name){alert('请填写姓名');return;}
  MEMBERS.push({id:uid('m'),name,deptId:document.getElementById('iu_dept').value,title:document.getElementById('iu_title').value});
  closeModal();render();
}

/* ===================== 模块三：角色权限管理 ===================== */
function renderRolePerm(){
  return `<div>
    <div class="mb-3"><h2 class="text-lg font-bold">租户管理</h2><p class="text-[12px] text-gray-500">按「角色组 → 角色 → 用户」组织；在一个页面内完成「挂用户 + 配置应用与菜单权限」。所有权限逻辑集中在此。</p></div>
    <div class="flex gap-4">
      <div class="w-72 card p-3">
        <div class="flex items-center justify-between mb-2"><span class="font-semibold text-[13px]">角色组</span><button class="text-[11px] text-[#165DFF]" onclick="addGroup()">+ 新建角色组</button></div>
        ${ROLE_GROUPS.map(g=>`<div class="mb-2">
          <div class="font-medium text-[13px] py-1"><i class="fas fa-layer-group text-gray-400 mr-1"></i>${g.name} <span class="text-[11px] text-gray-400">(${g.roles.length})</span></div>
          <div class="pl-3">${g.roles.map(r=>`<div class="flex items-center gap-1 py-1 cursor-pointer rounded px-1 ${state.roleId===r.id?'bg-[#eff4ff]':''}" onclick="state.roleId='${r.id}';state.roleShowPerm=false;render()">
              <i class="fas fa-user-shield text-[#165DFF]"></i><span>${r.name}</span><span class="text-[11px] text-gray-400 ml-auto">${r.memberIds.length}人</span>
            </div>`).join('')}
            <div class="text-[11px] text-[#165DFF] cursor-pointer pl-1 mt-1" onclick="addRole('${g.id}')">+ 新建角色</div>
          </div>
        </div>`).join('')}
      </div>
      <div class="flex-1">${state.roleId?renderRoleDetail():'<div class="card p-8 text-center text-gray-400 text-[13px]">← 选择左侧角色查看 / 编辑</div>'}</div>
    </div>
  </div>`;
}
/* renderRolesTab 已并入 renderRolePerm（左侧角色组/角色列表内联），保留空位以免遗漏引用 */
function renderRoleDetail(){
  const r=roleById(state.roleId);
  return `<div class="space-y-4">
    <div class="card p-4">
      <div class="flex items-center gap-2 mb-3"><span class="icon-box" style="background:#165DFF22;color:#165DFF">👥</span><div><div class="font-bold">${r.name}</div><div class="text-[11px] text-gray-400">${groupName(findGroupOf(r.id))}</div></div></div>
      <div class="flex gap-2 mb-3">
        <button class="btn btn-ghost text-[12px]" onclick="assignUsers('${r.id}')"><i class="fas fa-user-plus mr-1"></i>挂用户</button>
        <button class="btn btn-ghost text-[12px]" onclick="state.roleShowPerm=!state.roleShowPerm;render()"><i class="fas fa-sliders-h mr-1"></i>${state.roleShowPerm?'收起应用与菜单权限':'配置应用与菜单权限'}</button>
      </div>
      <div>
        <div class="font-semibold text-[13px] mb-1">角色下用户</div>
        <div>${r.memberIds.length?r.memberIds.map(m=>`<span class="chip">${memberName(m)}<i onclick="removeUserFromRole('${r.id}','${m}')">✕</i></span>`).join(''):'<span class="text-[12px] text-gray-400">暂无用户，点击「挂用户」从组织架构添加</span>'}</div>
      </div>
    </div>
    ${state.roleShowPerm?renderRolePermConfig(r):''}
  </div>`;
}
function addGroup(){const name=prompt('角色组名称');if(!name)return;ROLE_GROUPS.push({id:uid('g'),name,roles:[]});render();}
function addRole(groupId){const name=prompt('角色名称');if(!name)return;ROLE_GROUPS.find(g=>g.id===groupId).roles.push({id:uid('r'),name,memberIds:[],appIds:[]});render();}
function toggleRoleApp(roleId,appId){const r=roleById(roleId);if(r.appIds.includes(appId))r.appIds=r.appIds.filter(x=>x!==appId);else r.appIds.push(appId);render();}
function assignUsers(roleId){
  openModal(`<div class="font-bold mb-3">为「${roleById(roleId).name}」挂用户</div>
   <div class="text-[12px] text-gray-500 mb-2">从组织架构选择用户（可多选）：</div>
   <div class="max-h-64 overflow-auto space-y-1">${DEPTS.map(d=>`<div class="text-[12px] font-semibold text-gray-600 mt-1">${d.name}</div>${MEMBERS.filter(m=>m.deptId===d.id).map(m=>`<label class="flex items-center gap-2 text-[12px] py-0.5"><input type="checkbox" ${roleById(roleId).memberIds.includes(m.id)?'checked':''} value="${m.id}" class="uu"> ${m.name} <span class="text-gray-400">${m.title}</span></label>`).join('')}`).join('')}</div>
   <div class="flex justify-end gap-2 mt-3"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doAssignUsers('${roleId}')">确定</button></div>`);
}
function doAssignUsers(roleId){const r=roleById(roleId);r.memberIds=[...document.querySelectorAll('.uu:checked')].map(c=>c.value);closeModal();render();}
function removeUserFromRole(roleId,mid){const r=roleById(roleId);r.memberIds=r.memberIds.filter(x=>x!==mid);render();}

function renderRolePermConfig(r){
  return `<div class="card p-4">
    <div class="font-semibold text-[13px] mb-2">应用与菜单权限（在一处配置）</div>
    <div class="text-[12px] text-gray-500 mb-3">勾选应用 = 第一道门（角色成员可进入）；展开后逐菜单勾选 = 第二道门（该角色可见哪些菜单）。应用与菜单合并配置。</div>
    <div class="space-y-3">
      ${APPS.map(a=>{
        const on=r.appIds.includes(a.id);
        return `<div class="border rounded p-3 ${on?'border-[#165DFF] bg-[#f7faff]':'border-gray-200'}">
          <div class="flex items-center gap-2">
            <input type="checkbox" ${on?'checked':''} onchange="toggleRoleApp('${r.id}','${a.id}')">
            <span class="icon-box" style="background:#165DFF22;color:#165DFF"><i class="fas ${a.icon.name||'fa-th-large'}"></i></span>
            <span class="font-medium">${a.name}</span>
            <span class="text-[11px] text-gray-400">${a.menus.length} 菜单</span>
          </div>
          ${on?`<div class="pl-6 mt-2 space-y-1">${menuPermInline(a,a.menus,r)}</div>`:`<div class="pl-6 mt-2 text-[11px] text-gray-400">未进入该应用，菜单权限暂不生效。</div>`}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function menuVisibleByRole(m,r){
  if(m.roleIds===null) return true;
  return m.roleIds.includes(r.id);
}
function menuPermInline(a,menus,r){
  if(!menus.length) return '<div class="text-[11px] text-gray-400">该应用暂无菜单。</div>';
  return menus.map(m=>{
    if(m.type==='folder') return `<div class="pl-3"><div class="text-[12px] font-medium text-gray-500 py-0.5"><i class="fas fa-folder text-amber-500 mr-1"></i>${m.name}</div>${menuPermInline(a,m.children,r)}</div>`;
    const vis=menuVisibleByRole(m,r);
    const icon=m.type==='form'?'file-alt':(m.type==='flow'?'project-diagram':'clipboard-list');
    const tag=m.type==='form'?'表单':(m.type==='flow'?'流程':'任务');
    return `<label class="flex items-center gap-2 text-[12px] py-0.5 cursor-pointer ${vis?'text-[#165DFF] font-medium':''}">
      <input type="checkbox" ${vis?'checked':''} onchange="toggleMenuRole('${a.id}','${m.id}','${r.id}')">
      <i class="fas fa-${icon} text-[#165DFF]"></i>${m.name}
      <span class="text-[11px] text-gray-400">${tag}</span>
    </label>`;
  }).join('');
}
function toggleMenuRole(appId,menuId,roleId){
  const a=APPS.find(x=>x.id===appId);const m=findMenu(a,menuId);
  if(m.roleIds===null)m.roleIds=allRoles().filter(r=>r.appIds.includes(appId)).map(r=>r.id);
  if(m.roleIds.includes(roleId))m.roleIds=m.roleIds.filter(x=>x!==roleId);else m.roleIds.push(roleId);
  render();
}

/* ===================== 弹窗 ===================== */
function openModal(html){document.getElementById('modal').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal-box">${html}</div></div>`;}
function closeModal(){document.getElementById('modal').innerHTML='';}

/* ===================== 右侧逻辑备注 ===================== */
function renderNotes(){
  const n=document.getElementById('notes');
  if(state.module==='app'){
    n.innerHTML=`<div class="font-bold text-[13px] text-gray-700 mb-2">逻辑备注 · 应用中心</div>
      <div class="note-card"><span class="note-num">1</span><b>图标库选择：</b>创建 / 编辑应用时点击图标从<b>图标库弹窗</b>选择（fa 图标集），不再手填 emoji 与颜色；应用自动归属当前租户。</div>
      <div class="note-card"><span class="note-num">2</span><b>只建不配：</b>应用中心仅负责创建应用 + 挂载菜单（表单 / 流程 / 任务），<b>不做任何权限设置</b>。</div>
      <div class="note-card"><span class="note-num">3</span><b>分组与菜单：</b>可<b>新建分组 / 子分组</b>归类菜单，分组下<b>添加菜单</b>；菜单为叶子节点，其下不能再加子菜单。</div>
      <div class="note-card"><span class="note-num">4</span><b>菜单向导（支持多选）：</b>先填名称 → 选类型（表单 / 流程 / 任务下拉）→ 从<b>已发布素材</b>中筛选（关键词 + 类型）<b>多选</b>，一次生成多个菜单；单选时可用自定义名称，多选时以素材名命名。</div>
      <div class="note-card"><span class="note-num">5</span><b>素材来源：</b>表单来自「表单设计器」、流程来自「流程中心」、任务指向「任务中心」，此处仅引用与编排。</div>`;
  }else if(state.module==='user'){
    n.innerHTML=`<div class="font-bold text-[13px] text-gray-700 mb-2">逻辑备注 · 用户管理</div>
      <div class="note-card"><span class="note-num">1</span><b>唯一用户源：</b>用户由租户管理员在此导入/创建，<b>全租户所有应用共用，只建一次</b>。</div>
      <div class="note-card"><span class="note-num">2</span><b>组织架构：</b>部门 → 小组 → 成员，是授权的组织维度，可在授权时按部门选择。</div>
      <div class="note-card"><span class="note-num">3</span><b>与角色解耦：</b>此处只管"有哪些人、在什么组织"，不在此分配权限；权限在「角色权限管理」通过角色关联。</div>`;
  }else{
    n.innerHTML=`<div class="font-bold text-[13px] text-gray-700 mb-2">逻辑备注 · 角色权限管理</div>
      <div class="note-card"><span class="note-num">1</span><b>角色组→角色→用户：</b>先建角色组（分类），组内建角色，角色下挂用户（从组织架构选）。</div>
      <div class="note-card"><span class="note-num">2</span><b>单页配置：</b>选中角色后，同页内点「挂用户」与「配置应用与菜单权限」两个按钮，无需切换页签。</div>
      <div class="note-card"><span class="note-num">3</span><b>应用与菜单合并：</b>同一角色下，勾选应用即第一道门（可进入），展开后逐菜单勾选即第二道门（可见菜单），两道门在一处完成。</div>
      <div class="note-card"><span class="note-num">4</span><b>权限唯一入口：</b>所有访问控制集中在此模块，应用中心/用户管理均不触碰权限。</div>`;
  }
}

<script>
(function(){
  var MODULES={
    form:{iframe:document.getElementById('iframe-form'),tpl:'mod-form-full',loaded:false},
    flow:{iframe:document.getElementById('iframe-flow'),tpl:'mod-flow-full',loaded:false},
    app:{iframe:document.getElementById('iframe-app'),tpl:'mod-gov-full',loaded:false,hash:'app'},
    user:{iframe:document.getElementById('iframe-user'),tpl:'mod-gov-full',loaded:false,hash:'user'},
    tenant:{iframe:document.getElementById('iframe-tenant'),tpl:'mod-gov-full',loaded:false,hash:'role'}
  };
  window.switchModule=function(key){
    for(var k in MODULES){ MODULES[k].iframe.style.display='none'; }
    var m=MODULES[key];
    m.iframe.style.display='block';
    if(!m.loaded){
      var raw=document.getElementById(m.tpl).textContent;
      m.html=raw.replace(/___SCEND___/g,'<\/script>');
      m.iframe.srcdoc=m.html;
      m.loaded=true;
    }
    var items=document.querySelectorAll('.topnav-item');
    for(var i=0;i<items.length;i++){
      items[i].classList.toggle('active', items[i].dataset.mod===key);
    }
  };
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='switch' && MODULES[e.data.mod]){
      switchModule(e.data.mod);
    }
  });
  var request = window.__hostLowCodeRequest || {};
  var requestedModule = request.module;
  var requestedView = request.view;
  function openRequestedView(key, view, attempts){
    if(!view) return;
    var child = MODULES[key] && MODULES[key].iframe.contentWindow;
    if(child && typeof child.showView === 'function'){
      child.showView(view);
      return;
    }
    if((attempts || 0) < 30){
      setTimeout(function(){ openRequestedView(key, view, (attempts || 0) + 1); }, 120);
    }
  }
  setTimeout(function(){
    var initialModule = MODULES[requestedModule] ? requestedModule : 'form';
    switchModule(initialModule);
    openRequestedView(initialModule, requestedView);
  }, 30);
})();
</script>
